<!DOCTYPE html>
<html dir="rtl" lang="he" data-v="20260720">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="only light">
<title>תוקף אילת — MMD ORDERS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:only light;forced-color-adjust:none}
/* ── Header ── */
#hdr{display:flex;align-items:center;gap:8px;padding:10px 18px;background:#c62828 !important;position:sticky;top:0;z-index:99;flex-wrap:wrap;color:#fff}
.hdr-title{font-weight:bold;font-size:15px;color:#fff !important;flex:none}
.hdr-sep{width:1px;height:22px;background:rgba(255,255,255,.35);margin:0 3px;flex-shrink:0}
.hbtn{background:rgba(255,255,255,.15) !important;border:1.5px solid rgba(255,255,255,.45);color:#fff !important;font-size:13px;font-weight:bold;cursor:pointer;border-radius:5px;padding:5px 14px;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.3) !important}
.hbtn.active{background:rgba(255,255,255,.92) !important;color:#c62828 !important;border-color:transparent}
.hbtn-util{background:rgba(255,255,255,.2) !important;border:none;color:#fff !important;font-size:13px;cursor:pointer;border-radius:5px;padding:5px 14px;white-space:nowrap;font-weight:600}
.hbtn-util:hover{background:rgba(255,255,255,.38) !important}
.hbtn-reset{display:none;background:#fff3cd !important;border:none;color:#7a5c00 !important;font-size:13px;font-weight:bold;cursor:pointer;border-radius:5px;padding:5px 14px}
.hdr-spacer{flex:1}
/* ── Summary ── */
#summary{padding:7px 18px;font-size:13px;color:#444 !important;background:#fff !important;border-bottom:1px solid #dde0e8}
/* ── Cards ── */
#cards{display:flex;flex-wrap:wrap;gap:12px;padding:14px 18px;align-content:flex-start;background:#f4f6fb !important;min-height:100vh}
.empty-msg{padding:40px;text-align:center;color:#aaa;font-size:15px;width:100%}
/* ── Card ── */
.ec{background:#fff !important;border-radius:8px;border:1px solid #dde0e8;box-shadow:0 1px 5px rgba(0,0,0,.07);padding:10px;display:flex;gap:10px;align-items:flex-start;position:relative;width:calc(25% - 9px);flex-shrink:0;box-sizing:border-box}
.ec.danger{border:2px solid #c62828 !important}
.ec.warn  {border:2px solid #e65100 !important}
.ec-hide{position:absolute;top:5px;left:5px;background:rgba(0,0,0,.28) !important;border:none;color:#fff !important;font-size:11px;cursor:pointer;border-radius:3px;padding:2px 8px;z-index:10;line-height:1.5;font-weight:bold}
.ec-hide:hover{background:rgba(0,0,0,.5) !important}
/* photo */
.ec-photo-col{flex-shrink:0;text-align:center}
.ec-photo{width:64px;height:64px;object-fit:contain;border-radius:4px;border:1px solid #e0e0e0;background:#fff !important;display:block}
.ec-photo-ph{width:64px;height:64px;background:#f0f0f0 !important;border-radius:4px;border:1px solid #e0e0e0;display:flex;align-items:center;justify-content:center;font-size:1.8rem}
.ec-mkt{font-size:10px;color:#1565C0 !important;font-weight:bold;margin-top:3px}
/* content */
.ec-content{flex:1;min-width:0}
.ec-name{font-size:11px;font-weight:bold;color:#222 !important;margin-bottom:5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ec-badges{margin-bottom:6px}
.ec-stock-badge{display:inline-block;font-size:12px;font-weight:bold;padding:2px 10px;border-radius:4px;background:#e3f2fd !important;color:#0d47a1 !important}
.ec-special-badge{display:inline-block;font-size:10px;font-weight:bold;padding:1px 7px;border-radius:3px;background:#6a1b9a !important;color:#fff !important;margin-left:5px}
/* table */
.ec-tbl{width:100%;border-collapse:collapse;font-size:11px}
.ec-tbl th{padding:3px 6px;font-size:10px;text-align:right;font-weight:bold}
.th-danger{background:#c62828 !important;color:#fff !important}
.th-warn  {background:#e65100 !important;color:#fff !important}
.th-ok    {background:#f5f5f5 !important;color:#555 !important}
.ec-tbl td{padding:2px 6px;border-bottom:1px solid #f0f0f0;color:#333 !important;font-size:11px;white-space:nowrap}
.ec-tbl tr:last-child td{border-bottom:none}
.ec-tbl tfoot td{padding:5px 7px;border-top:2px solid #e0e0e0;background:#f5f7fa !important;font-size:10px;color:#555 !important}
.clr-r{color:#c62828 !important;font-weight:bold}
.clr-o{color:#e65100 !important;font-weight:bold}
.clr-g{color:#2e7d32 !important}
#loading{padding:50px;text-align:center;color:#888;background:#f4f6fb !important;min-height:100vh}
#tukuf-print-header{display:none}
@media print{
  @page{size:A4 landscape;margin:6mm}
  body{background:#fff;margin:0}
  body.printing-tukuf>*:not(#cards):not(#tukuf-print-header){display:none!important}
  body.printing-tukuf #tukuf-print-header{display:flex!important;justify-content:space-between;align-items:center;padding:4px 8px;font-size:11px;font-weight:bold;color:#333;border-bottom:1px solid #ccc;margin-bottom:4px}
  body.printing-tukuf #cards{display:block!important;padding:0!important;gap:0!important;min-height:0!important;overflow:visible!important}
  body.printing-tukuf .tukuf-page-group{display:grid!important;grid-template-columns:repeat(2,1fr)!important;grid-template-rows:repeat(2,1fr)!important;gap:4px!important;width:100%!important;height:190mm!important;overflow:hidden!important;break-after:page!important;page-break-after:always!important;box-sizing:border-box!important}
  body.printing-tukuf .tukuf-page-group:last-child{break-after:auto!important;page-break-after:auto!important}
  body.printing-tukuf .tukuf-page-group>.ec{overflow:hidden!important;min-height:0!important;height:100%!important;width:100%!important;box-sizing:border-box!important;border-radius:4px!important;box-shadow:none!important}
  .ec-hide,.no-print{display:none!important}
  -webkit-print-color-adjust:exact!important;print-color-adjust:exact!important
}
</style>
</head>
<body style="background:#f4f6fb;margin:0;padding:0;font-family:'Segoe UI',sans-serif">

<div id="hdr">
  <span class="hdr-title">📦 תוקף אילת</span>
  <div class="hdr-sep"></div>
  <button class="hbtn" id="btn-danger" onclick="setLevelFilter('danger')">⚠ סכנה בלבד</button>
  <button class="hbtn" id="btn-warn"   onclick="setLevelFilter('warn')">🔶 תשומות לב</button>
  <div class="hdr-sep"></div>
  <div id="hevra-btns" style="display:flex;gap:6px;flex-wrap:wrap"></div>
  <div class="hdr-spacer"></div>
  <button class="hbtn-reset no-print" id="btn-reset" onclick="resetHidden()">↩ איפוס</button>
  <button class="hbtn-util no-print" onclick="window.print()">🖨 הדפס</button>
  <a href="/mmd/" style="background:rgba(255,255,255,.2);border:none;color:#fff;font-size:18px;cursor:pointer;border-radius:5px;padding:2px 12px;text-decoration:none;line-height:2;font-weight:bold">✕</a>
</div>

<div id="summary" style="background:#fff;padding:7px 18px;font-size:13px;color:#444;border-bottom:1px solid #dde0e8"></div>
<div id="tukuf-print-header"><span>דוח תוקף אילת — MMD FORMULA</span><span id="tukuf-print-date"></span></div>
<div id="loading" style="padding:50px;text-align:center;color:#888">טוען נתונים...</div>
<div id="cards" style="display:none;background:#f4f6fb;min-height:100vh"></div>

<script>
var allCards   = [];
var levelFilter = null;
var hebraFilter = null;
var hiddenSet   = new Set();

function clrClass(d){ return d<30?'clr-r':d<60?'clr-o':'clr-g'; }

function fixProductName(s){
  s=s.replace(/\)([^()]+)\(/g,'($1)');
  s=s.replace(/\s*\([A-Za-z]{1,6}\d*\)\s*/g,' ').trim();
  return s;
}
function _ltrWrap(s){
  return s.split(/(\s+)/).map(function(tok){
    return /[A-Za-z0-9]/.test(tok)?'<span dir="ltr">'+tok+'</span>':tok;
  }).join('');
}
function shortName(s){
  var m=s.match(/\d+\s*ג[.'׳]?/);
  if(!m) return s;
  var res=s.slice(0,s.indexOf(m[0])+m[0].length).trim();
  res=res.replace(/(\d+)\s+(ג[.'׳]?)$/,'$1 $2');
  return res;
}

function dangerLevel(batches, wk, shelfLifeDays) {
  var sl=shelfLifeDays||0, hasDanger=false, hasWarn=false;
  batches.forEach(function(b){
    if(b.qty<=0) return;
    var eff=b.days-sl;                    // effective days after shelf-life buffer
    var we=eff/7,                          // effective weeks
        ws=wk>0?b.qty/wk:999;             // weeks of stock at current sales
    if(eff<=0||ws>we)  hasDanger=true;
    else if(ws>we*0.7) hasWarn=true;
  });
  return hasDanger?'danger':(hasWarn?'warn':'ok');
}

function setLevelFilter(lvl){
  levelFilter=(levelFilter===lvl)?null:lvl;
  document.getElementById('btn-danger').classList.toggle('active',levelFilter==='danger');
  document.getElementById('btn-warn'  ).classList.toggle('active',levelFilter==='warn');
  render(); updateSummary();
}
function setHebraFilter(h){
  hebraFilter=(hebraFilter===h)?null:h;
  document.querySelectorAll('.hevra-btn').forEach(function(b){ b.classList.toggle('active',b.dataset.h===hebraFilter); });
  render(); updateSummary();
}
function hideCard(mkt){
  hiddenSet.add(mkt);
  document.getElementById('btn-reset').style.display='';
  render();
}
function resetHidden(){
  hiddenSet.clear();
  document.getElementById('btn-reset').style.display='none';
  render();
}

function render(){
  var grid=document.getElementById('cards');
  grid.innerHTML='';
  var shown=0;
  allCards.forEach(function(c){
    if(hiddenSet.has(c.mkt)) return;
    if(levelFilter==='danger'&&c.level!=='danger') return;
    if(levelFilter==='warn'  &&c.level!=='warn'  ) return;
    if(hebraFilter&&c.hevra!==hebraFilter) return;
    shown++;

    var div=document.createElement('div');
    div.className='ec'+(c.level==='danger'?' danger':c.level==='warn'?' warn':'');

    var hb=document.createElement('button');
    hb.className='ec-hide no-print'; hb.textContent='✕'; hb.title='הסתר לפני הדפסה';
    hb.setAttribute('onclick','hideCard("'+c.mkt+'")');
    div.appendChild(hb);

    // photo col
    var pcol=document.createElement('div');
    pcol.className='ec-photo-col';
    if(c.img){
      pcol.innerHTML='<img class="ec-photo" src="'+c.img+'" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'" loading="lazy"><div class="ec-photo-ph" style="display:none">📦</div>';
    } else {
      pcol.innerHTML='<div class="ec-photo-ph">📦</div>';
    }
    pcol.innerHTML+='<div class="ec-mkt">'+c.mkt+'</div>';
    div.appendChild(pcol);

    // content col
    var cc=document.createElement('div');
    cc.className='ec-content';

    var nd=document.createElement('div');
    nd.className='ec-name'; nd.innerHTML=_ltrWrap(shortName(fixProductName(c.taur)));
    cc.appendChild(nd);

    var totalQty=c.batches.reduce(function(s,b){return s+b.qty;},0);
    var bd=document.createElement('div');
    bd.className='ec-badges';
    bd.innerHTML='<span class="ec-stock-badge">סה"כ: '+totalQty+' קרט</span>'
      +(String(c.mkt)==='664'?'<span class="ec-special-badge">×4 המלצה</span>':'');
    cc.appendChild(bd);

    var thCls=c.level==='danger'?'th-danger':c.level==='warn'?'th-warn':'th-ok';
    var thLabel=c.level==='danger'?'סכנה':c.level==='warn'?'תשומת לב':'OK';
    var colHdr='color:#666;font-size:9px;font-weight:600;padding:2px 5px;border-bottom:1px solid #eee;text-align:center;';
    var _wk=c.mkr_shvua||0; var _sl=c.shelfLife||0;
    var rows='';
    c.batches.forEach(function(b){
      if(b.qty<=0) return;
      var eff=Math.max(0,b.days-_sl), we=eff/7, ws=_wk>0?b.qty/_wk:999;
      var isSakana=(eff<=0||ws>we);
      var cl=isSakana?'clr-r':(ws>we*0.7)?'clr-o':'clr-g';
      // STOP SALE: ימים נשארו < shelfLife (past the buffer — can't sell at all)
      // לזריקה: ימים >= shelfLife but stock won't sell fast enough
      var throwLine='';
      if(b.days<_sl){
        throwLine=' <span style="display:inline-block;font-size:7px;font-weight:bold;color:#fff;background:#6a1b9a;border-radius:3px;padding:0 4px;vertical-align:middle;">⛔ STOP</span>';
      } else if(isSakana&&_wk>0){
        var canSell=we*_wk;
        var throwAway=Math.ceil(Math.max(0,b.qty-canSell));
        if(throwAway>0){
          throwLine=' <span style="font-size:7px;font-weight:bold;color:#c62828">~'+throwAway+'🗑</span>';
        }
      }
      var sellWks=_wk>0?(b.qty/_wk).toFixed(1):null;
      rows+='<tr>'
        +'<td>'+b.dt+throwLine+'</td>'
        +'<td class="'+cl+'" style="text-align:center;font-weight:bold">'+b.qty+'</td>'
        +'<td class="'+cl+'" style="text-align:center;font-weight:bold">'+(b.days/7).toFixed(1)+'</td>'
        +'<td class="'+cl+'" style="text-align:center;font-weight:bold">'+(sellWks||'—')+'</td>'
        +'</tr>';
    });
    var wks=c.mkr_shvua!=null?Number(c.mkr_shvua).toFixed(1):null;
    var yspik=(c.mkr_shvua>0&&totalQty>0)?(totalQty/c.mkr_shvua).toFixed(1):null;
    var slTxt=c.shelfLife!=null?'<span style="white-space:nowrap">חיי מדף: <b style="color:#555">'+(c.shelfLife/7).toFixed(1)+' שב\'</b></span>':'';
    var ftxt=wks
      ?'ממוצע מכירה: <b style="color:#222">'+wks+' קרט/שבוע</b>'
        +(yspik!=null?' &nbsp;·&nbsp; <span style="white-space:nowrap">יספיק: <b style="color:#1a6b1a" dir="ltr">'+yspik+' שב\'</b></span>':'')
        +(slTxt?' &nbsp;·&nbsp; '+slTxt:'')
      :'<span style="color:#bbb">אין נתוני מכירה</span>'+(slTxt?' &nbsp;'+slTxt:'');

    var tbl=document.createElement('table');
    tbl.className='ec-tbl';
    tbl.innerHTML='<thead>'
      +'<tr><th colspan="4" class="'+thCls+'">'+thLabel+'</th></tr>'
      +'<tr><th style="'+colHdr+'text-align:right">ת. תפוגה</th><th style="'+colHdr+'">קרט\'</th><th style="'+colHdr+'">שב\' נשארו</th><th style="'+colHdr+'">שב\' למכירה סופית</th></tr>'
      +'</thead>'
      +'<tbody>'+(rows||'<tr><td colspan="4" style="text-align:center;color:#bbb">אין מלאי</td></tr>')+'</tbody>'
      +'<tfoot><tr><td colspan="4">'+ftxt+'</td></tr></tfoot>';
    cc.appendChild(tbl);
    div.appendChild(cc);
    grid.appendChild(div);
  });
  if(shown===0) grid.innerHTML='<div class="empty-msg">אין מוצרים להצגה</div>';
  grid.style.display='grid';
}

function updateSummary(){
  var vis=allCards.filter(function(c){return !hiddenSet.has(c.mkt)&&(!hebraFilter||c.hevra===hebraFilter);});
  var d=vis.filter(function(c){return c.level==='danger';}).length;
  var w=vis.filter(function(c){return c.level==='warn';  }).length;
  document.getElementById('summary').innerHTML=
    '<b>'+vis.length+'</b> מוצרים עם מלאי תוקף'
    +(d?' · <b style="color:#c62828">⚠ '+d+' בסכנה</b>':'')
    +(w?' · <b style="color:#e65100">🔶 '+w+' בתשומת לב</b>':'')
    +(hiddenSet.size?' · <span style="color:#888">'+hiddenSet.size+' מוסתרים</span>':'');
}

function buildHebraButtons(cards){
  var counts={};
  cards.forEach(function(c){ if(c.hevra) counts[c.hevra]=(counts[c.hevra]||0)+1; });
  var wrap=document.getElementById('hevra-btns');
  wrap.innerHTML='';
  var all=document.createElement('button');
  all.className='hbtn hevra-btn active'; all.dataset.h=''; all.textContent='כולם';
  all.onclick=function(){setHebraFilter(null);};
  wrap.appendChild(all);
  Object.keys(counts).sort().forEach(function(h){
    var b=document.createElement('button');
    b.className='hbtn hevra-btn'; b.dataset.h=h;
    b.textContent=h+' · '+counts[h];
    b.onclick=function(){setHebraFilter(h);};
    wrap.appendChild(b);
  });
}

window.addEventListener('beforeprint', function() {
  var cards = document.getElementById('cards');
  if (!cards) return;
  var cardEls = Array.from(cards.querySelectorAll(':scope > .ec'));
  var heights = new Map(); var maxW = 0;
  cardEls.forEach(function(c) {
    heights.set(c, c.offsetHeight || 200);
    maxW = Math.max(maxW, c.offsetWidth || 300);
  });
  document.body.classList.add('printing-tukuf');
  document.title = 'דוח תוקף אילת — FORMULA';
  var pd = document.getElementById('tukuf-print-date');
  if (pd) pd.textContent = 'הדפסה: ' + new Date().toLocaleDateString('he-IL');
  cards._printOrigHTML = cards.innerHTML;
  cards.innerHTML = '';
  for (var i = 0; i < cardEls.length; i += 4) {
    var group = cardEls.slice(i, i + 4);
    group.sort(function(a, b) { return (heights.get(a) || 200) - (heights.get(b) || 200); });
    var grp = document.createElement('div');
    grp.className = 'tukuf-page-group';
    group.forEach(function(c) { grp.appendChild(c); });
    while (grp.children.length < 4) grp.appendChild(document.createElement('div'));
    cards.appendChild(grp);
  }
  // Per-row zoom: A4 landscape content ~285×198mm at 96dpi
  var MM = 96 / 25.4;
  var cellW = (285 * MM - 4) / 2;
  var cellH = (198 * MM - 28 - 4) / 2;
  var allCells = Array.from(document.querySelectorAll('.tukuf-page-group > .ec'));
  for (var j = 0; j < allCells.length; j += 2) {
    var row = allCells.slice(j, j + 2);
    var rowMaxH = 0;
    row.forEach(function(c) { var h = heights.get(c) || 0; if (h > rowMaxH) rowMaxH = h; });
    if (rowMaxH === 0) rowMaxH = 200;
    var s = Math.min(cellW / (maxW || 300), cellH / rowMaxH, 1.4);
    row.forEach(function(c) { c.style.zoom = Math.max(0.4, Math.min(s, 3)).toFixed(3); });
  }
});
window.addEventListener('afterprint', function() {
  document.body.classList.remove('printing-tukuf');
  document.title = 'תוקף אילת — MMD ORDERS';
  var cards = document.getElementById('cards');
  if (cards && cards._printOrigHTML !== undefined) {
    cards.innerHTML = cards._printOrigHTML;
    delete cards._printOrigHTML;
  }
});

fetch('./mmd-orders.json')
  .then(function(r){return r.json();})
  .then(function(json){
    document.getElementById('loading').style.display='none';
    var data=(json.data||[]).filter(function(r){return r.eilat_batches;});
    allCards=data.map(function(r){
      var batches=r.eilat_batches.split(';').filter(Boolean).map(function(b){
        var p=b.split('|');
        return{pke:p[0],dt:p[1],qty:parseInt(p[2],10)||0,days:parseInt(p[3],10)||0};
      });
      var sl=r.shelfLife||0;
      var level=dangerLevel(batches,r.mkr_shvua,sl);
      return{mkt:r.mkt,taur:r.taur,mishpacha:r.mishpacha,hevra:r.hevra||'',
             img:r.img,krat:r.krat,mkr_shvua:r.mkr_shvua,shelfLife:sl,batches:batches,level:level};
    });
    allCards.sort(function(a,b){
      var o={danger:0,warn:1,ok:2};
      if(o[a.level]!==o[b.level]) return o[a.level]-o[b.level];
      var am=Math.min.apply(null,a.batches.map(function(x){return x.days;}));
      var bm=Math.min.apply(null,b.batches.map(function(x){return x.days;}));
      return am-bm;
    });
    buildHebraButtons(allCards);
    updateSummary();
    render();
  })
  .catch(function(e){
    document.getElementById('loading').textContent='שגיאה: '+e.message;
  });
</script>
</body>
</html>
