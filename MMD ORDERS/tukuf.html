<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>תוקף אילת — MMD ORDERS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f4f6fb;color:#222;font-family:'Segoe UI',sans-serif;min-height:100vh}

/* ── Header ── */
header{background:#c62828;padding:8px 14px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:99;flex-wrap:wrap}
header h1{font-size:.9rem;color:#fff;font-weight:bold;flex:none}
.hdr-sep{width:1px;height:20px;background:rgba(255,255,255,.3);margin:0 2px;flex-shrink:0}
.hbtn{border:1.5px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;padding:4px 11px;border-radius:5px;cursor:pointer;font-size:.75rem;font-weight:600;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.25)}
.hbtn.active{background:rgba(255,255,255,.9);color:#c62828;border-color:transparent}
.hbtn-print{background:#fff;border:none;color:#c62828;padding:4px 11px;border-radius:4px;cursor:pointer;font-size:.75rem;font-weight:bold}
.hbtn-back{text-decoration:none;color:rgba(255,255,255,.7);font-size:.75rem;border:1px solid rgba(255,255,255,.3);padding:4px 10px;border-radius:5px}
.hbtn-reset{display:none;background:#fff3cd;border:none;color:#7a5c00;font-size:.75rem;font-weight:bold;cursor:pointer;border-radius:4px;padding:4px 11px}

/* ── Summary bar ── */
#summary{padding:6px 16px;font-size:.72rem;color:#666;direction:rtl;background:#fff;border-bottom:1px solid #dde0e8}

/* ── Cards grid ── */
#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px;padding:12px 14px}
.empty{padding:40px;text-align:center;color:#aaa;font-size:.85rem}

/* ── Card ── */
.card{background:#fff;border-radius:8px;border:1px solid #dde0e8;overflow:hidden;display:flex;flex-direction:column;position:relative}
.card.is-danger{border:2px solid #c62828}
.card.is-warn  {border:2px solid #e65100}
.card-hide-btn{position:absolute;top:4px;left:4px;background:#c62828;border:none;color:#fff;font-size:11px;font-weight:bold;cursor:pointer;border-radius:3px;padding:2px 8px;z-index:10;line-height:1.4}
.card-hide-btn:hover{background:#b71c1c}

.card-top{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#f5f5f5;border-bottom:1px solid #ececec}
.card-photo{width:50px;height:50px;object-fit:contain;border-radius:4px;border:1px solid #ddd;background:#fff;flex-shrink:0}
.card-photo-ph{width:50px;height:50px;background:#f0f0f0;border-radius:4px;border:1px solid #e0e0e0;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0}
.card-name{font-size:.7rem;color:#333;font-weight:bold;line-height:1.3}
.card-sub{font-size:.6rem;color:#888;margin-top:2px}
.badge-yehidot{display:inline-block;background:#6a1b9a;color:#fff;font-size:.55rem;font-weight:bold;padding:1px 5px;border-radius:3px;margin-top:3px;letter-spacing:.03em}

.card-body{padding:7px 10px;flex:1}
.col-hdr{display:flex;direction:rtl;padding:2px 0 3px;border-bottom:1px solid #eee;margin-bottom:2px}
.col-hdr span{flex:1;text-align:center;font-size:.57rem;color:#aaa;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.batch-row{display:flex;direction:rtl;align-items:center;padding:3px 0;border-bottom:1px solid #f5f5f5;gap:0;font-size:.68rem}
.batch-row:last-child{border-bottom:none}
.bc{flex:1;text-align:center}
.bc.date{color:#666}
.bc.qty{font-weight:bold}
.bc.days{font-weight:bold}
.clr-r{color:#c62828}
.clr-o{color:#e65100}
.clr-g{color:#2e7d32}

.card-footer{padding:5px 10px;background:#fafafa;border-top:1px solid #ececec;display:flex;align-items:center;justify-content:space-between;direction:rtl;font-size:.64rem;gap:8px}
.footer-sales{color:#888}
.badge-danger{background:#c62828;color:#fff;padding:2px 7px;border-radius:3px;font-weight:bold;font-size:.6rem}
.badge-warn  {background:#e65100;color:#fff;padding:2px 7px;border-radius:3px;font-size:.6rem}
.badge-ok    {color:#2e7d32;font-size:.6rem;font-weight:600}

#loading{padding:40px;text-align:center;color:#aaa}

/* ── Print ── */
@media print {
  @page { size: A4 landscape; margin: 8mm; }
  header { position:static; padding:5px 12px; }
  .hbtn,.hbtn-print,.hbtn-back,.hbtn-reset,.card-hide-btn { display:none !important; }
  #summary { font-size:.65rem; }
  #cards { grid-template-columns:repeat(4,1fr) !important; gap:6px !important; padding:6px !important; }
  .card { break-inside:avoid; page-break-inside:avoid; }
  #loading { display:none !important; }
}
</style>
</head>
<body>
<header>
  <h1>📦 תוקף אילת</h1>
  <div class="hdr-sep"></div>
  <button class="hbtn" id="btn-danger" onclick="setLevelFilter('danger')">⚠ סכנה בלבד</button>
  <button class="hbtn" id="btn-warn"   onclick="setLevelFilter('warn')">🔶 תשומות לב</button>
  <div class="hdr-sep"></div>
  <div id="hevra-btns" style="display:flex;gap:6px;flex-wrap:wrap"></div>
  <div class="hdr-sep"></div>
  <button class="hbtn-reset" id="btn-reset" onclick="resetHidden()">↩ איפוס</button>
  <button class="hbtn-print" onclick="window.print()">🖨 הדפסה</button>
  <a class="hbtn-back" href="/mmd/">← חזרה</a>
</header>
<div id="summary"></div>
<div id="loading">טוען נתונים...</div>
<div id="cards" style="display:none"></div>

<script>
var allCards   = [];
var levelFilter = null;   // null | 'danger' | 'warn'
var hebraFilter = null;   // null | company string
var hiddenSet   = new Set();

function clrClass(days) {
  return days < 30 ? 'clr-r' : days < 60 ? 'clr-o' : 'clr-g';
}

function dangerLevel(batches, mkr_shvua) {
  var hasDanger = false, hasWarn = false;
  batches.forEach(function(b) {
    if (b.qty <= 0) return;
    var weeksToExpiry = b.days / 7;
    var weeksOfStock  = mkr_shvua > 0 ? b.qty / mkr_shvua : 999;
    if (b.days < 14 || weeksOfStock > weeksToExpiry)           hasDanger = true;
    else if (b.days < 30 || weeksOfStock > weeksToExpiry * 0.7) hasWarn   = true;
  });
  return hasDanger ? 'danger' : (hasWarn ? 'warn' : 'ok');
}

function setLevelFilter(lvl) {
  levelFilter = (levelFilter === lvl) ? null : lvl;
  document.getElementById('btn-danger').classList.toggle('active', levelFilter === 'danger');
  document.getElementById('btn-warn'  ).classList.toggle('active', levelFilter === 'warn');
  renderCards();
  updateSummary();
}

function setHebraFilter(hevra) {
  hebraFilter = (hebraFilter === hevra) ? null : hevra;
  document.querySelectorAll('.hevra-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.h === hebraFilter);
  });
  renderCards();
  updateSummary();
}

function hideCard(mkt) {
  hiddenSet.add(mkt);
  document.getElementById('btn-reset').style.display = '';
  renderCards();
}

function resetHidden() {
  hiddenSet.clear();
  document.getElementById('btn-reset').style.display = 'none';
  renderCards();
}

function renderCards() {
  var grid  = document.getElementById('cards');
  grid.innerHTML = '';
  var shown = 0;
  allCards.forEach(function(c) {
    if (hiddenSet.has(c.mkt)) return;
    if (levelFilter === 'danger' && c.level !== 'danger') return;
    if (levelFilter === 'warn'   && c.level !== 'warn'  ) return;
    if (hebraFilter && c.hevra !== hebraFilter) return;
    shown++;

    var el = document.createElement('div');
    el.className = 'card' + (c.level === 'danger' ? ' is-danger' : c.level === 'warn' ? ' is-warn' : '');

    // hide button
    var hideBtn = document.createElement('button');
    hideBtn.className = 'card-hide-btn no-print';
    hideBtn.textContent = '✕';
    hideBtn.title = 'הסתר לפני הדפסה';
    hideBtn.setAttribute('onclick', 'hideCard("' + c.mkt + '")');
    el.appendChild(hideBtn);

    // top
    var photoHtml = c.img
      ? '<img class="card-photo" src="/mmd/img/' + encodeURIComponent(c.mkt) + '" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'" loading="lazy"><div class="card-photo-ph" style="display:none">📦</div>'
      : '<div class="card-photo-ph">📦</div>';
    var yehidotBadge = (String(c.mkt) === '664') ? '<div><span class="badge-yehidot">×4 המלצה</span></div>' : '';
    var top = document.createElement('div');
    top.className = 'card-top';
    top.innerHTML = photoHtml + '<div style="flex:1;min-width:0"><div class="card-name">' + c.taur + '</div>'
      + '<div class="card-sub">מק"ט ' + c.mkt + ' · ' + (c.mishpacha || '') + '</div>'
      + yehidotBadge + '</div>';
    el.appendChild(top);

    // body — batch rows
    var body = document.createElement('div');
    body.className = 'card-body';
    var hdr = document.createElement('div');
    hdr.className = 'col-hdr';
    hdr.innerHTML = '<span>ת. תפוגה</span><span>מלאי</span><span>ימים</span>';
    body.appendChild(hdr);
    c.batches.forEach(function(b) {
      var cls = clrClass(b.days);
      var row = document.createElement('div');
      row.className = 'batch-row';
      row.innerHTML = '<span class="bc date">' + b.dt + '</span>'
        + '<span class="bc qty ' + cls + '">' + (b.qty > 0 ? b.qty : '<span style="color:#ccc">0</span>') + '</span>'
        + '<span class="bc days ' + cls + '">' + b.days + '</span>';
      body.appendChild(row);
    });
    el.appendChild(body);

    // footer
    var wks = c.mkr_shvua != null ? Number(c.mkr_shvua).toFixed(1) : null;
    var badgeHtml = c.level === 'danger' ? '<span class="badge-danger">⚠ סכנה</span>'
                  : c.level === 'warn'   ? '<span class="badge-warn">תשומת לב</span>'
                  : '<span class="badge-ok">✓ בסדר</span>';
    var footer = document.createElement('div');
    footer.className = 'card-footer';
    footer.innerHTML = '<span class="footer-sales">' + (wks ? 'מכר שבועי: ' + wks + ' קרט\'' : 'אין נתוני מכר') + '</span>' + badgeHtml;
    el.appendChild(footer);

    grid.appendChild(el);
  });

  if (shown === 0) {
    grid.innerHTML = '<div class="empty">אין מוצרים להצגה</div>';
  }
  grid.style.display = '';
}

function updateSummary() {
  var visible = allCards.filter(function(c) {
    if (hiddenSet.has(c.mkt)) return false;
    if (hebraFilter && c.hevra !== hebraFilter) return false;
    return true;
  });
  var danger = visible.filter(function(c){ return c.level === 'danger'; }).length;
  var warn   = visible.filter(function(c){ return c.level === 'warn';   }).length;
  var total  = visible.length;
  document.getElementById('summary').textContent =
    total + ' מוצרים עם מלאי תוקף'
    + (danger ? ' · ⚠ ' + danger + ' בסכנה' : '')
    + (warn   ? ' · 🔶 ' + warn + ' בתשומת לב' : '')
    + (hiddenSet.size ? ' · ' + hiddenSet.size + ' מוסתרים' : '');
}

function buildHebraButtons(cards) {
  var counts = {};
  cards.forEach(function(c) {
    if (c.hevra) counts[c.hevra] = (counts[c.hevra] || 0) + 1;
  });
  var wrap = document.getElementById('hevra-btns');
  wrap.innerHTML = '';
  // "כולם" button
  var allBtn = document.createElement('button');
  allBtn.className = 'hbtn hevra-btn active';
  allBtn.dataset.h = '';
  allBtn.textContent = 'כולם';
  allBtn.onclick = function(){ setHebraFilter(null); };
  wrap.appendChild(allBtn);
  Object.keys(counts).sort().forEach(function(h) {
    var b = document.createElement('button');
    b.className = 'hbtn hevra-btn';
    b.dataset.h = h;
    b.textContent = h + ' · ' + counts[h];
    b.onclick = function(){ setHebraFilter(h); };
    wrap.appendChild(b);
  });
}

fetch('./mmd-orders.json')
  .then(function(r) { return r.json(); })
  .then(function(json) {
    document.getElementById('loading').style.display = 'none';
    var data = (json.data || []).filter(function(r) { return r.eilat_batches; });
    allCards = data.map(function(r) {
      var batches = r.eilat_batches.split(';').filter(Boolean).map(function(b) {
        var p = b.split('|');
        return { pke: p[0], dt: p[1], qty: parseInt(p[2], 10) || 0, days: parseInt(p[3], 10) || 0 };
      });
      var level = dangerLevel(batches, r.mkr_shvua);
      return {
        mkt: r.mkt, taur: r.taur, mishpacha: r.mishpacha,
        hevra: r.hevra || '', img: r.img, krat: r.krat,
        mkr_shvua: r.mkr_shvua, batches: batches, level: level
      };
    });
    // sort: danger → warn → ok, then min days asc
    allCards.sort(function(a, b) {
      var order = { danger: 0, warn: 1, ok: 2 };
      if (order[a.level] !== order[b.level]) return order[a.level] - order[b.level];
      var aMin = Math.min.apply(null, a.batches.map(function(x){ return x.days; }));
      var bMin = Math.min.apply(null, b.batches.map(function(x){ return x.days; }));
      return aMin - bMin;
    });
    buildHebraButtons(allCards);
    updateSummary();
    renderCards();
  })
  .catch(function(e) {
    document.getElementById('loading').textContent = 'שגיאה בטעינת נתונים: ' + e.message;
  });
</script>
</body>
</html>
