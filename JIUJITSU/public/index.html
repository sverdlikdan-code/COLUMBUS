<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JJS Moveset Generator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d0d0d; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }

  header { background: linear-gradient(135deg, #1a0a2e, #16213e); padding: 24px 32px; border-bottom: 1px solid #2a1a4e; }
  header h1 { font-size: 1.6rem; font-weight: 700; color: #c084fc; letter-spacing: 1px; }
  header p { color: #94a3b8; font-size: 0.85rem; margin-top: 4px; }

  .container { max-width: 900px; margin: 0 auto; padding: 32px 16px; }

  .tabs { display: flex; gap: 8px; margin-bottom: 24px; }
  .tab { padding: 8px 20px; border-radius: 8px; border: 1px solid #2a1a4e; background: transparent; color: #94a3b8; cursor: pointer; font-size: 0.9rem; transition: all 0.2s; }
  .tab.active { background: #7c3aed; border-color: #7c3aed; color: #fff; }

  .panel { display: none; }
  .panel.active { display: block; }

  .card { background: #111827; border: 1px solid #1e2a3a; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .card-title { font-size: 0.95rem; font-weight: 600; color: #c084fc; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

  label { display: block; font-size: 0.78rem; color: #64748b; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
  input, select { width: 100%; padding: 8px 12px; background: #1e293b; border: 1px solid #2d3748; border-radius: 8px; color: #e2e8f0; font-size: 0.9rem; outline: none; transition: border-color 0.2s; }
  input:focus, select:focus { border-color: #7c3aed; }

  .btn { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-size: 0.9rem; font-weight: 600; transition: all 0.2s; }
  .btn-primary { background: #7c3aed; color: #fff; }
  .btn-primary:hover { background: #6d28d9; }
  .btn-danger { background: #991b1b; color: #fca5a5; font-size: 0.8rem; padding: 6px 12px; }
  .btn-add { background: #1e293b; border: 1px dashed #374151; color: #60a5fa; width: 100%; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; }
  .btn-add:hover { border-color: #60a5fa; background: #1e3a5f22; }

  .result-box { background: #0f172a; border: 1px solid #1e3a5f; border-radius: 8px; padding: 16px; margin-top: 20px; }
  .result-label { font-size: 0.75rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
  .code-output { word-break: break-all; font-family: monospace; font-size: 0.8rem; color: #a5f3fc; max-height: 120px; overflow-y: auto; }
  .copy-btn { margin-top: 12px; background: #0e7490; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
  .copy-btn:hover { background: #0891b2; }
  .copy-btn.copied { background: #16a34a; }

  .decode-area textarea { width: 100%; min-height: 100px; padding: 12px; background: #1e293b; border: 1px solid #2d3748; border-radius: 8px; color: #e2e8f0; font-size: 0.8rem; font-family: monospace; resize: vertical; }
  pre { background: #0f172a; padding: 16px; border-radius: 8px; overflow: auto; max-height: 400px; font-size: 0.78rem; color: #86efac; border: 1px solid #1e3a5f; }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 600; }
  .badge-skill { background: #1e3a5f; color: #60a5fa; }
  .badge-melee { background: #3f1f1f; color: #f87171; }
  .badge-special { background: #2d1f3f; color: #c084fc; }

  .move-number { color: #4b5563; font-size: 0.8rem; }
  .error { color: #f87171; font-size: 0.85rem; margin-top: 8px; }
  .success { color: #4ade80; font-size: 0.85rem; }
</style>
</head>
<body>

<header>
  <h1>⚡ JJS Moveset Generator</h1>
  <p>Jujutsu Shenanigans — Custom Skill Builder Code Generator</p>
</header>

<div class="container">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('generate')">Generate Code</button>
    <button class="tab" onclick="switchTab('decode')">Decode Code</button>
  </div>

  <!-- GENERATE PANEL -->
  <div class="panel active" id="panel-generate">
    <div id="moves-list"></div>

    <button class="btn-add" onclick="addMove()">+ Add Move</button>

    <div style="margin-top: 20px; display: flex; gap: 12px; align-items: center;">
      <button class="btn btn-primary" onclick="generateCode()">Generate Code</button>
      <span id="gen-status" class="success"></span>
    </div>

    <div class="result-box" id="result-box" style="display:none;">
      <div class="result-label">Your JJS Import Code — paste this in Skill Builder</div>
      <div class="code-output" id="code-output"></div>
      <button class="copy-btn" id="copy-btn" onclick="copyCode()">Copy Code</button>
      <div style="margin-top:12px; color: #64748b; font-size: 0.75rem;" id="json-preview"></div>
    </div>
    <div class="error" id="gen-error"></div>
  </div>

  <!-- DECODE PANEL -->
  <div class="panel" id="panel-decode">
    <div class="card">
      <div class="card-title" style="margin-bottom: 12px;">Paste a JJS import code to decode it</div>
      <div class="decode-area">
        <textarea id="decode-input" placeholder="Paste base64 code here..."></textarea>
      </div>
      <button class="btn btn-primary" style="margin-top: 12px;" onclick="decodeCode()">Decode</button>
      <div class="error" id="decode-error"></div>
    </div>
    <pre id="decode-output" style="display:none;"></pre>
  </div>
</div>

<script>
let moveCount = 0;

const SLOT_TYPES = ['SKILL', 'MELEE', 'SPECIAL', 'CHASE', 'AWAKENING'];
const ATTACK_TYPES = ['Normal', 'Heavy', 'Unblockable', 'Grab'];

function addMove() {
  moveCount++;
  const id = moveCount;
  const div = document.createElement('div');
  div.className = 'card';
  div.id = `move-${id}`;
  div.innerHTML = `
    <div class="card-header">
      <span class="card-title">Move <span class="move-number">#${id}</span></span>
      <button class="btn btn-danger" onclick="removeMove(${id})">Remove</button>
    </div>
    <div class="grid2" style="margin-bottom:12px;">
      <div>
        <label>Move Name</label>
        <input type="text" id="name-${id}" placeholder="e.g. Hollow Purple" value="Custom Strike">
      </div>
      <div>
        <label>Slot Type</label>
        <select id="slotType-${id}">
          ${SLOT_TYPES.map(t => `<option value="${t}">${t}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="grid3" style="margin-bottom:12px;">
      <div>
        <label>Damage</label>
        <input type="number" id="damage-${id}" value="25" min="1" max="999">
      </div>
      <div>
        <label>Stun (sec)</label>
        <input type="number" id="stun-${id}" value="0.5" step="0.1" min="0">
      </div>
      <div>
        <label>Cooldown (sec)</label>
        <input type="number" id="cooldown-${id}" value="5" min="0">
      </div>
    </div>
    <div class="grid3">
      <div>
        <label>Attack Type</label>
        <select id="attackType-${id}">
          ${ATTACK_TYPES.map(t => `<option value="${t}">${t}</option>`).join('')}
        </select>
      </div>
      <div>
        <label>Knockback Force</label>
        <input type="number" id="force-${id}" value="50" min="0" max="999">
      </div>
      <div>
        <label>Duration (sec)</label>
        <input type="number" id="duration-${id}" value="0.5" step="0.1" min="0.1">
      </div>
    </div>
  `;
  document.getElementById('moves-list').appendChild(div);
}

function removeMove(id) {
  document.getElementById(`move-${id}`)?.remove();
}

function getMoveData() {
  const moves = [];
  for (let i = 1; i <= moveCount; i++) {
    const el = document.getElementById(`move-${i}`);
    if (!el) continue;
    moves.push({
      name: document.getElementById(`name-${i}`)?.value,
      slotType: document.getElementById(`slotType-${i}`)?.value,
      damage: document.getElementById(`damage-${i}`)?.value,
      stun: document.getElementById(`stun-${i}`)?.value,
      cooldown: document.getElementById(`cooldown-${i}`)?.value,
      attackType: document.getElementById(`attackType-${i}`)?.value,
      force: document.getElementById(`force-${i}`)?.value,
      duration: document.getElementById(`duration-${i}`)?.value,
    });
  }
  return moves;
}

async function generateCode() {
  document.getElementById('gen-error').textContent = '';
  document.getElementById('gen-status').textContent = '';
  const moves = getMoveData();
  if (moves.length === 0) {
    document.getElementById('gen-error').textContent = 'Добавь хотя бы один move';
    return;
  }
  try {
    const res = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ moves })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    document.getElementById('code-output').textContent = data.code;
    document.getElementById('json-preview').textContent = 'JSON preview: ' + data.jsonPreview;
    document.getElementById('result-box').style.display = 'block';
    document.getElementById('gen-status').textContent = `✓ ${data.slotsCount} slot(s) generated`;
  } catch (err) {
    document.getElementById('gen-error').textContent = 'Error: ' + err.message;
  }
}

function copyCode() {
  const code = document.getElementById('code-output').textContent;
  navigator.clipboard.writeText(code);
  const btn = document.getElementById('copy-btn');
  btn.textContent = 'Copied!';
  btn.classList.add('copied');
  setTimeout(() => { btn.textContent = 'Copy Code'; btn.classList.remove('copied'); }, 2000);
}

async function decodeCode() {
  document.getElementById('decode-error').textContent = '';
  document.getElementById('decode-output').style.display = 'none';
  const code = document.getElementById('decode-input').value.trim();
  if (!code) return;
  try {
    const res = await fetch('/api/decode', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    const out = document.getElementById('decode-output');
    out.textContent = JSON.stringify(data.slots, null, 2);
    out.style.display = 'block';
  } catch (err) {
    document.getElementById('decode-error').textContent = 'Error: ' + err.message;
  }
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById(`panel-${name}`).classList.add('active');
  event.target.classList.add('active');
}

// Start with one move
addMove();
</script>
</body>
</html>
