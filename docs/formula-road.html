<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Formula Road</title>
<style>body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#0a1628;color:#fff;font-family:Arial,sans-serif;text-align:center}a{color:#4fc3f7;font-weight:700;font-size:1.1rem}</style>
</head>
<body>
<div id="msg" style="display:none">
  <p>Formula Road עבר לכתובת חדשה</p>
  <p>פנה למנהל לקבלת קישור כניסה</p>
  <p><a href="https://api.sverdlik-apps.site/formula-road">api.sverdlik-apps.site/formula-road</a></p>
</div>
<script>
// FR moved to api.sverdlik-apps.site (27.10.2026). Carry the existing session over via the
// invite hand-off the new page already accepts (?_inv&_ac&_an[&_im&_ch]) - no re-login.
(function(){
  var NEW = 'https://api.sverdlik-apps.site/formula-road';
  var t = '', a = null;
  try { t = localStorage.getItem('frToken') || ''; a = JSON.parse(localStorage.getItem('frAgent') || 'null'); } catch (e) {}
  if (t && a && a.code) {
    var q = '?_inv=' + encodeURIComponent(t) + '&_ac=' + encodeURIComponent(a.code) + '&_an=' + encodeURIComponent(a.name || '');
    if (a.isManager) q += '&_im=1' + (a.channel ? '&_ch=' + encodeURIComponent(a.channel) : '');
    location.replace(NEW + q);
  } else {
    document.getElementById('msg').style.display = 'block';
  }
})();
</script>
</body>
</html>
