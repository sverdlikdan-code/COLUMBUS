<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>DILER FORMULA — מסלול</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --blue:#1565C0; --blue-dark:#0D47A1; --blue-deeper:#082D6E;
  --sky:#29B6F6;  --sky-light:#E3F2FD; --sky-mid:#BBDEFB;
  --bg:#F0F5FF;   --white:#fff;
  --text:#0D2137; --mid:#546E7A; --light:#90A4AE;
  --border:#BBDEFB; --green:#1B7B34; --red:#C62828; --orange:#E65100;
}
html,body{height:100%;background:var(--bg);font-family:'Segoe UI',Tahoma,Arial,sans-serif;direction:rtl;}
#app{height:100%;display:flex;flex-direction:column;overflow:hidden;}

/* SCREENS */
.screen{display:none;flex:1;flex-direction:column;overflow:hidden;}
.screen.active{display:flex;}

/* HEADER */
.hdr{background:linear-gradient(135deg,var(--blue-deeper) 0%,var(--blue-dark) 60%,var(--blue) 100%);color:#fff;padding:10px 14px;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(13,71,161,.35);}
.hdr-logo{height:38px;filter:brightness(0) invert(1);opacity:.92;flex-shrink:0;}
.hdr-back{background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.45);color:#fff;font-size:16px;font-weight:800;cursor:pointer;padding:6px 14px;border-radius:20px;line-height:1;display:flex;align-items:center;gap:5px;white-space:nowrap;letter-spacing:.3px;transition:background .15s;}
.hdr-back:hover{background:rgba(255,255,255,.3);}
.hdr-center{position:absolute;left:0;right:0;text-align:center;pointer-events:none;}
.hdr-title{font-size:13px;font-weight:900;letter-spacing:3px;text-transform:uppercase;color:#fff;}
.hdr-sub{font-size:11px;color:rgba(255,255,255,.7);margin-top:1px;}
.sky-line{height:3px;background:linear-gradient(90deg,var(--sky),var(--blue));flex-shrink:0;}
.demo-tag{font-size:9px;background:rgba(41,182,246,.25);color:var(--sky);padding:2px 8px;border-radius:10px;letter-spacing:1px;border:1px solid rgba(41,182,246,.4);}

/* SCROLL BODY */
.scroll-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px;display:flex;flex-direction:column;gap:10px;}

/* MANAGER / AGENT CARD */
.card{background:#fff;border-radius:14px;padding:16px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 10px rgba(21,101,192,.10);cursor:pointer;border-right:5px solid var(--blue);transition:transform .12s,box-shadow .12s;}
.card:active{transform:scale(.97);box-shadow:0 1px 5px rgba(0,0,0,.08);}
.avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#fff;flex-shrink:0;background:var(--blue);}
.card-name{font-size:15px;font-weight:800;color:var(--text);}
.card-sub{font-size:12px;color:var(--mid);margin-top:3px;}

/* LOADING */
.spinner{display:flex;align-items:center;justify-content:center;flex:1;flex-direction:column;gap:12px;color:var(--mid);}
.spin{width:34px;height:34px;border:3px solid var(--sky-mid);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

/* START CITY */
.city-body{flex:1;display:flex;flex-direction:column;align-items:center;padding:32px 20px 20px;gap:0;}
.city-label{font-size:12px;color:var(--sky);font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;}
.city-title{font-size:26px;font-weight:900;color:var(--blue-dark);margin-bottom:4px;}
.city-sub{font-size:14px;color:var(--mid);margin-bottom:22px;}
.city-input{width:100%;max-width:420px;background:#fff;border-radius:12px;padding:13px 16px;font-size:16px;color:var(--text);border:2px solid var(--sky-mid);outline:none;text-align:right;direction:rtl;transition:border-color .2s;}
.city-input:focus{border-color:var(--blue);}
.suggestions{background:#fff;border-radius:10px;margin-top:4px;box-shadow:0 6px 20px rgba(21,101,192,.15);overflow:hidden;border:1px solid var(--sky-mid);}
.sug-item{padding:11px 16px;border-bottom:1px solid var(--sky-light);cursor:pointer;font-size:15px;color:var(--text);text-align:right;}
.sug-item:hover,.sug-item:active{background:var(--sky-light);}
.city-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:18px;max-width:420px;}
.gps-btn{margin-top:12px;background:#fff;border:2px solid var(--blue);border-radius:12px;padding:12px 0;width:100%;max-width:420px;color:var(--blue);font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .15s;}
.gps-btn:hover{background:var(--sky-light);}
.gps-btn:disabled{border-color:var(--light);color:var(--light);cursor:default;}
.confirm-btn{margin-top:14px;background:linear-gradient(135deg,var(--blue-dark),var(--blue));border-radius:12px;padding:14px 0;width:100%;max-width:420px;color:#fff;font-size:16px;font-weight:700;border:none;cursor:pointer;letter-spacing:.5px;box-shadow:0 4px 14px rgba(21,101,192,.35);}
.confirm-btn:hover{background:linear-gradient(135deg,var(--blue-deeper),var(--blue-dark));}
.confirm-btn:disabled{background:var(--light);box-shadow:none;cursor:default;}

/* DAY PICKER */
.day-body{flex:1;display:flex;flex-direction:column;padding:20px;}
.day-title{font-size:28px;font-weight:900;color:var(--blue-dark);margin-bottom:20px;text-align:center;flex-shrink:0;}
.days-grid{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:16px;}
.day-card{background:#fff;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 20px rgba(21,101,192,.14);border-top:6px solid var(--sky);gap:10px;transition:transform .12s,box-shadow .12s;}
.day-card:hover{transform:translateY(-5px);box-shadow:0 10px 32px rgba(21,101,192,.24);}
.day-letter{font-size:clamp(40px,6vw,90px);font-weight:900;color:var(--blue-dark);line-height:1;}
.day-name{font-size:clamp(13px,1.8vw,22px);color:var(--mid);font-weight:700;}

/* ROUTE TOOLBAR */
#route-hdr{flex-shrink:0;}
.tab-bar{display:none !important;}
.tab-btn{display:none;}
.km-bar{display:flex;align-items:flex-start;padding:5px 10px;background:#fff;border-bottom:1px solid var(--sky-mid);font-size:13px;color:var(--mid);flex-shrink:0;}
.km-left{flex:1;display:flex;align-items:flex-start;gap:6px;min-width:0;}
.km-cities{flex:1;display:flex;gap:4px;flex-wrap:wrap;min-width:0;}
.km-right{flex:1;display:flex;align-items:flex-start;justify-content:flex-end;gap:8px;}
.km-info{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.km-lbl{font-size:10px;color:var(--light);font-weight:600;}
.km-val{font-weight:900;color:var(--blue-dark);font-size:15px;}
.km-unit{font-size:10px;color:var(--light);}
.km-saving{background:#E8F5E9;color:var(--green);font-weight:800;font-size:11px;padding:2px 7px;border-radius:10px;border:1px solid #A5D6A7;}
.sort-btns{display:flex;gap:5px;}
.sort-btn{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:800;cursor:pointer;border:2px solid var(--sky-mid);background:none;color:var(--mid);transition:all .15s;}
.sort-btn.active-priority{color:var(--blue);border-color:var(--blue);background:var(--sky-light);box-shadow:0 2px 8px rgba(21,101,192,.18);}
.sort-btn.active-ai{color:var(--green);border-color:var(--green);background:#E8F5E9;box-shadow:0 2px 8px rgba(27,123,52,.18);}
.day-switch{display:flex;gap:4px;flex-shrink:0;padding:0 6px;align-self:flex-start;}
.day-sw-btn{width:46px;height:46px;border-radius:12px;background:var(--sky-light);border:2px solid var(--sky-mid);font-size:20px;font-weight:900;color:var(--blue-dark);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;box-shadow:0 1px 4px rgba(21,101,192,.10);}
.day-sw-btn:hover{background:var(--sky-mid);transform:translateY(-1px);}
.day-sw-btn.active{background:var(--blue);color:#fff;border-color:var(--blue-dark);box-shadow:0 2px 8px rgba(21,101,192,.38);}
.tab-inline{display:flex;gap:3px;}
.tab-inline-btn{width:30px;height:30px;border-radius:8px;font-size:15px;cursor:pointer;background:none;border:1.5px solid var(--sky-mid);color:var(--mid);display:flex;align-items:center;justify-content:center;transition:all .15s;}
.tab-inline-btn.active{background:var(--blue);color:#fff;border-color:var(--blue);}

/* CLIENT LIST */
#route-body{display:flex;flex:1;overflow:hidden;flex-direction:column;}
#list-pane{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 6px 18px;min-width:0;background:var(--bg);}
.city-chip{padding:3px 9px;border-radius:10px;font-size:11px;font-weight:700;cursor:pointer;border:1.5px solid var(--sky-mid);background:#fff;color:var(--mid);white-space:nowrap;flex-shrink:0;}
.city-chip.on{background:var(--blue);color:#fff;border-color:var(--blue);}

/* CLIENT CARD */
.client-card{background:#fff;border-radius:8px;padding:4px 8px;margin-bottom:2px;display:flex;align-items:center;gap:5px;box-shadow:0 1px 4px rgba(21,101,192,.07);position:relative;cursor:pointer;border-right:3px solid var(--sky-mid);touch-action:pan-y;transition:box-shadow .12s;}
.client-card:hover{box-shadow:0 3px 12px rgba(21,101,192,.14);}
.client-card.no-gps{border-right-color:var(--orange);}
.client-card.selected{border-right-color:var(--blue);background:var(--sky-light);}
.client-card.ai-diff{border-right-color:var(--green);}
.client-card.walk-card{border-right-color:var(--green);}
.client-card.walk-top{margin-bottom:2px;border-radius:10px 10px 4px 4px;}
.client-card.walk-mid{margin-bottom:2px;border-radius:4px;margin-top:0;}
.client-card.walk-bottom{border-radius:4px 4px 10px 10px;margin-top:0;}
.c-num-wrap{display:flex;flex-direction:column;align-items:center;gap:1px;flex-shrink:0;}
.walk-icon{font-size:11px;line-height:1;}
.c-num{width:20px;height:20px;border-radius:50%;background:var(--sky-light);border:1.5px solid var(--sky-mid);font-size:10px;font-weight:800;color:var(--blue);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.c-num-walk{background:#E8F5E9;border-color:var(--green);color:var(--green);}
.selected .c-num{background:var(--blue);color:#fff;border-color:var(--blue);}
.c-body{flex:1;min-width:0;}
.c-name{font-size:12px;font-weight:800;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3;}
.c-sub{font-size:9px;color:var(--mid);margin-top:0;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.c-drag{color:var(--light);font-size:14px;cursor:grab;padding:0 1px;flex-shrink:0;touch-action:none;user-select:none;}
.no-gps-icon{display:none;}
.no-gps-badge{font-size:10px;font-weight:900;color:#fff;background:var(--red);padding:3px 8px;border-radius:8px;flex-shrink:0;cursor:pointer;letter-spacing:.5px;white-space:nowrap;}
.gps-edit-btn{font-size:16px;flex-shrink:0;cursor:pointer;opacity:.35;transition:opacity .15s;padding:2px;}
.gps-edit-btn:hover{opacity:.8;}
.day-change-btn{font-size:15px;flex-shrink:0;cursor:pointer;opacity:.3;transition:opacity .15s;padding:2px;margin-right:2px;}
.day-change-btn:hover{opacity:.9;}
#day-popup{position:fixed;background:#fff;border-radius:14px;box-shadow:0 6px 28px rgba(0,0,0,.18);padding:10px 12px;display:none;gap:7px;z-index:9999;align-items:center;}
#day-popup.open{display:flex;}
.day-pop-btn{width:42px;height:42px;border-radius:11px;background:var(--sky-light);border:2px solid var(--sky-mid);font-size:17px;font-weight:900;color:var(--blue-dark);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .12s;}
.day-pop-btn:hover,.day-pop-btn.cur-day{background:var(--blue);color:#fff;border-color:var(--blue-dark);}

/* MAP */
#map-pane{flex:1;display:none;min-width:0;}
#map-pane.active{display:block;}
#map{height:100%;width:100%;}

/* Wide: split view */
@media(min-width:700px){
  #route-body{flex-direction:row;}
  .tab-inline{display:none;}
  #list-pane{display:block!important;flex:0 0 34%;border-left:1px solid var(--sky-mid);}
  #map-pane{display:block!important;flex:1;}
}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(13,71,161,.45);z-index:1000;align-items:flex-end;justify-content:center;}
.modal-bg.open{display:flex;}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:24px 20px 36px;width:100%;max-width:500px;box-shadow:0 -4px 24px rgba(0,0,0,.18);}
.modal-title{font-size:16px;font-weight:800;color:var(--text);margin-bottom:16px;}
.modal-input{width:100%;border:2px solid var(--blue);border-radius:10px;padding:12px;font-size:16px;direction:rtl;text-align:right;outline:none;}
.modal-btns{display:flex;gap:10px;margin-top:14px;}
.modal-btn{flex:1;padding:12px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;border:none;}
.modal-btn.cancel{background:var(--sky-light);color:var(--mid);}
.modal-btn.confirm{background:var(--blue);color:#fff;}

/* EXPORT BTN */
.export-btn{background:var(--blue);color:#fff;border:none;border-radius:12px;padding:0 14px;height:46px;font-size:12px;font-weight:800;cursor:pointer;box-shadow:0 2px 8px rgba(21,101,192,.3);display:none;align-items:center;gap:5px;white-space:nowrap;flex-shrink:0;}
.export-btn.visible{display:flex;}
.export-btn:hover{background:var(--blue-dark);}
.map-rotate-ctrl{position:absolute;bottom:24px;left:10px;z-index:1000;display:flex;flex-direction:column;gap:4px;}
.map-rotate-btn{width:34px;height:34px;border-radius:10px;background:#fff;border:2px solid var(--sky-mid);color:var(--blue-dark);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.18);transition:background .12s;}
.map-rotate-btn:hover{background:var(--sky-light);}
.map-reset-btn{width:34px;height:20px;border-radius:8px;background:#fff;border:2px solid var(--sky-mid);color:var(--mid);font-size:9px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.12);letter-spacing:.5px;}

/* LOGIN HERO */
.login-hero{background:linear-gradient(160deg,var(--blue-deeper) 0%,var(--blue-dark) 50%,var(--blue) 100%);padding:28px 20px 22px;display:flex;flex-direction:column;align-items:center;gap:10px;flex-shrink:0;}
.login-logo{height:72px;filter:brightness(0) invert(1);opacity:.95;}
.login-app-name{font-size:22px;font-weight:900;letter-spacing:4px;color:#fff;text-transform:uppercase;}
.login-tagline{font-size:12px;color:rgba(255,255,255,.6);letter-spacing:1px;}
.login-sky-bar{height:4px;background:linear-gradient(90deg,var(--sky),var(--blue));flex-shrink:0;}
.login-section{padding:16px 14px 6px;font-size:11px;font-weight:800;color:var(--sky);letter-spacing:2px;text-transform:uppercase;}
.mgr-grid{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:10px;padding:6px 14px 14px;flex:1;}
.mgr-card{border-radius:18px;padding:22px 16px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;color:#fff;
  box-shadow:0 2px 0 rgba(0,0,0,.25) inset, 0 -3px 0 rgba(0,0,0,.2) inset, 0 8px 20px rgba(0,0,0,.22), 0 2px 4px rgba(0,0,0,.15);
  transition:transform .1s,box-shadow .1s;position:relative;overflow:hidden;border-top:1px solid rgba(255,255,255,.35);}
.mgr-card::after{content:'';position:absolute;top:0;left:0;right:0;height:50%;background:linear-gradient(to bottom,rgba(255,255,255,.18),transparent);border-radius:18px 18px 0 0;pointer-events:none;}
.mgr-card:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.25) inset,0 -1px 0 rgba(0,0,0,.2) inset,0 3px 8px rgba(0,0,0,.2);}
.mgr-card:hover{transform:translateY(-2px);box-shadow:0 2px 0 rgba(0,0,0,.25) inset,0 -3px 0 rgba(0,0,0,.2) inset,0 14px 28px rgba(0,0,0,.25);}
.mgr-name{font-size:clamp(26px,5vw,36px);font-weight:900;letter-spacing:1px;text-shadow:0 1px 3px rgba(0,0,0,.25);text-align:center;}
.mgr-count{font-size:11px;opacity:.75;min-height:14px;}

/* AGENT CARDS (when manager selected) */
.agent-grid{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:10px;padding:6px 14px 14px;flex:1;}
.agent-card{background:#fff;border-radius:14px;padding:16px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;box-shadow:0 2px 10px rgba(21,101,192,.10);transition:transform .12s,box-shadow .12s;border-top:4px solid;}
.agent-card:active{transform:scale(.96);}
.agent-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(21,101,192,.18);}
.agent-avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#fff;}
.agent-name{font-size:13px;font-weight:800;color:var(--text);text-align:center;}
.agent-count{font-size:11px;color:var(--mid);min-height:16px;}
</style>
</head>
<body>
<div id="app">

<!-- ── LOGIN ── -->
<div class="screen active" id="s-login">
  <div class="login-hero" id="login-hdr">
    <img src="logo-diler-bmd.png" class="login-logo" alt="DILER BMD"/>
    <div class="login-app-name">Formula Road</div>
    <div class="login-tagline" id="login-sub">מערכת ניהול מסלולים</div>
    <span class="demo-tag" id="demo-tag" style="display:none">DEMO</span>
  </div>
  <div class="login-sky-bar"></div>
  <div id="login-body" style="flex:1;display:flex;flex-direction:column;overflow:hidden;"></div>
</div>

<!-- ── START CITY ── -->
<div class="screen" id="s-city">
  <div class="hdr">
    <button class="hdr-back" onclick="goBack('s-city')">← חזור</button>
    <img src="logo-diler-bmd.png" class="hdr-logo" alt="DILER"/>
    <div class="hdr-center">
      <div class="hdr-title">FORMULA ROAD</div>
    </div>
  </div>
  <div class="sky-line"></div>
  <div class="city-body">
    <div class="city-label" id="city-agent-label"></div>
    <div class="city-title">עיר מוצא</div>
    <div class="city-sub">ממה מתחיל המסלול היום?</div>
    <div style="width:100%;max-width:420px;position:relative;">
      <input class="city-input" id="city-input" placeholder="הקלד עיר..." type="text" oninput="onCityInput()" onfocus="onCityInput()" autocomplete="off"/>
      <div class="suggestions" id="city-suggestions" style="display:none;position:absolute;top:100%;right:0;left:0;z-index:100;max-height:220px;overflow-y:auto;"></div>
    </div>
    <button class="gps-btn" id="gps-btn" onclick="detectCity()">📍 זהה מיקום אוטומטית</button>
    <button class="confirm-btn" id="city-confirm" onclick="confirmCity()" disabled>המשך לבניית מסלול ←</button>
  </div>
</div>

<!-- ── DAY PICKER ── -->
<div class="screen" id="s-day">
  <div class="hdr">
    <button class="hdr-back" onclick="goBack('s-day')">← חזור</button>
    <img src="logo-diler-bmd.png" class="hdr-logo" alt="DILER"/>
    <div class="hdr-center">
      <div class="hdr-title">FORMULA ROAD</div>
      <div class="hdr-sub" id="day-sub"></div>
    </div>
  </div>
  <div class="sky-line"></div>
  <div class="day-body">
    <div class="day-title">בחר יום</div>
    <div class="days-grid">
      <div class="day-card" onclick="selectDay(1)"><div class="day-letter">א</div><div class="day-name">ראשון</div></div>
      <div class="day-card" onclick="selectDay(2)"><div class="day-letter">ב</div><div class="day-name">שני</div></div>
      <div class="day-card" onclick="selectDay(3)"><div class="day-letter">ג</div><div class="day-name">שלישי</div></div>
      <div class="day-card" onclick="selectDay(4)"><div class="day-letter">ד</div><div class="day-name">רביעי</div></div>
      <div class="day-card" onclick="selectDay(5)"><div class="day-letter">ה</div><div class="day-name">חמישי</div></div>
    </div>
  </div>
</div>

<!-- ── ROUTE ── -->
<div class="screen" id="s-route">
  <div class="hdr" id="route-hdr">
    <button class="hdr-back" onclick="goBack('s-route')">← חזור</button>

// ── Haversine ──────────────────────────────────────────────────────────────
function haversineKm(la1,lo1,la2,lo2){
  const R=6371, d2r=Math.PI/180;
  const dLat=(la2-la1)*d2r, dLon=(lo2-lo1)*d2r;
  const a=Math.sin(dLat/2)**2+Math.cos(la1*d2r)*Math.cos(la2*d2r)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// ── Nearest Neighbor sort ──────────────────────────────────────────────────
function nearestNeighbor(clients){
  const withGps = clients.filter(c=>c.lat&&c.lng);
  const noGps   = clients.filter(c=>!c.lat||!c.lng);
  if(!withGps.length) return clients;
  const startLat = st.startLat || withGps[0].lat;
  const startLng = st.startLng || withGps[0].lng;
  const remaining=[...withGps], result=[];
  let curLat=startLat, curLng=startLng;
  while(remaining.length){
    let bi=-1, bDist=Infinity;
    remaining.forEach((c,i)=>{
      const d=haversineKm(curLat,curLng,c.lat,c.lng);
      if(d<bDist){bDist=d;bi=i;}
    });
    const chosen=remaining.splice(bi,1)[0];
    result.push(chosen);
    curLat=chosen.lat; curLng=chosen.lng;
  }
  return [...twoOpt(result),...noGps];
}

// ── 2-opt: eliminates crossing edges ───────────────────────────────────────
function twoOpt(route){
  if(route.length<4) return route;
  let best=[...route], improved=true;
  const dist=(a,b)=>haversineKm(a.lat,a.lng,b.lat,b.lng);
  while(improved){
    improved=false;
    for(let i=0;i<best.length-1;i++){
      for(let j=i+2;j<best.length;j++){
        if(j===best.length-1&&i===0) continue;
        const d1=dist(best[i],best[i+1])+dist(best[j],best[(j+1)%best.length]);
        const d2=dist(best[i],best[j])+dist(best[i+1],best[(j+1)%best.length]);
        if(d2<d1-0.001){
          best=[...best.slice(0,i+1),...best.slice(i+1,j+1).reverse(),...best.slice(j+1)];
          improved=true;
        }
      }
    }
  }
  return best;
}

// ── OSRM real-road routing ──────────────────────────────────────────────────
const OSRM_CACHE = new Map();

async function osrmTrip(clients) {
  const withGps = clients.filter(c => c.lat && c.lng);
  const noGps   = clients.filter(c => !c.lat || !c.lng);
  if (withGps.length < 2) return null;
  const cacheKey = withGps.map(c=>`${c.custId}:${(c.lat||0).toFixed(4)},${(c.lng||0).toFixed(4)}`).join('|');
  if (OSRM_CACHE.has(cacheKey)) {
    const cached = OSRM_CACHE.get(cacheKey);
    return { ...cached, ordered:[...cached.ordered,...noGps] };
  }
  const coords = withGps.map(c=>`${c.lng},${c.lat}`).join(';');
  try {
    const r = await fetch(
      `https://router.project-osrm.org/trip/v1/driving/${coords}?roundtrip=false&source=first&destination=last&geometries=geojson&overview=full&steps=false`,
      { signal: AbortSignal.timeout(10000) }
    );
    const data = await r.json();
    if (data.code !== 'Ok' || !data.trips?.length) return null;
    const trip = data.trips[0];
    const ordered = new Array(withGps.length);
    data.waypoints.forEach((wp,i) => { ordered[wp.waypoint_index] = withGps[i]; });
    const result = {
      ordered: ordered.filter(Boolean),
      roadKm: trip.distance / 1000,
      roadGeometry: trip.geometry.coordinates.map(([lon,lat]) => [lat,lon])
    };
    OSRM_CACHE.set(cacheKey, result);
    return { ...result, ordered:[...result.ordered,...noGps] };
  } catch (_) { return null; }
}

function triggerOsrm() {
  const snap = { clients:[...st.clients], agentCode:st.agent?.code, day:st.day };
  osrmTrip(snap.clients).then(res => {
    if (!res) return;
    if (st.agent?.code !== snap.agentCode || st.day !== snap.day) return;
    st.aiClients  = res.ordered;
    st.roadKm     = res.roadKm;
    st.roadGeometry = res.roadGeometry;
    updateKmBar();
    if (st.sortMode === 'ai') renderClientList();
    if (window.innerWidth >= 700 || st.tab === 'map') renderMap();
  });
}

function totalKm(clients){
  const wg=clients.filter(c=>c.lat&&c.lng);
  if(!wg.length)return null;
  let km=0, la=st.startLat||wg[0].lat, lo=st.startLng||wg[0].lng;
  for(const c of wg){km+=haversineKm(la,lo,c.lat,c.lng);la=c.lat;lo=c.lng;}
  return km;
}

function detectCity(){
  const btn=document.getElementById('gps-btn');
  btn.disabled=true; btn.textContent='⏳ מאתר מיקום...';
  if(!navigator.geolocation){btn.textContent='📍 GPS לא זמין';btn.disabled=false;return;}
  navigator.geolocation.getCurrentPosition(
    pos=>{
      st.startLat=pos.coords.latitude; st.startLng=pos.coords.longitude;
      // Reverse geocode via server
      fetch(`https://nominatim.openstreetmap.org/reverse?lat=${st.startLat}&lon=${st.startLng}&format=json&accept-language=he`)
        .then(r=>r.json()).then(d=>{
          const a=d?.address||{};
          const city=a.city||a.town||a.village||a.suburb||a.county||'';
          const street=a.road?` · ${a.road}${a.house_number?' '+a.house_number:''}` : '';
          const label=city+(city&&street?street:'');
          const display=label||`${st.startLat.toFixed(4)}, ${st.startLng.toFixed(4)}`;
          document.getElementById('city-input').value=display;
          document.getElementById('city-confirm').disabled=false;
          btn.textContent='✅ '+display;
        }).catch(()=>{
          const label=`${st.startLat.toFixed(4)}, ${st.startLng.toFixed(4)}`;
          document.getElementById('city-input').value=label;
          document.getElementById('city-confirm').disabled=false;
          btn.textContent='✅ מיקום נקלט';
        });
      btn.disabled=false;
    },
    ()=>{btn.textContent='❌ נדחה — הקלד ידנית';btn.disabled=false;}
  );
}

  st.startLat=null; st.startLng=null;
  // Try to geocode start city in background
  fetch(`${API}/geocode?address=${encodeURIComponent(city)}&city=${encodeURIComponent(city)}`)
    .then(r=>r.json()).then(d=>{if(d&&d.lat){st.startLat=d.lat;st.startLng=d.lng;}}).catch(()=>{});
  document.getElementById('day-sub').textContent=`${st.agent.name} · ${city}`;
  show('s-day');
}

// ── DAY ────────────────────────────────────────────────────────────────────
async function selectDay(day){
  st.day=day;
  show('s-route');
  initRoute();
}

// ── ROUTE ──────────────────────────────────────────────────────────────────
async function initRoute(){
  st.sortMode='ai'; st.selectedCities=[]; st.selectedId=null;
  st.roadKm=null; st.roadGeometry=null;
  document.getElementById('route-title').textContent='DILER FORMULA';
  document.getElementById('route-sub').textContent=`${st.agent.name} · יום ${DAY_LABELS[st.day]}`;
  document.getElementById('export-btn').classList.remove('visible');
  setTab('list');
  buildDaySwitcher();
  renderClientList('<div class="spinner"><div class="spin"></div><span>טוען לקוחות...</span></div>');
  document.getElementById('km-val').textContent='—';

  const staticKey=`${st.agent.code}_${st.day}`;
  if(STATIC_DATA?.routes?.[staticKey]){
    st.clients=STATIC_DATA.routes[staticKey];
  }else{
    try{
      const r=await fetch(`${API}/customers?agent=${st.agent.code}&day=${st.day}`);
      if(!r.ok)throw new Error();
      st.clients=await r.json();
    }catch{
      st.clients=getDemoClients();
      st.isDemo=true;
    }
  }

  // Merge with localStorage
  const saved=loadSavedRoute(st.agent.code,st.day);
  if(saved) st.clients=mergeWithSaved(st.clients,saved);

  // Apply day overrides — remove moved-away, add moved-here
  const dayOv=getDayOverrides(st.agent.code);
  st.clients=st.clients.filter(c=>dayOv[c.custId]===undefined||dayOv[c.custId]===st.day);
  Object.entries(dayOv).filter(([,d])=>d===st.day).forEach(([id])=>{
    if(st.clients.find(c=>c.custId===id))return;
    for(let d=1;d<=5;d++){
      if(d===st.day)continue;
      const client=(STATIC_DATA?.routes?.[`${st.agent.code}_${d}`]||[]).find(c=>c.custId===id);
      if(client){st.clients.push({...client,dayNum:st.day,dayLabel:DAY_LABELS[st.day]});break;}
    }
  });

  st.aiClients=nearestNeighbor([...st.clients]);
  st.roadKm=null; st.roadGeometry=null; triggerOsrm();
  updateKmBar();
  renderCityFilters();
  renderClientList();
  document.getElementById('export-btn').classList.add('visible');
  setupSortable();
  setupDragScroll(document.getElementById('list-pane'));
  setupCardDoubleTap(document.getElementById('list-pane'));
  if(window.innerWidth>=700) setTimeout(()=>renderMap(),200);
}

function displayClients(){
  const base=st.sortMode==='ai'?st.aiClients:st.clients;
  if(!st.selectedCities.length)return base;
  return base.filter(c=>st.selectedCities.includes(c.city));
}

function buildDaySwitcher(){
  const el=document.getElementById('day-switch');
  el.innerHTML=[1,2,3,4,5].map(d=>`<button class="day-sw-btn${d===st.day?' active':''}" onclick="switchDay(${d})">${DAY_LABELS[d]}</button>`).join('');
}

function switchDay(d){
  if(d===st.day)return;
  st.day=d;
  document.getElementById('route-sub').textContent=`${st.agent.name} · יום ${DAY_LABELS[d]}`;
  buildDaySwitcher();
  initRoute();
}

function setTab(t){
  st.tab=t;
  document.getElementById('tab-list').classList.toggle('active',t==='list');
  document.getElementById('tab-map').classList.toggle('active',t==='map');
  const il=document.getElementById('tab-inline-list');
  const im=document.getElementById('tab-inline-map');
  if(il) il.classList.toggle('active',t==='list');
  if(im) im.classList.toggle('active',t==='map');
  if(window.innerWidth<700){
    document.getElementById('list-pane').style.display=t==='list'?'block':'none';
    document.getElementById('map-pane').classList.toggle('active',t==='map');
  }
  if(t==='map'||window.innerWidth>=700) renderMap();
}

function setSort(mode){
  if(st.sortMode===mode)return;
  st.sortMode=mode;
  document.getElementById('sort-btn-priority').className='sort-btn'+(mode==='priority'?' active-priority':'');
  document.getElementById('sort-btn-ai').className='sort-btn'+(mode==='ai'?' active-ai':'');
  renderCityFilters();
  renderClientList();
  if(st.tab==='map'||window.innerWidth>=700) renderMap();
}

function resetRoute(){
  const dayLabel=DAY_LABELS[st.day]||st.day;
  if(!confirm(`לאפס יום ${dayLabel}?\nכל השינויים יימחקו והסדר המקורי של Priority יוחזר`)) return;
  try{ localStorage.removeItem(`fr_${st.agent.code}_${st.day}`); }catch{}
  try{ localStorage.removeItem(`fr_dayov_${st.agent.code}`); }catch{}
  initRoute();
}

function recalcRoute(){
  st.roadKm=null; st.roadGeometry=null;
  st.aiClients = nearestNeighbor([...st.clients]);
  st.sortMode = 'ai';
  document.getElementById('sort-btn-priority').className = 'sort-btn';
  document.getElementById('sort-btn-ai').className = 'sort-btn active-ai';
  updateKmBar(); renderCityFilters(); renderClientList();
  if(st.tab==='map'||window.innerWidth>=700) renderMap();
  const btn = document.getElementById('recalc-btn');
  btn.textContent = '⏳ כביש...'; btn.disabled = true;
  const snap = { agentCode:st.agent?.code, day:st.day };
  osrmTrip([...st.clients]).then(res => {
    btn.disabled = false;
    btn.textContent = res ? '✅ כביש!' : '✅ חושב!';
    setTimeout(() => { btn.textContent = '🔄 חשב מחדש'; }, 1800);
    if (!res || st.agent?.code !== snap.agentCode || st.day !== snap.day) return;
    st.aiClients = res.ordered; st.roadKm = res.roadKm; st.roadGeometry = res.roadGeometry;
    updateKmBar(); renderClientList();
    if (st.tab === 'map' || window.innerWidth >= 700) renderMap();
  });
}

function updateKmBar(){
  const priorityKm=totalKm(st.clients);
  const aiKm=st.roadKm!=null?st.roadKm:totalKm(st.aiClients);
  document.getElementById('km-val').textContent=priorityKm!=null?priorityKm.toFixed(1):'—';
  document.getElementById('km-ai').textContent=aiKm!=null?aiKm.toFixed(1):'—';
  const aiLbl=document.getElementById('km-ai-lbl');
  if(aiLbl) aiLbl.textContent=st.roadKm!=null?'🛣':'AI';
  const savingWrap=document.getElementById('km-saving-wrap');
  if(priorityKm!=null&&aiKm!=null&&priorityKm>aiKm+0.5){
    document.getElementById('km-saving').textContent=(priorityKm-aiKm).toFixed(1);
    savingWrap.style.display='';
  }else{
    savingWrap.style.display='none';
  }
}

function renderCityFilters(){
  const cities=[...new Set(st.clients.map(c=>c.city).filter(Boolean))].sort();
  const el=document.getElementById('city-filters');
  el.innerHTML=cities.map(c=>`<span class="city-chip${st.selectedCities.includes(c)?' on':''}" onclick="toggleCity('${c}')">${c}</span>`).join('');
}

function toggleCity(city){
  if(st.selectedCities.includes(city)) st.selectedCities=st.selectedCities.filter(c=>c!==city);
  else st.selectedCities.push(city);
  renderCityFilters();
  renderClientList();
  updateKmBar();
  if(window.innerWidth>=700||st.tab==='map') renderMap();
}

function haversineM(la1,lo1,la2,lo2){return haversineKm(la1,lo1,la2,lo2)*1000;}

function renderClientList(html){
  const el=document.getElementById('client-list');
  if(html){el.innerHTML=html;return;}
  const list=displayClients();
  if(!list.length){el.innerHTML='<div class="spinner" style="padding:40px"><span>אין לקוחות</span></div>';return;}
  el.innerHTML=list.map((c,i)=>{
    const noGps=!c.lat||!c.lng;
    const isSel=st.selectedId===c.custId;
    const isAiDiff=st.sortMode==='priority'&&st.aiClients[i]&&st.aiClients[i].custId!==c.custId;
    const prev=i>0?list[i-1]:null;
    const next=i<list.length-1?list[i+1]:null;
    const walkPrev=!!(prev&&prev.lat&&prev.lng&&c.lat&&c.lng&&haversineM(prev.lat,prev.lng,c.lat,c.lng)<=400);
    const walkNext=!!(next&&next.lat&&next.lng&&c.lat&&c.lng&&haversineM(c.lat,c.lng,next.lat,next.lng)<=200);
    const inWalk=walkPrev||walkNext;
    const walkTop=walkNext&&!walkPrev, walkBottom=walkPrev&&!walkNext, walkMid=walkPrev&&walkNext;
    const cls=['client-card',
      noGps?'no-gps':'',isSel?'selected':'',isAiDiff?'ai-diff':'',
      inWalk?'walk-card':'',walkTop?'walk-top':'',walkBottom?'walk-bottom':'',walkMid?'walk-mid':''
    ].filter(Boolean).join(' ');
    const lastOrder=(()=>{
      if(!c.lastOrderDate) return `<span style="color:var(--red);font-weight:700">לא הוזמן</span>`;
      const d=new Date(c.lastOrderDate.slice(0,10));
      const today=new Date(); today.setHours(0,0,0,0);
      const days=Math.round((today-d)/86400000);
      const dd=String(d.getDate()).padStart(2,'0');
      const mm=String(d.getMonth()+1).padStart(2,'0');
      const label=`${dd}.${mm}`;
      const old=days>14;
      return `<span style="${old?'color:var(--red);font-weight:700':''}">הזמנה: ${label}${old?` (${days}d)`:''}</span>`;
    })();
    const sales=c.monthlySales?`<span style="color:var(--sky);font-weight:800;font-size:12px;">₪${Math.round(c.monthlySales).toLocaleString()}</span> <span style="font-size:10px;color:var(--light)">החודש</span>`:`<span title="אין מכירות החודש">😥</span>`;
    const yedPart=c.target?`<span style="font-size:10px;color:var(--mid)">יעד: </span><span style="font-size:10px;font-weight:800;color:var(--mid)">₪${Math.round(c.target).toLocaleString()}</span>`:'';
    const pctPart=(()=>{
      if(!c.target) return '';
      const pct=c.pct?Math.round(c.pct*100):(c.totalSales&&c.target?Math.round(c.totalSales/c.target*100):0);
      const color=pct>=100?'var(--green)':pct>=70?'var(--sky)':'var(--red)';
      return `<span style="font-size:11px;font-weight:900;color:${color}">${pct}%</span>`;
    })();
    return `<div class="${cls}" data-id="${c.custId}" ondblclick="selectClient('${c.custId}')">
      <span class="c-drag">✋</span>
      <div class="c-num-wrap">
        <span class="c-num${inWalk?' c-num-walk':''}">${i+1}</span>
        ${inWalk?`<span class="walk-icon">🚶</span>`:''}
      </div>
      <div class="c-body">
        <div class="c-name">${c.custName||''}</div>
        <div class="c-sub"><span style="color:var(--blue);font-weight:800;">${c.custId||''}</span>${c.city||c.address?' · ':''}</span>${[c.city,c.address].filter(Boolean).join(' · ')}</div>
        <div class="c-sub">${[lastOrder,yedPart,sales,pctPart].filter(Boolean).join('<span style="color:var(--light)"> · </span>')}</div>
      </div>
      <span class="day-change-btn" data-id="${c.custId}" onclick="openDayPopup(event,this.dataset.id)">📅</span>
      ${noGps
        ? `<span class="no-gps-badge" data-id="${c.custId}" data-name="${(c.custName||'').replace(/"/g,'&quot;')}" onclick="openAddrModal(event,this.dataset.id,this.dataset.name)">NO GPS</span>`
        : `<span class="gps-edit-btn"  data-id="${c.custId}" data-name="${(c.custName||'').replace(/"/g,'&quot;')}" onclick="openAddrModal(event,this.dataset.id,this.dataset.name)">📍</span>`}
    </div>`;
  }).join('');
}

function selectClient(id){
  st.selectedId=st.selectedId===id?null:id;
  renderClientList();
  if(st.tab==='map'||window.innerWidth>=700){
    renderMap();
    if(st.selectedId){
      const c=st.clients.find(x=>x.custId===st.selectedId)||st.aiClients.find(x=>x.custId===st.selectedId);
      if(c&&c.lat&&c.lng) setTimeout(()=>map.setView([c.lat,c.lng],17),50);
    }
  }
}

// Double-tap to select card on mobile (single tap ignored — avoids accidental select while scrolling)
let _dtapTime=0, _dtapId=null, _dtapStartY=0;
function setupCardDoubleTap(listEl){
  listEl.addEventListener('touchstart',e=>{
    const card=e.target.closest('.client-card');
    if(!card||e.target.closest('.day-change-btn,.no-gps-badge,.gps-edit-btn,.c-drag')) return;
    _dtapStartY=e.touches[0].clientY;
  },{passive:true});
  listEl.addEventListener('touchend',e=>{
    const card=e.target.closest('.client-card');
    if(!card||e.target.closest('.day-change-btn,.no-gps-badge,.gps-edit-btn,.c-drag')) return;
    if(Math.abs(e.changedTouches[0].clientY-_dtapStartY)>12) return; // was scrolling
    const id=card.dataset.id;
    const now=Date.now();
    if(now-_dtapTime<400&&_dtapId===id){
      selectClient(id);
      _dtapTime=0; _dtapId=null;
    } else {
      // First tap — briefly flash card so user knows tap registered
      card.style.background='var(--sky-light)';
      setTimeout(()=>{ if(card.isConnected) card.style.background=''; },200);
      _dtapTime=now; _dtapId=id;
    }
  });
}

function setupDragScroll(el){
  let y0=0,top0=0,dragging=false,moved=false;
  el.addEventListener('mousedown',e=>{
    if(e.target.closest('.c-drag,.c-btn,[onclick]'))return;
    dragging=true;moved=false;y0=e.clientY;top0=el.scrollTop;
    el.style.cursor='grabbing';el.style.userSelect='none';
  });
  window.addEventListener('mousemove',e=>{
    if(!dragging)return;
    const dy=e.clientY-y0;
    if(Math.abs(dy)>4)moved=true;
    el.scrollTop=top0-dy;
  });
  window.addEventListener('mouseup',e=>{
    if(!dragging)return;
    dragging=false;el.style.cursor='';el.style.userSelect='';
    if(moved)e.stopPropagation();
  },true);
}

function setupSortable(){
  if(sortable){sortable.destroy();sortable=null;}
  sortable=Sortable.create(document.getElementById('client-list'),{
    handle:'.c-drag', animation:150,
    onEnd(e){
      if(e.oldIndex===e.newIndex)return;
      const list=displayClients();
      const moved=list.splice(e.oldIndex,1)[0];
      list.splice(e.newIndex,0,moved);
      if(st.sortMode==='ai') st.aiClients=[...list,...st.clients.filter(c=>!list.find(x=>x.custId===c.custId))];
      else st.clients=[...list,...st.clients.filter(c=>!list.find(x=>x.custId===c.custId))];
      saveRoute(st.agent.code,st.day,st.clients);
      updateKmBar();
      renderClientList();
    }
  });
}

// ── MAP ────────────────────────────────────────────────────────────────────
function renderMap(){
  if(!map){
    map=L.map('map',{rotate:true,bearing:0}).setView([32.0,34.9],10);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png',{attribution:'© CartoDB',subdomains:'abcd',maxZoom:19}).addTo(map);
  }
  mapMarkers.forEach(m=>m.remove()); mapMarkers=[];
  mapPolylines.forEach(p=>p.remove()); mapPolylines=[];
  if(markerCluster){markerCluster.clearLayers();map.removeLayer(markerCluster);}
  markerCluster=L.markerClusterGroup({
    maxClusterRadius:50,disableClusteringAtZoom:16,
    iconCreateFunction(cluster){
      const rns=cluster.getAllChildMarkers().map(m=>m._rn).sort((a,b)=>a-b);
      const n=rns.length;
      const label=n===1?`${rns[0]}`:`${rns[0]}–${rns[n-1]}`;
      const sz=44;
      return L.divIcon({className:'',
        html:`<div style="background:#C9A84C;color:#fff;width:${sz}px;height:${sz}px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2.5px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.35)">
          <span style="font-size:12px;font-weight:900;letter-spacing:-0.5px">${label}</span>
        </div>`,
        iconSize:[sz,sz],iconAnchor:[sz/2,sz/2]});
    }
  });
  const list=displayClients().filter(c=>c.lat&&c.lng);
  if(!list.length)return;
  const bounds=[];
  list.forEach((c,i)=>{
    const isSel=st.selectedId===c.custId;
    const isFirst=i===0;
    const flagColor=isSel?'#1565C0':isFirst?'#2E7D32':'#C9A84C';
    const flagW=isSel||isFirst?34:28;
    const flagLabel=isSel||isFirst
      ?`<span style="transform:rotate(45deg);font-size:${isFirst&&!isSel?'9px':'13px'};font-weight:900">${isFirst&&!isSel?'START':i+1}</span>`
      :`${i+1}`;
    const icon=(isSel||isFirst)
      ? L.divIcon({className:'',
          html:`<div style="display:flex;flex-direction:column;align-items:center;filter:drop-shadow(0 3px 6px rgba(0,0,0,.4))">
            <div style="background:${flagColor};color:#fff;width:${flagW}px;height:${flagW}px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;border:2px solid #fff;">
              ${flagLabel}
            </div></div>`,
          iconSize:[flagW,flagW+8], iconAnchor:[flagW/2,flagW+8]})
      : L.divIcon({
          className:'',
          html:`<div style="background:#C9A84C;color:#fff;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)">${i+1}</div>`,
          iconSize:[28,28], iconAnchor:[14,14],
        });
    const m=L.marker([c.lat,c.lng],{icon});
    m._rn=i+1;
    const corrMark = gpsCorrections[String(c.custId)] ? ' ✏️' : '';
    m.bindPopup(`<b>${c.custName}${corrMark}</b><br>${c.city||''}<br><button onclick="startGpsCorrection('${c.custId}','${c.custName.replace(/'/g,"\\'")}')" style="margin-top:6px;background:#1565C0;color:#fff;border:none;border-radius:8px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer">📍 תקן מיקום</button>`);
    if(isSel) m.openPopup();
    bounds.push([c.lat,c.lng]);
    markerCluster.addLayer(m);
    mapMarkers.push(m);
  });
  // Road geometry (OSRM) or straight segments
  if(st.roadGeometry&&st.roadGeometry.length>1&&st.sortMode==='ai'&&!st.selectedCities.length){
    const roadLine=L.polyline(st.roadGeometry,{color:'#1565C0',weight:3,opacity:.55}).addTo(map);
    mapPolylines.push(roadLine);
    const dec=L.polylineDecorator(roadLine,{patterns:[{offset:'12%',repeat:'22%',symbol:L.Symbol.arrowHead({pixelSize:10,polygon:false,pathOptions:{stroke:true,color:'#1565C0',weight:2.5,opacity:.85}})}]}).addTo(map);
    mapPolylines.push(dec);
  }else{
    list.forEach((c,i)=>{
      if(!i)return;
      const prev=list[i-1];
      const p=L.polyline([[prev.lat,prev.lng],[c.lat,c.lng]],{color:'#1565C0',weight:2.5,opacity:.55}).addTo(map);
      mapPolylines.push(p);
      const dec=L.polylineDecorator(p,{patterns:[{offset:'50%',repeat:0,symbol:L.Symbol.arrowHead({pixelSize:11,polygon:false,pathOptions:{stroke:true,color:'#1565C0',weight:2.5,opacity:.85}})}]}).addTo(map);
      mapPolylines.push(dec);
    });
  }
  map.addLayer(markerCluster);
  if(bounds.length) map.fitBounds(bounds,{padding:[24,24]});
  setTimeout(()=>map.invalidateSize(),100);
}

function rotateMap(deg, reset){
  if(reset){ mapBearing=0; }
  else { mapBearing=(mapBearing+deg+360)%360; }
  if(map && map.setBearing) map.setBearing(mapBearing);
}

// ── GPS CORRECTION ──────────────────────────────────────────────────────────
function placeOnMap(){
  const id = st.addrClientId;
  const c  = st.clients.find(x=>x.custId===id);
  if(!c){ closeAddrModal(); return; }
  closeAddrModal();
  setTab('map');
  // Make sure map is rendered (may be empty if zero GPS clients)
  if(!map || !document.getElementById('map-pane').offsetParent){
    setTimeout(()=>{ renderMap(); _startMapPlace(id,c); }, 250);
  } else {
    renderMap();
    _startMapPlace(id,c);
  }
}

function _startMapPlace(id,c){
  showToast('👆 הקש על המפה למיקום '+c.custName, 5000);
  map.getContainer().style.cursor='crosshair';
  map.once('click', async(e)=>{
    map.getContainer().style.cursor='';
    const {lat,lng}=e.latlng;
    const IL={minLat:29.3,maxLat:33.5,minLng:34.2,maxLng:35.9};
    if(lat<IL.minLat||lat>IL.maxLat||lng<IL.minLng||lng>IL.maxLng){
      showToast('❌ מחוץ לגבולות ישראל'); return;
    }
    const la=+lat.toFixed(6), lo=+lng.toFixed(6);
    // Save locally immediately
    st.clients=st.clients.map(x=>x.custId===id?{...x,lat:la,lng:lo}:x);
    st.aiClients=nearestNeighbor([...st.clients]);
    st.roadKm=null; st.roadGeometry=null; triggerOsrm();
    saveRoute(st.agent.code,st.day,st.clients);
    updateKmBar(); renderClientList(); renderMap();
    // Commit to GitHub if token available
    if(GH_TOKEN){
      await commitGpsCorrection(id, c.custName, la, lo);
    } else {
      showToast('✅ מיקום נשמר (מקומי)');
    }
  });
}

function startGpsCorrection(custId, custName){
  if(!GH_TOKEN){ showToast('❌ אין הרשאה לתיקון'); return; }
  corrEditState = { custId, custName };
  showToast('📍 הקש על המפה כדי לקבוע מיקום חדש', 4000);
  map.getContainer().style.cursor='crosshair';
  map.once('click', async (e)=>{
    map.getContainer().style.cursor='';
    const {lat,lng} = e.latlng;
    const IL={minLat:29.3,maxLat:33.5,minLng:34.2,maxLng:35.9};
    if(lat<IL.minLat||lat>IL.maxLat||lng<IL.minLng||lng>IL.maxLng){
      showToast('❌ מחוץ לגבולות ישראל'); corrEditState=null; return;
    }
    await commitGpsCorrection(custId, custName, +lat.toFixed(6), +lng.toFixed(6));
    corrEditState=null;
  });
}

async function commitGpsCorrection(custId, custName, lat, lng){
  showToast('⏳ שומר תיקון...');
  try{
    // 1. Get current file + SHA
    const ghUrl = `https://api.github.com/repos/${GH_REPO}/contents/${GH_CORRECTIONS_PATH}`;
    const headers = {'Authorization':'token '+GH_TOKEN,'Content-Type':'application/json'};
    const cur = await fetch(ghUrl,{headers}).then(r=>r.json());
    const existing = cur.content ? JSON.parse(atob(cur.content.replace(/\s/g,''))) : {};
    const sha = cur.sha;
    // 2. Add/update correction
    existing[String(custId)] = {lat, lng, correctedAt: new Date().toISOString(), name: custName};
    // 3. Commit
    const body = JSON.stringify({
      message: `fix(gps): correct ${custId} ${custName}`,
      content: btoa(unescape(encodeURIComponent(JSON.stringify(existing, null, 2)))),
      sha
    });
    const res = await fetch(ghUrl,{method:'PUT',headers,body});
    if(!res.ok) throw new Error(await res.text());
    gpsCorrections[String(custId)] = {lat,lng};
    showToast('✅ מיקום עודכן! יחול בבנייה הבאה');
    renderMap();
  }catch(e){
    showToast('❌ שגיאה: '+e.message);
  }
}

function showToast(msg, ms=2500){
  let t=document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.id='toast';
    t.style='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1565C0;color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;font-weight:700;z-index:9999;pointer-events:none;transition:opacity .3s';
    document.body.appendChild(t); }
  t.textContent=msg; t.style.opacity='1';
  clearTimeout(t._to); t._to=setTimeout(()=>t.style.opacity='0', ms);
}

// ── ADDRESS MODAL ──────────────────────────────────────────────────────────
function openAddrModal(e,id,name){
  e.stopPropagation();
  st.addrClientId=id;
  document.getElementById('addr-modal-title').textContent=name||'עדכן כתובת';
  const c=st.clients.find(x=>x.custId===id);
  document.getElementById('addr-input').value=c?.address||'';
  document.getElementById('addr-modal').classList.add('open');
}

function closeAddrModal(){
  document.getElementById('addr-modal').classList.remove('open');
  document.getElementById('addr-gps-status').textContent='';
  document.getElementById('addr-gps-btn').disabled=false;
}

function detectAddrGps(){
  if(!navigator.geolocation){
    document.getElementById('addr-gps-status').textContent='GPS לא זמין במכשיר';
    return;
  }
  const btn=document.getElementById('addr-gps-btn');
  const status=document.getElementById('addr-gps-status');
  btn.disabled=true; status.textContent='מאתר מיקום...';
  navigator.geolocation.getCurrentPosition(pos=>{
    const lat=pos.coords.latitude, lng=pos.coords.longitude;
    status.textContent=`✅ ${lat.toFixed(5)}, ${lng.toFixed(5)} — שומר...`;
    const id=st.addrClientId;
    // reverse geocode to get address string
    fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&accept-language=he`)
      .then(r=>r.json()).then(d=>{
        const a=d?.address||{};
        const addr=[a.road,a.house_number].filter(Boolean).join(' ')||d.display_name||`${lat.toFixed(5)},${lng.toFixed(5)}`;
        st.clients=st.clients.map(x=>x.custId===id?{...x,lat,lng,address:addr}:x);
        st.aiClients=nearestNeighbor([...st.clients]);
        st.roadKm=null; st.roadGeometry=null; triggerOsrm();
        saveRoute(st.agent.code,st.day,st.clients);
        updateKmBar(); renderClientList();
        if(window.innerWidth>=700||st.tab==='map') renderMap();
        closeAddrModal();
      }).catch(()=>{
        st.clients=st.clients.map(x=>x.custId===id?{...x,lat,lng}:x);
        st.aiClients=nearestNeighbor([...st.clients]);
        st.roadKm=null; st.roadGeometry=null; triggerOsrm();
        saveRoute(st.agent.code,st.day,st.clients);
        updateKmBar(); renderClientList();
        if(window.innerWidth>=700||st.tab==='map') renderMap();
        closeAddrModal();
      });
  },err=>{
    btn.disabled=false;
    status.textContent=err.code===1?'❌ GPS חסום — אפשר גישה למיקום':'❌ שגיאת GPS';
  },{enableHighAccuracy:true,timeout:10000});
}

async function submitAddress(){
  const addr=document.getElementById('addr-input').value.trim();
  if(!addr){closeAddrModal();return;}
  const c=st.clients.find(x=>x.custId===st.addrClientId);
  closeAddrModal();
  try{
    const r=await fetch(`${API}/geocode?address=${encodeURIComponent(addr)}&city=${encodeURIComponent(c?.city||'')}`);
    const d=await r.json();
    if(d&&d.lat){
      st.clients=st.clients.map(x=>x.custId===st.addrClientId?{...x,address:addr,lat:d.lat,lng:d.lng}:x);
      st.aiClients=nearestNeighbor([...st.clients]);
      st.roadKm=null; st.roadGeometry=null; triggerOsrm();
      updateKmBar(); renderClientList();
    }
  }catch{}
}

// ── LOCALSTORAGE ───────────────────────────────────────────────────────────
function saveRoute(code,day,clients){
  try{localStorage.setItem(`fr_${code}_${day}`,JSON.stringify(clients.map(c=>({custId:c.custId,lat:c.lat,lng:c.lng}))));}catch{}
}
function loadSavedRoute(code,day){
  try{const s=localStorage.getItem(`fr_${code}_${day}`);return s?JSON.parse(s):null;}catch{return null;}
}
function mergeWithSaved(fromServer,saved){
  const savedMap=Object.fromEntries(saved.map(s=>[s.custId,s]));
  const savedIds=saved.map(s=>s.custId);
  const ordered=[];
  // Keep saved order, merge with server data
  savedIds.forEach(id=>{
    const s=fromServer.find(c=>c.custId===id);
    if(s){const sv=savedMap[id];ordered.push({...s,lat:sv.lat||s.lat,lng:sv.lng||s.lng});}
  });
  // Add new from server
  fromServer.forEach(c=>{if(!savedIds.includes(c.custId))ordered.push(c);});
  return ordered.length?ordered:fromServer;
}

// ── DAY OVERRIDES ──────────────────────────────────────────────────────────
function getDayOverrides(code){
  try{return JSON.parse(localStorage.getItem(`fr_dayov_${code}`)||'{}');}catch{return{};}
}
function setDayOverrides(code,ov){
  try{localStorage.setItem(`fr_dayov_${code}`,JSON.stringify(ov));}catch{}
}
function openDayPopup(event,custId){
  event.stopPropagation();
  const popup=document.getElementById('day-popup');
  popup.innerHTML=[1,2,3,4,5].map(d=>
    `<button class="day-pop-btn${d===st.day?' cur-day':''}" onclick="changeClientDay('${custId}',${d})">${DAY_LABELS[d]}</button>`
  ).join('');
  const r=event.target.getBoundingClientRect();
  popup.style.top=(r.bottom+6)+'px';
  popup.style.left=Math.max(6,r.left-70)+'px';
  popup.classList.add('open');
}
function closeDayPopup(){document.getElementById('day-popup').classList.remove('open');}
function changeClientDay(custId,newDay){
  closeDayPopup();
  if(newDay===st.day)return;
  const ov=getDayOverrides(st.agent.code);
  ov[custId]=newDay;
  setDayOverrides(st.agent.code,ov);
  st.clients=st.clients.filter(c=>c.custId!==custId);
  st.aiClients=nearestNeighbor([...st.clients]);
  st.roadKm=null; st.roadGeometry=null; triggerOsrm();
  saveRoute(st.agent.code,st.day,st.clients);
  updateKmBar(); renderClientList();
  if(window.innerWidth>=700||st.tab==='map') renderMap();
}

// ── EXPORT CSV ─────────────────────────────────────────────────────────────
function exportCSV(){
  const list=displayClients();
  const today=new Date().toISOString().slice(0,10);
  const agent=st.agent?.name||st.agent?.code||'';
  const day=DAY_LABELS[st.day]||st.day;
  const rows=[['סדר ביקור','מס. לקוח','שם לקוח','יום ביקור','עיר','כתובת','קו רוחב','קו אורך','GPS']];
  list.forEach((c,i)=>rows.push([
    i+1,
    c.custId||'',
    c.custName||'',
    c.dayLabel||DAY_LABELS[c.dayNum]||'',
    c.city||'',
    c.address||'',
    c.lat||'',
    c.lng||'',
    c.lat&&c.lng?'✓':'חסר'
  ]));
  const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,﻿'+encodeURIComponent(csv);
  a.download=`מסלול_${agent}_יום${day}_${today}.csv`;
  a.click();
}
