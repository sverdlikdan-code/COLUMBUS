<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MAHSAN EDITOR — FORMULA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #eef2f7; min-height: 100vh; }

    /* Header */
    .header {
      background: #1a1a2e; color: #fff;
      padding: 10px 16px; display: flex; align-items: center; gap: 12px;
      position: sticky; top: 0; z-index: 200;
    }
    .header h1 { font-size: 16px; letter-spacing: 1px; }
    .badge { background: #1a6ef5; padding: 3px 10px; border-radius: 12px; font-size: 11px; }

    /* Tabs */
    .tabs {
      display: flex; gap: 6px; padding: 10px 20px 0;
      background: #fff; border-bottom: 2px solid #dde0e8;
      justify-content: center;
    }
    .tab {
      padding: 10px 36px; border: none; border-radius: 6px 6px 0 0;
      font-size: 13px; font-weight: bold; cursor: pointer;
      background: #e8eaf0; color: #666; line-height: 1.4;
      display: flex; flex-direction: column; align-items: center; gap: 1px;
      flex: 1; max-width: 220px;
    }
    .tab.active { background: #1a6ef5; color: #fff; }
    .tab-pal { font-size: 10px; font-weight: normal; opacity: 0.8; }
    .wh-btn { background:#f0f4ff;color:#1565C0;border:1px solid #90caf9;font-size:11px;padding:4px 9px;font-weight:600; }
    .wh-btn.wh-active { background:#1565C0;color:#fff;border-color:#0d47a1; }

    /* Version history dropdown */
    .history-dropdown {
      display: none; position: absolute; top: 100%; right: 0;
      background: #fff; border: 1px solid #ddd; border-radius: 8px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15); z-index: 1000;
      min-width: 260px; overflow: hidden;
    }
    .history-dropdown.open { display: block; }
    .history-item {
      padding: 10px 14px; cursor: pointer; font-size: 12px;
      border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center;
    }
    .history-item:hover { background: #f0f4ff; }
    .history-item:last-child { border-bottom: none; }
    .history-item .h-ts { color: #555; }
    .history-item .h-restore { color: #1a6ef5; font-weight: bold; font-size: 11px; }
    .history-empty { padding: 14px; text-align: center; color: #aaa; font-size: 12px; }

    /* Print styles */
    @media print {
      .header, .tabs, .toolbar, #position-table, #legend, .no-print { display: none !important; }
      body { background: #fff; margin: 0; }
      .section {
        display: block !important; padding: 0;
        overflow: visible !important;
        height: auto !important; max-height: none !important;
      }
      .section:not(.active) { display: none !important; }
      .warehouse-grid {
        transform: none !important;
        width: auto !important;
        overflow: visible !important;
      }
      @page { size: landscape; margin: 10mm; }
      .slot { break-inside: avoid; }
      .slot.has-photo:hover { transform: none !important; }
      #print-header { display: block !important; }
    }
    #print-header {
      display: none;
      font-size: 16px; font-weight: bold; text-align: center;
      margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid #333;
    }

    /* Toolbar */
    .toolbar {
      display: flex; gap: 8px; padding: 10px 16px;
      background: #fff; border-bottom: 1px solid #eee; flex-wrap: wrap;
      align-items: center;
    }
    .btn { padding: 8px 16px; border-radius: 7px; border: 1.5px solid transparent; font-size: 13px; font-weight: bold; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,0.12); letter-spacing: 0.2px; }
    .btn:hover { filter: brightness(0.93); }
    .btn-export { background: #1a6ef5; color: #fff; border-color: #1557cc; }
    .btn-save   { background: #1a8a1a; color: #fff; border-color: #136613; }
    .btn-reset  { background: #f5f5f5; color: #555; border-color: #bbb; }
    .status { font-size: 11px; color: #888; flex: 1; direction: ltr; text-align: left; }

    /* Sections */
    .section { display: none; padding: 16px; overflow-x: auto; }
    .section.active { display: block; }

    /* Grid */
    .warehouse-grid { display: grid; gap: 10px; width: max-content; min-width: 100%; }

    /* ── Slot card ── */
    .slot {
      border-radius: 8px;
      width: 140px;
      min-height: 105px;
      cursor: grab;
      user-select: none;
      touch-action: none;
      border: 2px solid rgba(0,0,0,0.08);
      display: flex; flex-direction: column; align-items: stretch;
      overflow: hidden;
      transition: box-shadow 0.12s, transform 0.1s;
      background: #f0f0f0;
      position: relative;
    }
    .slot:active { cursor: grabbing; }

    /* Photo mode */
    .slot.has-photo { background: #fff; border-color: rgba(0,0,0,0.10); }
    .slot.has-photo .slot-img {
      width: 100%; flex: 1; min-height: 60px; max-height: 110px;
      object-fit: contain; display: block; border-radius: 6px 6px 0 0; flex-shrink: 0;
    }
    /* Hover zoom for photo slots */
    .slot.has-photo { transition: transform 0.18s ease, box-shadow 0.18s ease, z-index 0s; }
    .slot.has-photo:hover {
      transform: scale(2.2);
      transform-origin: center top;
      z-index: 9999;
      box-shadow: 0 8px 28px rgba(0,0,0,0.55);
    }
    .slot.has-photo:hover .edit-btn { display: inline !important; }
    .slot.has-photo .slot-id {
      padding: 2px 5px; display: flex; align-items: center; gap: 4px;
      background: rgba(0,0,0,0.035); flex-shrink: 0;
    }
    .slot-pick-badge  { font-size: 9px; color: #888; }
    .slot-makat-badge { font-size: 10px; font-weight: bold; color: #222; }

    /* Text mode */
    .slot.text-mode { padding: 5px 6px; flex-direction: column; transition: transform 0.18s ease, box-shadow 0.18s ease; }
    .slot.text-mode:hover {
      transform: scale(2.2);
      transform-origin: center top;
      z-index: 9999;
      box-shadow: 0 8px 28px rgba(0,0,0,0.55);
    }
    .slot.text-mode:hover .edit-btn { display: inline !important; }
    .slot.text-mode .s-pick  { font-size: 10px; color: #777; font-weight: bold; }
    .slot.text-mode .s-makat { font-size: 11px; color: #333; margin: 1px 0; }
    .slot.text-mode .s-name  {
      font-size: 9px; color: #111; font-weight: bold; line-height: 1.3;
      flex: 1; word-break: break-word;
    }
    .s-badges { font-size: 14px; line-height: 1; display: block; margin-bottom: 1px; }
    .slot-id .s-badges { font-size: 13px; display: inline; margin-right: 3px; }

    /* Stock info bar — shown in both modes */
    .slot-stock {
      font-size: 9px; padding: 2px 5px 1px; margin-top: auto; flex-shrink: 0;
      border-top: 1px solid rgba(0,0,0,0.07);
      background: rgba(255,255,255,0.55);
      text-align: center;
    }
    .s-pal-big {
      font-size: 18px; font-weight: 900; color: #1a6ef5; line-height: 1.1;
      letter-spacing: -0.5px;
    }
    .s-pal-unit { font-size: 10px; font-weight: 600; color: #4a90d9; }
    .slot-kart-line { font-size: 8px; color: #666; line-height: 1.4; }
    .slot-kart-line .s-kart { color: #444; }
    .slot-kart-line .s-krat { color: #999; }
    .s-zero-bar { text-align: center; }
    .slot-stock .s-zero { color: #cc0000; font-weight: bold; }
    .slot-meta  { font-size: 8px; color: #bbb; padding: 0 5px 2px; line-height: 1.2; text-align: center; }
    .slot-meta .s-meta { color: #bbb; }

    /* Empty slot */
    .slot.slot-empty {
      background: #f7f7f7 !important; border: 2px dashed #ddd !important;
      opacity: 0.4; cursor: default;
      justify-content: center; align-items: center;
    }
    .slot.slot-empty span { font-size: 10px; color: #bbb; text-align: center; }

    /* Reserve empty slot — compact indicator, not full card */
    .slot.slot-reserve-empty {
      background: repeating-linear-gradient(
        45deg, #f4f4f4 0, #f4f4f4 8px, #e8e8e8 8px, #e8e8e8 16px
      ) !important;
      border: 2px dashed #bbb !important;
      opacity: 0.6; cursor: grab;
      justify-content: center; align-items: center;
      width: 56px !important; min-height: 56px !important;
    }
    .slot.slot-reserve-empty span { font-size: 8px; color: #bbb; text-align: center; }

    /* No-photo mark — ✕ overlay on cards with no image in system */
    .slot.no-photo-mark::after {
      content: '✕';
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 28px; color: rgba(0,0,0,0.22);
      pointer-events: none; line-height: 1; font-weight: 300;
    }

    /* Side-column slots (single pick per row) — constrained to compact row height */
    .slot.side-col-slot { min-height: 0 !important; height: 63px; overflow: hidden; }
    .slot.side-col-slot .slot-img { max-height: 30px !important; min-height: 20px; }
    .slot.side-col-slot .slot-stock { font-size: 8px; padding: 1px 3px; }

    /* Corridor row — dark passage between zones */
    .corridor-row {
      background: rgba(0,0,0,0.13);
      border-radius: 4px;
    }

    /* Reserve separator — thick red line over the corridor */
    .reserve-banner {
      background: linear-gradient(90deg, #e53e3e 0%, #c53030 40%, transparent 100%);
      border-radius: 2px;
      align-self: end;
      height: 5px;
    }

    /* Drag states */
    .sortable-ghost  { opacity: 0.2; }
    .sortable-chosen { box-shadow: 0 6px 20px rgba(0,0,0,0.25); transform: scale(1.05); z-index: 999; }
    .sortable-swap   { outline: 3px dashed #1a6ef5; outline-offset: 2px; border-radius: 8px; }

    /* Edit mode toggle — hide action buttons in view mode */
    .edit-btn { display: none !important; }
    body.edit-mode .edit-btn { display: inline !important; }

    /* Legend */
    .legend {
      display: flex; flex-wrap: wrap; gap: 5px;
      padding: 10px 16px 16px; background: #fff; border-top: 1px solid #eee;
    }
    .leg { display: flex; align-items: center; gap: 3px; font-size: 9px; color: #444; }
    .leg-dot { width: 10px; height: 10px; border-radius: 2px; border: 1px solid rgba(0,0,0,0.08); }

    @media (max-width: 600px) {
      .slot { width: 84px; min-height: 132px; }
      .slot.has-photo .slot-img { height: 56px; }
    }
  </style>
</head>
<body>

<div class="header">
  <h1>MAHSAN EDITOR</h1>
  <span class="badge">FORMULA ❄️</span>
  <span id="refresh-badge" style="margin-right:auto; font-size:13px; font-weight:bold; color:#7dd3fc; letter-spacing:0.5px;"></span>
</div>

<div class="tabs">
  <button class="tab active" data-sec="kapua"  onclick="switchTab('kapua',this)"><span>קפוא ❄️</span><span class="tab-pal" id="tab-pal-kapua"></span></button>
  <button class="tab"        data-sec="halavi" onclick="switchTab('halavi',this)"><span>חלבי 🥛</span><span class="tab-pal" id="tab-pal-halavi"></span></button>
  <button class="tab"        data-sec="dagim"  onclick="switchTab('dagim',this)"><span>דגים 🐟</span><span class="tab-pal" id="tab-pal-dagim"></span></button>
  <button class="tab"        data-sec="yavesh" onclick="switchTab('yavesh',this)"><span>דג יבש 🧂</span><span class="tab-pal" id="tab-pal-yavesh"></span></button>
</div>

<div id="print-header">MAHSAN PLANOGRAM — FORMULA</div>

<div class="toolbar">
  <button class="btn no-print" id="btn-refresh" onclick="refreshData()"
    style="background:#0ea5e9;color:#fff;border:1px solid #0284c7;font-weight:bold;">🔄 רענן</button>
  <button class="btn btn-export no-print" onclick="exportCSV()">⬇ CSV</button>
  <button class="btn btn-save no-print"   onclick="saveState()">💾 שמור</button>
  <div style="position:relative; display:inline-block;" class="no-print">
    <button class="btn" id="btn-history" onclick="toggleHistory()"
      style="background:#fff3cd;color:#7a5c00;border:1px solid #e0c040;">🕐 היסטוריה</button>
    <div class="history-dropdown" id="history-dropdown"></div>
  </div>
  <button class="btn no-print" id="btn-hide-reserve" onclick="toggleHideReserve()"
    style="background:#fff8e1;color:#7a5c00;border:1px solid #e0c040;">Plan Only</button>
  <button class="btn no-print" id="btn-pdf" onclick="printPlanogram()"
    style="background:#f0f0f0;color:#333;border:1px solid #ccc;">🖨️ PDF</button>
  <button class="btn no-print" id="btn-edit" onclick="toggleEditMode()"
    style="background:#fff3e0;color:#e65100;border:2px solid #ff8f00;font-weight:bold;font-size:16px;padding:10px 22px;min-width:110px;">✏ עריכה</button>
  <button class="btn btn-reset no-print edit-btn" onclick="resetSection()">↩ אפס</button>
  <button class="btn no-print" id="btn-table" onclick="toggleTable()" style="background:#f0f4ff;color:#1565C0;border:1px solid #1565C0;">📊 מיקום</button>
  <button class="btn no-print" id="btn-expiry" onclick="toggleExpiryPage()" style="background:#f0f4ff;color:#c62828;border:1px solid #ef9a9a;">📦 תוקף</button>
  <span class="no-print" style="margin-right:6px;border-right:1px solid #ccc;padding-right:8px;display:inline-flex;align-items:center;gap:3px;">
    <button id="wh-main" class="btn wh-btn wh-active" onclick="setWarehouse('Main')">אשדוד</button>
    <button id="wh-zafn" class="btn wh-btn"           onclick="setWarehouse('Zafn')">צפון</button>
  </span>
  <button class="btn no-print" id="btn-fs" onclick="toggleFullscreen()" title="מסך מלא"
    style="background:#f5f5f5;color:#333;border:1px solid #ccc;padding:7px 10px;">⛶</button>
  <button class="btn no-print" onclick="fitToScreen()" title="כל הדף במסך"
    style="background:#f5f5f5;color:#333;border:1px solid #ccc;padding:7px 10px;">⊡</button>
  <button class="btn no-print" onclick="changeZoom(-1)" style="background:#f5f5f5;color:#333;border:1px solid #ccc;padding:7px 10px;">−</button>
  <span id="zoom-label" style="font-size:11px;color:#555;min-width:32px;text-align:center;">100%</span>
  <button class="btn no-print" onclick="changeZoom(+1)" style="background:#f5f5f5;color:#333;border:1px solid #ccc;padding:7px 10px;">+</button>
  <span id="section-stats" class="no-print status" style="display:inline-flex;gap:10px;align-items:center;font-size:12px;font-weight:600;color:#444;background:#f0f4ff;border:1px solid #c5cae9;border-radius:8px;padding:5px 14px;">
    <span>מקטים פעילים: <b id="stat-active" style="color:#1565C0">—</b></span>
    <span style="color:#ccc">|</span>
    <span>במלאי היום: <b id="stat-instock" style="color:#2e7d32">—</b></span>
  </span>
  <span class="status" id="status" style="display:none;"></span>
</div>

<div id="sec-kapua"  class="section active"><div id="grid-kapua"  class="warehouse-grid"></div></div>
<div id="sec-halavi" class="section">       <div id="grid-halavi" class="warehouse-grid"></div></div>
<div id="sec-dagim"  class="section">       <div id="grid-dagim"  class="warehouse-grid"></div></div>
<div id="sec-yavesh" class="section">       <div id="grid-yavesh" class="warehouse-grid"></div></div>

<div class="legend" id="legend"></div>

<!-- Expiry report page — full-screen overlay -->
<div id="expiry-page" style="
  display:none; position:fixed; inset:0; z-index:600;
  background:#f4f6fb; overflow-y:auto; direction:rtl;
">
  <div style="display:flex;align-items:center;gap:10px;padding:10px 18px;background:#c62828;position:sticky;top:0;z-index:10;">
    <span style="font-weight:bold;font-size:13px;color:#fff;flex:1;" id="expiry-title">דוח תוקף</span>
    <button id="btn-sakana-filter"  onclick="toggleSakanaFilter()"  style="background:#e8e8e8;border:1.5px solid #bdbdbd;color:#c62828;font-size:13px;font-weight:bold;cursor:pointer;border-radius:5px;padding:6px 20px;">⚠ סכנה בלבד</button>
    <button id="btn-zafn-low-filter" onclick="toggleZafnLowFilter()" style="background:#e8e8e8;border:1.5px solid #bdbdbd;color:#c62828;font-size:13px;font-weight:bold;cursor:pointer;border-radius:5px;padding:6px 20px;">📦 צפון &lt;3 ימים</button>
    <button onclick="window.print()" style="background:rgba(255,255,255,0.2);border:none;color:#fff;font-size:12px;cursor:pointer;border-radius:4px;padding:4px 12px;">🖨 הדפס</button>
    <button onclick="toggleExpiryPage()" style="background:rgba(255,255,255,0.2);border:none;color:#fff;font-size:16px;cursor:pointer;border-radius:4px;padding:2px 8px;">✕</button>
  </div>
  <div id="expiry-grid" style="padding:12px 16px; display:flex; flex-wrap:wrap; gap:10px; justify-content:flex-start;"></div>
</div>

<!-- Summary position table — fixed overlay panel -->
<div id="position-table" style="
  display:none;
  position:fixed; bottom:0; right:0; left:0; z-index:500;
  background:#fff; border-top:3px solid #1a6ef5;
  max-height:48vh; overflow-y:auto; overflow-x:auto;
  direction:rtl; box-shadow:0 -4px 20px rgba(0,0,0,0.18);
">
  <div style="display:flex; align-items:center; gap:8px; padding:8px 16px; background:#1565C0; position:sticky; top:0; z-index:10;">
    <span style="font-weight:bold; font-size:12px; color:#fff; flex:1;" id="pos-tbl-title">טבלת מיקום</span>
    <button onclick="toggleTable()" style="background:rgba(255,255,255,0.2); border:none; color:#fff; font-size:16px; cursor:pointer; border-radius:4px; padding:2px 8px; line-height:1;">✕</button>
  </div>
  <div style="padding:0 16px 12px;">
    <table id="pos-tbl" style="border-collapse:collapse; font-size:11px; min-width:400px; width:100%;">
      <thead>
        <tr style="background:#e8f0fe; color:#1565C0; position:sticky; top:42px;">
          <th style="padding:5px 10px; text-align:center; min-width:55px;">סדר הדפסה</th>
          <th style="padding:5px 10px; text-align:center; min-width:40px;">ביי</th>
          <th style="padding:5px 10px; text-align:right; min-width:60px;">מקט</th>
          <th style="padding:5px 10px; text-align:right; min-width:160px;">שם מוצר</th>
          <th style="padding:5px 10px; text-align:right; min-width:100px;">משפחה</th>
        </tr>
      </thead>
      <tbody id="pos-tbl-body"></tbody>
    </table>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>

// ══════════════════════════════════════════════════════════════════════════
// FAMILY COLORS
// ══════════════════════════════════════════════════════════════════════════
const FAM_COLORS = {
  'חמאה FERMA':'#FFF9D5','חמאה רושן':'#FFFCC0','ממרחי חמאה':'#FFFAB0',
  'בלינצס':'#D4E8FF','כיסונים':'#E8D5F5','בצק':'#FFF0CC','עלי בלינצס':'#D5F0D5',
  'SANTA BREMOR':'#D5EAF5','חטיף גבינה':'#FFFF9A','עוגות רושן':'#FFD5D5',
  'עוגות מוזיקה':'#D5FFD5','מוסדי':'#FFDEA0','VALESTA':'#C8C8FF',
  'SANTA BREMOR דגים':'#D0F0FF','PRESIDENT':'#FCE4EC','SVALIA תנמש':'#E3F2FD',
  'SVALIA גורובט':'#F3E5F5','SVALIA תוסורפ':'#F1F8E9','SVALIA הניבג':'#FFF8E1',
  'NORD PORT':'#E0F7FA','NORD PORT מצונן':'#B2DFEE','SANTA BREMOR Fish':'#FFE0B2',
  'דגים KAZAHSTAN':'#FFF3CD','דגים RUSSIA':'#FFE4B5','דגים פודסטוק':'#FFDAB9',
  'דגים RUSSIAN SEA':'#FFD8A8',
};
function fixVisualRTL(s) {
  const full = s.split('').reverse().join('');
  return full.replace(/[\x20-\x7E]+/g, m => m.split('').reverse().join(''));
}
function famColor(fam) {
  if (!fam) return '#F5F5F5';
  for (const k of Object.keys(FAM_COLORS)) if (fam.includes(k)) return FAM_COLORS[k];
  return '#E8E8E8';
}
function cardBg(makat, fam) {
  const d = productData[String(makat)];
  return (d && d.daySales == null) ? '#FFF9C4' : famColor(fam);
}

// ══════════════════════════════════════════════════════════════════════════
// KAPUA BASE DATA
// ══════════════════════════════════════════════════════════════════════════
const KAPUA_BASE = {
   1:{makat:'732',   fam:'חמאה FERMA',       name:'חמאה FERMA 82%'},
   2:{makat:'800',   fam:'חמאה רושן',         name:'חמאה רושן 82%'},
   3:{makat:'604',   fam:'חמאה רושן',         name:'חמאה רושן 72%'},
   4:{makat:'736',   fam:'ממרחי חמאה',        name:'ממרח 1'},
   5:{makat:'803',   fam:'ממרחי חמאה',        name:'ממרח 2'},
   6:{makat:'802',   fam:'ממרחי חמאה',        name:'ממרח 3'},
   7:{makat:'739',   fam:'ממרחי חמאה',        name:'ממרח 4'},

// Print order per section — array of pick strings; independent of bay position
const printOrder = {
  kapua:  JSON.parse(localStorage.getItem('mahsan_print_order_kapua')  || 'null'),
  halavi: JSON.parse(localStorage.getItem('mahsan_print_order_halavi') || 'null'),
  dagim:  JSON.parse(localStorage.getItem('mahsan_print_order_dagim')  || 'null'),
  yavesh: JSON.parse(localStorage.getItem('mahsan_print_order_yavesh') || 'null'),
};
function _getPrintOrder(sec) {
  const activePicks = Object.keys(state[sec] || {}).filter(k => state[sec][k]).sort((a,b)=>+a-+b);
  const saved = printOrder[sec];
  if (!saved) return activePicks;
  // Keep saved order, add any new picks at end, remove stale
  const activeSet = new Set(activePicks);
  const filtered = saved.filter(p => activeSet.has(p));
  activePicks.forEach(p => { if (!filtered.includes(p)) filtered.push(p); });
  return filtered;
}
function _savePrintOrder(sec, order) {
  printOrder[sec] = order;
  localStorage.setItem('mahsan_print_order_' + sec, JSON.stringify(order));
}
function movePrintOrder(sec, idx, dir) {
  const order = _getPrintOrder(sec);
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= order.length) return;
  [order[idx], order[newIdx]] = [order[newIdx], order[idx]];
  _savePrintOrder(sec, order);
  updateTable();
}

// ── Medals + dumbbell ────────────────────────────────────────────────────
let heavyThresh = null;
const medalMap  = {};  // key: "section:makat" → "🥇"|"🥈"|"🥉"

function computeHeavyThresh() {
  const vals = Object.values(productData)
    .map(p => p.weightCarton).filter(v => v != null && v > 0).sort((a,b) => a-b);
  return vals.length ? vals[Math.floor(vals.length * 0.7)] : null;
}

function computeSectionMedals(section, picks) {
  const ranked = Object.values(picks)
    .filter(p => p && productData[String(p.makat)]?.daySales > 0)
    .sort((a,b) => (productData[String(b.makat)]?.daySales||0) - (productData[String(a.makat)]?.daySales||0));
  const medals = ['🥇','🥈','🥉'];
  const seen = new Set(); let rank = 0;
  for (const p of ranked) {
    const mk = String(p.makat);
    if (seen.has(mk)) continue;
    seen.add(mk);
    medalMap[`${section}:${mk}`] = medals[rank++];
    if (rank >= 3) break;
  }
}

function getMedal(section, makat) {
  return medalMap[`${section}:${String(makat)}`] || '';
}
function isHeavyProduct(makat) {
  return heavyThresh != null && (productData[String(makat)]?.weightCarton || 0) >= heavyThresh;
}
function slotBadges(section, makat) {
  const medal = getMedal(section, makat);
  const heavy = isHeavyProduct(makat) ? '🏋️' : '';
  return medal || heavy ? `<span class="s-badges">${medal}${heavy ? ' ' + heavy : ''}</span>` : '';
}

function offUrl(ean) {
  // Open Food Facts image: split 13-digit EAN into 3/3/3/rest
  const s = String(ean).replace(/\D/g,'');
  if (s.length >= 9) {
    const a = s.slice(0,3), b = s.slice(3,6), c = s.slice(6,9), d = s.slice(9);
    return `https://images.openfoodfacts.org/images/products/${a}/${b}/${c}/${d}/front_en.display.jpg`;
  }
  return `https://images.openfoodfacts.org/images/products/${s}/front_en.display.jpg`;
}

function getPhotoUrl(makat) {
  if (hiddenPhotos.has(String(makat))) return null;
  // Priority: 1) KARTIS PARIT URL, 2) local EAN photo, 3) local makat PNG
  const priorityUrl = productPhotos[String(makat)];
  if (priorityUrl) return priorityUrl;
  const ean = makatEan[String(makat)];
  if (ean) {
    const entry = photoMap[String(ean)];
    if (entry) return entry.url;
  }
  return './' + makat + '.png';
}

window.hidePhoto = function(makat, pick, section) {
  hiddenPhotos.add(String(makat));
  localStorage.setItem('mahsan_no_photo', JSON.stringify([...hiddenPhotos]));
  const container = document.getElementById('grid-' + section);
  const el = container ? [...container.children].find(e => +e.dataset.pick === pick) : null;
  if (el) refreshSlot(el, pick, section || window._currentSection || 'kapua');
};

window.showPhoto = function(makat, pick, section) {
  hiddenPhotos.delete(String(makat));
  localStorage.setItem('mahsan_no_photo', JSON.stringify([...hiddenPhotos]));
  const container = document.getElementById('grid-' + section);
  const el = container ? [...container.children].find(e => +e.dataset.pick === pick) : null;
  if (el) refreshSlot(el, pick, section || window._currentSection || 'kapua');
};

window.clearPick = function(pick, section) {
  const sec = section || window._currentSection || 'kapua';
  const p = state[sec] && state[sec][pick];
  if (p && p.makat) {
    hiddenPhotos.delete(String(p.makat));
    localStorage.setItem('mahsan_no_photo', JSON.stringify([...hiddenPhotos]));
  }
  clearedPicks[sec] = clearedPicks[sec] || new Set();
  clearedPicks[sec].add(String(pick));
  _saveClearedPicks();
  const container = document.getElementById('grid-' + sec);
  const el = container ? [...container.children].find(e => +e.dataset.pick === +pick) : null;
  if (el) refreshSlot(el, pick, sec);
};

window.restorePick = function(pick, section) {
  const sec = section || window._currentSection || 'kapua';
  clearedPicks[sec] && clearedPicks[sec].delete(String(pick));
  _saveClearedPicks();
  const container = document.getElementById('grid-' + sec);
  const el = container ? [...container.children].find(e => +e.dataset.pick === +pick) : null;
  if (el) refreshSlot(el, pick, sec);
};

  const id = wh === 'Main' ? 'wh-main' : wh === 'Zafn' ? 'wh-zafn' : 'wh-trnz';
  document.getElementById(id)?.classList.add('wh-active');
  updateSectionStats();
  // Re-render all already-rendered sections so warehouse change applies everywhere
  for (const sec of _SECTIONS) {
    if (!rendered[sec]) continue;
    const grid = document.getElementById('grid-' + sec);
    if (grid) grid.querySelectorAll('.slot[data-pick]').forEach(el => {
      refreshSlot(el, +el.dataset.pick, sec);
    });

}

function stockHTML(makat) {
  const d = productData[String(makat)];
  if (!d) return '';
  const wh = window._activeWarehouse || 'Main';
  if (wh === 'Trnz') {
    const trnzStock = d.stockTrnz;
    if (!trnzStock || trnzStock <= 0) return '';
    const palTrnz = d.palStockTrnz;
    const palLine = palTrnz > 0 ? `<div class="s-pal-big">${Math.round(palTrnz)} <span class="s-pal-unit">PAL</span></div>` : '';
    const kartLine = `<span class="s-kart">${trnzStock}קרט</span>`;
    const kratLine = d.kratnost > 0 ? `<span class="s-krat"> [${d.kratnost}]</span>` : '';
    return `<div class="slot-stock">${palLine}<div class="slot-kart-line">${kartLine}${kratLine}</div></div>`;
  }
  const stock    = wh === 'Zafn' ? d.stockZafn    : d.stock;
  const palStock = wh === 'Zafn' ? d.palStockZafn : d.palStock;
  const daySales = wh === 'Zafn' ? d.daySalesZafn : d.daySales;
  if (stock == null && wh === 'Zafn') return '';
  if (!stock || stock <= 0) return `<div class="slot-stock s-zero-bar"><span class="s-zero">אפס מלאי</span></div>`;
  const palLine  = palStock != null && palStock > 0
    ? `<div class="s-pal-big">${Math.round(palStock)} <span class="s-pal-unit">PAL</span></div>` : '';
  const kartLine = stock != null ? `<span class="s-kart">${stock}קרט</span>` : '';
  const kratLine = d.kratnost > 0 ? `<span class="s-krat"> [${d.kratnost}]</span>` : '';
  const noDataLine = wh === 'Main' && !(d.kratnost > 0) && !d.yavesh
    ? `<div style="font-weight:bold;color:#e53935;font-size:10px;line-height:1.2;">NO DATA</div>` : '';
  const wCarton  = d.weightCarton != null && d.weightCarton > 0 ? d.weightCarton
                 : (d.weight != null && d.weight > 0 && d.packFactor > 0 ? +(d.weight * d.packFactor).toFixed(1) : null);
  const wtLine   = wCarton != null ? `<span class="s-weight">${wCarton} kg/קרט</span>` : '';
  const dsa      = daySales;
  const daysLeft = (dsa > 0 && stock > 0) ? Math.round(stock / dsa) : (wh === 'Main' ? d.daysStockAll : null);
  const daysLine = daysLeft != null ? `<span class="s-meta" title="days for saleout">${daysLeft}<span style="font-size:9px;opacity:0.7"> days</span></span>` : '';
  const metaLine = daysLine ? `<div class="slot-meta">${daysLine}</div>` : '';
  const stockLine = (kartLine || kratLine) ? `<div class="slot-kart-line">${kartLine}${kratLine}</div>` : '';
  return `<div class="slot-stock">${palLine}${stockLine}${noDataLine}${wtLine}</div>${metaLine}`;
}

      fetch(base + 'refresh-info.json?t='      + Date.now()).then(r => r.ok ? r.json() : null).catch(() => null),
    ]);
    photoMap      = pm;
    makatEan      = me;
    productData   = pd;
    productPhotos = pp;
    dyBase        = dy;

    // Apply fresh dagim-yavesh-base.json — version check resets stale localStorage picks
    let _anyVersionReset = false;
    if (dy && dy.picks) {
      const savedYaveshV = localStorage.getItem('yavesh_base_v');
      const freshYaveshV = dy.v != null ? String(dy.v) : '';
      if (freshYaveshV && savedYaveshV !== freshYaveshV) {
        state.yavesh = deepClone(dy.picks);
        localStorage.setItem('yavesh_base_v', freshYaveshV);
        _anyVersionReset = true;
        console.log(`dagim-yavesh-base.json: version changed ${savedYaveshV} → ${freshYaveshV}, state reset`);
      } else {
        for (const [pick, p] of Object.entries(dy.picks)) {
          if (!p) { state.yavesh[pick] = null; }
          else if (!(pick in state.yavesh)) state.yavesh[pick] = { ...p };
        }
      }
      console.log(`dagim-yavesh-base.json: ${Object.keys(dy.picks).length} picks, v=${freshYaveshV}`);
    }

    // Apply fresh kapua-base.json (includes new PBI products + updated names)
    if (kb && kb.picks) {
      Object.assign(KAPUA_BASE,   kb.picks);
      Object.assign(KAPUA_LAYOUT, kb.layout || {});
      if (kb.maxCols) KAPUA_MAX.cols = kb.maxCols;
      if (kb.maxRows) KAPUA_MAX.rows = kb.maxRows;
      if (kb.reserveStart) KAPUA_RESERVE_START = kb.reserveStart;
      window._kapuaVer = kb.v || '';
      // If base version changed → reset state from fresh JSON (clears stale localStorage order)
      const savedVer = localStorage.getItem('kapua_base_v');
      const freshVer = kb.v || '';
      if (freshVer && savedVer !== freshVer) {
        state.kapua = deepClone(kb.picks);
        localStorage.setItem('kapua_base_v', freshVer);
        _anyVersionReset = true;
        console.log(`kapua-base.json: version changed ${savedVer} → ${freshVer}, state reset`);
      } else {
        for (const [pick, p] of Object.entries(kb.picks)) {
          if (!p) {
            state.kapua[pick] = null; // product removed from base → clear from state too
          } else if (!(pick in state.kapua)) {
            state.kapua[pick] = { ...p };
          }
        }
      }
      console.log(`kapua-base.json: ${Object.keys(kb.picks).length} picks, maxRows=${kb.maxRows}, v=${freshVer}`);
    }

    // Apply fresh halavi-base.json
    if (hb && hb.picks) {
      Object.assign(HALAVI_BASE,   hb.picks);
      Object.assign(HALAVI_LAYOUT, hb.layout || {});
      if (hb.maxCols)     HALAVI_MAX.cols       = hb.maxCols;
      if (hb.maxRows)     HALAVI_MAX.rows       = hb.maxRows;
      if (hb.reserveStart) HALAVI_RESERVE_START = hb.reserveStart;
      const savedHalaviV = localStorage.getItem('halavi_base_v');
      const freshHalaviV = hb.v || '';
      if (freshHalaviV && savedHalaviV !== freshHalaviV) {
        state.halavi = deepClone(hb.picks);
        localStorage.setItem('halavi_base_v', freshHalaviV);
        _anyVersionReset = true;
        console.log(`halavi-base.json: version changed ${savedHalaviV} → ${freshHalaviV}, state reset`);
      } else {
        for (const [pick, p] of Object.entries(hb.picks)) {
          if (!p) { state.halavi[pick] = null; }
          else if (!(pick in state.halavi)) state.halavi[pick] = { ...p };
        }
      }
      console.log(`halavi-base.json: ${Object.keys(hb.picks).length} picks, reserveStart=${hb.reserveStart}`);
    }

    // Apply fresh dagim-base.json
    if (db && db.picks) {
      Object.assign(DAGIM_BASE,   db.picks);
      Object.assign(DAGIM_LAYOUT, db.layout || {});
      if (db.maxCols)     DAGIM_MAX.cols       = db.maxCols;
      if (db.maxRows)     DAGIM_MAX.rows       = db.maxRows;
      if (db.reserveStart) DAGIM_RESERVE_START = db.reserveStart;
      const savedDagimV = localStorage.getItem('dagim_base_v');
      const freshDagimV = db.v || '';
      if (freshDagimV && savedDagimV !== freshDagimV) {
        state.dagim = deepClone(db.picks);
        localStorage.setItem('dagim_base_v', freshDagimV);
        _anyVersionReset = true;
        console.log(`dagim-base.json: version changed ${savedDagimV} → ${freshDagimV}, state reset`);
      } else {
        for (const [pick, p] of Object.entries(db.picks)) {
          if (!p) { state.dagim[pick] = null; }
          else if (!(pick in state.dagim)) state.dagim[pick] = { ...p };
        }
      }
      console.log(`dagim-base.json: ${Object.keys(db.picks).length} picks, reserveStart=${db.reserveStart}`);
    }

    if (ri && ri.label) {
      document.getElementById('refresh-badge').textContent = '🔄 ' + ri.label;
    }

    // Persist reset state so ALL users see fresh layout without manual איפוס
    if (_anyVersionReset) {
      localStorage.setItem('mahsan_editor', JSON.stringify(state));
      console.log('State persisted after version reset — all users will see fresh layout');
    }

    // Compute medals + heavy threshold after all data loaded
    heavyThresh = computeHeavyThresh();
    computeSectionMedals('kapua',  KAPUA_BASE);
    computeSectionMedals('halavi', HALAVI_BASE);
    computeSectionMedals('dagim',  DAGIM_BASE);
    console.log(`Heavy thresh: ${heavyThresh?.toFixed(1)} kg/קרט | Medals computed`);

    const cnt = Object.keys(photoMap).length;
    console.log(`Photos: ${cnt} EANs | Stock: ${Object.keys(pd).length} | DY: ${Object.keys(dy).length}`);
    return cnt;
  } catch(e) {
    console.warn('Maps not available:', e.message);
    return 0;
  }
}

// SLOT RENDERING
// ══════════════════════════════════════════════════════════════════════════
function makeSlot(pick, p, reserveStart = 0) {
  const el = document.createElement('div');
  el.dataset.pick = pick;
  const isReserve = reserveStart > 0 && pick >= reserveStart;
  if (!p) {
    if (isReserve) {
      el.className = 'slot slot-reserve-empty';
      el.innerHTML = `<span>◈<br>РЕЗЕРВ</span>`;
    } else {
      el.className = 'slot slot-empty';
      el.innerHTML = `<span>#${pick}<br>פנוי</span>`;
    }
    return el;
  }
  const sec = window._currentSection || 'kapua';
  const photoUrl = getPhotoUrl(p.makat);
  if (photoUrl) {
    el.className = 'slot has-photo';
    el.innerHTML = `
      <img class="slot-img" src="${photoUrl}" alt="${p.makat}"
           onerror="this.closest('.slot').classList.remove('has-photo'); this.closest('.slot').classList.add('text-mode'); renderTextMode(this.closest('.slot'), ${pick});">
      <button class="edit-btn" onclick="clearPick(${pick},'${sec}')" title="הסר מוצר"
        style="position:absolute;top:2px;left:2px;background:rgba(0,0,0,0.45);border:none;color:#fff;font-size:9px;cursor:pointer;border-radius:3px;padding:1px 4px;z-index:10;line-height:1.4;">✕</button>
      <div class="slot-id">
        ${isReserve ? '' : `<span class="slot-pick-badge">#${pick}</span>`}
        <span class="slot-makat-badge">${p.makat}</span>
        ${isReserve ? '' : slotBadges(sec, p.makat)}
      </div>
      ${stockHTML(p.makat)}`;
  } else {
    const hasRealPhoto = !!makatEan[String(p.makat)] && !!photoMap[makatEan[String(p.makat)]];
    const restoreBtn  = hiddenPhotos.has(String(p.makat)) && hasRealPhoto
      ? `<button onclick="showPhoto('${p.makat}',${pick},'${sec}')" title="שחזר תמונה"
           style="position:absolute;top:2px;left:2px;background:rgba(26,110,245,0.7);border:none;color:#fff;font-size:9px;cursor:pointer;border-radius:3px;padding:1px 4px;z-index:10;line-height:1.4;">📷</button>`
      : '';
    el.className = 'slot text-mode' + (!hasRealPhoto && !hiddenPhotos.has(String(p.makat)) ? ' no-photo-mark' : '');
    el.style.background = cardBg(p.makat, p.fam);
    const clearBtn = `<button class="edit-btn" onclick="clearPick(${pick},'${sec}')" title="הסר מוצר"
      style="position:absolute;top:2px;left:2px;background:rgba(0,0,0,0.35);border:none;color:#fff;font-size:9px;cursor:pointer;border-radius:3px;padding:1px 4px;z-index:10;line-height:1.4;">✕</button>`;
    el.innerHTML = clearBtn + restoreBtn + textModeHTML(pick, p, reserveStart) + stockHTML(p.makat);
  }
  return el;
}

function textModeHTML(pick, p, reserveStart = 0) {
  const isReserve = reserveStart > 0 && pick >= reserveStart;
  const displayName = p.name || productData[String(p.makat)]?.nameEn || productData[String(p.makat)]?.desc || '';
  const sec = window._currentSection || 'kapua';
  const badges = isReserve ? '' : slotBadges(sec, p.makat);
  return `${isReserve ? '' : `<span class="s-pick">#${pick}</span>`}
          ${badges}
          <span class="s-makat">${p.makat}</span>
          ${displayName ? `<span class="s-name">${displayName}</span>` : `<span class="s-fam">${p.fam || ''}</span>`}`;
}

function sectionReserveStart(section) {
  if (section === 'halavi') return HALAVI_RESERVE_START;
  if (section === 'dagim')  return DAGIM_RESERVE_START;
  return KAPUA_RESERVE_START;
}

// Called from onerror handler when image fails to load
window.renderTextMode = function(el, pick) {
  const section = window._currentSection || 'kapua';
  const p = state[section][pick];
  if (p) {
    el.style.background = cardBg(p.makat, p.fam);

      style="position:absolute;top:2px;left:2px;background:rgba(0,0,0,0.35);border:none;color:#fff;font-size:9px;cursor:pointer;border-radius:3px;padding:1px 4px;z-index:10;line-height:1.4;">✕</button>`;
    el.innerHTML = clearBtn + textModeHTML(pick, p, sectionReserveStart(section)) + stockHTML(p.makat);
  }
};

function refreshSlot(el, pick, section) {
  const p = state[section][pick];
  el.dataset.pick = pick;
  const rs = sectionReserveStart(section);
  const isReserve = rs > 0 && pick >= rs;

  // Pick manually cleared by user — show as empty with restore button
  if (clearedPicks[section] && clearedPicks[section].has(String(pick))) {
    el.className = 'slot slot-empty';
    el.style.background = '';
    el.innerHTML = `<span style="color:#aaa;font-size:9px;">#${pick}</span>
      <button class="edit-btn" onclick="restorePick(${pick},'${section}')" title="שחזר מוצר"
        style="position:absolute;bottom:3px;left:50%;transform:translateX(-50%);background:rgba(26,110,245,0.7);border:none;color:#fff;font-size:9px;cursor:pointer;border-radius:3px;padding:1px 5px;z-index:10;">↩</button>`;
    return;
  }

  if (!p) {
    if (isReserve) {
      el.className = 'slot slot-reserve-empty';
      el.style.background = '';
      el.innerHTML = `<span>◈<br>РЕЗЕРВ</span>`;
    } else {
      el.className = 'slot slot-empty';
      el.style.background = '';
      el.innerHTML = `<span>#${pick}<br>פנוי</span>`;
    }
    return;
  }
  const photoUrl = getPhotoUrl(p.makat);
  if (photoUrl) {
    el.className = 'slot has-photo';
    el.style.background = '';
    el.innerHTML = `
      <img class="slot-img" src="${photoUrl}" alt="${p.makat}"
           onerror="this.closest('.slot').classList.remove('has-photo'); this.closest('.slot').classList.add('text-mode'); renderTextMode(this.closest('.slot'), ${pick});">
      <button class="edit-btn" onclick="clearPick(${pick},'${section}')" title="הסר מוצר"
        style="position:absolute;top:2px;left:2px;background:rgba(0,0,0,0.45);border:none;color:#fff;font-size:9px;cursor:pointer;border-radius:3px;padding:1px 4px;z-index:10;line-height:1.4;">✕</button>
      <div class="slot-id">
        ${isReserve ? '' : `<span class="slot-pick-badge">#${pick}</span>`}
        <span class="slot-makat-badge">${p.makat}</span>
        ${isReserve ? '' : slotBadges(section, p.makat)}
      </div>
      ${stockHTML(p.makat)}`;
  } else {
    const hasRealPhoto = !!makatEan[String(p.makat)] && !!photoMap[makatEan[String(p.makat)]];
    const restoreBtn  = hiddenPhotos.has(String(p.makat)) && hasRealPhoto
      ? `<button onclick="showPhoto('${p.makat}',${pick},'${section}')" title="שחזר תמונה"
           style="position:absolute;top:2px;left:2px;background:rgba(26,110,245,0.7);border:none;color:#fff;font-size:9px;cursor:pointer;border-radius:3px;padding:1px 4px;z-index:10;line-height:1.4;">📷</button>`
      : '';
    el.className = 'slot text-mode';
    el.style.background = cardBg(p.makat, p.fam);
    const clearBtnR = `<button class="edit-btn" onclick="clearPick(${pick},'${section}')" title="הסר מוצר"
      style="position:absolute;top:2px;left:2px;background:rgba(0,0,0,0.35);border:none;color:#fff;font-size:9px;cursor:pointer;border-radius:3px;padding:1px 4px;z-index:10;line-height:1.4;">✕</button>`;
    el.innerHTML = clearBtnR + restoreBtn + textModeHTML(pick, p, rs) + stockHTML(p.makat);
  }
}

// RENDER GRID
// ══════════════════════════════════════════════════════════════════════════
const sortables = {};

function renderGrid(section, layoutMap, maxCols, maxRows, reserveStart = 0) {
  const container = document.getElementById('grid-' + section);

  // When hideReserve is on, filter layout to working picks only
  const effectiveLayout = (hideReserve && reserveStart > 0)
    ? Object.fromEntries(Object.entries(layoutMap).filter(([p]) => parseInt(p) < reserveStart))
    : layoutMap;

  // Re-number rows compactly when reserve is hidden (remove reserve rows from grid)
  let rowMap = null; // original row → compact row
  let effectiveMaxRows = maxRows;
  if (hideReserve && reserveStart > 0) {
    const usedRows = [...new Set(Object.values(effectiveLayout).map(p => p.r))].sort((a,b)=>a-b);
    rowMap = {};
    usedRows.forEach((r, i) => { rowMap[r] = i + 1; });
    effectiveMaxRows = usedRows.length;
  }

  container.style.gridTemplateColumns = `repeat(${maxCols}, 140px)`;
  const occupiedRows = new Set(Object.values(effectiveLayout).map(p => rowMap ? rowMap[p.r] : p.r));
  // Count picks per grid-row to detect side-column-only rows (single pick)
  const rowPickCount = {};
  for (const pos of Object.values(effectiveLayout)) {
    const gr = rowMap ? rowMap[pos.r] : pos.r;
    rowPickCount[gr] = (rowPickCount[gr] || 0) + 1;
  }
  const rowTpl = Array.from({length: effectiveMaxRows}, (_, i) => {
    const r = i + 1;
    if (!occupiedRows.has(r)) return '40px'; // corridor — halved from 80px
    return rowPickCount[r] === 1 ? '65px' : 'auto'; // side-column rows compact
  }).join(' ');
  container.style.gridTemplateRows = rowTpl;
  container.innerHTML = '';

  // Find all corridor rows adjacent to reserve (works for top+bottom reserve like dagim)
  const reserveBannerRows = new Set();
  if (!hideReserve && reserveStart > 0) {
    const allPickRows   = new Set(Object.values(layoutMap).map(p => p.r));
    const reservePickRows = new Set(
      Object.entries(layoutMap)
        .filter(([p]) => parseInt(p) >= reserveStart)
        .map(([,pos]) => pos.r)
    );
    for (const rr of reservePickRows) {
      if (rr - 1 >= 1 && !allPickRows.has(rr - 1)) reserveBannerRows.add(rr - 1);
      if (rr + 1 <= maxRows && !allPickRows.has(rr + 1)) reserveBannerRows.add(rr + 1);
    }
  }

  for (const [pickStr, pos] of Object.entries(effectiveLayout)) {
    const el = makeSlot(parseInt(pickStr), state[section][parseInt(pickStr)], reserveStart);
    const gridRow = rowMap ? rowMap[pos.r] : pos.r;
    el.style.gridColumn = pos.c;
    el.style.gridRow    = gridRow;
    if (rowPickCount[gridRow] === 1) el.classList.add('side-col-slot');
    container.appendChild(el);
  }

  // Dark background for ALL corridor rows (empty rows between zones)
  const allPickRowsSet = new Set(Object.values(effectiveLayout).map(p => rowMap ? rowMap[p.r] : p.r));
  for (let r = 1; r <= effectiveMaxRows; r++) {
    if (!allPickRowsSet.has(r)) {
      const corridor = document.createElement('div');
      corridor.className = 'corridor-row';
      corridor.style.gridColumn = `1 / span ${maxCols}`;
      corridor.style.gridRow    = r;
      container.appendChild(corridor);
    }
  }

  // Red reserve banner on top of corridor rows adjacent to reserve
  for (const bannerRow of reserveBannerRows) {
    const banner = document.createElement('div');
    banner.className = 'reserve-banner';
    banner.style.gridColumn = `1 / span ${maxCols}`;
    banner.style.gridRow    = bannerRow;
    container.appendChild(banner);
  }

  if (sortables[section]) sortables[section].destroy();
  sortables[section] = Sortable.create(container, {
    disabled: !editMode,
    swap: true, swapThreshold: 0.6, animation: 120,
    ghostClass: 'sortable-ghost', chosenClass: 'sortable-chosen', swapClass: 'sortable-swap',
    onMove(evt) {
      return !!(evt.related && evt.related.dataset && evt.related.dataset.pick);
    },
    onEnd(evt) {
      const fromPick = parseInt(evt.item.dataset.pick);
      if (!evt.swapItem) return;
      const toPick = parseInt(evt.swapItem.dataset.pick);
      if (fromPick === toPick) return;
      const tmp = state[section][fromPick] ? {...state[section][fromPick]} : null;
      state[section][fromPick] = state[section][toPick] ? {...state[section][toPick]} : null;
      state[section][toPick]   = tmp;
      refreshSlot(evt.item,     fromPick, section);
      refreshSlot(evt.swapItem, toPick,   section);
      setStatus(`✅ #${fromPick} ↔ #${toPick}`);
      if (document.getElementById('position-table').style.display !== 'none') updateTable();
    }
  });
}

// TABS

const rendered = { kapua:false, halavi:false, dagim:false, yavesh:false };

// Build sequential grid layout: cols wide, row per cols items
function makeSeqLayout(count, cols) {
  const layout = {};
  for (let i = 1; i <= count; i++)
    layout[i] = { r: Math.ceil(i / cols), c: ((i - 1) % cols) + 1 };
  return layout;
}

async function refreshData() {
  const btn = document.getElementById('btn-refresh');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ ...'; }
  setStatus('מרענן נתונים...');
  try {
    await loadMaps();
    // Force re-render of all sections
    Object.keys(rendered).forEach(k => rendered[k] = false);
    const cur = window._currentSection || 'kapua';
    rendered[cur] = true;
    if (cur === 'kapua')  renderGrid('kapua',  KAPUA_LAYOUT,  KAPUA_MAX.cols,  KAPUA_MAX.rows,  KAPUA_RESERVE_START);
    if (cur === 'halavi') renderGrid('halavi', HALAVI_LAYOUT, HALAVI_MAX.cols, HALAVI_MAX.rows, HALAVI_RESERVE_START);
    if (cur === 'dagim')  renderGrid('dagim',  DAGIM_LAYOUT,  DAGIM_MAX.cols,  DAGIM_MAX.rows,  DAGIM_RESERVE_START);
    if (cur === 'yavesh') {
      if (!Object.keys(state.yavesh).length) Object.assign(state.yavesh, deepClone(dyBase.picks || dyBase));
      const lay = dyBase.layout || makeSeqLayout(Object.keys(state.yavesh).length, dyBase.maxCols || 10);
      renderGrid('yavesh', lay, dyBase.maxCols || 10, dyBase.maxRows || 4, dyBase.reserveStart);
    }
    buildLegend(); updateTabPalTotals();
    setStatus('✅ נתונים עודכנו');
  } catch(e) {
    setStatus('❌ שגיאה: ' + e.message);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '🔄 רענן'; }
  }
}

function updateSectionStats() {
  const sec = window._currentSection || 'kapua';
  const wh  = window._activeWarehouse || 'Main';
  const picks = state[sec] || {};
  let active = 0, inStock = 0;
  for (const p of Object.values(picks)) {
    if (!p || !p.makat) continue;
    active++;
    const d = productData[String(p.makat)];
    if (!d) continue;
    const stk = wh === 'Zafn' ? (d.stockZafn ?? d.stock) : wh === 'Trnz' ? (d.stockTrnz ?? 0) : d.stock;
    if (stk > 0) inStock++;
  }
  document.getElementById('stat-active').textContent  = active;
  document.getElementById('stat-instock').textContent = inStock;
}

const _SECTIONS = ['kapua','halavi','dagim','yavesh'];
function switchSectionBy(delta) {
  const cur = _SECTIONS.indexOf(window._currentSection || 'kapua');
  const next = _SECTIONS[(cur + delta + _SECTIONS.length) % _SECTIONS.length];
  switchTab(next, document.querySelector(`.tab[data-sec="${next}"]`));
}

function switchTab(name, tabEl) {
  window._currentSection = name;
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('sec-' + name).classList.add('active');
  tabEl.classList.add('active');
  if (!rendered[name]) {
    rendered[name] = true;
    if (name === 'kapua')  renderGrid('kapua',  KAPUA_LAYOUT,  KAPUA_MAX.cols,  KAPUA_MAX.rows,  KAPUA_RESERVE_START);
    if (name === 'halavi') renderGrid('halavi', HALAVI_LAYOUT, HALAVI_MAX.cols, HALAVI_MAX.rows, HALAVI_RESERVE_START);
    if (name === 'dagim')  renderGrid('dagim',  DAGIM_LAYOUT,  DAGIM_MAX.cols,  DAGIM_MAX.rows,  DAGIM_RESERVE_START);
    if (name === 'yavesh') {
      if (!Object.keys(state.yavesh).length)
        Object.assign(state.yavesh, deepClone(dyBase.picks || dyBase));
      const lay  = dyBase.layout || makeSeqLayout(Object.keys(state.yavesh).length, dyBase.maxCols || 10);
      renderGrid('yavesh', lay, dyBase.maxCols || 10, dyBase.maxRows || 4, dyBase.reserveStart);
    }
  }
  setStatus('מוכן לעריכה');
  applyZoomToSection();
  buildLegend();
  updateSectionStats();
  if (document.getElementById('position-table').style.display !== 'none') updateTable();
  if (document.getElementById('expiry-page').style.display !== 'none') buildExpiryPage();
  updateTabPalTotals();
}

function updateTabPalTotals() {
  for (const sec of ['kapua','halavi','dagim','yavesh']) {
    let total = 0;
    for (const p of Object.values(state[sec] || {})) {
      if (!p) continue;
      const d = productData[String(p.makat)];
      if (d && d.palStock != null && d.palStock > 0) total += d.palStock;
    }
    const el = document.getElementById('tab-pal-' + sec);
    if (el) el.textContent = total > 0 ? Math.round(total) + ' PAL' : '';
  }

// ══════════════════════════════════════════════════════════════════════════
// SAVE TO PDF  (html2canvas + jsPDF — direct download, no dialog)
// ══════════════════════════════════════════════════════════════════════════
async function printPlanogram() {
  const sec     = window._currentSection || 'kapua';
  const secNames = { kapua:'קפוא ❄️', halavi:'חלבי 🥛', dagim:'דגים 🐟', yavesh:'דג יבש 🧂' };
  const btn = document.getElementById('btn-pdf');
  if (btn) { btn.disabled = true; btn.textContent = '⏳...'; }
  setStatus('מייצא PDF...');
  try {
    const grid = document.getElementById('grid-' + sec);
    // Temporarily remove transform (zoom) for clean capture
    const oldTransform = grid.style.transform;
    grid.style.transform = 'none';
    const canvas = await html2canvas(grid, {
      scale: 1.2,
      useCORS: true,
      allowTaint: true,
      backgroundColor: '#eef2f7',
      scrollX: 0, scrollY: 0,
      logging: false,
    });
    grid.style.transform = oldTransform;
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a3' });
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    // Title row
    pdf.setFontSize(11);
    pdf.setFont('helvetica', 'bold');
    pdf.text(`MAHSAN PLANOGRAM  |  ${secNames[sec]}  |  ${new Date().toLocaleDateString('he-IL')}`, pageW / 2, 9, { align: 'center' });
    // Scale image to fit page
    const titleH = 14;
    const availH = pageH - titleH;
    const ratio   = canvas.width / canvas.height;
    let imgW = pageW, imgH = imgW / ratio;
    if (imgH > availH) { imgH = availH; imgW = imgH * ratio; }
    const x = (pageW - imgW) / 2;
    pdf.addImage(canvas.toDataURL('image/jpeg', 0.88), 'JPEG', x, titleH, imgW, imgH);
    pdf.save(`planogram-${sec}-${new Date().toISOString().slice(0,10)}.pdf`);
    setStatus('✅ PDF הורד');
  } catch(e) {
    console.error('PDF error:', e);
    setStatus('שגיאה — נסה שוב');
  }
  if (btn) { btn.disabled = false; btn.textContent = '🖨️ PDF'; }
  setTimeout(() => setStatus('מוכן לעריכה'), 3000);
}

      maxRows:      KAPUA_MAX.rows,

      method:  'POST',
      headers: { 'Content-Type': 'application/json' },

    });
    if (resp.ok) {

    } else {
      setStatus('✅ נשמר בדפדפן (שרת לא פעיל)');

// ── Mouse drag-to-scroll on planogram sections ────────────────────────────
(function() {
  function attachDragScroll(el) {
    let down = false, startX, scrollLeft;
    el.addEventListener('mousedown', e => {
      if (e.target.closest('button,img,.slot')) return; // don't intercept clicks on cards
      down = true; startX = e.pageX - el.offsetLeft; scrollLeft = el.scrollLeft;
      el.style.cursor = 'grabbing'; e.preventDefault();
    });
    el.addEventListener('mouseleave', () => { down = false; el.style.cursor = ''; });
    el.addEventListener('mouseup',    () => { down = false; el.style.cursor = ''; });
    el.addEventListener('mousemove',  e => {
      if (!down) return;
      const x = e.pageX - el.offsetLeft;
      el.scrollLeft = scrollLeft - (x - startX);
    });
  }
  document.querySelectorAll('.section').forEach(attachDragScroll);
})();

function updateTable() {

    const up   = i > 0              ? `<button style="${btnStyle}" onclick="movePrintOrder('${sec}',${i},-1)" title="הזז למעלה">▲</button>` : '<span style="width:18px;display:inline-block"></span>';
    const down = i < order.length-1 ? `<button style="${btnStyle}" onclick="movePrintOrder('${sec}',${i},1)"  title="הזז למטה">▼</button>`  : '<span style="width:18px;display:inline-block"></span>';
    return `<tr draggable="true" data-pick="${pick}" data-idx="${i}" data-sec="${sec}" style="background:${bg}; border-left:3px solid ${fl}; cursor:grab;">
      <td style="padding:4px 6px; text-align:center; white-space:nowrap;">

      <td style="padding:4px 10px;">${p.makat}</td>
      <td style="padding:4px 10px; font-weight:bold;">${p.name || productData[String(p.makat)]?.nameEn || productData[String(p.makat)]?.desc || ''}</td>
      <td style="padding:4px 10px; font-size:10px; color:#555;">${p.fam || ''}</td>
    </tr>`;
  }).join('');
  _initTableDrag(body);
}

function _initTableDrag(tbody) {
  let dragSrc = null;
  tbody.addEventListener('dragstart', e => {
    const row = e.target.closest('tr[draggable]');
    if (!row) return;
    dragSrc = row;
    e.dataTransfer.effectAllowed = 'move';
    setTimeout(() => { if (dragSrc) dragSrc.style.opacity = '0.35'; }, 0);
  });
  tbody.addEventListener('dragover', e => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const row = e.target.closest('tr[draggable]');
    tbody.querySelectorAll('tr').forEach(r => r.style.boxShadow = '');
    if (row && row !== dragSrc) row.style.boxShadow = 'inset 0 2px 0 #1565C0';
  });
  tbody.addEventListener('dragleave', e => {
    if (!tbody.contains(e.relatedTarget)) tbody.querySelectorAll('tr').forEach(r => r.style.boxShadow = '');
  });
  tbody.addEventListener('drop', e => {
    e.preventDefault();
    const row = e.target.closest('tr[draggable]');
    if (!row || !dragSrc || row === dragSrc) return;
    const sec     = dragSrc.dataset.sec;
    const fromIdx = parseInt(dragSrc.dataset.idx);
    const toIdx   = parseInt(row.dataset.idx);
    const order   = _getPrintOrder(sec);
    const [item]  = order.splice(fromIdx, 1);
    order.splice(toIdx, 0, item);
    _savePrintOrder(sec, order);
    updateTable();
  });
  tbody.addEventListener('dragend', () => {
    tbody.querySelectorAll('tr').forEach(r => { r.style.opacity = ''; r.style.boxShadow = ''; });
    dragSrc = null;
  });
}

function buildExpiryPage() {
  const sec   = window._currentSection || 'kapua';
  const order = _getPrintOrder(sec);
  const grid  = document.getElementById('expiry-grid');

  const fmt = (isoDate) => {
    if (!isoDate) return '—';
    const [y, m, d] = isoDate.split('-');
    return `${d}/${m}/${y.slice(2)}`;
  };

  const batchSakana = (pak, daySales, shelfLife) => {
    if (pak.daysLeft == null || !(pak.cartons > 0)) return null;
    if (pak.sellDays != null) {
      return { isSakana: pak.sakana === true, sellDays: Math.ceil(pak.sellDays) };
    }
    const sellDays = (daySales > 0) ? (pak.cartons / daySales) * 1.4 : Infinity;
    const isSakana = isFinite(sellDays) && (pak.daysLeft - sellDays) < (shelfLife ?? 0);
    return { isSakana, sellDays: isFinite(sellDays) ? Math.ceil(sellDays) : null };
  };

  const batchCell = (pak, daySales, shelfLife) => {
    if (!pak) return '<span style="color:#ccc;">—</span>';
    const sk = batchSakana(pak, daySales, shelfLife);
    const isSakana   = sk?.isSakana;
    const sellDays   = sk?.sellDays;
    const dateColor  = isSakana ? '#c62828' : '#1a6b1a';
    const daysColor  = isSakana ? '#c62828' : '#555';
    const sakanaTag  = isSakana
      ? `<span style="display:inline-block;background:#c62828;color:#fff;font-size:8px;font-weight:bold;border-radius:3px;padding:1px 4px;margin-right:3px;">⚠ סכנה</span>`
      : '';
    const sellLine = sellDays != null
      ? `<div style="font-size:9px;color:#666;">days needed for sellout: <b style="color:${isSakana ? '#c62828' : '#2e7d32'};">${sellDays}</b></div>`
      : '';
    let throwLine = '';
    if (isSakana && pak.cartons > 0 && daySales > 0 && pak.daysLeft != null) {
      const effectiveDays = Math.max(0, pak.daysLeft - (shelfLife ?? 0));
      const canSell       = effectiveDays * daySales;
      const throwAway     = Math.ceil(Math.max(0, pak.cartons - canSell));
      if (throwAway > 0) {
        throwLine = `<div style="display:inline-block;font-size:9px;font-weight:bold;color:#c62828;margin-top:3px;border:1.5px solid #222;border-radius:3px;padding:1px 6px;">צפי ~${throwAway} קרט לזריקה</div>`;
      }
    }
    return `<div style="padding:5px 0;border-bottom:1px solid #e8e8e8;">`
         + `<div>${sakanaTag}<span style="font-weight:bold;color:${dateColor};">תוקף: ${fmt(pak.date)}</span></div>`
         + `<div style="font-size:9px;color:${daysColor};margin-bottom:4px;">(${pak.daysLeft??'?'} ימים)</div>`
         + `<div style="color:#1565C0;font-weight:bold;">כמות: ${Math.round(pak.cartons)} קרט</div>`
         + sellLine
         + throwLine
         + `</div>`;
  };

  const cards = order.map((pick) => {
    const p = state[sec][pick];
    if (!p) return null;
    const mk = String(p.makat);
    const d  = productData[mk] || {};
    if (!(d.stock > 0) && !(d.stockZafn > 0)) return null;
    const salesMain = d.daySales || 0;
    const salesZafn = d.daySalesZafn || 0;
    const shelfLife = d.shelfLife ?? 0;
    const batches   = { main: d.pakuot || [], zafn: d.pakuotZafn || [] };
    const sakanaMain = batches.main.some(b => batchSakana(b, salesMain, shelfLife)?.isSakana);
    const sakanaZafn = batches.zafn.some(b => batchSakana(b, salesZafn, shelfLife)?.isSakana);
    if (window._expiryOnlySakana && !(sakanaMain || sakanaZafn)) return null;
    const zafnDays = (salesZafn > 0 && d.stockZafn > 0) ? (d.stockZafn / salesZafn) * 1.4 : null;
    if (window._expiryZafnLow && !(zafnDays != null && zafnDays < 3)) return null;
    return { pick, p, mk, d, salesMain, salesZafn, shelfLife, batches, sakanaMain, sakanaZafn, zafnDays };
  }).filter(Boolean);

  const totalWithStock = order.filter(pk => { const d = productData[String(state[sec][pk]?.makat)] || {}; return (d.stock > 0) || (d.stockZafn > 0); }).length;
  const filtered = window._expiryOnlySakana || window._expiryZafnLow;
  document.getElementById('expiry-title').textContent = filtered
    ? `דוח תוקף — ${sec} (${cards.length} / ${totalWithStock} מוצרים)`
    : `דוח תוקף — ${sec} (${totalWithStock} מוצרים)`;

  grid.innerHTML = cards.map(({ pick, p, mk, d, salesMain, salesZafn, shelfLife, batches, sakanaMain, sakanaZafn }) => {
    const name = p.name || d.nameEn || d.desc || p.fam || mk;
    const photoUrl = getPhotoUrl(mk);
    const imgHtml  = photoUrl
      ? `<img src="${photoUrl}" style="width:72px;height:72px;object-fit:contain;border-radius:6px;border:1px solid #e0e0e0;" onerror="this.style.display='none'">`
      : `<div style="width:72px;height:72px;background:#f5f5f5;border-radius:6px;border:1px solid #e0e0e0;display:flex;align-items:center;justify-content:center;font-size:10px;color:#aaa;">📷</div>`;

    const maxRows    = Math.max(batches.main.length, batches.zafn.length, 1);
    const cardBorder = (sakanaMain || sakanaZafn) ? '2px solid #c62828' : '1px solid #dde0e8';

    const thMain = sakanaMain
      ? 'padding:2px 6px;background:#c62828;font-size:9px;color:#fff;text-align:right;font-weight:bold;'
      : 'padding:2px 6px;background:#f5f5f5;font-size:9px;color:#555;text-align:right;';
    const thZafn = sakanaZafn
      ? 'padding:2px 6px;background:#1565C0;font-size:9px;color:#fff;text-align:right;border-right:2px solid #e0e0e0;font-weight:bold;'
      : 'padding:2px 6px;background:#f5f5f5;font-size:9px;color:#555;text-align:right;border-right:2px solid #e0e0e0;';

    const stockMainBg = sakanaMain ? 'background:#c62828;color:#fff;' : 'background:#f0f0f0;color:#333;';
    const stockZafnBg = sakanaZafn ? 'background:#1565C0;color:#fff;' : 'background:#e3f2fd;color:#1565C0;';

    const batchRows = Array.from({length: maxRows}, (_, i) => {
      return `<tr>
        <td style="padding:2px 6px;border-bottom:1px solid #f0f0f0;font-size:10px;">${batchCell(batches.main[i], salesMain, shelfLife)}</td>
        <td style="padding:2px 6px;border-bottom:1px solid #f0f0f0;font-size:10px;border-right:2px solid #e0e0e0;">${batchCell(batches.zafn[i], salesZafn, shelfLife)}</td>
      </tr>`;
    }).join('');

    return `<div style="
      background:#fff; border-radius:8px; border:${cardBorder};
      box-shadow:0 1px 4px rgba(0,0,0,0.06); padding:8px;
      width:340px; flex-shrink:0; display:flex; gap:8px; align-items:flex-start;
    ">
      <div style="flex-shrink:0; text-align:center;">
        ${imgHtml}
        <div style="font-size:9px;color:#888;margin-top:2px;">#${pick}</div>
        <div style="font-size:9px;color:#1565C0;font-weight:bold;">${mk}</div>
      </div>
      <div style="flex:1; min-width:0;">
        <div style="font-size:10px;font-weight:bold;color:#222;margin-bottom:3px;line-height:1.3;">${name}</div>
        <div style="display:flex;gap:6px;align-items:center;margin-bottom:4px;flex-wrap:wrap;">
          <span style="font-size:11px;font-weight:bold;padding:2px 10px;border-radius:4px;background:#e3f2fd;color:#0d47a1;">סה"כ מלאי: ${(d.stock || 0) + (d.stockZafn || 0)} קרט</span>
        </div>
        <table style="width:100%;border-collapse:collapse;font-size:10px;">
          <thead>
            <tr>
              <th style="${thMain}">אשדוד — פק"ע</th>
              <th style="${thZafn}">צפון — פק"ע</th>
            </tr>
          </thead>
          <tbody>${batchRows}</tbody>
          <tfoot><tr>
            <td style="padding:4px 6px;border-top:2px solid #e0e0e0;background:#f5f7fa;line-height:1.7;">${
              salesMain > 0
                ? `<div style="font-size:9px;color:#666;">ממוצע מכירה: <b style="color:#222;">${salesMain.toFixed(1)} קרט/יום</b></div>`
                : '<div style="font-size:9px;color:#bbb;">אין נתוני מכירה</div>'
            }</td>
            <td style="padding:4px 6px;border-top:2px solid #e0e0e0;border-right:2px solid #e0e0e0;background:#f5f7fa;line-height:1.7;">${
              salesZafn > 0
                ? `<div style="font-size:9px;color:#666;">ממוצע מכירה: <b style="color:#222;">${salesZafn.toFixed(1)} קרט/יום</b></div>`
                : '<div style="font-size:9px;color:#bbb;">אין נתוני מכירה</div>'
            }</td>
          </tr></tfoot>
        </table>
      </div>
    </div>`;
  }).join('');
}

// ══════════════════════════════════════════════════════════════════════════
// LEGEND
// ══════════════════════════════════════════════════════════════════════════
function buildLegend() {
  const el = document.getElementById('legend');
  el.innerHTML = '';
  const sec = window._currentSection || 'kapua';
  const secState = state[sec] || {};
  const usedFams = new Set(Object.values(secState).filter(Boolean).map(p => p.fam).filter(Boolean));
  for (const [fam, color] of Object.entries(FAM_COLORS)) {
    if (!usedFams.has(fam)) continue;
    el.insertAdjacentHTML('beforeend',
      `<div class="leg"><div class="leg-dot" style="background:${color}"></div><span>${fam}</span></div>`);
  }
}

// ══════════════════════════════════════════════════════════════════════════
// INIT — load maps first, then render
// ══════════════════════════════════════════════════════════════════════════
window._currentSection = 'kapua';

(async () => {
  setStatus('טוען מפת תמונות...');
  const cnt = await loadMaps();
  setStatus(cnt > 0 ? `${cnt} תמונות נטענו — מוכן לעריכה` : 'מוכן לעריכה (ללא תמונות)');
  renderGrid('kapua', KAPUA_LAYOUT, KAPUA_MAX.cols, KAPUA_MAX.rows, KAPUA_RESERVE_START);
  rendered.kapua = true;
  document.getElementById('zoom-label').textContent = ZOOM_STEPS[zoomIdx] + '%';
  applyZoomToSection();
  buildLegend();
  updateTabPalTotals();
  updateSectionStats();
})();
</script>
</body>
</html>
