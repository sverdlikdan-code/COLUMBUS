<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAHSAN PLANOGRAM — FORMULA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      padding: 40px 48px;
      text-align: center;
      max-width: 480px;
      width: 100%;
    }
    .logo { font-size: 13px; letter-spacing: 2px; color: #888; margin-bottom: 8px; text-transform: uppercase; }
    h1 { font-size: 26px; color: #1a1a2e; margin-bottom: 6px; }
    .subtitle { font-size: 14px; color: #555; margin-bottom: 32px; }
    .status-box {
      background: #f7f9fc; border: 1px solid #e0e6ed;
      border-radius: 10px; padding: 16px 20px; margin-bottom: 28px;
      font-size: 13px; color: #444;
    }
    .status-box .label { color: #888; margin-bottom: 4px; }
    .status-box .time  { font-size: 18px; font-weight: bold; color: #1a1a2e; }
    .btn-download {
      display: block; width: 100%; padding: 16px;
      background: #1a6ef5; color: #fff; border: none;
      border-radius: 10px; font-size: 17px; font-weight: bold;
      cursor: pointer; text-decoration: none; margin-bottom: 14px;
      transition: background 0.2s;
    }
    .btn-download:hover { background: #1558d0; }
    .btn-refresh {
      display: block; width: 100%; padding: 13px;
      background: #fff; color: #1a6ef5;
      border: 2px solid #1a6ef5; border-radius: 10px;
      font-size: 15px; font-weight: bold; cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .btn-refresh:hover { background: #eef4ff; }
    .btn-refresh:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg { margin-top: 12px; font-size: 13px; min-height: 20px; }
    .msg.ok  { color: #1a8a1a; }
    .msg.err { color: #cc0000; }
    .schedule-note { margin-top: 22px; font-size: 12px; color: #aaa; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">FORMULA Cold Storage</div>
  <h1>📦 MAHSAN PLANOGRAM</h1>
  <div class="subtitle">מחסן קירור — עדכון יומי מ-Power BI</div>

  <div class="status-box">
    <div class="label">עודכן לאחרונה</div>
    <div class="time" id="updated">טוען...</div>
  </div>

  <a class="btn-download" href="planogram.xlsx" download="MAHSAN PLANOGRAM.xlsx">
    ⬇️ הורד פלנוגרמה (Excel)
  </a>

  <button class="btn-refresh" id="refreshBtn" onclick="triggerRefresh()">
    🔄 עדכן עכשיו
  </button>
  <div class="msg" id="msg"></div>

  <div class="schedule-note">מתעדכן אוטומטית כל יום ראשון–חמישי בשעה 08:00</div>
</div>

<script>
  const REPO  = 'sverdlikdan-code/COLUMBUS';
  const WF    = 'planogram.yml';
  const T     = '__TRIGGER_TOKEN__';

  fetch('status.json?t=' + Date.now())
    .then(r => r.json())
    .then(d => { document.getElementById('updated').textContent = d.updated || '—'; })
    .catch(() => { document.getElementById('updated').textContent = '—'; });

  function triggerRefresh() {
    const btn = document.getElementById('refreshBtn');
    const msg = document.getElementById('msg');
    btn.disabled = true;
    btn.textContent = '⏳ מפעיל עדכון...';
    msg.className = 'msg';
    msg.textContent = '';

    fetch('https://api.github.com/repos/' + REPO + '/actions/workflows/' + WF + '/dispatches', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + T,
        'Accept': 'application/vnd.github+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ ref: 'master' })
    })
    .then(r => {
      if (r.status === 204) {
        msg.className = 'msg ok';
        msg.textContent = '✅ העדכון הופעל! הקובץ יהיה מוכן בעוד ~2 דקות';
        btn.textContent = '✅ הופעל';
        setTimeout(() => {
          btn.disabled = false;
          btn.textContent = '🔄 עדכן עכשיו';
        }, 120000);
      } else {
        throw new Error('HTTP ' + r.status);
      }
    })
    .catch(e => {
      msg.className = 'msg err';
      msg.textContent = '❌ שגיאה: ' + e.message;
      btn.disabled = false;
      btn.textContent = '🔄 עדכן עכשיו';
    });
  }
</script>
</body>
</html>
