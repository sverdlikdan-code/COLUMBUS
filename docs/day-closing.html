<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>סגירת יום — FORMULA</title>
<script src="https://unpkg.com/@zumer/snapdom/dist/snapdom.js"></script>
<style>
:root{
  --blue:#1565C0;--blue-dark:#0D47A1;--sky:#E3F2FD;--sky-mid:#BBDEFB;
  --green:#2E7D32;--orange:#E65100;--red:#C62828;
  --text:#1A1A2E;--mid:#5C6BC0;--light:#90A4AE;
  --bg:#F5F7FA;--card:#fff;--radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);font-family:'Segoe UI',system-ui,sans-serif;color:var(--text);min-height:100vh;font-size:15px;overscroll-behavior-y:contain;}
.top-bar{background:linear-gradient(135deg,var(--blue-dark),var(--blue));color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2);}
.back-btn{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:8px;width:40px;height:40px;font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.top-title{font-size:17px;font-weight:800;flex:1;}
.loading{text-align:center;padding:60px 20px;color:var(--light);font-size:14px;}
.err-box{margin:16px;padding:20px;background:#FFEBEE;border:1.5px solid #FFCDD2;border-radius:var(--radius);color:var(--red);font-weight:700;text-align:center;}

/* ── printable / shareable blank — same off-screen-capture-then-fullscreen
   pattern as zikuy-order.html/mekarer-order.html (proven on real devices). ── */
#print-view{position:fixed;left:-10000px;top:0;width:900px;background:#fff;padding:24px;}
#pv-overlay{display:none;}
#pv-overlay.show{display:block;position:fixed;inset:0;z-index:20000;background:var(--bg);overflow-y:auto;padding:14px;}
#pv-overlay.show #print-view{position:static;left:auto;width:100%;max-width:900px;margin:0 auto;box-shadow:0 2px 16px rgba(0,0,0,.15);border-radius:12px;}
#pv-overlay-bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;position:sticky;top:0;background:var(--bg);z-index:1;padding-bottom:4px;}
.pv-close{background:var(--card);border:1.5px solid var(--sky-mid);border-radius:10px;padding:10px 16px;font-weight:800;font-size:14px;color:var(--text);cursor:pointer;font-family:inherit;}

/* ICE brand — light/sky blue, distinct from the app's navy chrome. FORMULA
   brand — corporate green. Applied to header, stat tiles AND the table now
   (not just the header) — live request 2026-08-26: "плашки и таблица тоже в
   корпорат цветах". Toggled via .formula on #print-view (renderBlank()),
   which everything below is scoped under. */
/* Deeper, less saturated tones — live feedback 2026-08-26: the earlier bright
   cyan/candy-green read as "game design", not a business report. Same hue
   family (ICE=blue, FORMULA=green per the color-strategy already committed
   to), just pulled toward the dark end instead of the light end. */
#dc-header{background:linear-gradient(135deg,#0277BD,#01579B);color:#fff;padding:24px 26px;border-radius:10px;margin-bottom:14px;position:relative;display:flex;align-items:center;justify-content:center;min-height:34px;}
#print-view.formula #dc-header{background:linear-gradient(135deg,#2E7D32,#1B5E20);}
/* One line, live request 2026-08-26: agent name centered across the FULL
   header width (not just sharing a row with the type tag) — dc-type is
   pulled out of flow (position:absolute) so it doesn't skew the centering,
   and sits as a small corner tag ("ICE"/"FORMULA" plain word) rather than a
   second competing line. No more "ICE — סגירת יום" title and no date —
   WhatsApp's own message timestamp already carries the date, and the card's
   fill color already signals ICE vs FORMULA. Agent name is the one thing that
   needs reading at a glance — the whole point of the card is "whose line is
   this" — so it alone is large. */
/* Live request 2026-08-28: logo 2x bigger, type word stacked ABOVE it (tiny,
   near-illegible on purpose) in the corner — decouples "how big can the logo
   be" from "how much horizontal room the name gets", since the corner's
   width is now just the logo's, not logo+FORMULA/ICE side by side. */
#dc-brand{position:absolute;top:50%;right:26px;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;}
#dc-logo{height:40px;filter:brightness(0) invert(1);opacity:.95;}
#dc-type{font-size:6px;font-weight:800;opacity:.6;letter-spacing:.5px;}
/* Always 1 line — live request 2026-08-27: a wrapped 2-line name bled past
   the header's bottom edge (font-size was fixed regardless of name length).
   min-width:0 lets a flex item actually shrink for nowrap/ellipsis to kick
   in instead of blowing out the flex row; fitAgentNameOneLine() (below) sets
   the real font-size per name via canvas measurement, ellipsis is only the
   last-resort safety net if that measurement is ever off. */
#dc-agent{font-size:38px;font-weight:900;line-height:1.15;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}

/* Live feedback 2026-08-26: filled colored tiles with white text read as
   "game design", not a business report — reverted to plain white cards with
   black/navy text (DESIGN.md's Field Text #0D2137), a thin border for
   definition instead of a shadow-heavy colored block. Header stays the
   branded color block; the DATA rows underneath it are sober and plain,
   the way a financial statement pairs a masthead with plain ledger rows. */
#dc-stats{display:flex;gap:8px;margin-bottom:14px;}
/* Raised/convex, not flat-bordered — live feedback 2026-08-26 ("выпуклыми
   сделать"). Shadow tinted with the brand color per DESIGN.md's elevation
   rule (never neutral grey), no border — the shadow alone reads as depth. */
.dc-stat{flex:1;background:#fff;border-radius:9px;padding:12px 8px;text-align:center;box-shadow:0 5px 16px rgba(1,87,155,.28),0 1px 3px rgba(1,87,155,.12);}
#print-view.formula .dc-stat{box-shadow:0 5px 16px rgba(27,94,32,.28),0 1px 3px rgba(27,94,32,.12);}
.dc-stat .dc-num{font-size:42px;font-weight:900;color:#0D2137;line-height:1.1;}
/* Same card treatment, elongated — live feedback 2026-08-26: "должен быть
   как карточка только длинная", not a colored plaque. */
#dc-new-line{text-align:center;font-size:18px;font-weight:800;color:#546E7A;background:#fff;border-radius:9px;padding:11px 8px;margin:0 0 14px;box-shadow:0 5px 16px rgba(1,87,155,.28),0 1px 3px rgba(1,87,155,.12);}
#print-view.formula #dc-new-line{box-shadow:0 5px 16px rgba(27,94,32,.28),0 1px 3px rgba(27,94,32,.12);}
#dc-new-line b{color:#0D2137;font-weight:900;}
#dc-by-agent{text-align:center;font-size:15px;font-weight:700;color:#546E7A;background:#fff;border-radius:9px;padding:9px 10px;margin:0 0 14px;box-shadow:0 5px 16px rgba(1,87,155,.28),0 1px 3px rgba(1,87,155,.12);}
#print-view.formula #dc-by-agent{box-shadow:0 5px 16px rgba(27,94,32,.28),0 1px 3px rgba(27,94,32,.12);}
#dc-by-agent .dc-ba-row{display:flex;justify-content:space-between;gap:8px;padding:2px 4px;}
#dc-by-agent .dc-ba-row+.dc-ba-row{border-top:1px solid #ECEFF1;}
#dc-by-agent b{color:#0D2137;font-weight:900;}

.dc-tbl{border-collapse:collapse;width:100%;font-size:13px;}
.dc-tbl th,.dc-tbl td{border:1px solid var(--sky-mid);padding:7px;text-align:center;}
/* Grid line color was hardcoded blue (var(--sky-mid)) regardless of theme —
   live bug report 2026-08-26: a green FORMULA table with a blue grid. */
#print-view.formula .dc-tbl th,#print-view.formula .dc-tbl td{border-color:#C8E6C9;}
.dc-tbl th{background:#01579B;color:#fff;font-size:12px;}
.dc-tbl tbody tr:nth-child(even){background:#E1F5FE;}
#print-view.formula .dc-tbl th{background:#1B5E20;}
#print-view.formula .dc-tbl tbody tr:nth-child(even){background:#E8F5E9;}
.dc-tbl img{width:32px;height:32px;object-fit:contain;border-radius:5px;background:#f5f5f5;}
.dc-tbl td.dc-name{text-align:right;font-weight:700;font-size:12px;}
/* מק"ט — the field an agent actually reads off this table, bumped up from
   the table's base 13px. Live request 2026-08-26. */
/* +50% — live request 2026-08-26. One color for both (not sku=black,
   qty=blue in the same row) — live feedback: mixed colors in one table
   read as sloppy, not deliberate. */
.dc-tbl td.dc-sku{font-size:29px;font-weight:900;color:var(--text);}
.dc-tbl td.dc-qty{font-size:29px;font-weight:900;color:var(--text);}
/* Inline, not stacked below the number — live feedback 2026-08-26, same
   asymmetry issue as the stat tiles' number-over-label stack. */
.dc-tbl td.dc-qty small{font-size:13px;font-weight:700;color:#01579B;}
#print-view.formula .dc-tbl td.dc-qty small{color:#1B5E20;}

.wa-btn{flex:1;padding:15px;background:#25D366;color:#fff;border:none;border-radius:var(--radius);font-size:15.5px;font-weight:800;cursor:pointer;font-family:inherit;text-align:center;display:none;align-items:center;justify-content:center;min-height:52px;}
.wa-btn.show{display:flex;}
#wa-web-btn{min-width:64px;flex:0 0 auto;background:#fff;color:var(--blue-dark);border:1.5px solid var(--sky-mid);border-radius:var(--radius);font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;}
.toast{position:fixed;top:50%;right:50%;transform:translate(50%,-50%);background:#323232;color:#fff;padding:18px 26px;border-radius:14px;font-size:17px;font-weight:700;z-index:20001;opacity:0;transition:opacity .3s;white-space:nowrap;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.3);}
.toast.show{opacity:1;}

@media (min-width:760px){
  body{font-size:16px;}
  .dc-stat .dc-num{font-size:48px;}
  .wa-btn{font-size:17px;min-height:58px;}
}
</style>
</head>
<body>
  <div class="top-bar no-print">
    <button class="back-btn" onclick="window.close()" aria-label="סגור">→</button>
    <div class="top-title" id="page-title">סגירת יום</div>
  </div>
  <div id="root-body">
    <div class="loading" id="dc-loading">טוען נתונים מ-Priority...</div>
  </div>
  <div id="toast" class="toast"></div>

  <div id="pv-overlay" class="no-print">
    <div id="pv-overlay-bar">
      <button class="pv-close" onclick="hidePrintFullscreen()">✕ סגור</button>
      <a class="wa-btn show" id="wa-btn" target="_blank" rel="noopener">📱 שלח ב-WhatsApp</a>
      <button type="button" id="wa-web-btn" onclick="sendViaWhatsAppWeb()" title="גיבוי אם WhatsApp לא מותקן במכשיר">💻 Web</button>
    </div>
    <div id="print-view">
      <div id="dc-header">
        <div id="dc-brand">
          <div id="dc-type"></div>
          <img src="logo-diler-bmd.png" id="dc-logo" alt="DILER">
        </div>
        <div id="dc-agent"></div>
      </div>
      <div id="dc-stats">
        <div class="dc-stat"><div class="dc-num" id="dc-sum">—</div></div>
        <div class="dc-stat"><div class="dc-num" id="dc-cust-count">—</div></div>
      </div>
      <div id="dc-new-line" style="display:none"></div>
      <div id="dc-by-agent" style="display:none"></div>
      <div id="dc-tbl-wrap" style="display:none">
        <table class="dc-tbl">
          <thead><tr><th>כמות</th><th>מק"ט</th><th>תמונה</th></tr></thead>
          <tbody id="dc-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

<script>
const params = new URLSearchParams(location.search);
const API = 'https://api.sverdlik-apps.site';
const TOKEN = localStorage.getItem('frToken') || '';

// Client-side crash reporting, same as formula-road.html — see that file's
// comment for why raw fetch (not apiFetch) and the 5-report cap. Live request
// 2026-08-28.
let _errReportCount = 0;
function _reportClientError(message, stack){
  if(_errReportCount++ >= 5) return;
  try{
    fetch(API + '/api/client-error', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Session': TOKEN },
      body: JSON.stringify({ message: String(message||'').slice(0,300), stack: stack ? String(stack).slice(0,1000) : null, url: location.href, page: 'day-closing' }),
      keepalive: true,
    }).catch(()=>{});
  }catch(_){}
}
window.addEventListener('error', e => _reportClientError(e.message, e.error && e.error.stack));
window.addEventListener('unhandledrejection', e => _reportClientError('unhandledrejection: ' + (e.reason && e.reason.message || e.reason), e.reason && e.reason.stack));
const agentCode = params.get('agentCode') || '';
const agentName = params.get('agentName') || '';
const isManager = params.get('isManager') === '1';
const type = params.get('type') === 'ice' ? 'ice' : 'formula';

const esc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function showToast(msg,ms=2200){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),ms);
}
function apiFetch(path, opts = {}) {
  return fetch(path.startsWith('http') ? path : API + path, {
    ...opts, headers: { 'X-Session': TOKEN, ...(opts.headers || {}) },
    signal: opts.signal || AbortSignal.timeout(15000),
  });
}
function proxyImg(url){ return url ? `${API}/api/img-proxy?url=${encodeURIComponent(url)}` : ''; }

document.getElementById('page-title').textContent = type==='ice' ? 'סגירת יום ICE' : 'סגירת יום פורמולה';

async function init(){
  if(!agentCode){
    document.getElementById('root-body').innerHTML = `<div class="err-box">חסר קוד סוכן — פתח מתוך הדף הראשי</div>`;
    return;
  }
  try{
    const res = await apiFetch(`/api/day-closing?agentCode=${encodeURIComponent(agentCode)}&type=${type}`);
    if(!res.ok) throw new Error('http_'+res.status);
    const d = await res.json();
    if(!d.ok) throw new Error(d.error||'unknown');
    renderBlank(d);
    document.getElementById('root-body').innerHTML = '';
    showPrintFullscreen();
    prewarmShareImage();
  }catch(e){
    console.warn('day-closing load failed', e);
    document.getElementById('root-body').innerHTML = `<div class="err-box">שגיאה בטעינת נתונים מ-Priority — נסה שוב</div>`;
  }
}

function renderBlank(d){
  // Unlike the "please wait" toast below (addressed to whoever's physically
  // waiting — ambiguous for a manager, who could be viewing any agent), this
  // header labels WHICH LINE is being closed. agentName here is always
  // st.agent.name from formula-road.html — the route being viewed, e.g.
  // "גליה" when a manager is covering her route — so it must show regardless
  // of isManager. Live correction 2026-08-26: was wrongly blank for managers.
  const first = agentName ? agentName.trim() : '';
  // .formula on #print-view (not just the header) — header, stat tiles and
  // the table are all scoped under it, see the CSS block above.
  document.getElementById('print-view').classList.toggle('formula', type==='formula');
  document.getElementById('dc-type').textContent = type==='ice' ? 'ICE' : 'FORMULA';
  document.getElementById('dc-agent').textContent = first;
  // Bare number, matching the sum tile — live feedback 2026-08-26: neither
  // "לקוחות" nor "הזמנות" as a label rendered well (stacked = asymmetric with
  // the sum tile; inline = the Hebrew word looked visibly lighter/greyer next
  // to the bold digit, and forcing it bolder via text-stroke made a Semitic
  // script blur together instead of reading better). Dropped the word
  // entirely rather than keep fighting the rendering.
  document.getElementById('dc-cust-count').textContent = d.custCount;
  document.getElementById('dc-sum').textContent = '₪' + Number(d.sum||0).toLocaleString('he-IL',{maximumFractionDigits:0});
  // "מתוכם לקוחות חדשים" — clients caught only via the agentCode fallback (not
  // yet in the PBI roster, refreshes once a day) — only shown when non-zero,
  // no reason to clutter the report on an ordinary day. Live request 2026-08-26.
  const newLine = document.getElementById('dc-new-line');
  if(d.newCustCount > 0){
    newLine.style.display = '';
    const newSumText = Number(d.newSum||0).toLocaleString('he-IL',{maximumFractionDigits:0});
    newLine.innerHTML = `מתוכם לקוחות חדשים: <b>${d.newCustCount}</b> — ₪<b>${newSumText}</b>`;
  } else {
    newLine.style.display = 'none';
  }
  // Subtotal by whoever actually entered the order in Priority — often not the
  // roster-owning agent themselves (a manager or another rep placing the order
  // for that client, live case 2026-08-28: agent 53 entered most of agent 110's
  // orders). Only shown when there's more than one distinct entering agent —
  // a normal single-agent day doesn't need the breakdown. No agent CODE shown
  // here on purpose (live request), just names.
  const byAgentEl = document.getElementById('dc-by-agent');
  const byAgent = Array.isArray(d.byAgent) ? d.byAgent.filter(a => a.agentName) : [];
  if(byAgent.length > 1){
    byAgentEl.style.display = '';
    byAgentEl.innerHTML = byAgent
      .sort((a,b) => b.sum - a.sum)
      .map(a => `<div class="dc-ba-row"><b>₪${Number(a.sum||0).toLocaleString('he-IL',{maximumFractionDigits:0})}</b><span>(${a.custCount}) ${esc(a.agentName.replace(/\s*\([^)]*\)\s*$/, ''))}</span></div>`)
      .join('');
  } else {
    byAgentEl.style.display = 'none';
  }
  if(type==='formula' && Array.isArray(d.items) && d.items.length){
    document.getElementById('dc-tbl-wrap').style.display='';
    // 721/724 (dried/smoked fish) are weight-sold with no "גרם" in their own
    // name (unlike 403004/403006, which spell out their weight already) — קג
    // label added so the number doesn't read as a piece count. Live request
    // 2026-08-26.
    const KG_SKUS = new Set(['721','724']);
    document.getElementById('dc-tbody').innerHTML = d.items.map(it=>{
      const img = it.imgUrl ? `<img src="${proxyImg(it.imgUrl)}" alt="" onerror="this.style.display='none'">` : '';
      // קג quantities come straight from QUANT/1000 and can land on ugly
      // decimals (e.g. 4.567) — 1 decimal place is all that's meaningful for
      // a weight total, not the raw division result. Live request 2026-08-26.
      // DOM order flipped from the number-then-label version — live report
      // 2026-08-26 ("קג ושט לא מהצד הזה"): RTL renders the FIRST inline node
      // on the right, so unit-label-first puts the label to the number's
      // right (reads label-then-number) — swapped to put the number first.
      const qtyText = KG_SKUS.has(String(it.sku))
        ? `<small>ק"ג</small> ${esc(Number(it.qty).toFixed(1))}`
        : `<small>יחידות</small> ${esc(it.qty)}`;
      // DOM order is qty, sku, img (not the visual order) — RTL renders the
      // FIRST cell on the right, so to get photo|makat|quantity reading
      // left-to-right, quantity has to be first in markup. Live request
      // 2026-08-26.
      return `<tr><td class="dc-qty">${qtyText}</td><td class="dc-sku">${esc(it.sku)}</td><td>${img}</td></tr>`;
    }).join('');
  }
}

// Shrinks #dc-agent's font until the name fits the header on one line —
// reserves space on both sides equal to the corner logo/tag zone since the
// name is centered across the FULL header width (see #dc-agent CSS comment),
// so a name that's merely "not wider than the header" can still run into the
// logo before it runs into the header edge. Live request 2026-08-27.
function fitAgentNameOneLine(){
  const el = document.getElementById('dc-agent');
  const header = document.getElementById('dc-header');
  const text = el.textContent;
  if(!text) return;
  const cs = getComputedStyle(el);
  const headerPad = 52; // #dc-header padding: 24px 26px -> 26+26
  const cornerReserve = 120; // #dc-logo corner (2x bigger, ~40px, but alone now — FORMULA/ICE moved above the name), mirrored since name is centered
  const avail = Math.max(60, header.clientWidth - headerPad - cornerReserve);
  const canvas = fitAgentNameOneLine._canvas || (fitAgentNameOneLine._canvas = document.createElement('canvas'));
  const ctx = canvas.getContext('2d');
  const maxSize = 38, minSize = 18;
  let size = maxSize;
  while(size > minSize){
    ctx.font = `900 ${size}px ${cs.fontFamily}`;
    if(ctx.measureText(text).width <= avail) break;
    size -= 1;
  }
  el.style.fontSize = size + 'px';
  // Hard cap even after the shrink loop — a name that still doesn't fit at
  // minSize (long name, narrow phone header) used to render at natural width
  // with nothing to actually stop it running into the corner tag: #dc-agent
  // has no max-width, so CSS's overflow:hidden/text-overflow:ellipsis had
  // nothing to clip against and never engaged. Live bug 2026-08-27 ("FORMULA"
  // overlapping the agent name). This makes the already-declared ellipsis
  // fallback real instead of decorative.
  el.style.maxWidth = avail + 'px';
}

function showPrintFullscreen(){
  document.getElementById('pv-overlay').classList.add('show');
  // Only here, not in renderBlank() — #pv-overlay is still display:none at
  // render time, so #dc-header.clientWidth reads 0 there and the fit would
  // always collapse to the minimum size. Live bug found 2026-08-27.
  fitAgentNameOneLine();
  history.pushState({pv:1},'');
}
function hidePrintFullscreen(){
  document.getElementById('pv-overlay').classList.remove('show');
  window.close();
}
window.addEventListener('popstate', ()=>{
  document.getElementById('pv-overlay').classList.remove('show');
});

function waitForImages(container){
  const imgs=[...container.querySelectorAll('img')];
  if(!imgs.length) return Promise.resolve();
  const loaded=Promise.all(imgs.map(img=>img.complete?Promise.resolve():new Promise(res=>{img.onload=img.onerror=res;})));
  return Promise.race([loaded, new Promise(res=>setTimeout(res,1200))]);
}

// Capture flow copied from zikuy-order.html's captureShareImage/_captureShareImageInner
// (snapDOM, queued against concurrent calls, paint-wait poll, timeout race) — same
// real-device hangs it was hardened against apply here too (product photos + WhatsApp
// share). No landscape-rotate here: this blank is always short (header+stats+7 rows
// max), nowhere near the aspect ratio that made that necessary for zikuy's long lists.
let _captureQueue=Promise.resolve();
async function captureShareImage(){
  const myTurn=_captureQueue.catch(()=>{});
  let release; _captureQueue=new Promise(res=>{release=res;});
  await myTurn;
  try{ return await _captureShareImageInner(); }
  finally{ release(); }
}
async function _captureShareImageInner(){
  const el=document.getElementById('print-view');
  await waitForImages(el);
  // 600px, not 900 — messaging-app chat bubbles scale a photo to a fixed
  // bubble WIDTH and cap height, so a wide/short image (900px was ~3:1 for
  // ICE, no table) gets compressed hardest vertically — the least-square
  // aspect ratio of the two. Narrower capture width keeps the same content
  // but lands closer to a ratio WhatsApp doesn't have to squash as much.
  // Live request 2026-08-26 ("читалось все в вотсапе без открытия").
  const prevWidth=el.style.width, prevMaxWidth=el.style.maxWidth;
  const agentEl=document.getElementById('dc-agent');
  const prevAgentFontSize=agentEl.style.fontSize;
  // fitAgentNameOneLine() also sets #dc-agent's own maxWidth (sized for
  // whatever width #print-view has AT THAT MOMENT) — captured here too and
  // restored below, alongside fontSize. Missing this left the ON-SCREEN name
  // stuck with the WIDE 600px-capture maxWidth after this async prewarm ran,
  // so it silently overflowed into the FORMULA/ICE badge post-load. Live bug
  // 2026-08-28 (found testing longer agent names, e.g. מרגריטה מאקארצ׳בה).
  const prevAgentMaxWidth=agentEl.style.maxWidth;
  el.style.width='600px'; el.style.maxWidth='600px';
  fitAgentNameOneLine(); // header is narrower at capture width than on-screen — refit
  let canvas;
  try{
    canvas=await Promise.race([
      snapdom.toCanvas(el,{backgroundColor:'#ffffff',scale:1,placeholders:true}),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error('snapdom_timeout')),20000)),
    ]);
  }finally{
    el.style.width=prevWidth; el.style.maxWidth=prevMaxWidth;
    agentEl.style.fontSize=prevAgentFontSize;
    agentEl.style.maxWidth=prevAgentMaxWidth;
  }
  return await new Promise(res=>canvas.toBlob(res,'image/png'));
}
let _shareBlobPromise=null;
function prewarmShareImage(){
  _shareBlobPromise=captureShareImage().catch(e=>{ console.warn('prewarm capture failed',e); return null; });
}
function getShareImage(){
  if(!_shareBlobPromise) prewarmShareImage();
  return _shareBlobPromise;
}

let _shareInFlight=false;
function _setShareButtonsBusy(busy){
  _shareInFlight=busy;
  const waBtn=document.getElementById('wa-btn'), waWebBtn=document.getElementById('wa-web-btn');
  [waBtn,waWebBtn].forEach(b=>{ if(b){ b.style.opacity=busy?'.5':''; b.style.pointerEvents=busy?'none':''; } });
  if(busy){
    const first = (!isManager && agentName) ? agentName.trim().split(/\s+/)[0] : '';
    showToast(first ? `⏳ רגע ${first}, מכינים את הקובץ...` : '⏳ רגע, מכינים את הקובץ...', 15000);
  }
}
function downloadAndOpenWaWeb(blob){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`sgirat-yom-${type}-${agentCode}.png`; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
  window.open('https://web.whatsapp.com/','_blank');
  showToast('התמונה הורדה ל-Downloads — פתח את WhatsApp וצרף אותה מהגלריה');
}
async function sendAsImage(){
  if(_shareInFlight) return;
  _setShareButtonsBusy(true);
  try{
    const blob=await getShareImage();
    const ua=navigator.userAgent;
    const isDesktop=/Windows NT/.test(ua)
      || (/Macintosh/.test(ua) && navigator.maxTouchPoints===0)
      || (/Linux/.test(ua) && !/Android/.test(ua));
    if(blob && !isDesktop){
      const file=new File([blob],`sgirat-yom-${type}-${agentCode}.png`,{type:'image/png'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file]});
        showToast('נשלח לשיתוף');
        return;
      }
    }
    if(blob){ downloadAndOpenWaWeb(blob); return; }
    showToast('שיתוף אוטומטי לא זמין — צלם את המסך עם המצלמה');
  }catch(e){
    console.warn('image share unavailable', e);
    showToast('שיתוף אוטומטי לא זמין — צלם את המסך עם המצלמה');
  }finally{ _setShareButtonsBusy(false); }
}
async function sendViaWhatsAppWeb(){
  if(_shareInFlight) return;
  _setShareButtonsBusy(true);
  try{
    const blob=await getShareImage();
    if(blob){ downloadAndOpenWaWeb(blob); return; }
    showToast('שיתוף אוטומטי לא זמין — צלם את המסך עם המצלמה');
  }catch(e){
    console.warn('whatsapp web share unavailable', e);
    showToast('שיתוף אוטומטי לא זמין — צלם את המסך עם המצלמה');
  }finally{ _setShareButtonsBusy(false); }
}
document.getElementById('wa-btn').onclick=(e)=>{ e.preventDefault(); sendAsImage(); };

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    document.body.style.display = 'none';
    void document.body.offsetHeight;
    document.body.style.display = '';
  }
});

init();
</script>
