<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>בקשת זיכוי — FORMULA</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
:root{
  --blue:#1565C0;--blue-dark:#0D47A1;--sky:#E3F2FD;--sky-mid:#BBDEFB;
  --green:#2E7D32;--orange:#E65100;--red:#C62828;
  --text:#1A1A2E;--mid:#5C6BC0;--light:#90A4AE;
  --bg:#F5F7FA;--card:#fff;--radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);font-family:'Segoe UI',system-ui,sans-serif;color:var(--text);min-height:100vh;padding-bottom:96px;font-size:15px;}
.top-bar{background:linear-gradient(135deg,var(--blue-dark),var(--blue));color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2);}
.back-btn{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:8px;width:40px;height:40px;font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.top-title{font-size:17px;font-weight:800;flex:1;}
.section{background:var(--card);border-radius:var(--radius);margin:12px;box-shadow:0 1px 4px rgba(21,101,192,.08);overflow:hidden;}
.sec-head{background:var(--sky);padding:11px 14px;border-bottom:1px solid var(--sky-mid);display:flex;align-items:center;gap:8px;}
.sec-title{font-size:14px;font-weight:800;color:var(--blue-dark);}
.sec-body{padding:14px;}
.client-strip{background:var(--sky);border-radius:8px;margin:8px 12px;padding:6px 12px;font-size:12px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:6px;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch;}
.cs-sep{color:var(--mid);font-weight:400;}
.loading{text-align:center;padding:24px;color:var(--light);font-size:13px;}

/* ── product picker ─────────────────────────────────────────────── */
.chips{display:flex;flex-wrap:wrap;gap:7px;}
.chip{padding:10px 15px;border-radius:20px;border:1.5px solid var(--sky-mid);background:#fff;font-size:13.5px;font-weight:700;font-family:inherit;cursor:pointer;color:var(--blue-dark);transition:all .15s;-webkit-appearance:none;appearance:none;min-height:40px;}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue);}
.fam-head{font-size:12.5px;font-weight:800;color:var(--mid);text-transform:uppercase;letter-spacing:.3px;margin:14px 0 6px;padding-bottom:4px;border-bottom:1.5px solid var(--sky-mid);}
.fam-head:first-of-type{margin-top:10px;}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;}
.photo-card{width:100%;border:1.5px solid var(--sky-mid);border-radius:10px;padding:6px;text-align:center;cursor:pointer;background:#fff;font-family:inherit;transition:all .15s;-webkit-appearance:none;appearance:none;}
.photo-card:hover{border-color:var(--blue);box-shadow:0 2px 8px rgba(21,101,192,.15);}
.photo-card.added{border-color:var(--green);background:#F1F8F1;}
.photo-card img{width:100%;height:64px;object-fit:contain;border-radius:6px;background:#f5f5f5;margin-bottom:4px;}
.photo-card .pname{font-size:11.5px;font-weight:700;color:var(--text);line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.photo-card .padd{font-size:10px;font-weight:800;color:var(--green);margin-top:2px;}

/* ── return-request list (the main work surface) ───────────────── */
.ret-list{display:flex;flex-direction:column;gap:12px;}
.ret-item{border:1.5px solid var(--sky-mid);border-radius:12px;padding:12px;background:#fff;}
.ret-item-top{display:flex;align-items:center;gap:10px;}
.ret-item-top img{width:48px;height:48px;object-fit:contain;border-radius:8px;background:#f5f5f5;flex-shrink:0;}
.ret-item-name{flex:1;font-size:14.5px;font-weight:700;color:var(--text);line-height:1.3;}
.ret-item-sku{font-size:11px;font-weight:700;color:var(--light);}
.ret-item-pct{font-size:11.5px;font-weight:800;white-space:nowrap;padding:5px 9px;border-radius:8px;background:var(--sky);}
.ret-item-pct.pct-hi{color:var(--red);}
.ret-item-pct.pct-lo{color:var(--blue-dark);}
.ret-item-controls{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;}
.ret-field{display:flex;flex-direction:column;gap:5px;}
.ret-field label{font-size:11px;font-weight:700;color:var(--mid);text-transform:uppercase;letter-spacing:.3px;}
.qty-stepper{display:flex;align-items:center;border:1.5px solid var(--sky-mid);border-radius:10px;overflow:hidden;}
.qty-stepper .qty-btn{width:44px;height:44px;border:none;background:var(--sky);color:var(--blue-dark);font-size:20px;font-weight:800;cursor:pointer;font-family:inherit;-webkit-appearance:none;appearance:none;}
.qty-stepper .qty-btn:active{background:var(--sky-mid);}
.qty-stepper input[type=number]{width:52px;height:44px;border:none;text-align:center;font-size:16px;font-family:inherit;-moz-appearance:textfield;appearance:textfield;}
.qty-stepper input[type=number]::-webkit-outer-spin-button,.qty-stepper input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.ret-field input[type=date],.ret-field select{padding:9px 10px;min-height:44px;min-width:132px;border:1.5px solid var(--sky-mid);border-radius:10px;font-size:14.5px;font-family:inherit;color:var(--text);background:#fff;}
/* -50% vs השמדה — two very different outcomes for the return, easy to fat-finger
   as a <select> on a tablet. A toggle keeps both options visible at once and
   color-codes them so which one is active reads at a glance, not just from text. */
.opt-toggle{display:flex;min-height:44px;min-width:150px;border:1.5px solid var(--sky-mid);border-radius:10px;overflow:hidden;}
.opt-btn{flex:1;border:none;background:#fff;font-family:inherit;font-size:13px;font-weight:800;color:var(--mid);cursor:pointer;-webkit-appearance:none;appearance:none;padding:0 6px;white-space:nowrap;}
.opt-btn:not(:last-child){border-inline-end:1.5px solid var(--sky-mid);}
.opt-btn.opt-50.on{background:var(--blue);color:#fff;}
.opt-btn.opt-destroy.on{background:var(--red);color:#fff;}
.ret-empty{text-align:center;padding:20px;color:var(--light);font-size:13px;}
.rm-btn{width:40px;height:40px;flex-shrink:0;background:none;border:none;color:var(--red);font-size:19px;cursor:pointer;border-radius:8px;display:flex;align-items:center;justify-content:center;}
.rm-btn:active{background:#FFEBEE;}

.submit-bar{position:fixed;bottom:0;right:0;left:0;background:#fff;padding:12px 16px;box-shadow:0 -2px 12px rgba(0,0,0,.12);z-index:100;display:flex;gap:8px;}
.submit-btn{flex:1;padding:15px;background:var(--green);color:#fff;border:none;border-radius:var(--radius);font-size:15.5px;font-weight:800;cursor:pointer;font-family:inherit;min-height:52px;}
.submit-btn:disabled{background:var(--light);cursor:default;}
.wa-btn{flex:1;padding:15px;background:#25D366;color:#fff;border:none;border-radius:var(--radius);font-size:15.5px;font-weight:800;cursor:pointer;font-family:inherit;text-decoration:none;text-align:center;display:none;align-items:center;justify-content:center;min-height:52px;}
.wa-btn.show{display:flex;}
.toast{position:fixed;bottom:96px;right:50%;transform:translateX(50%);background:#323232;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;z-index:9999;opacity:0;transition:opacity .3s;white-space:nowrap;}
.toast.show{opacity:1;}

/* ── tablet sizing: portrait-only — stays single-column (stacked) at any width,
   just bigger fonts/touch-targets. The app is used holding the tablet vertically;
   no side-by-side desktop-style split. ── */
@media (min-width:760px){
  body{font-size:16px;}
  .sec-title{font-size:15px;}
  .ret-item-name{font-size:16px;}
  .ret-item-pct{font-size:13px;}
  .qty-stepper .qty-btn{width:48px;height:48px;font-size:22px;}
  .qty-stepper input[type=number]{width:60px;height:48px;font-size:17px;}
  .ret-field input[type=date],.ret-field select{min-height:48px;font-size:15.5px;}
  .opt-toggle{min-height:48px;min-width:170px;}
  .opt-btn{font-size:14.5px;}
  .submit-btn,.wa-btn{font-size:17px;min-height:58px;}
}

/* ── printable / shareable blank ─────────────────────────────────── */
/* Default: off-screen, only used as the html2canvas capture source (WhatsApp
   image share). #pv-overlay.show makes it a real full-screen view instead, so
   the agent can just point their phone's camera at it directly — no dependency
   on Web Share API / WhatsApp target availability at all. */
#print-view{position:fixed;left:-10000px;top:0;width:1100px;background:#fff;padding:22px;}
#pv-overlay{display:none;}
#pv-overlay.show{display:block;position:fixed;inset:0;z-index:20000;background:var(--bg);overflow-y:auto;padding:14px;}
#pv-overlay-bar{display:flex;gap:10px;margin-bottom:14px;position:sticky;top:0;}
#pv-close-btn{background:#37474F;color:#fff;border:none;border-radius:10px;padding:12px 20px;font-weight:800;font-size:14.5px;cursor:pointer;font-family:inherit;flex-shrink:0;}
#pv-barcode-btn{background:var(--blue);color:#fff;border:none;border-radius:10px;padding:12px 20px;font-weight:800;font-size:14.5px;cursor:pointer;font-family:inherit;flex-shrink:0;}
#pv-barcode-btn.on{background:var(--green);}
#pv-overlay.show #print-view{position:static;left:auto;width:100%;max-width:1100px;margin:0 auto;box-shadow:0 2px 16px rgba(0,0,0,.15);border-radius:12px;}
@media print{
  body *{visibility:hidden;}
  #print-view,#print-view *{visibility:visible;}
  #print-view{position:absolute;left:0;top:0;width:auto;padding:20px;}
  .no-print{display:none!important;}
}
#pv-header{background:linear-gradient(135deg,var(--blue-dark),var(--blue));color:#fff;padding:16px 20px;border-radius:10px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
#pv-brand{font-size:12px;font-weight:800;letter-spacing:1px;opacity:.85;margin-bottom:4px;}
#pv-title{font-size:19px;font-weight:800;}
/* Operators re-key this into Priority by client number — it needs to read as one
   clean number at a glance, not a parenthesized suffix riding inside RTL name text
   where bidi mirroring could flip the parens visually. A separate high-contrast
   badge, isolated from the surrounding Hebrew run, sidesteps that entirely. */
#pv-custid{flex-shrink:0;background:#fff;color:var(--blue-dark);border-radius:10px;padding:6px 16px;text-align:center;direction:ltr;unicode-bidi:isolate;}
#pv-custid b{display:block;font-size:10px;font-weight:800;color:var(--blue);letter-spacing:.5px;}
#pv-custid span{display:block;font-size:22px;font-weight:900;line-height:1.2;}
#pv-meta{margin:0 0 14px;font-size:13px;color:var(--mid);font-weight:600;}
/* Chain mode adds a drawn-barcode column at a fixed pixel width (needs to stay
   legible/scannable, can't just shrink to fit) — table can end up wider than
   the tablet screen, so it scrolls horizontally inside its own box instead of
   breaking the page. */
.pv-tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.pv-tbl{border-collapse:collapse;width:100%;font-size:13px;}
.pv-tbl th,.pv-tbl td{border:1px solid var(--sky-mid);padding:8px;text-align:center;}
.pv-tbl th{background:var(--blue-dark);color:#fff;font-size:12px;}
.pv-tbl tbody tr:nth-child(even){background:var(--sky);}
.pv-tbl img{width:44px;height:44px;object-fit:contain;border-radius:6px;background:#f5f5f5;}
.pv-tbl td.pv-name{text-align:right;font-weight:700;}
.pv-total{font-weight:800;background:var(--sky-mid)!important;}
.pv-tbl td.pv-lastship small{display:block;font-size:10px;color:var(--light);font-weight:600;margin-top:2px;}
.pv-tbl td.pv-gap.gap-neg{color:var(--red);font-weight:800;}

/* ── optional barcode mode (➕ ברקוד button, agent's own call — not tied to any
   client segment: some chains don't need it, some private stores might) ──
   Same table, scaled up + a drawn-barcode column so whoever's receiving the
   return can scan it straight off the tablet screen. ── */
.pv-ean-cell{white-space:nowrap;text-align:center;}
.pv-ean-cell svg{display:block;margin:0 auto;}
.pv-ean-none{color:var(--light);font-size:16px;}
.pv-ean-digits{font-family:'Consolas',monospace;font-weight:800;direction:ltr;unicode-bidi:isolate;margin-top:2px;}
#pv-overlay.barcode-mode #print-view{max-width:1180px;}
#pv-overlay.barcode-mode .pv-tbl{font-size:17px;}
#pv-overlay.barcode-mode .pv-tbl th{font-size:15px;padding:12px;}
#pv-overlay.barcode-mode .pv-tbl td{padding:14px 10px;}
#pv-overlay.barcode-mode .pv-tbl img{width:70px;height:70px;}
#pv-overlay.barcode-mode .pv-ean-digits{font-size:13px;letter-spacing:.5px;}
#pv-overlay.barcode-mode #pv-title{font-size:23px;}
#pv-overlay.barcode-mode #pv-custid span{font-size:26px;}
#pv-overlay.barcode-mode #pv-meta{font-size:15.5px;}
</style>
</head>
<body>

<div class="top-bar no-print">
  <button class="back-btn" aria-label="חזרה" onclick="window.close()">→</button>
  <div class="top-title">🔄 בקשת זיכוי</div>
</div>

<div class="client-strip no-print">
  <span>👤</span>
  <span id="inf-name">—</span><span class="cs-sep">·</span>
  <span id="inf-id">—</span><span class="cs-sep">·</span>
  <span id="inf-city">—</span><span class="cs-sep">·</span>
  <span id="inf-agent">—</span>
</div>

<div class="layout no-print">
  <div class="section" id="browse-section">
    <div class="sec-head"><span class="sec-title">📦 בחר מוצרים (FORMULA + ICE מיש בלבד, רק מוצרים שהלקוח קנה ב-365 יום)</span></div>
    <div class="sec-body">
      <div id="browse-loading" class="loading">⏳ טוען מוצרים...</div>
      <div id="browse-body" style="display:none">
        <div class="chips" id="chips"></div>
        <div id="fam-groups"></div>
      </div>
    </div>
  </div>

  <div class="section" id="ret-section">
    <div class="sec-head"><span class="sec-title">📋 טופס זיכוי</span></div>
    <div class="sec-body">
      <div class="ret-list" id="ret-tbody"></div>
      <div class="ret-empty" id="ret-empty">לא נבחרו מוצרים עדיין — בחר מוצר מהרשימה משמאל</div>
    </div>
  </div>
</div>

<div class="submit-bar no-print">
  <button type="button" class="submit-btn" id="ok-btn" onclick="buildProforma()" disabled>✅ OK — הפק בלנק</button>
</div>

<div id="pv-overlay" class="no-print">
  <div id="pv-overlay-bar">
    <button type="button" id="pv-close-btn" onclick="hidePrintFullscreen()">✕ סגור</button>
    <button type="button" id="pv-barcode-btn" onclick="toggleBarcodeMode()">➕ ברקוד</button>
    <a class="wa-btn show" id="wa-btn" target="_blank" rel="noopener">📱 שלח ב-WhatsApp</a>
  </div>
  <div id="print-view">
    <div id="pv-header">
      <div>
        <div id="pv-brand">FORMULA · בקשת זיכוי</div>
        <div id="pv-title"></div>
      </div>
      <div id="pv-custid"><b>מס' לקוח</b><span></span></div>
    </div>
    <div id="pv-meta"></div>
    <div class="pv-tbl-wrap">
      <table class="pv-tbl">
        <thead><tr id="pv-thead-row"><th>תמונה</th><th>מק"ט</th><th>מוצר</th><th>כמות</th><th>תנועה אחרונה</th><th>ימי תוקף שלקוח קיבל</th><th>תוקף</th><th>אופציה</th></tr></thead>
        <tbody id="pv-tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'https://api.sverdlik-apps.site';
const params = new URLSearchParams(location.search);
const TOKEN = localStorage.getItem('frToken') || '';
const custId = params.get('custId') || '';
const custName = params.get('custName') || '';
const city = params.get('city') || '';
const agentCode = params.get('agentCode') || '';
const agentName = params.get('agentName') || '';
let barcodeMode = false; // agent's own toggle (➕ ברקוד button) — not tied to client segment

const esc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
// Same convention as MMD ORDERS' shortName(): cut right after the first "NNN ג"
// weight marker instead of showing the full packaging/supplier boilerplate.
function shortName(s) {
  const m = s.match(/\d+\s*ג[.'׳]?/);
  if (!m) return s;
  let res = s.slice(0, s.indexOf(m[0]) + m[0].length).trim();
  res = res.replace(/(\d+)\s+(ג[.'׳]?)$/, '$1 $2');
  return res;
}
function showToast(msg,ms=2200){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),ms);
}
function apiFetch(path, opts = {}) {
  return fetch(path.startsWith('http') ? path : API + path, {
    ...opts, headers: { 'X-Session': TOKEN, ...(opts.headers || {}) },
  });
}
function proxyImg(url){ return url ? `${API}/api/img-proxy?url=${encodeURIComponent(url)}` : ''; }

let products = [];      // full 365-day history from server
let selected = new Map(); // sku -> {product, qty, date, option}
let navMachlaka = null; // currently drilled-into department

// Sold by weight, not by unit — these families and SKUs need the return
// quantity entered in grams instead of pieces. Matched by 'KARTIS PARIT'[משפחת
// מוצר] — the numeric family code (e.g. "025") — not by the free-text family
// name: that text comes from a different table (ALL_PARTS[תאור משפחת מוצר])
// and a spelling/pluralization mismatch there ('גבינות SVALYA' vs the real
// 'גבינה SVALIA') silently dropped the whole SVALIA cheese line out of this
// list on 2026-08-23. The numeric code is the same value regardless of which
// table or transliteration reads it. 2026-08-23.
const GRAM_FAM_CODES = new Set([25, 3, 31]); // SVALIA cheese, KAZAHSTAN fish, RUSSIA fish
const GRAMS_SKUS = new Set(['413000', '413001', '413002']); // PRESIDENT cheese
function isGramsProduct(p){
  return GRAM_FAM_CODES.has(parseInt(p.famCode, 10)) || GRAMS_SKUS.has(String(p.sku));
}

// date bounds for the תוקף picker: 1 year back, 3 years ahead
const today = new Date();
const oneYearAgo = new Date(); oneYearAgo.setFullYear(oneYearAgo.getFullYear()-1);
const threeYearsAhead = new Date(); threeYearsAhead.setFullYear(threeYearsAhead.getFullYear()+3);
const dMax = threeYearsAhead.toISOString().slice(0,10);
const dMin = oneYearAgo.toISOString().slice(0,10);

async function init(){
  document.getElementById('inf-name').textContent = custName || '—';
  document.getElementById('inf-id').textContent = custId || '—';
  document.getElementById('inf-city').textContent = city || '—';
  document.getElementById('inf-agent').textContent = agentName ? `${agentName} (${agentCode})` : (agentCode || '—');

  if(!custId){ document.getElementById('browse-loading').textContent='❌ חסר מספר לקוח'; return; }
  try{
    const r = await apiFetch(`/api/client-returns/${custId}`);
    const d = await r.json();
    if(!d.ok) throw new Error(d.error||'שגיאה');
    products = d.products||[];
    document.getElementById('browse-loading').style.display='none';
    document.getElementById('browse-body').style.display='';
    renderBrowse();
  }catch(e){
    document.getElementById('browse-loading').textContent='❌ '+e.message;
  }
}

// Single-level hierarchy: pick a מחלקה, then see all its photos at once,
// grouped visually by משפחה (no separate family drill-down step).
function renderBrowse(){
  const chipsEl=document.getElementById('chips');
  const groupsEl=document.getElementById('fam-groups');

  const machlakot=[...new Set(products.map(p=>p.machlaka).filter(Boolean))].sort();
  chipsEl.innerHTML=machlakot.map(m=>`<button type="button" class="chip ${m===navMachlaka?'on':''}" data-m="${esc(m)}">${esc(m)}</button>`).join('');
  chipsEl.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{navMachlaka=(navMachlaka===c.dataset.m?null:c.dataset.m);renderBrowse();});

  if(!navMachlaka){ groupsEl.innerHTML=''; return; }

  const items=products.filter(p=>p.machlaka===navMachlaka);
  const families=[...new Set(items.map(p=>p.family).filter(Boolean))].sort();
  groupsEl.innerHTML = families.map(fam=>{
    const famItems = items.filter(p=>p.family===fam);
    const cards = famItems.map(p=>{
      const isAdded=selected.has(p.sku);
      const img=p.imgUrl?`<img src="${esc(p.imgUrl)}" alt="${esc(p.name)}" loading="lazy" onerror="this.style.display='none'">`:'<div style="width:100%;height:64px;background:#f5f5f5;border-radius:6px;margin-bottom:4px"></div>';
      return `<button type="button" class="photo-card ${isAdded?'added':''}" data-sku="${esc(p.sku)}">${img}<div class="pname">${esc(shortName(p.name))}</div>${isAdded?'<div class="padd">✓ נוסף</div>':''}</button>`;
    }).join('');
    return `<div class="fam-head">${esc(fam)}</div><div class="photo-grid">${cards}</div>`;
  }).join('');
  groupsEl.querySelectorAll('.photo-card').forEach(c=>c.onclick=()=>toggleProduct(c.dataset.sku));
}

// Warms the browser's HTTP cache for the proxied product photo as soon as it's
// picked, not when the blank is built — navigator.share() must fire within a short
// window of the user's click (transient activation), and waiting on a fresh image
// fetch at that point was blowing past it, silently dropping to the text fallback.
function preloadProxyImg(url){
  if(!url) return;
  const img=new Image();
  img.src=proxyImg(url);
}
function toggleProduct(sku){
  if(selected.has(sku)){ selected.delete(sku); }
  else{
    const p=products.find(x=>x.sku===sku); if(!p) return;
    selected.set(sku,{product:p,qty:1,date:today.toISOString().slice(0,10),option:'-50%'});
    preloadProxyImg(p.imgUrl);
  }
  renderBrowse(); renderTable();
}

function renderTable(){
  const tbody=document.getElementById('ret-tbody');
  const empty=document.getElementById('ret-empty');
  const okBtn=document.getElementById('ok-btn');
  if(!selected.size){
    tbody.innerHTML=''; empty.style.display='';
    okBtn.disabled=true; okBtn.textContent='✅ OK — הפק בלנק';
    return;
  }
  empty.style.display='none';
  okBtn.disabled=false;
  okBtn.textContent=`✅ OK — הפק בלנק (${selected.size})`;
  tbody.innerHTML=[...selected.values()].map(row=>{
    const p=row.product;
    const pctClass=p.zikuyPct3mo>10?'pct-hi':'pct-lo';
    const img=p.imgUrl?`<img src="${esc(p.imgUrl)}" alt="${esc(p.name)}" onerror="this.style.display='none'">`:'';
    const lastShip=p.lastShipDate?` · אספקה אחרונה: ${p.lastShipDate.split('-').reverse().join('.')} (${p.lastShipQty} יח')`:'';
    return `<div class="ret-item" data-sku="${esc(p.sku)}">
      <div class="ret-item-top">
        ${img}
        <div class="ret-item-name">${esc(shortName(p.name))}<br><span class="ret-item-sku">מק"ט ${esc(p.sku)}${lastShip}</span></div>
        <div class="ret-item-pct ${pctClass}">זיכוי 3ח׳: ${p.zikuyPct3mo}%</div>
        <button type="button" class="rm-btn" aria-label="הסר מוצר" onclick="toggleProduct('${esc(p.sku)}')">🗑</button>
      </div>
      <div class="ret-item-controls">
        <div class="ret-field">
          <label>${isGramsProduct(p) ? 'משקל לזיכוי (גרם)' : 'כמות לזיכוי'}</label>
          <div class="qty-stepper">
            <button type="button" class="qty-btn" aria-label="הפחת" onclick="stepQty('${esc(p.sku)}',-1)">−</button>
            <input type="number" min="1" value="${row.qty}" inputmode="numeric" aria-label="${isGramsProduct(p) ? 'משקל לזיכוי בגרם' : 'כמות לזיכוי'}" onchange="updateRow('${esc(p.sku)}','qty',this.value)">
            <button type="button" class="qty-btn" aria-label="הוסף" onclick="stepQty('${esc(p.sku)}',1)">+</button>
          </div>
        </div>
        <div class="ret-field">
          <label>תוקף</label>
          <input type="date" value="${row.date}" min="${dMin}" max="${dMax}" aria-label="תאריך תוקף" onchange="updateRow('${esc(p.sku)}','date',this.value)">
        </div>
        <div class="ret-field">
          <label>אופציה</label>
          <div class="opt-toggle" role="group" aria-label="אופציה">
            <button type="button" class="opt-btn opt-50 ${row.option==='-50%'?'on':''}" onclick="setOption('${esc(p.sku)}','-50%')">-50%</button>
            <button type="button" class="opt-btn opt-destroy ${row.option==='השמדה'?'on':''}" onclick="setOption('${esc(p.sku)}','השמדה')">🗑 השמדה</button>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}
function updateRow(sku,field,val){
  const row=selected.get(sku); if(!row) return;
  row[field]= field==='qty' ? (parseInt(val,10)||1) : val;
}
function setOption(sku,val){
  const row=selected.get(sku); if(!row) return;
  row.option=val;
  renderTable();
}
function stepQty(sku,delta){
  const row=selected.get(sku); if(!row) return;
  row.qty=Math.max(1,(row.qty||1)+delta);
  renderTable();
}

async function buildProforma(){
  if(!selected.size){ showToast('בחר לפחות מוצר אחד'); return; }
  const rows=[...selected.values()];
  const now=new Date().toLocaleDateString('he-IL');
  document.getElementById('pv-title').textContent=`בקשת זיכוי — ${custName}`;
  document.getElementById('pv-custid').querySelector('span').textContent=custId;
  document.getElementById('pv-meta').innerHTML=`עיר: ${esc(city)} | סוכן: ${esc(agentName||agentCode)} | תאריך: ${now}`;
  renderProformaTable(rows);
  await waitForImages(document.getElementById('print-view'));
  setupWaButton();
  showPrintFullscreen();
}

// ➕ ברקוד button (in the open blank's top bar) — agent's own call, not tied to
// any client segment (some chains need it, some don't, private stores sometimes
// do too) — rebuilds the already-open blank in place: bigger everything + a
// drawn EAN-13 column, so whoever's receiving the return can scan it straight
// off the tablet screen instead of the agent dictating codes out loud.
function toggleBarcodeMode(){
  barcodeMode=!barcodeMode;
  const btn=document.getElementById('pv-barcode-btn');
  btn.classList.toggle('on',barcodeMode);
  btn.textContent = barcodeMode ? '✓ ברקוד' : '➕ ברקוד';
  renderProformaTable([...selected.values()]);
}

function renderProformaTable(rows){
  document.getElementById('pv-overlay').classList.toggle('barcode-mode', barcodeMode);
  // Grams and pieces don't sum to a meaningful number together — total only
  // counts piece-based rows.
  const totalQty=rows.reduce((s,r)=>s+(isGramsProduct(r.product)?0:r.qty),0);
  const eanTh = barcodeMode ? '<th>ברקוד</th>' : '';
  document.getElementById('pv-thead-row').innerHTML = eanTh +
    '<th>תמונה</th><th>מק"ט</th><th>מוצר</th><th>כמות</th><th>תנועה אחרונה</th><th>ימי תוקף שלקוח קיבל</th><th>תוקף</th><th>אופציה</th>';
  const firstColspan = barcodeMode ? 4 : 3;
  document.getElementById('pv-tbody').innerHTML=rows.map(r=>{
    const img=r.product.imgUrl?`<img src="${proxyImg(r.product.imgUrl)}" alt="">`:'';
    const lsDate=r.product.lastShipDate;
    const lastShipCell = lsDate
      ? `${lsDate.split('-').reverse().join('.')}<small>${r.product.lastShipQty} יח'</small>`
      : '—';
    // Days between the expiry the agent entered (r.date) and the last time this
    // exact client actually received this SKU (lsDate) — tells the agent whether the
    // physical stock in front of them plausibly came from that last shipment (small
    // gap) or has been sitting for a while (large gap). Negative = entered expiry is
    // BEFORE the last shipment date, a data-entry red flag, highlighted.
    const gapDays = lsDate ? Math.round((new Date(r.date) - new Date(lsDate)) / 86400000) : null;
    const gapCell = gapDays===null ? '—' : `${gapDays} ימים`;
    const gapClass = gapDays!==null && gapDays<0 ? 'pv-gap gap-neg' : 'pv-gap';
    const eanTd = barcodeMode ? `<td class="pv-ean-cell">${eanCellHtml(r.product.ean)}</td>` : '';
    const qtyCell = isGramsProduct(r.product) ? (r.qty/1000).toFixed(3) : r.qty;
    return `<tr>${eanTd}<td>${img}</td><td>${esc(r.product.sku)}</td><td class="pv-name">${esc(shortName(r.product.name))}</td><td>${qtyCell}</td><td class="pv-lastship">${lastShipCell}</td><td class="${gapClass}">${gapCell}</td><td>${r.date}</td><td>${esc(r.option)}</td></tr>`;
  }).join('') + `<tr class="pv-total"><td colspan="${firstColspan}">סה"כ</td><td>${totalQty}</td><td colspan="4"></td></tr>`;
}

function showPrintFullscreen(){
  document.getElementById('pv-overlay').classList.add('show');
  // Pushes a same-document history entry so the device/browser "back" gesture
  // just fires popstate below instead of navigating the tab away (which was
  // wiping the in-memory `selected` Map — the agent's edits looked "lost").
  history.pushState({pv:1},'');
}
function hidePrintFullscreen(){
  document.getElementById('pv-overlay').classList.remove('show');
}
window.addEventListener('popstate', ()=>{
  document.getElementById('pv-overlay').classList.remove('show');
});

// Images are inserted into #print-view moments before html2canvas rasterizes it
// (in shareBlank) — without waiting, their network fetch (through /api/img-proxy)
// hasn't finished yet and the capture comes out with blank photo cells. Should
// normally resolve near-instantly since toggleProduct() already preloads each
// photo into the HTTP cache when it's picked, well before this point. The timeout
// is kept short (not the earlier 4s) because navigator.share() right after this
// needs to still be within the click's transient-activation window.
function waitForImages(container){
  const imgs=[...container.querySelectorAll('img')];
  if(!imgs.length) return Promise.resolve();
  const loaded=Promise.all(imgs.map(img=>img.complete?Promise.resolve():new Promise(res=>{img.onload=img.onerror=res;})));
  return Promise.race([loaded, new Promise(res=>setTimeout(res,1200))]);
}

// The blank is now shown full-screen (showPrintFullscreen) as the primary result —
// the agent can just point their phone's camera at it, no dependency on any share
// API at all. The WhatsApp button inside that view is a secondary, optional path
// that shares the actual styled image via the native OS share sheet (so it lands
// in WhatsApp as a photo on Android). No text-only fallback — the full-screen view
// already covers "how do I get this to someone" if native share isn't available,
// and a duplicated bullet-list caption of the same info the photo already shows
// is redundant. preventDefault fires immediately inside the click handler itself,
// before any await, to stay within the click's transient-activation window.
function setupWaButton(rows, now){
  const waBtn=document.getElementById('wa-btn');
  waBtn.onclick=(e)=>{
    e.preventDefault();
    sendAsImage();
  };
}
async function sendAsImage(){
  try{
    const el=document.getElementById('print-view');
    // #pv-overlay.show #print-view shrinks to viewport width on phones (CSS
    // rule above), so capturing it as-is gives a tall/narrow canvas that
    // WhatsApp letterboxes/crops. Force the full 1100px design width for the
    // capture only, then restore.
    const prevWidth=el.style.width, prevMaxWidth=el.style.maxWidth;
    el.style.width='1100px'; el.style.maxWidth='1100px';
    let canvas=await html2canvas(el,{useCORS:true,backgroundColor:'#ffffff',scale:1.5});
    el.style.width=prevWidth; el.style.maxWidth=prevMaxWidth;
    // Still portrait with a long product list (table taller than 1100px wide) —
    // rotate into landscape so WhatsApp never crops it.
    if(canvas.height>canvas.width){
      const rotated=document.createElement('canvas');
      rotated.width=canvas.height; rotated.height=canvas.width;
      const ctx=rotated.getContext('2d');
      ctx.translate(rotated.width/2,rotated.height/2);
      ctx.rotate(Math.PI/2);
      ctx.drawImage(canvas,-canvas.width/2,-canvas.height/2);
      canvas.width=0; canvas.height=0;
      canvas=rotated;
    }
    const blob=await new Promise(res=>canvas.toBlob(res,'image/png'));
    // Free the pixel buffer now — otherwise canvas+blob+File all stay alive together
    // while the native share sheet is open, which is when the freeze/flicker on
    // return has been reported (Android WebView under memory pressure).
    canvas.width=0; canvas.height=0;
    // navigator.share({files}) is real usage on the agent's phone/tablet (WhatsApp
    // shows up as a direct target with the image attached) but on a real desktop
    // it routes through the generic OS Share charm instead of WhatsApp Web — worse,
    // not better, than just handing the user the file.
    // Whitelisting "mobile" UAs is fragile — iPadOS 13+ spoofs a plain Macintosh
    // UA by default (no "iPad" token at all) and would misfire as desktop, sending
    // a real field tablet down the wrong path. Blacklisting desktop OSes instead:
    // a genuine Mac has 0 touch points, so "Macintosh" + touch points is iPadOS in
    // disguise, not desktop. Android UA always says "Android" even on tablets.
    const ua=navigator.userAgent;
    const isDesktop=/Windows NT/.test(ua)
      || (/Macintosh/.test(ua) && navigator.maxTouchPoints===0)
      || (/Linux/.test(ua) && !/Android/.test(ua));
    if(blob && !isDesktop){
      const file=new File([blob],`zikuy-${custId}.png`,{type:'image/png'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title:'בקשת זיכוי'});
        showToast('נשלח לשיתוף');
        return;
      }
    }
    if(blob){
      // Desktop fallback: WhatsApp Web has no URL API to pre-attach a file (browser
      // security), so download the image and open WhatsApp Web for a manual attach.
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url; a.download=`zikuy-${custId}.png`; a.click();
      setTimeout(()=>URL.revokeObjectURL(url),5000);
      window.open('https://web.whatsapp.com/','_blank');
      showToast('התמונה הורדה — צרף אותה בשיחה בווטסאפ Web');
      return;
    }
  }catch(e){ console.warn('image share unavailable', e); }
  showToast('שיתוף אוטומטי לא זמין — צלם את המסך עם המצלמה');
}

// Android WebView sometimes leaves the page stuck in a stale-paint state after the
// native share sheet (navigator.share) closes and focus returns to the tab — force
// a reflow to recover instead of leaving the frozen/flickering frame on screen.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    document.body.style.display = 'none';
    void document.body.offsetHeight;
    document.body.style.display = '';
  }
});

// ── EAN-13 barcode rendering (chain blank — ברקוד column) ───────────────────
// Standard EAN-13 module tables — no external library. First digit isn't drawn
// as bars itself; it selects the L/G parity pattern for the next 6 digits.
const EAN_L = ['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
const EAN_G = ['0100111','0110011','0011011','0100001','0011101','0111001','0000101','0010001','0001001','0010111'];
const EAN_R = ['1110010','1100110','1101100','1000010','1011100','1001110','1010000','1000100','1001000','1110100'];
const EAN_PARITY = ['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
function ean13Bits(code){
  const d=code.split('').map(Number);
  const parity=EAN_PARITY[d[0]];
  let bits='101';
  for(let i=0;i<6;i++) bits += (parity[i]==='L'?EAN_L:EAN_G)[d[i+1]];
  bits+='01010';
  for(let i=0;i<6;i++) bits += EAN_R[d[i+7]];
  return bits+'101';
}
function ean13SVG(code,barW,height){
  const bits=ean13Bits(code);
  const quiet=barW*10;
  const totalW=bits.length*barW+quiet*2;
  let rects='', x=quiet;
  for(const b of bits){ if(b==='1') rects+=`<rect x="${x}" y="0" width="${barW}" height="${height}" fill="#000"/>`; x+=barW; }
  return `<svg viewBox="0 0 ${totalW} ${height}" width="${totalW}" height="${height}" xmlns="http://www.w3.org/2000/svg" style="background:#fff">${rects}</svg>`;
}
// Sized for the ברקוד table cell (~230px drawn width) — big enough for a
// handheld imager scanner to read straight off the tablet screen.
function eanCellHtml(ean){
  ean=String(ean||'').replace(/\D/g,'');
  if(ean.length!==13) return '<div class="pv-ean-none">—</div>';
  return ean13SVG(ean,2.2,80)+`<div class="pv-ean-digits">${ean[0]} ${ean.slice(1,7)} ${ean.slice(7)}</div>`;
}

init();
</script>
