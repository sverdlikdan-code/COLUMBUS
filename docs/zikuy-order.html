<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>בקשת זיכוי — FORMULA</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
:root{
  --blue:#1565C0;--blue-dark:#0D47A1;--sky:#E3F2FD;--sky-mid:#BBDEFB;
  --green:#2E7D32;--orange:#E65100;--red:#C62828;
  --text:#1A1A2E;--mid:#5C6BC0;--light:#90A4AE;
  --bg:#F5F7FA;--card:#fff;--radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);font-family:'Segoe UI',system-ui,sans-serif;color:var(--text);min-height:100vh;padding-bottom:96px;font-size:15px;}
.top-bar{background:linear-gradient(135deg,var(--blue-dark),var(--blue));color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2);}
.back-btn{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:8px;width:40px;height:40px;font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.top-title{font-size:17px;font-weight:800;flex:1;}
.section{background:var(--card);border-radius:var(--radius);margin:12px;box-shadow:0 1px 4px rgba(21,101,192,.08);overflow:hidden;}
.sec-head{background:var(--sky);padding:11px 14px;border-bottom:1px solid var(--sky-mid);display:flex;align-items:center;gap:8px;}
.sec-title{font-size:14px;font-weight:800;color:var(--blue-dark);}
.sec-body{padding:14px;}
.client-strip{background:var(--sky);border-radius:8px;margin:8px 12px;padding:6px 12px;font-size:12px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:6px;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch;}
.cs-sep{color:var(--mid);font-weight:400;}
.loading{text-align:center;padding:24px;color:var(--light);font-size:13px;}

/* ── product picker ─────────────────────────────────────────────── */
.chips{display:flex;flex-wrap:wrap;gap:7px;}
.chip{padding:10px 15px;border-radius:20px;border:1.5px solid var(--sky-mid);background:#fff;font-size:13.5px;font-weight:700;font-family:inherit;cursor:pointer;color:var(--blue-dark);transition:all .15s;-webkit-appearance:none;appearance:none;min-height:40px;}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue);}
.fam-head{font-size:12.5px;font-weight:800;color:var(--mid);text-transform:uppercase;letter-spacing:.3px;margin:14px 0 6px;padding-bottom:4px;border-bottom:1.5px solid var(--sky-mid);}
.fam-head:first-of-type{margin-top:10px;}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;}
.photo-card{width:100%;border:1.5px solid var(--sky-mid);border-radius:10px;padding:6px;text-align:center;cursor:pointer;background:#fff;font-family:inherit;transition:all .15s;-webkit-appearance:none;appearance:none;}
.photo-card:hover{border-color:var(--blue);box-shadow:0 2px 8px rgba(21,101,192,.15);}
.photo-card.added{border-color:var(--green);background:#F1F8F1;}
.photo-card img{width:100%;height:64px;object-fit:contain;border-radius:6px;background:#f5f5f5;margin-bottom:4px;}
.photo-card .pname{font-size:11.5px;font-weight:700;color:var(--text);line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.photo-card .padd{font-size:10px;font-weight:800;color:var(--green);margin-top:2px;}

/* ── return-request list (the main work surface) ───────────────── */
.ret-list{display:flex;flex-direction:column;gap:12px;}
.ret-item{border:1.5px solid var(--sky-mid);border-radius:12px;padding:12px;background:#fff;}
.ret-item-top{display:flex;align-items:center;gap:10px;}
.ret-item-top img{width:48px;height:48px;object-fit:contain;border-radius:8px;background:#f5f5f5;flex-shrink:0;}
.ret-item-name{flex:1;font-size:14.5px;font-weight:700;color:var(--text);line-height:1.3;}
.ret-item-sku{font-size:11px;font-weight:700;color:var(--light);}
.ret-item-pct{font-size:11.5px;font-weight:800;white-space:nowrap;padding:5px 9px;border-radius:8px;background:var(--sky);}
.ret-item-pct.pct-hi{color:var(--red);}
.ret-item-pct.pct-lo{color:var(--blue-dark);}
.ret-item-controls{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;}
.ret-field{display:flex;flex-direction:column;gap:5px;}
.ret-field label{font-size:11px;font-weight:700;color:var(--mid);text-transform:uppercase;letter-spacing:.3px;}
.qty-stepper{display:flex;align-items:center;border:1.5px solid var(--sky-mid);border-radius:10px;overflow:hidden;}
.qty-stepper .qty-btn{width:44px;height:44px;border:none;background:var(--sky);color:var(--blue-dark);font-size:20px;font-weight:800;cursor:pointer;font-family:inherit;-webkit-appearance:none;appearance:none;}
.qty-stepper .qty-btn:active{background:var(--sky-mid);}
.qty-stepper input[type=number]{width:52px;height:44px;border:none;text-align:center;font-size:16px;font-family:inherit;-moz-appearance:textfield;appearance:textfield;}
.qty-stepper input[type=number]::-webkit-outer-spin-button,.qty-stepper input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.ret-field input[type=date],.ret-field select{padding:9px 10px;min-height:44px;min-width:132px;border:1.5px solid var(--sky-mid);border-radius:10px;font-size:14.5px;font-family:inherit;color:var(--text);background:#fff;}
.ret-empty{text-align:center;padding:20px;color:var(--light);font-size:13px;}
.rm-btn{width:40px;height:40px;flex-shrink:0;background:none;border:none;color:var(--red);font-size:19px;cursor:pointer;border-radius:8px;display:flex;align-items:center;justify-content:center;}
.rm-btn:active{background:#FFEBEE;}

.submit-bar{position:fixed;bottom:0;right:0;left:0;background:#fff;padding:12px 16px;box-shadow:0 -2px 12px rgba(0,0,0,.12);z-index:100;display:flex;gap:8px;}
.submit-btn{flex:1;padding:15px;background:var(--green);color:#fff;border:none;border-radius:var(--radius);font-size:15.5px;font-weight:800;cursor:pointer;font-family:inherit;min-height:52px;}
.submit-btn:disabled{background:var(--light);cursor:default;}
.wa-btn{flex:1;padding:15px;background:#25D366;color:#fff;border:none;border-radius:var(--radius);font-size:15.5px;font-weight:800;cursor:pointer;font-family:inherit;text-decoration:none;text-align:center;display:none;align-items:center;justify-content:center;min-height:52px;}
.wa-btn.show{display:flex;}
.toast{position:fixed;bottom:96px;right:50%;transform:translateX(50%);background:#323232;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;z-index:9999;opacity:0;transition:opacity .3s;white-space:nowrap;}
.toast.show{opacity:1;}

/* ── tablet sizing: portrait-only — stays single-column (stacked) at any width,
   just bigger fonts/touch-targets. The app is used holding the tablet vertically;
   no side-by-side desktop-style split. ── */
@media (min-width:760px){
  body{font-size:16px;}
  .sec-title{font-size:15px;}
  .ret-item-name{font-size:16px;}
  .ret-item-pct{font-size:13px;}
  .qty-stepper .qty-btn{width:48px;height:48px;font-size:22px;}
  .qty-stepper input[type=number]{width:60px;height:48px;font-size:17px;}
  .ret-field input[type=date],.ret-field select{min-height:48px;font-size:15.5px;}
  .submit-btn,.wa-btn{font-size:17px;min-height:58px;}
}

/* ── printable / shareable blank ─────────────────────────────────── */
#print-view{position:fixed;left:-10000px;top:0;width:800px;background:#fff;padding:22px;}
@media print{
  body *{visibility:hidden;}
  #print-view,#print-view *{visibility:visible;}
  #print-view{position:absolute;left:0;top:0;width:auto;padding:20px;}
  .no-print{display:none!important;}
}
#pv-header{background:linear-gradient(135deg,var(--blue-dark),var(--blue));color:#fff;padding:16px 20px;border-radius:10px;margin-bottom:14px;}
#pv-brand{font-size:12px;font-weight:800;letter-spacing:1px;opacity:.85;margin-bottom:4px;}
#pv-title{font-size:19px;font-weight:800;}
#pv-meta{margin:0 0 14px;font-size:13px;color:var(--mid);font-weight:600;}
.pv-tbl{border-collapse:collapse;width:100%;font-size:13px;}
.pv-tbl th,.pv-tbl td{border:1px solid var(--sky-mid);padding:8px;text-align:center;}
.pv-tbl th{background:var(--blue-dark);color:#fff;font-size:12px;}
.pv-tbl tbody tr:nth-child(even){background:var(--sky);}
.pv-tbl img{width:44px;height:44px;object-fit:contain;border-radius:6px;background:#f5f5f5;}
.pv-tbl td.pv-name{text-align:right;font-weight:700;}
.pv-total{font-weight:800;background:var(--sky-mid)!important;}
</style>
</head>
<body>

<div class="top-bar no-print">
  <button class="back-btn" aria-label="חזרה" onclick="window.history.length>1?history.back():window.close()">→</button>
  <div class="top-title">🔄 בקשת זיכוי</div>
</div>

<div class="client-strip no-print">
  <span>👤</span>
  <span id="inf-name">—</span><span class="cs-sep">·</span>
  <span id="inf-id">—</span><span class="cs-sep">·</span>
  <span id="inf-city">—</span><span class="cs-sep">·</span>
  <span id="inf-agent">—</span>
</div>

<div class="layout no-print">
  <div class="section" id="browse-section">
    <div class="sec-head"><span class="sec-title">📦 בחר מוצרים (FORMULA + ICE מיש בלבד, רק מוצרים שהלקוח קנה ב-365 יום)</span></div>
    <div class="sec-body">
      <div id="browse-loading" class="loading">⏳ טוען מוצרים...</div>
      <div id="browse-body" style="display:none">
        <div class="chips" id="chips"></div>
        <div id="fam-groups"></div>
      </div>
    </div>
  </div>

  <div class="section" id="ret-section">
    <div class="sec-head"><span class="sec-title">📋 טופס זיכוי</span></div>
    <div class="sec-body">
      <div class="ret-list" id="ret-tbody"></div>
      <div class="ret-empty" id="ret-empty">לא נבחרו מוצרים עדיין — בחר מוצר מהרשימה משמאל</div>
    </div>
  </div>
</div>

<div class="submit-bar no-print">
  <button type="button" class="submit-btn" id="ok-btn" onclick="buildProforma()" disabled>✅ OK — הפק בלנק</button>
  <a class="wa-btn" id="wa-btn" target="_blank" rel="noopener">📱 שלח ב-WhatsApp</a>
</div>

<div id="print-view">
  <div id="pv-header">
    <div id="pv-brand">FORMULA · בקשת זיכוי</div>
    <div id="pv-title"></div>
  </div>
  <div id="pv-meta"></div>
  <table class="pv-tbl">
    <thead><tr><th>תמונה</th><th>מק"ט</th><th>מוצר</th><th>כמות</th><th>תוקף</th><th>אופציה</th></tr></thead>
    <tbody id="pv-tbody"></tbody>
  </table>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'https://api.sverdlik-apps.site';
const params = new URLSearchParams(location.search);
const TOKEN = localStorage.getItem('frToken') || '';
const custId = params.get('custId') || '';
const custName = params.get('custName') || '';
const city = params.get('city') || '';
const agentCode = params.get('agentCode') || '';
const agentName = params.get('agentName') || '';

const esc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
// Isolates a number/parenthesis run so it doesn't visually merge with an adjacent
// number run from RTL text (e.g. client name ending in a branch number like "... - 5").
const isolate = s => '⁦' + s + '⁩';
function showToast(msg,ms=2200){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),ms);
}
function apiFetch(path, opts = {}) {
  return fetch(path.startsWith('http') ? path : API + path, {
    ...opts, headers: { 'X-Session': TOKEN, ...(opts.headers || {}) },
  });
}
function proxyImg(url){ return url ? `${API}/api/img-proxy?url=${encodeURIComponent(url)}` : ''; }

let products = [];      // full 365-day history from server
let curLabel = '';
let selected = new Map(); // sku -> {product, qty, date, option}
let navMachlaka = null; // currently drilled-into department

// date bounds for the תוקף picker: 6 months back, 2 months ahead
const today = new Date();
const sixMonthsAgo = new Date(); sixMonthsAgo.setMonth(sixMonthsAgo.getMonth()-6);
const twoMonthsAhead = new Date(); twoMonthsAhead.setMonth(twoMonthsAhead.getMonth()+2);
const dMax = twoMonthsAhead.toISOString().slice(0,10);
const dMin = sixMonthsAgo.toISOString().slice(0,10);

async function init(){
  document.getElementById('inf-name').textContent = custName || '—';
  document.getElementById('inf-id').textContent = custId || '—';
  document.getElementById('inf-city').textContent = city || '—';
  document.getElementById('inf-agent').textContent = agentName ? `${agentName} (${agentCode})` : (agentCode || '—');

  if(!custId){ document.getElementById('browse-loading').textContent='❌ חסר מספר לקוח'; return; }
  try{
    const r = await apiFetch(`/api/client-returns/${custId}`);
    const d = await r.json();
    if(!d.ok) throw new Error(d.error||'שגיאה');
    products = d.products||[]; curLabel = d.curLabel||'';
    document.getElementById('browse-loading').style.display='none';
    document.getElementById('browse-body').style.display='';
    renderBrowse();
  }catch(e){
    document.getElementById('browse-loading').textContent='❌ '+e.message;
  }
}

// Single-level hierarchy: pick a מחלקה, then see all its photos at once,
// grouped visually by משפחה (no separate family drill-down step).
function renderBrowse(){
  const chipsEl=document.getElementById('chips');
  const groupsEl=document.getElementById('fam-groups');

  const machlakot=[...new Set(products.map(p=>p.machlaka).filter(Boolean))].sort();
  chipsEl.innerHTML=machlakot.map(m=>`<button type="button" class="chip ${m===navMachlaka?'on':''}" data-m="${esc(m)}">${esc(m)}</button>`).join('');
  chipsEl.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{navMachlaka=(navMachlaka===c.dataset.m?null:c.dataset.m);renderBrowse();});

  if(!navMachlaka){ groupsEl.innerHTML=''; return; }

  const items=products.filter(p=>p.machlaka===navMachlaka);
  const families=[...new Set(items.map(p=>p.family).filter(Boolean))].sort();
  groupsEl.innerHTML = families.map(fam=>{
    const famItems = items.filter(p=>p.family===fam);
    const cards = famItems.map(p=>{
      const isAdded=selected.has(p.sku);
      const img=p.imgUrl?`<img src="${esc(p.imgUrl)}" alt="${esc(p.name)}" loading="lazy" onerror="this.style.display='none'">`:'<div style="width:100%;height:64px;background:#f5f5f5;border-radius:6px;margin-bottom:4px"></div>';
      return `<button type="button" class="photo-card ${isAdded?'added':''}" data-sku="${esc(p.sku)}">${img}<div class="pname">${esc(p.name)}</div>${isAdded?'<div class="padd">✓ נוסף</div>':''}</button>`;
    }).join('');
    return `<div class="fam-head">${esc(fam)}</div><div class="photo-grid">${cards}</div>`;
  }).join('');
  groupsEl.querySelectorAll('.photo-card').forEach(c=>c.onclick=()=>toggleProduct(c.dataset.sku));
}

function toggleProduct(sku){
  if(selected.has(sku)){ selected.delete(sku); }
  else{
    const p=products.find(x=>x.sku===sku); if(!p) return;
    selected.set(sku,{product:p,qty:1,date:today.toISOString().slice(0,10),option:'-50%'});
  }
  renderBrowse(); renderTable();
}

function renderTable(){
  const tbody=document.getElementById('ret-tbody');
  const empty=document.getElementById('ret-empty');
  const okBtn=document.getElementById('ok-btn');
  const waBtn=document.getElementById('wa-btn');
  if(!selected.size){
    tbody.innerHTML=''; empty.style.display='';
    okBtn.disabled=true; okBtn.textContent='✅ OK — הפק בלנק';
    waBtn.classList.remove('show');
    return;
  }
  empty.style.display='none';
  okBtn.disabled=false;
  okBtn.textContent=`✅ OK — הפק בלנק (${selected.size})`;
  tbody.innerHTML=[...selected.values()].map(row=>{
    const p=row.product;
    const pctClass=p.zikuyPct3mo>10?'pct-hi':'pct-lo';
    const img=p.imgUrl?`<img src="${esc(p.imgUrl)}" alt="${esc(p.name)}" onerror="this.style.display='none'">`:'';
    const lastShip=p.lastShipDate?` · אספקה אחרונה: ${p.lastShipDate.split('-').reverse().join('.')} (${p.lastShipQty} יח')`:'';
    return `<div class="ret-item" data-sku="${esc(p.sku)}">
      <div class="ret-item-top">
        ${img}
        <div class="ret-item-name">${esc(p.name)}<br><span class="ret-item-sku">מק"ט ${esc(p.sku)}${lastShip}</span></div>
        <div class="ret-item-pct ${pctClass}">זיכוי 3ח׳: ${p.zikuyPct3mo}%</div>
        <button type="button" class="rm-btn" aria-label="הסר מוצר" onclick="toggleProduct('${esc(p.sku)}')">🗑</button>
      </div>
      <div class="ret-item-controls">
        <div class="ret-field">
          <label>כמות לזיכוי</label>
          <div class="qty-stepper">
            <button type="button" class="qty-btn" aria-label="הפחת כמות" onclick="stepQty('${esc(p.sku)}',-1)">−</button>
            <input type="number" min="1" value="${row.qty}" inputmode="numeric" aria-label="כמות לזיכוי" onchange="updateRow('${esc(p.sku)}','qty',this.value)">
            <button type="button" class="qty-btn" aria-label="הוסף כמות" onclick="stepQty('${esc(p.sku)}',1)">+</button>
          </div>
        </div>
        <div class="ret-field">
          <label>תוקף</label>
          <input type="date" value="${row.date}" min="${dMin}" max="${dMax}" aria-label="תאריך תוקף" onchange="updateRow('${esc(p.sku)}','date',this.value)">
        </div>
        <div class="ret-field">
          <label>אופציה</label>
          <select aria-label="אופציה" onchange="updateRow('${esc(p.sku)}','option',this.value)">
            <option value="-50%" ${row.option==='-50%'?'selected':''}>-50%</option>
            <option value="השמדה" ${row.option==='השמדה'?'selected':''}>השמדה</option>
          </select>
        </div>
      </div>
    </div>`;
  }).join('');
}
function updateRow(sku,field,val){
  const row=selected.get(sku); if(!row) return;
  row[field]= field==='qty' ? (parseInt(val,10)||1) : val;
}
function stepQty(sku,delta){
  const row=selected.get(sku); if(!row) return;
  row.qty=Math.max(1,(row.qty||1)+delta);
  renderTable();
}

async function buildProforma(){
  if(!selected.size){ showToast('בחר לפחות מוצר אחד'); return; }
  const rows=[...selected.values()];
  const now=new Date().toLocaleDateString('he-IL');
  document.getElementById('pv-title').textContent=`בקשת זיכוי — ${custName} ${isolate('('+custId+')')}`;
  document.getElementById('pv-meta').innerHTML=`עיר: ${esc(city)} | סוכן: ${esc(agentName||agentCode)} | תאריך: ${now} | תקופת % זיכויים: ${esc(curLabel)}`;
  const totalQty=rows.reduce((s,r)=>s+r.qty,0);
  document.getElementById('pv-tbody').innerHTML=rows.map(r=>{
    const img=r.product.imgUrl?`<img src="${proxyImg(r.product.imgUrl)}" alt="">`:'';
    return `<tr><td>${img}</td><td>${esc(r.product.sku)}</td><td class="pv-name">${esc(r.product.name)}</td><td>${r.qty}</td><td>${r.date}</td><td>${esc(r.option)}</td></tr>`;
  }).join('') + `<tr class="pv-total"><td colspan="3">סה"כ</td><td>${totalQty}</td><td colspan="2"></td></tr>`;
  await waitForImages(document.getElementById('print-view')); // still needed: html2canvas source below
  await shareBlank(rows, now);
}

// Images are inserted into #print-view moments before html2canvas rasterizes it
// (in shareBlank) — without waiting, their network fetch (through /api/img-proxy)
// hasn't finished yet and the capture comes out with blank photo cells. Wait for
// load/error (or a timeout so one stuck image can't hang the whole share flow).
function waitForImages(container){
  const imgs=[...container.querySelectorAll('img')];
  if(!imgs.length) return Promise.resolve();
  const loaded=Promise.all(imgs.map(img=>img.complete?Promise.resolve():new Promise(res=>{img.onload=img.onerror=res;})));
  return Promise.race([loaded, new Promise(res=>setTimeout(res,4000))]);
}

function buildWaText(rows, now){
  let text=`🔄 בקשת זיכוי — ${custName} ${isolate('('+custId+')')}\n${city} | סוכן: ${agentName||agentCode} | ${now}\n\n`;
  rows.forEach(r=>{ text+=`• [${r.product.sku}] ${r.product.name} — כמות: ${r.qty} | תוקף: ${r.date} | ${r.option}\n`; });
  return text;
}

// Tries to share the styled proforma as an actual image (photo of the blank) via the
// native OS share sheet, so on Android with WhatsApp installed it lands as a picture,
// not plain text. The wa.me text-only button is ALWAYS also shown as a guaranteed
// fallback — the native share sheet's target list is OS/device-dependent (e.g. on
// desktop Windows it offers Snip & Sketch/OneNote/etc., not WhatsApp at all), and
// wa.me can't attach an image (WhatsApp's URL scheme is text-only by design), so
// neither path alone is reliable enough to hide the other.
async function shareBlank(rows, now){
  const waBtn=document.getElementById('wa-btn');
  const text=buildWaText(rows, now);
  waBtn.href='https://wa.me/?text='+encodeURIComponent(text);
  waBtn.classList.add('show');
  if (typeof html2canvas === 'function' && navigator.share && navigator.canShare) {
    try{
      const el=document.getElementById('print-view');
      const canvas=await html2canvas(el,{useCORS:true,backgroundColor:'#ffffff',scale:2});
      const blob=await new Promise(res=>canvas.toBlob(res,'image/png'));
      if(blob){
        const file=new File([blob],`zikuy-${custId}.png`,{type:'image/png'});
        if(navigator.canShare({files:[file]})){
          await navigator.share({files:[file], title:'בקשת זיכוי', text});
          showToast('נשלח לשיתוף — או פתח WhatsApp למטה (טקסט בלבד)');
          return;
        }
      }
    }catch(e){ console.warn('image share unavailable, falling back to text link', e); }
  }
  showToast('הבלנק מוכן — פתח WhatsApp לשליחה');
}

init();
</script>
</body>
</html>
