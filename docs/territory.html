<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>TERRITORY — FORMULA ROAD</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
      integrity="sha384-pmjIAcz2bAn0xukfxADbZIb3t8oRT9Sv0rvO+BR5Csr6Dhqq+nZs59P0pPKQJkEV" crossorigin="anonymous"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
      integrity="sha384-wgw+aLYNQ7dlhK47ZPK7FRACiq7ROZwgFNg0m04avm4CaXS+Z9Y7nMu8yNjBKYC+" crossorigin="anonymous"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --blue:#1565C0;--blue-dark:#0D47A1;--blue-deeper:#082D6E;
  --sky:#29B6F6;--sky-light:#E3F2FD;--sky-mid:#BBDEFB;
  --bg:#F0F5FF;--white:#fff;
  --text:#0D2137;--mid:#546E7A;--light:#90A4AE;
  --border:#BBDEFB;--green:#1B7B34;--red:#C62828;--orange:#E65100;
}
html,body{height:100%;background:var(--bg);font-family:'Segoe UI',Tahoma,Arial,sans-serif;direction:rtl;}
#app{height:100%;display:flex;flex-direction:column;overflow:hidden;}

/* HEADER */
.hdr{background:linear-gradient(135deg,var(--blue-deeper) 0%,var(--blue-dark) 60%,var(--blue) 100%);color:#fff;padding:0 14px;height:50px;flex-shrink:0;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(13,71,161,.35);}
.hdr-logo{height:32px;filter:brightness(0) invert(1);opacity:.92;flex-shrink:0;}
.hdr-title{font-size:13px;font-weight:900;letter-spacing:3px;color:#fff;white-space:nowrap;}
.sky-line{height:3px;background:linear-gradient(90deg,var(--sky),var(--blue));flex-shrink:0;}
.hdr-right{margin-right:auto;display:flex;align-items:center;gap:8px;}
.back-link{color:rgba(255,255,255,.8);font-size:12px;font-weight:700;text-decoration:none;padding:4px 10px;border:1.5px solid rgba(255,255,255,.35);border-radius:14px;white-space:nowrap;}

/* FILTER BAR */
.filter-bar{background:#fff;border-bottom:1px solid var(--sky-mid);padding:6px 10px;flex-shrink:0;display:flex;flex-direction:column;gap:5px;}
.filter-row{display:flex;align-items:center;flex-wrap:wrap;gap:6px;}
.flt-label{font-size:10px;font-weight:700;color:var(--light);letter-spacing:.8px;text-transform:uppercase;flex-shrink:0;}

/* City multi-select */
.city-wrap{position:relative;flex:1;min-width:160px;max-width:300px;}
.city-btn{width:100%;padding:6px 14px;border:1.5px solid var(--sky-mid);border-radius:20px;font-size:13px;font-weight:700;color:var(--text);background:#fff;cursor:pointer;outline:none;display:flex;align-items:center;gap:6px;}
.city-btn:hover,.city-btn.open{border-color:var(--blue);background:var(--sky-light);}
.city-btn-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right;}
.city-dropdown{position:absolute;top:calc(100% + 4px);right:0;z-index:2000;background:#fff;border:1.5px solid var(--sky-mid);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.16);min-width:200px;max-width:320px;max-height:320px;display:none;flex-direction:column;}
.city-dropdown.open{display:flex;}
.city-search{padding:8px 12px;border:none;border-bottom:1px solid var(--sky-mid);font-size:13px;width:100%;outline:none;border-radius:12px 12px 0 0;direction:rtl;}
.city-items{overflow-y:auto;flex:1;}
.city-item{display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text);user-select:none;}
.city-item:hover{background:var(--sky-light);}
.city-item input[type=checkbox]{accent-color:var(--blue);width:15px;height:15px;cursor:pointer;flex-shrink:0;}
.city-item-all{border-bottom:1px solid var(--sky-mid);font-weight:800;color:var(--blue-dark);}
.city-count-badge{background:var(--blue);color:#fff;border-radius:10px;font-size:10px;font-weight:700;padding:1px 7px;flex-shrink:0;}

/* Day buttons */
.day-btns{display:flex;gap:4px;width:100%;}
/* compact before data */
.day-btn{flex:1;min-height:44px;border-radius:10px;background:var(--sky-light);border:1.5px solid var(--sky-mid);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 3px;transition:all .15s;gap:1px;}
.day-btn:hover{background:var(--sky-mid);}
.day-btn.active{background:var(--blue);color:#fff;border-color:var(--blue-dark);}
.day-btn-label{font-size:16px;font-weight:900;color:var(--blue-dark);line-height:1;}
.day-btn.active .day-btn-label{color:#fff;}
.day-btn-agents,.day-btn-sales,.day-btn-count{font-size:9px;font-weight:700;line-height:1.2;white-space:nowrap;text-align:center;display:none;}
.day-btn-agents{color:var(--mid);}
.day-btn.active .day-btn-agents{color:rgba(255,255,255,.85);}
.day-btn-sales{color:var(--green);font-weight:800;}
.day-btn.active .day-btn-sales{color:#B3E5FC;}
.day-btn-count{color:var(--mid);opacity:.75;}
.day-btn.active .day-btn-count{color:rgba(255,255,255,.7);}
/* expanded with data */
.day-btns.has-data .day-btn{min-height:90px;border-radius:14px;border-width:2px;padding:8px 4px;gap:3px;box-shadow:0 1px 5px rgba(21,101,192,.08);}
.day-btns.has-data .day-btn:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(21,101,192,.15);}
.day-btns.has-data .day-btn.active{box-shadow:0 3px 12px rgba(21,101,192,.35);}
.day-btns.has-data .day-btn-label{font-size:24px;}
.day-btns.has-data .day-btn-agents,.day-btns.has-data .day-btn-sales,.day-btns.has-data .day-btn-count{display:block;}
.day-btn-ag-row{font-size:10px;font-weight:700;color:var(--mid);line-height:1.4;white-space:nowrap;text-align:center;display:none;}
.day-btns.has-data .day-btn-ag-row{display:block;}
.day-btn.active .day-btn-ag-row{color:rgba(255,255,255,.9);}
.day-btn-ag-sales{color:var(--green);font-weight:800;}
.day-btn.active .day-btn-ag-sales{color:#B3E5FC;}

/* Stats row */
.stats-row{background:#fff;border-bottom:1px solid var(--sky-mid);padding:4px 10px;display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap;}
.stat-chip{padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;background:var(--sky-light);color:var(--blue-dark);white-space:nowrap;}
.stats-right{margin-right:auto;display:flex;gap:6px;align-items:center;}
.export-btn{background:#1D6F42;color:#fff;border:none;border-radius:16px;padding:4px 12px;height:28px;font-size:11px;font-weight:800;cursor:pointer;}
.tab-inline{display:flex;gap:3px;}
.tab-inline-btn{width:28px;height:28px;border-radius:7px;font-size:13px;cursor:pointer;background:none;border:1.5px solid var(--sky-mid);color:var(--mid);display:flex;align-items:center;justify-content:center;transition:all .15s;}
.tab-inline-btn.active{background:var(--blue);color:#fff;border-color:var(--blue);}

/* Agent legend */
.agent-legend{display:flex;gap:4px;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;padding-bottom:1px;}
.agent-legend::-webkit-scrollbar{display:none;}
.agent-chip{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;border:2px solid transparent;white-space:nowrap;flex:0 0 auto;opacity:.45;transition:all .15s;color:#fff;}
.agent-chip.on{opacity:1;box-shadow:0 2px 8px rgba(0,0,0,.18);}
.agent-chip-count{font-size:9px;font-weight:800;margin-right:4px;opacity:.8;}

/* BODY */
#route-body{display:flex;flex:1;overflow:hidden;flex-direction:column;}
#list-pane{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 6px 18px;background:var(--bg);}
#map-pane{flex:1;display:none;min-width:0;position:relative;}
#map-pane.active{display:block;}
#map{height:100%;width:100%;}
@media(min-width:700px){
  #route-body{flex-direction:row;}
  .tab-inline{display:none;}
  #list-pane{display:block!important;flex:0 0 40%;border-left:1px solid var(--sky-mid);max-width:420px;}
  #map-pane{display:block!important;flex:1;}
}

/* SPINNER / PLACEHOLDER */
.placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:40px 20px;text-align:center;color:var(--mid);}
.placeholder-icon{font-size:48px;margin-bottom:14px;}
.placeholder-text{font-size:15px;font-weight:700;color:var(--text);margin-bottom:5px;}
.placeholder-sub{font-size:12px;}
.spinner{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:40px;color:var(--mid);}
.spin{width:32px;height:32px;border:3px solid var(--sky-mid);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

/* CLIENT CARD */
.client-card{background:#fff;border-radius:6px;padding:5px 8px;margin-bottom:1px;display:flex;align-items:center;gap:5px;box-shadow:0 1px 3px rgba(21,101,192,.06);cursor:pointer;border-right:4px solid transparent;transition:box-shadow .12s,border-color .12s;}
.client-card:hover{box-shadow:0 3px 10px rgba(21,101,192,.14);}
.client-card.no-gps{background:#FFF8F0;}
.client-card.selected{background:var(--sky-light);box-shadow:0 2px 10px rgba(21,101,192,.18);}
.c-body{flex:1;min-width:0;}
.c-name{font-size:12px;font-weight:800;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3;}
.c-sub{font-size:10px;color:var(--mid);margin-top:2px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.c-actions{display:flex;align-items:center;gap:0;flex-shrink:0;}
.c-id{font-size:8px;font-weight:700;color:#fff;background:#9e9e9e;border-radius:4px;padding:2px 5px;margin-bottom:2px;white-space:nowrap;}
.act-btn{font-size:14px;cursor:pointer;opacity:.35;transition:opacity .15s;min-width:34px;min-height:30px;display:flex;align-items:center;justify-content:center;}
.act-btn:hover{opacity:.9;}
.no-gps-badge{font-size:9px;font-weight:900;color:#fff;background:var(--red);padding:2px 6px;border-radius:6px;flex-shrink:0;cursor:pointer;}
.agent-badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700;color:#fff;margin-left:4px;}
.day-badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700;background:var(--sky-light);color:var(--blue-dark);border:1px solid var(--sky-mid);}
.changed-badge{background:#FFF3E0;border:1px solid #FFB74D;color:#E65100;font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px;margin-right:3px;}

/* AGENT POPUP */
#agent-popup{position:fixed;background:#fff;border-radius:14px;box-shadow:0 6px 28px rgba(0,0,0,.22);padding:12px;display:none;flex-direction:column;gap:4px;z-index:9999;max-height:320px;overflow-y:auto;min-width:180px;}
#agent-popup.open{display:flex;}
.agent-pop-item{padding:7px 12px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;border:none;background:none;width:100%;text-align:right;}
.agent-pop-item:hover{background:var(--sky-light);}
.agent-pop-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;}

/* DAY POPUP */
#day-popup{position:fixed;background:#fff;border-radius:14px;box-shadow:0 6px 28px rgba(0,0,0,.18);padding:10px 12px;display:none;gap:7px;z-index:9999;align-items:center;}
#day-popup.open{display:flex;}
.day-pop-btn{width:38px;height:38px;border-radius:10px;background:var(--sky-light);border:2px solid var(--sky-mid);font-size:14px;font-weight:900;color:var(--blue-dark);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.day-pop-btn:hover,.day-pop-btn.cur-day{background:var(--blue);color:#fff;border-color:var(--blue-dark);}

/* MAP */
.map-ctrl-bar{position:absolute;top:10px;left:10px;z-index:1000;display:flex;gap:5px;flex-direction:column;}
.map-tile-btn{height:26px;border-radius:10px;background:#fff;border:2px solid var(--sky-mid);color:var(--blue-dark);font-size:11px;font-weight:800;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.18);padding:0 10px;white-space:nowrap;}
.lasso-btn{height:32px;border-radius:10px;background:#fff;border:2px solid var(--sky-mid);color:var(--blue-dark);font-size:12px;font-weight:900;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.18);padding:0 12px;white-space:nowrap;display:flex;align-items:center;gap:5px;}
.lasso-btn.active{background:var(--blue);color:#fff;border-color:var(--blue-dark);}
.lasso-btn.has-selection{background:#E8F5E9;border-color:#2E7D32;color:#1B5E20;}
.lasso-clear{height:26px;border-radius:10px;background:#fff;border:2px solid #EF9A9A;color:var(--red);font-size:11px;font-weight:800;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12);padding:0 10px;white-space:nowrap;display:none;}
.lasso-clear.visible{display:block;}
.leaflet-tooltip.fr-tip{background:rgba(0,0,0,.85)!important;color:#fff!important;border:none!important;font-size:12px!important;font-weight:700!important;direction:rtl!important;padding:5px 11px!important;border-radius:6px!important;box-shadow:0 2px 8px rgba(0,0,0,.45)!important;white-space:nowrap!important;pointer-events:none!important;}
.leaflet-tooltip.fr-tip::before{display:none!important;}

@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important;}}
</style>
</head>
<body>
<div id="app">

  <div class="hdr">
    <img src="logo-diler-bmd.png" class="hdr-logo" alt="DILER BMD"/>
    <div class="hdr-title">TERRITORY</div>
    <div class="hdr-right">
      <a href="./formula-road.html" class="back-link">← ROAD</a>
    </div>
  </div>
  <div class="sky-line"></div>

  <!-- FILTERS -->
  <div class="filter-bar">
    <div class="filter-row">
      <span class="flt-label">ערים</span>
      <div class="city-wrap" id="city-wrap">
        <button class="city-btn" id="city-btn" onclick="toggleCityDropdown(event)">
          <span class="city-btn-text" id="city-btn-text">-- בחר ערים --</span>
          <span class="city-count-badge" id="city-count-badge" style="display:none">0</span>
          <span style="color:var(--light);font-size:11px">▾</span>
        </button>
        <div class="city-dropdown" id="city-dropdown">
          <input class="city-search" id="city-search" placeholder="חפש עיר..." oninput="filterCityList()" onclick="event.stopPropagation()"/>
          <div class="city-items" id="city-items"></div>
        </div>
      </div>
      <span class="flt-label">יום</span>
      <div class="day-btns" id="day-btns-wrap">
        <button class="day-btn active" onclick="selectDay(null)">
          <span class="day-btn-label">כל</span>
        </button>
        <button class="day-btn" onclick="selectDay(1)"><span class="day-btn-label">א</span></button>
        <button class="day-btn" onclick="selectDay(2)"><span class="day-btn-label">ב</span></button>
        <button class="day-btn" onclick="selectDay(3)"><span class="day-btn-label">ג</span></button>
        <button class="day-btn" onclick="selectDay(4)"><span class="day-btn-label">ד</span></button>
        <button class="day-btn" onclick="selectDay(5)"><span class="day-btn-label">ה</span></button>
      </div>
    </div>
    <div class="filter-row">
      <div class="agent-legend" id="agent-legend"></div>
    </div>
  </div>

  <!-- STATS BAR -->
  <div class="stats-row" id="stats-row" style="display:none;">
    <span class="stat-chip" id="stat-total"></span>
    <span class="stat-chip" id="stat-avg" style="display:none;background:#E8F5E9;color:#1B5E20;"></span>
    <span class="stat-chip" id="stat-lasso" style="display:none;background:#FFF3E0;color:#E65100;"></span>
    <span class="stat-chip" id="stat-nogps" style="display:none;"></span>
    <span class="stat-chip" id="stat-changed" style="display:none;"></span>
    <div class="stats-right">
      <button class="export-btn" onclick="exportXLSX()">📥 Excel</button>
      <div class="tab-inline">
        <button class="tab-inline-btn active" id="tab-list" onclick="setTab('list')">📋</button>
        <button class="tab-inline-btn" id="tab-map" onclick="setTab('map')">🗺</button>
      </div>
    </div>
  </div>

  <!-- BODY -->
  <div id="route-body">
    <div id="list-pane">
      <div id="client-list">
        <div class="placeholder">
          <div class="placeholder-icon">🗺</div>
          <div class="placeholder-text">בחר עיר להתחיל</div>
          <div class="placeholder-sub">תראה את כל הלקוחות של כל הסוכנים על המפה</div>
        </div>
      </div>
    </div>
    <div id="map-pane">
      <div id="map"></div>
      <div class="map-ctrl-bar">
        <button class="map-tile-btn" id="tile-btn" onclick="cycleTile()">🏠 בתים</button>
        <button class="lasso-btn" id="lasso-btn" onclick="toggleLasso()" title="לאסו — בחר אזור">🎯 לאסו</button>
        <button class="lasso-clear" id="lasso-clear" onclick="clearLasso()">✕ נקה בחירה</button>
      </div>
    </div>
  </div>

</div>

<!-- AGENT POPUP -->
<div id="agent-popup"></div>

<!-- DAY POPUP -->
<div id="day-popup"></div>

<!-- GPS FIX MODAL -->
<div class="modal-bg" id="gps-modal" onclick="if(event.target===this)closeGpsModal()" style="position:fixed;inset:0;z-index:10001;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.5);padding:16px;">
  <div style="background:#fff;border-radius:16px;width:100%;max-width:400px;padding:18px;display:flex;flex-direction:column;gap:10px;">
    <div style="font-size:15px;font-weight:800;color:var(--text)" id="gps-modal-title">תיקון מיקום</div>
    <input id="gps-addr-input" class="city-search" style="border-radius:8px;border:1.5px solid var(--sky-mid);padding:8px 12px;" placeholder="הכנס כתובת..." type="text"/>
    <div id="gps-modal-status" style="font-size:12px;color:var(--mid);min-height:16px;"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button onclick="submitGpsAddress()" style="flex:1;background:var(--blue);color:#fff;border:none;border-radius:10px;padding:10px;font-weight:800;font-size:13px;cursor:pointer;">🔍 גיאוקוד</button>
      <button onclick="closeGpsModal()" style="background:none;border:1.5px solid var(--sky-mid);border-radius:10px;padding:10px 16px;font-weight:700;font-size:13px;cursor:pointer;color:var(--mid);">ביטול</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<script src="https://unpkg.com/leaflet-lasso@2.0.4/dist/leaflet-lasso.umd.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"
        integrity="sha384-eXVCORTRlv4FUUgS/xmOyr66XBVraen8ATNLMESp92FKXLAMiKkerixTiBvXriZr" crossorigin="anonymous"></script>

<script>
const API = 'https://api.sverdlik-apps.site';
const TOKEN_KEY = 'frToken';
let gpsCorrections = {}; // custId → {lat,lng} — from gps-corrections.json + localStorage
let gpsCorrectMode = false, gpsCorrectId = null;

async function loadCorrections(){
  try{
    const r=await fetch('./gps-corrections.json?_='+Date.now());
    if(r.ok){
      gpsCorrections=await r.json();
      const local=JSON.parse(localStorage.getItem('fr_gps_local')||'{}');
      Object.assign(gpsCorrections,local);
    }
  }catch(_){
    try{
      const local=JSON.parse(localStorage.getItem('fr_gps_local')||'{}');
      gpsCorrections=local;
    }catch(__) {}
  }
}
const DAY_LBL = {1:'א',2:'ב',3:'ג',4:'ד',5:'ה'};
const esc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

// Agent colors — deterministic from agentCode
const PALETTE = ['#1565C0','#C62828','#2E7D32','#E65100','#6A1B9A','#00695C','#AD1457','#F57F17','#1A237E','#4E342E','#006064','#33691E','#37474F','#BF360C','#880E4F','#0277BD'];
function agentColor(code){
  if(!code) return '#9E9E9E';
  let h=0; for(const ch of String(code)) h=(h*31+ch.charCodeAt(0))&0x7FFFFFFF;
  return PALETTE[h%PALETTE.length];
}

// ── AUTH ──────────────────────────────────────────────────────────────────
function getToken(){ return localStorage.getItem(TOKEN_KEY)||''; }

async function apiFetch(url, opts={}){
  const hdrs={...opts.headers||{}};
  const tok=getToken(); if(tok) hdrs['x-session']=tok;
  const ctrl=new AbortController(), tid=setTimeout(()=>ctrl.abort(),15000);
  let r;
  try{ r=await fetch(url,{...opts,headers:hdrs,signal:ctrl.signal}); }
  finally{ clearTimeout(tid); }
  if(r.status===401){
    try{
      const p=await fetch(API+'/auth/pbi',{credentials:'include'});
      if(p.ok){const j=await p.json();if(j.ok&&j.token){localStorage.setItem(TOKEN_KEY,j.token);hdrs['x-session']=j.token;return fetch(url,{...opts,headers:hdrs});}}
    }catch(_){}
    location.href='./formula-road.html'; throw new Error('session_expired');
  }
  return r;
}

const st={

let allCities=[], selectedCities=new Set();

async function loadCities(){

    const data=await r.json();

function renderCityItems(cities){

  el.innerHTML=`<label class="city-item city-item-all">

  </label>`+

}

function filterCityList(){
  const q=(document.getElementById('city-search').value||'').trim().toLowerCase();
  const filtered=q?allCities.filter(c=>c.toLowerCase().includes(q)):allCities;

}

function toggleCityDropdown(event){
  event.stopPropagation();
  const dd=document.getElementById('city-dropdown');
  const btn=document.getElementById('city-btn');
  const open=dd.classList.toggle('open');
  btn.classList.toggle('open',open);
  if(open) setTimeout(()=>document.getElementById('city-search')?.focus(),60);

function toggleAllCities(checked){
  if(checked) allCities.forEach(c=>selectedCities.add(c));
  else selectedCities.clear();
  renderCityItems(allCities);
  updateCityBtn();
  onCitiesChanged();
}

function toggleCity(city, checked){
  if(checked) selectedCities.add(city); else selectedCities.delete(city);

  const allChk=document.getElementById('city-all-chk');
  if(allChk) allChk.checked=allCities.every(c=>selectedCities.has(c));

}

function updateCityBtn(){
  const n=selectedCities.size;
  const badge=document.getElementById('city-count-badge');
  const txt=document.getElementById('city-btn-text');
  if(n===0){ txt.textContent='-- בחר ערים --'; badge.style.display='none'; }

  else{ txt.textContent=`${n} ערים`; badge.textContent=n; badge.style.display=''; }

function onCitiesChanged(){

let _loadId=0;
async function loadClients(cities){
  const myId=++_loadId;
  document.getElementById('stats-row').style.display='none';
  document.getElementById('client-list').innerHTML='<div class="spinner"><div class="spin"></div><span>טוען לקוחות...</span></div>';
  document.getElementById('agent-legend').innerHTML='';
  const cityArr=Array.isArray(cities)?cities:[cities];
  try{
    const param=cityArr.map(c=>encodeURIComponent(c)).join(',');
    const r=await apiFetch(`${API}/territory-clients?cities=${param}`);
    if(!r.ok) throw new Error(r.status);
    const data=await r.json();
    if(myId!==_loadId) return;
    // Filter out "כללי" (catch-all unassigned, not route agents)
    st.allClients=(Array.isArray(data)?data:[]).filter(c=>!String(c.agentName||'').includes('כללי'));
  }catch(e){
    if(myId!==_loadId) return;
    document.getElementById('client-list').innerHTML=`<div class="placeholder"><div class="placeholder-icon">❌</div><div class="placeholder-text">שגיאה</div><div class="placeholder-sub">${esc(String(e))}</div></div>`;
    return;
  }

  // Apply GPS corrections: gps-corrections.json (server-synced) + localStorage
  try{
    st.allClients=st.allClients.map(c=>{
      const id=String(c.custId);
      const corr=gpsCorrections[id];
      return corr?{...c,lat:corr.lat,lng:corr.lng}:c;
    });
  }catch(_){}

  // Build agent list
  const agMap=new Map();
  st.allClients.forEach(c=>{
    if(c.agentCode&&!agMap.has(c.agentCode))
      agMap.set(c.agentCode,{agentCode:c.agentCode,agentName:c.agentName||c.agentCode,color:agentColor(c.agentCode)});
  });
  st.agents=[...agMap.values()].sort((a,b)=>(a.agentName||'').localeCompare(b.agentName||''));
  st.activeAgents=new Set(st.agents.map(a=>a.agentCode));

  renderAgentLegend();
  renderAll();
  document.getElementById('stats-row').style.display='';
}

function renderDayBtns(){
  const fmt=n=>n>=1000?`₪${(n/1000).toFixed(1)}K`:`₪${n}`;
  const baseCl=st.allClients.filter(c=>{
    const ov=st.overrides[String(c.custId)]||{};
    return st.activeAgents.has(ov.agentCode||c.agentCode);
  });

  // per-day per-agent stats: byDay[dayNum][agentCode] = {name, count, salesSum, salesCount}
  const byDay={};
  [1,2,3,4,5].forEach(d=>{ byDay[d]={}; });
  baseCl.forEach(c=>{
    const ov=st.overrides[String(c.custId)]||{};
    const dayNum=ov.dayNum!==undefined?ov.dayNum:c.dayNum;
    const agentCode=ov.agentCode||c.agentCode;
    if(!dayNum||!byDay[dayNum]) return;
    if(!byDay[dayNum][agentCode]){
      const ag=st.agents.find(a=>a.agentCode===agentCode);
      byDay[dayNum][agentCode]={name:(ag?.agentName||agentCode).split(/[\s\-]/)[0].slice(0,6),count:0,salesSum:0,salesCount:0};
    }
    byDay[dayNum][agentCode].count++;
    if(c.monthlySales>0){byDay[dayNum][agentCode].salesSum+=c.monthlySales;byDay[dayNum][agentCode].salesCount++;}
  });

  // "כל" per-agent totals
  const totalByAgent={};
  baseCl.forEach(c=>{
    const ov=st.overrides[String(c.custId)]||{};
    const agentCode=ov.agentCode||c.agentCode;
    if(!totalByAgent[agentCode]){
      const ag=st.agents.find(a=>a.agentCode===agentCode);
      totalByAgent[agentCode]={name:(ag?.agentName||agentCode).split(/[\s\-]/)[0].slice(0,6),count:0,salesSum:0,salesCount:0};
    }
    totalByAgent[agentCode].count++;
    if(c.monthlySales>0){totalByAgent[agentCode].salesSum+=c.monthlySales;totalByAgent[agentCode].salesCount++;}
  });

  function agRows(agMap){
    return Object.values(agMap).map(ag=>{
      const avg=ag.salesCount>0?Math.round(ag.salesSum/ag.salesCount):0;
      const s=avg?`<span class="day-btn-ag-sales">${fmt(avg)}</span> `:'';
      return `<div class="day-btn-ag-row">${ag.name} ${s}${ag.count}לק'</div>`;
    }).join('');
  }

  const wrap=document.getElementById('day-btns-wrap');
  if(!wrap) return;
  wrap.classList.toggle('has-data', baseCl.length>0);
  const dayKeys=[null,1,2,3,4,5];
  const btnEls=wrap.querySelectorAll('.day-btn');
  btnEls.forEach((btn,i)=>{
    const d=dayKeys[i];
    btn.classList.toggle('active',d===null?st.activeDays.size===5:st.activeDays.has(d));
    if(d===null){
      btn.innerHTML=`<span class="day-btn-label">כל</span>${agRows(totalByAgent)}`;
    } else {
      const rows=agRows(byDay[d]);
      btn.innerHTML=`<span class="day-btn-label">${DAY_LBL[d]}</span>${rows||'<span class="day-btn-count" style="display:block">—</span>'}`;
    }
  });
}

function selectDay(d){
  if(d===null){
    // "כל" — toggle: if all selected → deselect all; if any deselected → select all
    if(st.activeDays.size===5) st.activeDays=new Set(); else st.activeDays=new Set([1,2,3,4,5]);
  } else {
    if(st.activeDays.has(d)) st.activeDays.delete(d); else st.activeDays.add(d);
  }
  renderDayBtns();
  renderAll();
}

// ── DISPLAY LIST ──────────────────────────────────────────────────────────
function displayClients(){
  return st.allClients.filter(c=>{
    // apply overrides for display
    const ov=st.overrides[String(c.custId)]||{};
    const agentCode=ov.agentCode||c.agentCode;
    const dayNum=ov.dayNum!==undefined?ov.dayNum:c.dayNum;
    if(!st.activeAgents.has(agentCode)) return false;
    if(st.activeDays.size<5 && dayNum && !st.activeDays.has(dayNum)) return false;
    if(st.lassoIds!==null && !st.lassoIds.has(String(c.custId))) return false;
    return true;
  }).map(c=>{
    const ov=st.overrides[String(c.custId)]||{};
    return {
      ...c,
      agentCode: ov.agentCode||c.agentCode,
      agentName: ov.agentCode ? (st.agents.find(a=>a.agentCode===ov.agentCode)?.agentName||ov.agentCode) : c.agentName,
      dayNum:    ov.dayNum!==undefined?ov.dayNum:c.dayNum,
      _changed:  !!(ov.agentCode||ov.dayNum!==undefined),
    };
  });
}

function renderAll(){
  renderDayBtns();
  renderClientList();
  updateStats();
  if(window.innerWidth>=700||st.tab==='map') renderMap();
}

function updateStats(){
  const list=displayClients();
  const noGps=list.filter(c=>!c.lat||!c.lng).length;
  const changed=Object.keys(st.overrides).length;
  const withSales=list.filter(c=>c.monthlySales>0);
  const avgSales=withSales.length?Math.round(withSales.reduce((s,c)=>s+c.monthlySales,0)/withSales.length):0;
  document.getElementById('stat-total').textContent=`${list.length} לקוחות`;
  const avgEl=document.getElementById('stat-avg');
  avgEl.textContent=avgSales>0?`ממוצע ₪${avgSales.toLocaleString()}`:''; avgEl.style.display=avgSales>0?'':'none';
  const lassoEl=document.getElementById('stat-lasso');
  if(st.lassoIds!==null){ lassoEl.textContent=`🎯 ${list.length} נבחרו`; lassoEl.style.display=''; }else{ lassoEl.style.display='none'; }
  const ngEl=document.getElementById('stat-nogps');
  ngEl.textContent=noGps?`${noGps} ללא GPS`:''; ngEl.style.display=noGps?'':'none';
  const chEl=document.getElementById('stat-changed');
  chEl.textContent=changed?`✏️ ${changed} שינויים`:''; chEl.style.display=changed?'':'none';
}

function toggleAgent(code){

}

// ── CARD RENDER ───────────────────────────────────────────────────────────
function renderClientList(){
  const el=document.getElementById('client-list');

  if(!list.length){
    el.innerHTML='<div class="placeholder"><div class="placeholder-icon">📭</div><div class="placeholder-text">אין לקוחות</div><div class="placeholder-sub">נסה לשנות את הסינון</div></div>';
    return;
  }
  el.innerHTML=list.map((c,i)=>{
    const color=agentColor(c.agentCode);
    const noGps=!c.lat||!c.lng;
    const isSel=st.selectedId===c.custId;
    const dayBadge=c.dayNum?`<span class="day-badge">${DAY_LBL[c.dayNum]||'?'}</span>`:'';

    const changedMark=c._changed?`<span class="changed-badge">✏️</span>`:'';

            :`<span class="act-btn" onclick="openAddrModal(event,'${c.custId}','${esc(c.custName||'')}','${esc(c.city||'')}','${esc(c.address||'')}')" title="תיקון מיקום">📍</span>`}
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── MAP ────────────────────────────────────────────────────────────────────
let map=null,mapMarkers=[],mapPolylines=[],markerCluster=null;
let baseTileLayer=null,currentTileKey='osm';
const TILE_DEFS={
  osm:      {icon:'🏠',label:'בתים',    url:'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',         opts:{attribution:'© OSM',subdomains:'abc',maxZoom:19}},
  light:    {icon:'☁', label:'בהיר',    url:'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png', opts:{attribution:'© CartoDB',subdomains:'abcd',maxZoom:19}},
  satellite:{icon:'🛰',label:'לוויין',  url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',opts:{attribution:'© Esri',maxZoom:19}},
};
const TILE_ORDER=['osm','light','satellite'];
function setTile(key){
  if(!map) return;
  if(baseTileLayer) map.removeLayer(baseTileLayer);
  const d=TILE_DEFS[key]; baseTileLayer=L.tileLayer(d.url,d.opts).addTo(map); currentTileKey=key;
  const btn=document.getElementById('tile-btn'); if(btn) btn.innerHTML=d.icon+' '+d.label;
}
function cycleTile(){ setTile(TILE_ORDER[(TILE_ORDER.indexOf(currentTileKey)+1)%TILE_ORDER.length]); }

function renderMap(){
  if(!map){
    map=L.map('map',{zoomControl:false}).setView([32.0,34.9],10);
    L.control.zoom({position:'bottomright'}).addTo(map);
    setTile('osm');
    initLasso();
    map.on('click', async(e)=>{
      if(!gpsCorrectMode||!gpsCorrectId) return;
      map.getContainer().style.cursor='';
      const {lat,lng}=e.latlng;
      const IL={minLat:29.3,maxLat:33.5,minLng:34.2,maxLng:35.9};
      if(lat<IL.minLat||lat>IL.maxLat||lng<IL.minLng||lng>IL.maxLng){
        showToast('❌ מחוץ לגבולות ישראל'); gpsCorrectMode=false; gpsCorrectId=null; renderMap(); return;
      }
      const la=+lat.toFixed(6), lo=+lng.toFixed(6);
      const id=String(gpsCorrectId);
      gpsCorrections[id]={lat:la,lng:lo};
      try{const loc=JSON.parse(localStorage.getItem('fr_gps_local')||'{}');loc[id]={lat:la,lng:lo};localStorage.setItem('fr_gps_local',JSON.stringify(loc));}catch(_){}
      st.allClients=st.allClients.map(c=>String(c.custId)===id?{...c,lat:la,lng:lo,gpsSource:'correction'}:c);
      gpsCorrectMode=false; gpsCorrectId=null;
      renderAll();
      showToast('✅ מיקום נשמר');
    });
  }
  mapMarkers.forEach(m=>m.remove()); mapMarkers=[];
  mapPolylines.forEach(p=>p.remove()); mapPolylines=[];
  if(markerCluster){markerCluster.clearLayers();map.removeLayer(markerCluster);}
  markerCluster=L.markerClusterGroup({
    maxClusterRadius:40,disableClusteringAtZoom:17,
    iconCreateFunction(cluster){
      const marks=cluster.getAllChildMarkers();
      // Group by agent color inside cluster
      const colorMap={};
      marks.forEach(m=>{const c=m._agColor||'#999';colorMap[c]=(colorMap[c]||0)+1;});
      const colors=Object.keys(colorMap);
      const sz=38;
      const gradStop=colors.length===1?colors[0]:`conic-gradient(${colors.map((c,i)=>`${c} ${i/colors.length*360}deg ${(i+1)/colors.length*360}deg`).join(',')})`;
      return L.divIcon({className:'',html:`<div style="background:${gradStop};color:#fff;width:${sz}px;height:${sz}px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2.5px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.35);font-size:12px;font-weight:900">${marks.length}</div>`,iconSize:[sz,sz],iconAnchor:[sz/2,sz/2]});
    }
  });

  const list=displayClients().filter(c=>c.lat&&c.lng);
  const bounds=[];

  list.forEach(c=>{
    const color=agentColor(c.agentCode);
    const isSel=st.selectedId===c.custId;
    const sz=isSel?34:26;
    const icon=L.divIcon({className:'',html:`<div style="background:${color};color:#fff;width:${sz}px;height:${sz}px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:${isSel?12:10}px;font-weight:900;border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4)">${DAY_LBL[c.dayNum]||'?'}</div>`,iconSize:[sz,sz],iconAnchor:[sz/2,sz/2]});
    const m=L.marker([c.lat,c.lng],{icon,zIndexOffset:isSel?1000:0});
    m._agColor=color; m._custId=String(c.custId);
    const safeName=esc(c.custName||'');
    m.bindTooltip(`${esc(c.custName||'')} · ${esc(c.agentName||'')}`,{permanent:false,direction:'right',opacity:1,className:'fr-tip'});
    m.bindPopup(`<b>${safeName}</b><br><span style="color:${color};font-weight:700">${esc(c.agentName||c.agentCode||'')}</span><br>יום: ${DAY_LBL[c.dayNum]||'?'}${c.address?'<br>'+esc(c.address):''}`);
    if(isSel){m.addTo(map);m.openPopup();}else{markerCluster.addLayer(m);}
    mapMarkers.push(m);
    bounds.push([c.lat,c.lng]);
  });

  map.addLayer(markerCluster);
  if(bounds.length) map.fitBounds(bounds,{padding:[10,10]});
  setTimeout(()=>map.invalidateSize(),100);
}

// ── LASSO ─────────────────────────────────────────────────────────────────
let lassoControl=null, _lassoActive=false;

function initLasso(){
  if(!map||lassoControl) return;
  lassoControl=L.control.lasso({intersect:true}).addTo(map);
  map.on('lasso.finished', e=>{
    _lassoActive=false;
    updateLassoBtn(false);
    if(!e.layers||!e.layers.length){ clearLasso(); return; }
    const ids=new Set();
    e.layers.forEach(layer=>{
      if(layer._custId) ids.add(layer._custId);
    });
    st.lassoIds=ids;
    document.getElementById('lasso-clear').classList.add('visible');
    document.getElementById('lasso-btn').classList.remove('active');
    document.getElementById('lasso-btn').classList.add('has-selection');
    renderAll();
    // scroll list to top
    const lp=document.getElementById('list-pane'); if(lp) lp.scrollTop=0;
  });
  map.on('lasso.enabled', ()=>{ _lassoActive=true; updateLassoBtn(true); });
  map.on('lasso.disabled', ()=>{ _lassoActive=false; if(!st.lassoIds) updateLassoBtn(false); });
}

function toggleLasso(){
  if(!map) return;
  if(!lassoControl) initLasso();
  if(_lassoActive){ lassoControl.disable(); }
  else{ if(st.lassoIds){ clearLasso(); }else{ lassoControl.enable(); } }
}

function clearLasso(){
  st.lassoIds=null;
  _lassoActive=false;
  if(lassoControl) lassoControl.disable();
  updateLassoBtn(false);
  document.getElementById('lasso-btn').classList.remove('active','has-selection');
  document.getElementById('lasso-clear').classList.remove('visible');
  renderAll();
}

function updateLassoBtn(active){
  const btn=document.getElementById('lasso-btn');
  if(!btn) return;
  btn.classList.toggle('active',active);
}

// ── EXPORT ────────────────────────────────────────────────────────────────
async function exportXLSX(){
  const list=displayClients();
  if(!list.length) return;
  const btn=document.querySelector('.export-btn');
  const orig=btn.innerHTML; btn.innerHTML='⏳...'; btn.disabled=true;
  try{
    const rows=list.map((c,i)=>({
      currentPos:i+1, custId:c.custId||'', custName:c.custName||'',
      city:c.city||'', address:c.address||'',
      agentCode:c.agentCode||'', agentName:c.agentName||'',
      dayLabel:DAY_LBL[c.dayNum]||'', lat:c.lat||null, lng:c.lng||null,
      changed:c._changed?'✏️':'',
    }));
    const r=await apiFetch(`${API}/api/export-route-xlsx`,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({rows, agentName:[...selectedCities].join(', ')||'', dayLabel:'כל הימים'}),
    });
    if(!r.ok) throw new Error(r.status);
    const blob=await r.blob();
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url;
    const cityStr=[...selectedCities].slice(0,2).join('_')||'territory';
    a.download=`territory_${cityStr}_${new Date().toISOString().slice(0,10)}.xlsx`;
    a.click(); setTimeout(()=>URL.revokeObjectURL(url),5000);
  }catch(e){ alert('שגיאה: '+e.message); }
  finally{ btn.innerHTML=orig; btn.disabled=false; }
}

// ── GPS FIX ───────────────────────────────────────────────────────────────
let _gpsCustId=null, _gpsCity='';

function openGpsFix(event, custId, custName, city, address){
  event.stopPropagation();
  // Switch to map tab + map-click correction mode (same as formula-road)
  if(st.tab!=='map') switchTab('map');
  gpsCorrectMode=true; gpsCorrectId=custId; st.selectedId=custId;
  renderMap();
  if(map) map.getContainer().style.cursor='crosshair';
  showToast('👆 הקש על המפה למיקום '+custName, 6000);
}

function openAddrModal(event, custId, custName, city, address){
  // "📍" button on clients WITH GPS → open address-search modal for manual override
  event.stopPropagation();
  _gpsCustId=custId; _gpsCity=city;
  document.getElementById('gps-modal-title').textContent=custName||'תיקון מיקום';
  document.getElementById('gps-addr-input').value=address||'';
  document.getElementById('gps-modal-status').textContent='';
  document.getElementById('gps-modal').style.display='flex';
  setTimeout(()=>document.getElementById('gps-addr-input').focus(),80);
}

function closeGpsModal(){
  document.getElementById('gps-modal').style.display='none';
  _gpsCustId=null;
}

async function submitGpsAddress(){
  const addr=document.getElementById('gps-addr-input').value.trim();
  const status=document.getElementById('gps-modal-status');
  if(!addr){ status.textContent='הכנס כתובת'; return; }
  status.textContent='⏳ מחפש...';
  try{
    const r=await apiFetch(`${API}/geocode?address=${encodeURIComponent(addr)}&city=${encodeURIComponent(_gpsCity||'')}`);
    const d=await r.json();
    if(d&&d.lat){
      const id=String(_gpsCustId);
      gpsCorrections[id]={lat:d.lat,lng:d.lng};
      try{const loc=JSON.parse(localStorage.getItem('fr_gps_local')||'{}');loc[id]={lat:d.lat,lng:d.lng};localStorage.setItem('fr_gps_local',JSON.stringify(loc));}catch(_){}
      st.allClients=st.allClients.map(c=>String(c.custId)===id?{...c,lat:d.lat,lng:d.lng,address:addr}:c);
      status.textContent=`✅ ${d.lat.toFixed(5)}, ${d.lng.toFixed(5)}`;
      setTimeout(()=>{ closeGpsModal(); renderAll(); },800);
    } else {
      status.textContent='❌ לא נמצא — נסה כתובת אחרת';
    }
  }catch(e){ status.textContent='❌ שגיאה: '+e.message; }
}

// ── TOAST ─────────────────────────────────────────────────────────────────
function showToast(msg,ms=2500){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';t.style='position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#1565C0;color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;font-weight:700;z-index:9999;pointer-events:none;transition:opacity .3s';document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity='1';clearTimeout(t._to);t._to=setTimeout(()=>t.style.opacity='0',ms);
}

// ── INIT ──────────────────────────────────────────────────────────────────
async function init(){
  loadOverrides();
  if(!getToken()){
    try{const r=await fetch(API+'/auth/pbi',{credentials:'include'});if(r.ok){const j=await r.json();if(j.ok&&j.token)localStorage.setItem(TOKEN_KEY,j.token);}}catch(_){}
    if(!getToken()){location.href='./formula-road.html';return;}
  }
  await Promise.all([loadCities(), loadCorrections()]);
}
init();
