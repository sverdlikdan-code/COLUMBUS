<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>TERRITORY — FORMULA ROAD</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
      integrity="sha384-pmjIAcz2bAn0xukfxADbZIb3t8oRT9Sv0rvO+BR5Csr6Dhqq+nZs59P0pPKQJkEV" crossorigin="anonymous"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
      integrity="sha384-wgw+aLYNQ7dlhK47ZPK7FRACiq7ROZwgFNg0m04avm4CaXS+Z9Y7nMu8yNjBKYC+" crossorigin="anonymous"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --blue:#1565C0;--blue-dark:#0D47A1;--blue-deeper:#082D6E;
  --sky:#29B6F6;--sky-light:#E3F2FD;--sky-mid:#BBDEFB;
  --bg:#F0F5FF;--white:#fff;
  --text:#0D2137;--mid:#546E7A;--light:#90A4AE;
  --border:#BBDEFB;--green:#1B7B34;--red:#C62828;--orange:#E65100;
}
html,body{height:100%;background:var(--bg);font-family:'Segoe UI',Tahoma,Arial,sans-serif;direction:rtl;}
#app{height:100%;display:flex;flex-direction:column;overflow:hidden;}

/* HEADER */
.hdr{background:linear-gradient(135deg,var(--blue-deeper) 0%,var(--blue-dark) 60%,var(--blue) 100%);color:#fff;padding:0 14px;height:50px;flex-shrink:0;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(13,71,161,.35);}
.hdr-logo{height:32px;filter:brightness(0) invert(1);opacity:.92;flex-shrink:0;}
.hdr-title{font-size:13px;font-weight:900;letter-spacing:3px;color:#fff;white-space:nowrap;}
.sky-line{height:3px;background:linear-gradient(90deg,var(--sky),var(--blue));flex-shrink:0;}
.hdr-right{margin-right:auto;display:flex;align-items:center;gap:8px;}
.back-link{color:rgba(255,255,255,.8);font-size:12px;font-weight:700;text-decoration:none;padding:4px 10px;border:1.5px solid rgba(255,255,255,.35);border-radius:14px;white-space:nowrap;}

/* FILTER BAR */
.filter-bar{background:#fff;border-bottom:1px solid var(--sky-mid);padding:4px 8px;flex-shrink:0;display:flex;flex-direction:column;gap:3px;}
.filter-row{display:flex;align-items:center;flex-wrap:wrap;gap:5px;}
.flt-label{font-size:10px;font-weight:800;color:var(--mid);letter-spacing:.8px;text-transform:uppercase;flex-shrink:0;}

/* City multi-select */
.city-wrap{position:relative;flex:1;min-width:160px;max-width:300px;}
.city-btn{width:100%;padding:6px 14px;border:2px solid #90CAF9;border-radius:20px;font-size:12px;font-weight:700;color:var(--blue-dark);background:var(--sky-light);cursor:pointer;outline:none;display:flex;align-items:center;gap:6px;}
.city-btn:hover,.city-btn.open{border-color:var(--blue);background:#BBDEFB;}
.city-btn-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right;}
.city-dropdown{position:absolute;top:calc(100% + 4px);right:0;z-index:2000;background:#fff;border:1.5px solid var(--sky-mid);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.16);min-width:200px;max-width:320px;max-height:320px;display:none;flex-direction:column;}
.city-dropdown.open{display:flex;}
.city-search{padding:8px 12px;border:none;border-bottom:1px solid var(--sky-mid);font-size:13px;width:100%;outline:none;border-radius:12px 12px 0 0;direction:rtl;}
.city-items{overflow-y:auto;flex:1;}
.city-item{display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text);user-select:none;}
.city-item:hover{background:var(--sky-light);}
.city-item input[type=checkbox]{accent-color:var(--blue);width:15px;height:15px;cursor:pointer;flex-shrink:0;}
.city-item-all{border-bottom:1px solid var(--sky-mid);font-weight:800;color:var(--blue-dark);}
.city-count-badge{background:var(--blue);color:#fff;border-radius:10px;font-size:10px;font-weight:700;padding:1px 7px;flex-shrink:0;}

/* Day cards */
.day-btns{display:flex;gap:5px;width:100%;}
.day-btn{
  flex:1;border-radius:12px;background:#fff;
  border:1.5px solid #DDEAFF;cursor:pointer;
  display:flex;flex-direction:column;align-items:stretch;
  padding:6px 6px 5px;transition:box-shadow .18s,border-color .18s,background .18s;gap:0;
  box-shadow:0 1px 3px rgba(21,101,192,.06);min-height:32px;
}
.day-btn:hover{border-color:#90B4E8;box-shadow:0 2px 10px rgba(21,101,192,.13);}
.day-btn.active{
  background:#EEF3FF;border-color:#1565C0;
  box-shadow:0 0 0 2px #1565C0,0 4px 18px rgba(21,101,192,.18);
}
.day-btn-undef{border-color:#E0E0E0;}
.day-btn-undef .day-btn-label{color:#9E9E9E;}
.day-btn-undef.active{background:#F5F5F5;border-color:#616161;box-shadow:0 0 0 2px #616161,0 4px 12px rgba(0,0,0,.12);}
.day-btn-label{font-size:22px;font-weight:900;color:#1565C0;text-align:center;line-height:1.1;padding-bottom:2px;}
.day-btn.active .day-btn-label{color:#0D47A1;}
/* inner mini-table */
.day-card-body{display:none;flex-direction:column;gap:0;width:100%;}
.day-btns.has-data .day-btn-label{font-size:15px;font-weight:900;padding-bottom:2px;}
/* only expand cards that have actual data */
.day-btns.has-data .day-btn.has-card-data{height:104px;}
.day-btns.has-data .day-btn.has-card-data .day-card-body{display:flex;overflow:hidden;}
/* כל button in default all-days mode — neutral, no ring */
.day-btn.day-all-mode{border-color:#90B4E8;background:#F5F8FF;}
.day-btn.day-all-mode .day-btn-label{color:#1565C0;}
/* per-agent mini-table rows */
.dc-ag-tbl{display:table;width:100%;border-collapse:collapse;}
.dc-ag-row{display:table-row;}
.dc-ag-name{display:table-cell;font-size:9.5px;font-weight:700;color:#78909C;padding:0;white-space:nowrap;overflow:hidden;max-width:52px;text-overflow:ellipsis;text-align:right;}
.day-btn.active .dc-ag-name{color:#5474A8;}
.dc-ag-cnt{display:table-cell;font-size:10px;font-weight:900;color:#1A2A4A;padding:0 3px;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap;}
.day-btn.active .dc-ag-cnt{color:#0D47A1;}
.dc-ag-sales{display:table-cell;font-size:9.5px;font-weight:700;color:#1B7B34;padding:0;text-align:left;font-variant-numeric:tabular-nums;white-space:nowrap;}
.day-btn.active .dc-ag-sales{color:#1B5E20;}
.dc-ag-pct{display:table-cell;font-size:8.5px;font-weight:600;color:#B0BEC5;padding:0 2px;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap;}
.day-btn.active .dc-ag-pct{color:#90A4C8;}
.dc-ag-pct-g{font-size:8.5px;opacity:.75;}
.dc-pct-grand{font-size:10px;font-weight:700;color:#78909C;}
.day-btn.active .dc-pct-grand{color:#5474A8;}
/* totals row */
.dc-total-row{border-bottom:1px solid #DDEAFF;padding-bottom:2px;margin-bottom:2px;}
.day-btn.active .dc-total-row{border-color:#B8CCEE;}
.dc-total-row .dc-ag-name{font-weight:900;color:#263238;font-size:8.5px;}
.dc-total-row .dc-ag-cnt{font-size:13px;font-weight:900;color:#1A2A4A;}
.dc-total-row .dc-ag-pct{font-weight:800;font-size:10px;color:#546E7A;}
.dc-total-row .dc-ag-sales{font-weight:800;}
.day-btn.active .dc-total-row .dc-ag-name{color:#0D47A1;}
.day-btn.active .dc-total-row .dc-ag-cnt{color:#0D2F7A;font-size:14px;}
.day-btn.active .dc-total-row .dc-ag-pct{color:#3D5A9E;}
.day-btn.active .dc-total-row .dc-ag-sales{color:#1B5E20;}

/* Stats row */
.stats-row{background:#fff;border-bottom:1px solid var(--sky-mid);padding:3px 8px;display:flex;align-items:center;gap:5px;flex-shrink:0;flex-wrap:wrap;}
.stat-chip{padding:2px 9px;border-radius:12px;font-size:11px;font-weight:700;background:var(--sky-light);color:var(--blue-dark);white-space:nowrap;border:none;line-height:1.4;}
.stats-divider{width:1px;height:20px;background:var(--sky-mid);flex-shrink:0;margin:0 2px;}
.nogps-btn,.nosales-btn,.nosales-btn180,.regular-btn,.ice-btn,.ice-mish-btn,.month-btn{
  cursor:pointer;transition:all .18s cubic-bezier(.4,0,.2,1);
  position:relative;
}
.nogps-btn{background:#FBE9E7;color:#BF360C;border:1.5px dashed #FFCCBC;}
.nogps-btn.active{background:#D84315;color:#fff;border:1.5px solid #BF360C;box-shadow:inset 0 2px 5px rgba(0,0,0,.2);transform:scale(.97);}
.nosales-btn{background:#FFF3E0;color:#E65100;border:1.5px dashed #FFCC80;}
.nosales-btn.active{background:#E65100;color:#fff;border:1.5px solid #BF360C;box-shadow:inset 0 2px 5px rgba(0,0,0,.2);transform:scale(.97);}
.nosales-btn180{background:#FCE4EC;color:#880E4F;border:1.5px dashed #F48FB1;}
.nosales-btn180.active{background:#880E4F;color:#fff;border:1.5px solid #880E4F;box-shadow:inset 0 2px 5px rgba(0,0,0,.2);transform:scale(.97);}
.regular-btn{background:#E8F5E9;color:#1B5E20;border:1.5px dashed #A5D6A7;}
.regular-btn.active{background:#2E7D32;color:#fff;border:1.5px solid #1B5E20;box-shadow:inset 0 2px 5px rgba(0,0,0,.2);transform:scale(.97);}
.ice-btn{background:#E1F5FE;color:#0277BD;border:1.5px dashed #81D4FA;}
.ice-btn.active{background:#0277BD;color:#fff;border:1.5px solid #0277BD;box-shadow:inset 0 2px 5px rgba(0,0,0,.2);transform:scale(.97);}
.ice-mish-btn{background:#E3F2FD;color:#01579B;border:1.5px dashed #4FC3F7;}
.ice-mish-btn.active{background:#01579B;color:#fff;border:1.5px solid #0D47A1;box-shadow:inset 0 2px 5px rgba(0,0,0,.2);transform:scale(.97);}
.stats-right{margin-right:auto;display:flex;gap:6px;align-items:center;}
.export-btn{background:#1D6F42;color:#fff;border:none;border-radius:16px;padding:4px 12px;height:28px;font-size:11px;font-weight:800;cursor:pointer;}
.version-btn{background:#5C6BC0;color:#fff;border:none;border-radius:16px;padding:4px 12px;height:28px;font-size:11px;font-weight:800;cursor:pointer;}
.history-btn{background:#37474F;color:#fff;border:none;border-radius:16px;padding:4px 12px;height:28px;font-size:11px;font-weight:800;cursor:pointer;}
.tab-inline{display:flex;gap:3px;}
/* ─── Save/History modals ─── */
.sv-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9000;align-items:center;justify-content:center;}
.sv-modal-box{background:#fff;border-radius:14px;padding:24px;width:min(320px,90vw);box-shadow:0 8px 32px rgba(0,0,0,.25);}
.sv-modal-title{font-size:15px;font-weight:900;color:#1565C0;margin-bottom:14px;}
.sv-modal-input{width:100%;border:1.5px solid #BBDEFB;border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:10px;direction:rtl;font-family:inherit;}
.sv-modal-status{font-size:11px;color:#546E7A;min-height:18px;margin-bottom:12px;}
.sv-modal-actions{display:flex;gap:8px;justify-content:flex-end;}
.sv-btn-cancel{background:#ECEFF1;color:#546E7A;border:none;border-radius:8px;padding:8px 16px;font-weight:700;cursor:pointer;font-size:12px;}
.sv-btn-save{background:#5C6BC0;color:#fff;border:none;border-radius:8px;padding:8px 18px;font-weight:900;cursor:pointer;font-size:12px;}
.vh-modal-box{background:#fff;border-radius:14px;width:min(440px,96vw);max-height:80vh;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.25);display:flex;flex-direction:column;}
.vh-modal-hdr{padding:14px 18px;border-bottom:1px solid #BBDEFB;display:flex;justify-content:space-between;align-items:center;}
.vh-modal-hdr-title{font-size:14px;font-weight:900;color:#1565C0;}
.vh-modal-close{background:none;border:none;font-size:18px;cursor:pointer;color:#546E7A;line-height:1;}
.vh-modal-list{overflow-y:auto;flex:1;padding:4px 14px;}
.vh-item{display:flex;align-items:center;gap:8px;padding:10px 4px;border-bottom:1px solid #E3F2FD;}
.vh-item-info{flex:1;min-width:0;}
.vh-item-name{font-size:13px;font-weight:800;color:#1565C0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.vh-item-meta{font-size:10px;color:#90A4AE;margin-top:2px;}
.vh-item-restore{background:#E8F5E9;color:#2E7D32;border:1px solid #A5D6A7;border-radius:8px;padding:5px 12px;font-size:11px;font-weight:800;cursor:pointer;flex-shrink:0;}
.tab-inline-btn{width:28px;height:28px;border-radius:7px;font-size:13px;cursor:pointer;background:none;border:1.5px solid var(--sky-mid);color:var(--mid);display:flex;align-items:center;justify-content:center;transition:all .15s;}
.tab-inline-btn.active{background:var(--blue);color:#fff;border-color:var(--blue);}

/* Agent legend */
.agent-legend{display:flex;gap:4px;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;padding-bottom:1px;}
.agent-legend::-webkit-scrollbar{display:none;}
.agent-chip{padding:2px 8px;border-radius:16px;font-size:10px;font-weight:700;cursor:pointer;border:2px solid transparent;white-space:nowrap;flex:0 0 auto;opacity:.45;transition:all .15s;color:#fff;}
.agent-chip.on{opacity:1;box-shadow:0 2px 8px rgba(0,0,0,.18);}
.agent-chip-count{font-size:8px;font-weight:800;margin-right:3px;opacity:.8;}
/* Sadran legend */
.sadran-legend{display:flex;gap:4px;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;padding-bottom:1px;}
.sadran-legend::-webkit-scrollbar{display:none;}
.sadran-chip{padding:2px 8px;border-radius:16px;font-size:10px;font-weight:700;cursor:pointer;border:2px solid transparent;white-space:nowrap;flex:0 0 auto;opacity:.4;transition:all .15s;color:#fff;background:#7B1FA2;}
.sadran-chip.on{opacity:1;box-shadow:0 2px 8px rgba(123,31,162,.3);}
.sadran-chip-count{font-size:8px;font-weight:800;margin-right:3px;opacity:.8;}

/* BODY */
#route-body{display:flex;flex:1;overflow:hidden;flex-direction:column;}
#list-pane{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 6px 18px;background:var(--bg);}
#map-pane{flex:1;display:none;min-width:0;position:relative;}
#map-pane.active{display:block;}
#map{height:100%;width:100%;}
@media(min-width:700px){
  #route-body{flex-direction:row;}
  .tab-inline{display:none;}
  #list-pane{display:block!important;flex:0 0 48%;border-left:1px solid var(--sky-mid);max-width:520px;}
  #map-pane{display:block!important;flex:1;}
}

/* SPINNER / PLACEHOLDER */
.placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:40px 20px;text-align:center;color:var(--mid);}
.placeholder-icon{font-size:48px;margin-bottom:14px;}
.placeholder-text{font-size:15px;font-weight:700;color:var(--text);margin-bottom:5px;}
.placeholder-sub{font-size:12px;}
.spinner{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:40px;color:var(--mid);}
.spin{width:32px;height:32px;border:3px solid var(--sky-mid);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

/* CLIENT CARD */
.client-card{background:#fff;border-radius:7px;padding:6px 8px;margin-bottom:2px;display:flex;align-items:center;gap:5px;box-shadow:0 1px 3px rgba(21,101,192,.06);cursor:pointer;border-right:4px solid transparent;transition:box-shadow .12s,border-color .12s;}
.client-card:hover{box-shadow:0 3px 10px rgba(21,101,192,.14);}
.client-card.no-gps{background:#FFF8F0;}
.client-card.selected{background:var(--sky-light);box-shadow:0 2px 10px rgba(21,101,192,.18);}
.c-body{flex:1;min-width:0;}
.c-name{font-size:12px;font-weight:800;color:var(--text);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.c-sub{font-size:10px;color:var(--mid);margin-top:2px;line-height:1.4;display:flex;align-items:center;overflow:hidden;gap:0;}
.c-actions{display:flex;align-items:center;gap:0;flex-shrink:0;}
.c-id{font-size:8px;font-weight:700;color:#fff;background:#9e9e9e;border-radius:4px;padding:2px 5px;margin-bottom:2px;white-space:nowrap;}
.act-btn{font-size:14px;cursor:pointer;opacity:.35;transition:opacity .15s;min-width:34px;min-height:30px;display:flex;align-items:center;justify-content:center;}
.act-btn:hover{opacity:.9;}
.no-gps-badge{font-size:9px;font-weight:900;color:#fff;background:var(--red);padding:2px 6px;border-radius:6px;flex-shrink:0;cursor:pointer;}
.agent-badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700;color:#fff;margin-left:4px;}
.day-badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700;background:var(--sky-light);color:var(--blue-dark);border:1px solid var(--sky-mid);}
.changed-badge{background:#FFF3E0;border:1px solid #FFB74D;color:#E65100;font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px;margin-right:3px;}

/* AGENT POPUP */
#agent-popup{position:fixed;background:#fff;border-radius:14px;box-shadow:0 6px 28px rgba(0,0,0,.22);padding:12px;display:none;flex-direction:column;gap:4px;z-index:9999;max-height:320px;overflow-y:auto;min-width:180px;}
#agent-popup.open{display:flex;}
.agent-pop-item{padding:7px 12px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;border:none;background:none;width:100%;text-align:right;}
.agent-pop-item:hover{background:var(--sky-light);}
.agent-pop-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;}

/* DAY POPUP */
#day-popup{position:fixed;background:#fff;border-radius:14px;box-shadow:0 6px 28px rgba(0,0,0,.18);padding:10px 12px;display:none;gap:7px;z-index:9999;align-items:center;}
#day-popup.open{display:flex;}
.day-pop-btn{width:38px;height:38px;border-radius:10px;background:var(--sky-light);border:2px solid var(--sky-mid);font-size:14px;font-weight:900;color:var(--blue-dark);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.day-pop-btn:hover,.day-pop-btn.cur-day{background:var(--blue);color:#fff;border-color:var(--blue-dark);}

/* MAP */
.map-ctrl-bar{position:absolute;top:10px;left:10px;z-index:1000;display:flex;gap:5px;flex-direction:column;}
.map-tile-btn{height:26px;border-radius:10px;background:#fff;border:2px solid var(--sky-mid);color:var(--blue-dark);font-size:11px;font-weight:800;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.18);padding:0 10px;white-space:nowrap;}
.lasso-btn{height:32px;border-radius:10px;background:#fff;border:2px solid var(--sky-mid);color:var(--blue-dark);font-size:12px;font-weight:900;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.18);padding:0 12px;white-space:nowrap;display:flex;align-items:center;gap:5px;}
.lasso-btn.active{background:var(--blue);color:#fff;border-color:var(--blue-dark);}
.lasso-btn.has-selection{background:#E8F5E9;border-color:#2E7D32;color:#1B5E20;}
.lasso-clear{height:26px;border-radius:10px;background:#fff;border:2px solid #EF9A9A;color:var(--red);font-size:11px;font-weight:800;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12);padding:0 10px;white-space:nowrap;display:none;}
.lasso-clear.visible{display:block;}
.visit-btn{background:#5C6BC0;color:#fff;border:none;border-radius:16px;padding:0 12px;height:28px;font-size:11px;font-weight:800;cursor:pointer;transition:all .15s;white-space:nowrap;}
.visit-btn.active{background:#283593;box-shadow:0 2px 8px rgba(40,53,147,.45);}
.tablet-gps-btn{background:#fff;color:#E65100;border:1.5px solid #FFCC80;border-radius:16px;padding:0 12px;height:28px;font-size:11px;font-weight:800;cursor:pointer;transition:all .15s;white-space:nowrap;}
.tablet-gps-btn.active{background:#E65100;color:#fff;border-color:#BF360C;box-shadow:0 2px 8px rgba(230,81,0,.35);}
.visit-btn.ver-mode{background:#7B1FA2;}
.visit-btn.ver-mode.active{background:#4A148C;box-shadow:0 2px 8px rgba(74,20,140,.45);}
.visit-num{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:5px;background:#5C6BC0;color:#fff;font-size:10px;font-weight:900;flex-shrink:0;margin-left:4px;}

const API = 'https://api.sverdlik-apps.site';
const TOKEN_KEY = 'frToken';

// Client-side crash reporting, same as formula-road.html — see that file's
// comment for why raw fetch and the 5-report cap. Live request 2026-08-28.
let _errReportCount = 0;
function _reportClientError(message, stack){
  if(_errReportCount++ >= 5) return;
  try{
    fetch(API + '/api/client-error', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Session': localStorage.getItem(TOKEN_KEY) || '' },
      body: JSON.stringify({ message: String(message||'').slice(0,300), stack: stack ? String(stack).slice(0,1000) : null, url: location.href, page: 'territory' }),
      keepalive: true,
    }).catch(()=>{});
  }catch(_){}
}
window.addEventListener('error', e => _reportClientError(e.message, e.error && e.error.stack));
window.addEventListener('unhandledrejection', e => _reportClientError('unhandledrejection: ' + (e.reason && e.reason.message || e.reason), e.reason && e.reason.stack));

let gpsCorrections = {}; // custId → {lat,lng} — from gps-corrections.json + localStorage
let AI_GPS = {}; // custId → {aiLat,aiLng} — from google-gps.json (same as formula-road)
let gpsCorrectMode = false, gpsCorrectId = null;

async function loadCorrections(){
  try{
    const r=await apiFetch(API+'/gps-corrections.json');
    if(r.ok){
      gpsCorrections=await r.json();
    }
  }catch(_){}
  // always merge localStorage on top (works even if server file blocked)
  try{
    const local=JSON.parse(localStorage.getItem('fr_gps_local')||'{}');
    Object.assign(gpsCorrections,local);
  }catch(_){}
}

async function loadAiGps(){
  try{
    const r=await fetch('./google-gps.json?_='+Date.now());
    if(r.ok) AI_GPS=await r.json();
  }catch(_){}
}

let TABLET_GPS={};
async function loadTabletGps(){
  try{
    const r=await fetch('./priority-gps-cross.json?_='+Date.now());
    if(!r.ok) return;
    const arr=await r.json();
    arr.forEach(row=>{ if(row.cust&&row.lat&&row.lng) TABLET_GPS[String(row.cust)]={lat:row.lat,lng:row.lng}; });
  }catch(_){}
}

function toggleTabletGps(){
  st.tabletGpsMode=!st.tabletGpsMode;
  const btn=document.getElementById('tablet-gps-btn');
  if(btn) btn.classList.toggle('active',st.tabletGpsMode);

  if(st.tabletGpsMode){
    st.allClients=st.allClients.map(c=>{
      if(c.gpsSource==='correction') return c;
      const t=TABLET_GPS[String(c.custId)];
      if(t?.lat&&t?.lng) return{...c,lat:t.lat,lng:t.lng,gpsSource:'tablet'};
      return{...c,lat:c._pbiLat||c.lat,lng:c._pbiLng||c.lng};
    });
    showToast('📱 GPS: Tablet (Priority) פעיל');
  } else {
    st.allClients=st.allClients.map(c=>{
      if(c.gpsSource==='correction') return c;
      const ai=AI_GPS[String(c.custId)];
      if(ai?.aiLat&&ai?.aiLng) return{...c,lat:ai.aiLat,lng:ai.aiLng,gpsSource:'ai'};
      return{...c,lat:c._pbiLat||c.lat,lng:c._pbiLng||c.lng,gpsSource:c._pbiLat?'pbi':c.gpsSource};
    });
    showToast('📍 GPS: רגיל');
  }
  // recompute visit order with the new GPS source if AI-computed mode is active
  if(st.sortMode==='visit'&&st.visitSource==='computed') computeVisitOrder(st.startCustId);
  renderAll();
}

function agentColor(code){
  if(!code) return '#9E9E9E';
  if(code==='NEW') return '#FF8F00';
  let h=0; for(const ch of String(code)) h=(h*31+ch.charCodeAt(0))&0x7FFFFFFF;
  return PALETTE[h%PALETTE.length];
}

// ── AUTH ──────────────────────────────────────────────────────────────────
function getToken(){ return localStorage.getItem(TOKEN_KEY)||''; }

async function apiFetch(url, opts={}){
  const hdrs={...opts.headers||{}};
  const tok=getToken(); if(tok) hdrs['x-session']=tok;
  const ctrl=new AbortController(), tid=setTimeout(()=>ctrl.abort(),15000);
  let r;
  try{ r=await fetch(url,{...opts,headers:hdrs,signal:ctrl.signal}); }
  finally{ clearTimeout(tid); }
  if(r.status===401){
    try{
      const p=await fetch(API+'/auth/pbi',{credentials:'include'});
      if(p.ok){const j=await p.json();if(j.ok&&j.token){localStorage.setItem(TOKEN_KEY,j.token);hdrs['x-session']=j.token;return fetch(url,{...opts,headers:hdrs});}}
    }catch(_){}
    location.href=(location.hostname.includes('sverdlik-apps')?'/formula-road':('formula-road.html'))+'?next=territory.html'; throw new Error('session_expired');
  }
  return r;
}

  visitOrder: [],             // custIds in route order
  loadedVersionOrder: null,   // null=no version loaded; []=version without order; [...]= version with order
  startCustId: null,          // custId pinned to position #1 (null = start from Tel Aviv)
};

// ── ROUTING — ported from formula-road ────────────────────────────────────
const TEL_AVIV_LAT=32.0853, TEL_AVIV_LNG=34.7818;
function haversineKm(la1,lo1,la2,lo2){
  const R=6371,d2r=Math.PI/180,dLat=(la2-la1)*d2r,dLon=(lo2-lo1)*d2r;
  const a=Math.sin(dLat/2)**2+Math.cos(la1*d2r)*Math.cos(la2*d2r)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function twoOpt(route,sLat,sLng){
  if(route.length<3) return route;
  let best=[...route],improved=true;
  const dist=(a,b)=>haversineKm(a.lat,a.lng,b.lat,b.lng);
  const dS=(c)=>haversineKm(sLat,sLng,c.lat,c.lng);
  while(improved){
    improved=false;
    for(let i=-1;i<best.length-1;i++){
      const dI=(c)=>i===-1?dS(c):dist(best[i],c);
      for(let j=i+2;j<best.length;j++){
        const hasNext=j+1<best.length;
        const d1=dI(best[i+1])+(hasNext?dist(best[j],best[j+1]):0);
        const d2=dI(best[j])+(hasNext?dist(best[i+1],best[j+1]):0);
        if(d2<d1-0.001){
          best=[...best.slice(0,i+1),...best.slice(i+1,j+1).reverse(),...best.slice(j+1)];
          improved=true;
        }
      }
    }
  }
  return best;
}
function nearestNeighborFrom(sLat,sLng,clients){
  const withGps=clients.filter(c=>c.lat&&c.lng);
  const noGps=clients.filter(c=>!c.lat||!c.lng);
  if(!withGps.length) return clients;
  const rem=[...withGps],result=[];
  let curLat=sLat,curLng=sLng;
  while(rem.length){
    let bi=-1,bDist=Infinity;
    rem.forEach((c,i)=>{const d=haversineKm(curLat,curLng,c.lat,c.lng);if(d<bDist){bDist=d;bi=i;}});
    const ch=rem.splice(bi,1)[0];
    result.push(ch); curLat=ch.lat; curLng=ch.lng;
  }
  return [...twoOpt(result,sLat,sLng),...noGps];
}
function computeVisitOrder(pinFirstCustId){
  let clients=displayClients().map(c=>{
    if(c.gpsSource==='correction') return c;
    if(st.tabletGpsMode){
      const t=TABLET_GPS[String(c.custId)];
      if(t?.lat&&t?.lng) return{...c,lat:t.lat,lng:t.lng};
    }
    const ai=AI_GPS[String(c.custId)];
    return (ai?.aiLat&&ai?.aiLng)?{...c,lat:ai.aiLat,lng:ai.aiLng}:c;
  });
  let sLat=TEL_AVIV_LAT, sLng=TEL_AVIV_LNG, pinnedFirst=null;
  if(pinFirstCustId){
    const pinned=clients.find(c=>String(c.custId)===String(pinFirstCustId));
    if(pinned&&pinned.lat&&pinned.lng){
      sLat=pinned.lat; sLng=pinned.lng;
      clients=clients.filter(c=>String(c.custId)!==String(pinFirstCustId));
      pinnedFirst=pinned;
    }
  }
  const ordered=nearestNeighborFrom(sLat,sLng,clients);
  const result=pinnedFirst?[pinnedFirst,...ordered]:ordered;
  st.visitOrder=result.map(c=>String(c.custId));
  st.startCustId=pinFirstCustId||null;
}
function setVisitSource(source){
  // Clicking active source button → toggle off visit mode
  if(st.sortMode==='visit'&&st.visitSource===source){
    st.sortMode='default'; st.visitOrder=[]; st.startCustId=null;
  } else {
    st.sortMode='visit';
    st.visitSource=source;
    if(source==='computed'){
      computeVisitOrder(st.startCustId);
    } else {
      if(st.loadedVersionOrder===null){ showToast('לא נטענה גרסה עם סדר ביקור'); return; }
      if(!st.loadedVersionOrder.length){
        showToast('הגרסה שנטענה לא כוללת סדר ביקור שמור — שמור אותה מחדש');
        st.sortMode='default'; st.visitOrder=[];
        _updateVisitBtns(); return;
      }
      st.visitOrder=[...st.loadedVersionOrder];
    }
  }
  _updateVisitBtns();
  renderClientList();
  if(st.tab==='map'||window.innerWidth>=700) renderMap();
}
function _updateVisitBtns(){
  const isVisit=st.sortMode==='visit';
  const gBtn=document.getElementById('visit-btn');
  const vBtn=document.getElementById('visit-ver-btn');
  if(gBtn){ gBtn.classList.toggle('active',isVisit&&st.visitSource==='computed'); }
  if(vBtn){
    vBtn.style.display=st.loadedVersionOrder!==null?'':'none';
    vBtn.classList.toggle('active',isVisit&&st.visitSource==='version');
  }
}

let _loadId=0;
async function loadClients(cities){
  const myId=++_loadId;
  document.getElementById('stats-row').style.display='none';
  document.getElementById('client-list').innerHTML='<div class="spinner"><div class="spin"></div><span>טוען לקוחות...</span></div>';
  document.getElementById('agent-legend').innerHTML='';
  const cityArr=Array.isArray(cities)?cities:[cities];
  try{
    // If all cities selected → send "ALL" to avoid URL length limit with Hebrew city names
    const isAll = cityArr.length >= allCities.length && allCities.length > 0;
    const param = isAll ? 'ALL' : cityArr.map(c=>encodeURIComponent(c)).join(',');
    const r=await apiFetch(`${API}/territory-clients?cities=${param}`);
    if(!r.ok) throw new Error(r.status);
    const data=await r.json();
    if(myId!==_loadId) return;
    // Filter out "כללי" (catch-all unassigned, not route agents)
    // Mark מעיין 2000 clients with _isNew flag
    st.allClients=(Array.isArray(data)?data:[])
      .filter(c=>!String(c.agentName||'').includes('כללי'))
      .map(c=>String(c.clientType||'').includes('מעין')?{...c,_isNew:true}:c);
  }catch(e){
    if(myId!==_loadId) return;
    document.getElementById('client-list').innerHTML=`<div class="placeholder"><div class="placeholder-icon">❌</div><div class="placeholder-text">שגיאה</div><div class="placeholder-sub">${esc(String(e))}</div></div>`;
    return;
  }

  // Apply GPS corrections: gps-corrections.json (server-synced) + localStorage
  try{
    st.allClients=st.allClients.map(c=>{
      const id=String(c.custId);
      const corr=gpsCorrections[id];
      return corr?{...c,lat:corr.lat,lng:corr.lng,gpsSource:'correction'}:c;
    });
  }catch(_){}

  // Save original PBI coords before AI GPS override (needed for tablet GPS toggle)
  st.allClients=st.allClients.map(c=>({...c,_pbiLat:c.lat,_pbiLng:c.lng}));

  // Apply Tablet or AI GPS depending on active mode
  try{
    st.allClients=st.allClients.map(c=>{
      if(c.gpsSource==='correction') return c;
      if(st.tabletGpsMode){
        const t=TABLET_GPS[String(c.custId)];
        if(t?.lat&&t?.lng) return{...c,lat:t.lat,lng:t.lng,gpsSource:'tablet'};
      }
      const ai=AI_GPS[String(c.custId)];
      if(ai?.aiLat&&ai?.aiLng) return{...c,lat:ai.aiLat,lng:ai.aiLng,gpsSource:'ai'};
      return c;
    });
  }catch(_){}

  // Build agent list
  const agMap=new Map();
  st.allClients.forEach(c=>{
    if(c.agentCode&&!agMap.has(c.agentCode))
      agMap.set(c.agentCode,{agentCode:c.agentCode,agentName:c.agentName||c.agentCode,color:agentColor(c.agentCode)});
  });
  st.agents=[...agMap.values()].sort((a,b)=>(a.agentName||'').localeCompare(b.agentName||''));
  st.activeAgents=new Set(st.agents.map(a=>a.agentCode));

  renderAgentLegend();
  renderSadranBtn();
  // Restore visitOrder from version if pending (set by restoreVersion before reload)
  const _pendingVO=localStorage.getItem('ter_pending_visit_order');
  if(_pendingVO){
    try{
      const vo=JSON.parse(_pendingVO);
      if(Array.isArray(vo)&&vo.length){
        st.visitOrder=vo.map(String);
        st.loadedVersionOrder=vo.map(String);
        st.sortMode='visit';
        st.visitSource='version';
      } else {
        st.loadedVersionOrder=[]; // version loaded but no order saved — button visible, Google fallback
        computeVisitOrder();
      }
    }catch(_){ computeVisitOrder(); }
    localStorage.removeItem('ter_pending_visit_order');
  } else {
    computeVisitOrder();
  }
  _updateVisitBtns();
  renderAll();
  document.getElementById('stats-row').style.display='';
  setupSortable();
}

function renderDayBtns(){
  const fmt=n=>n>=1000?`₪${(n/1000).toFixed(1)}K`:`₪${Math.round(n)}`;
  // Apply agent + lasso + active stat filters (NOT day filter — each row IS a day)
  const baseCl=st.allClients.filter(c=>{
    const ov=st.overrides[String(c.custId)]||{};
    const _agCode=ov.agentCode||c.agentCode;
    if(!st.activeAgents.has(_agCode)) return false;
    if(dropAgentFilter.size>0 && !dropAgentFilter.has(_agCode)) return false;
    if(dropManagerFilter.size>0 && !dropManagerFilter.has(c.manager)) return false;
    if(st.lassoIds!==null&&!st.lassoIds.has(String(c.custId))) return false;
    if(st.noGpsFilter && c.lat && c.lng && c.gpsSource!=='no-gps') return false;
    if(st.noSalesDays>0){
      const lo=c.lastOrderDate?new Date(c.lastOrderDate):null;
      const cutoff=new Date(Date.now()-st.noSalesDays*86400000);
      if(lo&&lo>=cutoff) return false;
    }
    if(st.regularFilter){
      const lo=c.lastOrderDate?new Date(c.lastOrderDate):null;
      const cutoff60=new Date(Date.now()-60*86400000);
      if(!lo||lo<cutoff60) return false;
    }
    if(st.iceFilter && !c.iceOnly) return false;
    if(st.iceMishFilter && !(c.avg6IceSales>0)) return false;
    if(st.hasSadranFilter && !c.sadran) return false;
    return true;
  });

  // per-day per-agent stats using avg6Sales (completed months only)
  const byDay={};
  [0,1,2,3,4,5].forEach(d=>{ byDay[d]={}; });
  const totalByAgent={};
  baseCl.forEach(c=>{
    const ov=st.overrides[String(c.custId)]||{};
    const dayNum=ov.dayNum!==undefined?ov.dayNum:c.dayNum;
    const agentCode=ov.agentCode||c.agentCode;
    const ag=st.agents.find(a=>a.agentCode===agentCode);
    const agName=(ag?.agentName||agentCode).split(/[\s\-]/)[0].slice(0,8);
    // per-day (day 0 = no day)
    const dk=dayNum||0;
    if(!byDay[dk][agentCode]) byDay[dk][agentCode]={name:agName,count:0,salesSum:0,iceSalesSum:0,code:agentCode};
    byDay[dk][agentCode].count++;
    byDay[dk][agentCode].salesSum+=(c.avg6Sales||0);
    byDay[dk][agentCode].iceSalesSum+=(c.avg6IceSales||0);
    // total
    if(!totalByAgent[agentCode]) totalByAgent[agentCode]={name:agName,count:0,salesSum:0,iceSalesSum:0,code:agentCode};
    totalByAgent[agentCode].count++;
    totalByAgent[agentCode].salesSum+=(c.avg6Sales||0);
    totalByAgent[agentCode].iceSalesSum+=(c.avg6IceSales||0);
  });
  // Count second-visit clients in their second day card (not in totals — already counted once)
  baseCl.forEach(c=>{
    const ov=st.overrides[String(c.custId)]||{};
    if(ov.secondDay===undefined) return;
    const primaryDay=ov.dayNum!==undefined?ov.dayNum:(c.dayNum||0);
    if(ov.secondDay===primaryDay) return;
    const agentCode=ov.agentCode||c.agentCode;
    const ag=st.agents.find(a=>a.agentCode===agentCode);
    const agName=(ag?.agentName||agentCode).split(/[\s\-]/)[0].slice(0,8);
    const dk=ov.secondDay;
    if(!byDay[dk]) byDay[dk]={};
    if(!byDay[dk][agentCode]) byDay[dk][agentCode]={name:agName,count:0,salesSum:0,iceSalesSum:0,code:agentCode};
    byDay[dk][agentCode].count++;
    byDay[dk][agentCode].salesSum+=(c.avg6Sales||0);
    byDay[dk][agentCode].iceSalesSum+=(c.avg6IceSales||0);
  });

  const grandTotal=baseCl.length;

  function miniPie(entries,total){
    if(!entries.length||total<1) return '';
    const r=15,cx=17,cy=17,sz=34;
    let ang=-Math.PI/2;
    const paths=entries.map(ag=>{
      const frac=ag.count/total;
      const a0=ang,a1=ang+frac*2*Math.PI; ang=a1;
      if(frac>=0.999) return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${agentColor(ag.code)}"/>`;
      const x1=(cx+r*Math.cos(a0)).toFixed(2),y1=(cy+r*Math.sin(a0)).toFixed(2);
      const x2=(cx+r*Math.cos(a1)).toFixed(2),y2=(cy+r*Math.sin(a1)).toFixed(2);
      return `<path d="M${cx},${cy}L${x1},${y1}A${r},${r},0,${frac>0.5?1:0},1,${x2},${y2}Z" fill="${agentColor(ag.code)}"/>`;
    }).join('');
    return `<svg width="${sz}" height="${sz}" style="flex-shrink:0;border-radius:50%;overflow:visible">${paths}</svg>`;
  }

  function buildCard(agMap){
    const entries=Object.values(agMap).filter(a=>a.count>0).sort((a,b)=>b.count-a.count);
    const totalCount=entries.reduce((s,a)=>s+a.count,0);
    const totalSales=entries.reduce((s,a)=>s+a.salesSum,0);
    const totalIceSales=entries.reduce((s,a)=>s+a.iceSalesSum,0);
    if(!totalCount) return '';
    const pctGrandTotal=grandTotal>0?Math.round(totalCount/grandTotal*100):0;
    const agRows=entries.map(ag=>{
      const pctDay=totalCount>0?Math.round(ag.count/totalCount*100):0;
      const salesCell=ag.salesSum>0?`<span class="dc-ag-sales">${fmt(ag.salesSum)}</span>`:`<span class="dc-ag-sales"></span>`;
      return `<span class="dc-ag-row"><span class="dc-ag-name">${ag.name}</span><span class="dc-ag-cnt">${ag.count}</span><span class="dc-ag-pct">${pctDay}%</span>${salesCell}</span>`;
    }).join('');
    const pctGrandStr=grandTotal>0?`${pctGrandTotal}%`:'';
    const iceSalesStr=totalIceSales>0?`<span style="color:#0277BD;font-size:9px;font-weight:700">❄️${fmt(totalIceSales)}</span>`:'';
    const totalRow=`<span class="dc-ag-row dc-total-row"><span class="dc-ag-name">סה"כ</span><span class="dc-ag-cnt">${totalCount}</span><span class="dc-ag-pct">${pctGrandStr}</span><span class="dc-ag-sales" style="display:flex;gap:3px;align-items:center">${totalSales>0?fmt(totalSales):''}${iceSalesStr}</span></span>`;
    return `<div class="day-card-body">
      <div class="dc-ag-tbl" style="margin-top:2px">${totalRow}${agRows}</div>
    </div>`;
  }

  const wrap=document.getElementById('day-btns-wrap');
  if(!wrap) return;
  wrap.classList.toggle('has-data', baseCl.length>0);
  const dayKeys=[null,1,2,3,4,5,0];
  const btnEls=wrap.querySelectorAll('.day-btn');
  const isAllMode=st.activeDays.size===6;
  btnEls.forEach((btn,i)=>{
    const d=dayKeys[i];
    const cardData=d===null?totalByAgent:(byDay[d]||{});
    const hasData=Object.keys(cardData).length>0;
    btn.classList.toggle('active', d!==null && !isAllMode && st.activeDays.has(d));
    btn.classList.toggle('day-all-mode', d===null && isAllMode);
    btn.classList.toggle('has-card-data', hasData);
    const lbl=`<span class="day-btn-label">${d===null?'כל':d===0?'?':DAY_LBL[d]}</span>`;
    btn.innerHTML=lbl+(hasData?buildCard(cardData):'');
  });
}

function selectDay(d){
  if(d===null){
    st.activeDays=new Set([0,1,2,3,4,5]); // כל always resets to all
  } else {
    if(st.activeDays.size===6) st.activeDays=new Set(); // deselect all first
    if(st.activeDays.has(d)) st.activeDays.delete(d); else st.activeDays.add(d);
    if(st.activeDays.size===0) st.activeDays=new Set([0,1,2,3,4,5]); // pressing same day twice → reset
  }
  renderDayBtns();
  renderAll();
}

// ── DISPLAY LIST ──────────────────────────────────────────────────────────
function displayClients(){
  let result=st.allClients.filter(c=>{
    const ov=st.overrides[String(c.custId)]||{};
    const agentCode=ov.agentCode||c.agentCode;
    const dayNum=ov.dayNum!==undefined?ov.dayNum:c.dayNum;
    if(!st.activeAgents.has(agentCode)) return false;
    if(dropAgentFilter.size>0 && !dropAgentFilter.has(agentCode)) return false;
    if(dropManagerFilter.size>0 && !dropManagerFilter.has(c.manager)) return false;
    if(st.activeDays.size<6 && !st.activeDays.has(dayNum||0)) return false;
    if(st.lassoIds!==null && !st.lassoIds.has(String(c.custId))) return false;
    if(st.noGpsFilter && c.lat && c.lng && c.gpsSource!=='no-gps') return false;
    if(st.noSalesDays>0){
      const lo=c.lastOrderDate?new Date(c.lastOrderDate):null;
      const cutoff=new Date(Date.now()-st.noSalesDays*86400000);
      if(lo&&lo>=cutoff) return false;
    }
    if(st.regularFilter){
      const lo=c.lastOrderDate?new Date(c.lastOrderDate):null;
      const cutoff60=new Date(Date.now()-60*86400000);
      if(!lo||lo<cutoff60) return false;
    }
    if(st.iceFilter && !c.iceOnly) return false;
    if(st.iceMishFilter && !(c.avg6IceSales>0)) return false;
    if(st.hasSadranFilter && !c.sadran) return false;
    return true;
  }).map(c=>{
    const ov=st.overrides[String(c.custId)]||{};
    return {
      ...c,
      agentCode: ov.agentCode||c.agentCode,
      agentName: ov.agentCode ? (st.agents.find(a=>a.agentCode===ov.agentCode)?.agentName||ov.agentCode) : c.agentName,
      dayNum:    ov.dayNum!==undefined?ov.dayNum:c.dayNum,
      _changed:  !!(ov.agentCode||ov.dayNum!==undefined),
    };
  });
  // Inject second-visit clones — iterate allClients so clone shows even when original day is filtered out
  const secondClones=[];
  st.allClients.forEach(c=>{
    const ov=st.overrides[String(c.custId)]||{};
    if(ov.secondDay===undefined) return;
    const primaryDay=ov.dayNum!==undefined?ov.dayNum:(c.dayNum||0);
    if(ov.secondDay===primaryDay) return; // same as primary day → skip duplicate
    const agentCode=ov.agentCode||c.agentCode;
    if(!st.activeAgents.has(agentCode)) return;
    if(dropAgentFilter.size>0&&!dropAgentFilter.has(agentCode)) return;
    if(dropManagerFilter.size>0&&!dropManagerFilter.has(c.manager)) return;
    if(st.activeDays.size<6&&!st.activeDays.has(ov.secondDay)) return;
    if(st.lassoIds!==null&&!st.lassoIds.has(String(c.custId))) return;
    const agentName=ov.agentCode?(st.agents.find(a=>a.agentCode===ov.agentCode)?.agentName||ov.agentCode):c.agentName;
    secondClones.push({...c, agentCode, agentName, dayNum:ov.secondDay,
      _changed:!!(ov.agentCode||ov.dayNum!==undefined), _isSecondVisit:true});
  });
  result=[...result,...secondClones];

  if(st.sortMode==='visit'&&st.visitOrder.length){
    const orderMap={}; st.visitOrder.forEach((id,i)=>orderMap[id]=i);
    result.sort((a,b)=>(orderMap[String(a.custId)]??9999)-(orderMap[String(b.custId)]??9999));
  }
  return result;
}

function renderAll(){
  renderDayBtns();
  renderClientList();
  updateStats();
  if(window.innerWidth>=700||st.tab==='map') renderMap();
}

function updateStats(){
  const list=displayClients();
  const baseList=(st.noGpsFilter||st.noSalesDays>0||st.regularFilter||st.iceFilter||st.iceMishFilter)?displayClientsAll():list;
  const noGps=baseList.filter(c=>!c.lat||!c.lng||c.gpsSource==='no-gps').length;
  const now=Date.now();
  const cut60=new Date(now-60*86400000), cut180=new Date(now-180*86400000);
  const noSales60=baseList.filter(c=>{ const lo=c.lastOrderDate?new Date(c.lastOrderDate):null; return !lo||lo<cut60; }).length;
  const noSales180=baseList.filter(c=>{ const lo=c.lastOrderDate?new Date(c.lastOrderDate):null; return !lo||lo<cut180; }).length;
  const changed=Object.keys(st.overrides).length;
  document.getElementById('stat-total').textContent=`${list.length} לקוחות`;
  const lassoEl=document.getElementById('stat-lasso');
  if(st.lassoIds!==null){ lassoEl.textContent=`🎯 ${list.length} נבחרו`; lassoEl.style.display=''; }else{ lassoEl.style.display='none'; }
  const ngEl=document.getElementById('stat-nogps');
  if(noGps>0){
    ngEl.textContent=`📍 ${noGps} ללא GPS`; ngEl.style.display='';
    ngEl.classList.toggle('active',st.noGpsFilter);
  } else { ngEl.style.display='none'; st.noGpsFilter=false; }
  const ns60El=document.getElementById('stat-nosales60');
  if(noSales60>0){
    ns60El.textContent=`🔶 ${noSales60} ללא מכר 60י`; ns60El.style.display='';
    ns60El.classList.toggle('active',st.noSalesDays===60);
  } else { ns60El.style.display='none'; if(st.noSalesDays===60) st.noSalesDays=0; }
  const ns180El=document.getElementById('stat-nosales180');
  if(noSales180>0){
    ns180El.textContent=`🔴 ${noSales180} ללא מכר 180י`; ns180El.style.display='';
    ns180El.classList.toggle('active',st.noSalesDays===180);
  } else { ns180El.style.display='none'; if(st.noSalesDays===180) st.noSalesDays=0; }
  const regular=baseList.filter(c=>{ const lo=c.lastOrderDate?new Date(c.lastOrderDate):null; const cut60=new Date(now-60*86400000); return lo&&lo>=cut60; }).length;
  const regEl=document.getElementById('stat-regular');
  if(regular>0){ regEl.textContent=`📗 ${regular} לקוחות קבועים`; regEl.style.display=''; regEl.classList.toggle('active',st.regularFilter); }
  else { regEl.style.display='none'; st.regularFilter=false; }
  const iceCount=baseList.filter(c=>c.iceOnly===true).length;
  const iceEl=document.getElementById('stat-ice');
  if(iceCount>0){iceEl.textContent=`❄️ ${iceCount} לקוחות ICE`;iceEl.style.display='';iceEl.classList.toggle('active',st.iceFilter);}
  else{iceEl.style.display='none';st.iceFilter=false;}
  const chEl=document.getElementById('stat-changed');
  chEl.textContent=changed?`✏️ ${changed} שינויים`:''; chEl.style.display=changed?'':'none';
}
function displayClientsAll(){
  return st.allClients.filter(c=>{
    const ov=st.overrides[String(c.custId)]||{};
    const agentCode=ov.agentCode||c.agentCode;
    const dayNum=ov.dayNum!==undefined?ov.dayNum:c.dayNum;
    if(!st.activeAgents.has(agentCode)) return false;
    if(dropAgentFilter.size>0 && !dropAgentFilter.has(agentCode)) return false;
    if(dropManagerFilter.size>0 && !dropManagerFilter.has(c.manager)) return false;
    if(st.activeDays.size<6 && !st.activeDays.has(dayNum||0)) return false;
    if(st.lassoIds!==null && !st.lassoIds.has(String(c.custId))) return false;
    if(st.hasSadranFilter && !c.sadran) return false;
    return true;
  });
}
function toggleNoGpsFilter(){
  st.noGpsFilter=!st.noGpsFilter;
  renderAll();
}
function toggleNoSales(days){
  st.noSalesDays=st.noSalesDays===days?0:days;
  st.regularFilter=false; // mutually exclusive
  renderAll();
}
function toggleRegular(){
  st.regularFilter=!st.regularFilter;
  st.noSalesDays=0; // mutually exclusive
  renderAll();
}
function toggleIceFilter(){
  st.iceFilter=!st.iceFilter;
  renderAll();
}
function toggleIceMishFilter(){
  st.iceMishFilter=!st.iceMishFilter;
  renderAll();
}

// ── AGENT LEGEND ──────────────────────────────────────────────────────────
function getLegendAgents(){
  const agentMgrMap={};
  st.allClients.forEach(c=>{ if(c.agentCode&&c.manager) agentMgrMap[c.agentCode]=c.manager; });
  return st.agents.filter(a=>{
    if(dropAgentFilter.size>0 && !dropAgentFilter.has(a.agentCode)) return false;
    if(dropManagerFilter.size>0 && !dropManagerFilter.has(agentMgrMap[a.agentCode])) return false;
    return true;
  });
}

function renderAgentLegend(){
  const el=document.getElementById('agent-legend');
  const countMap={};
  st.allClients.forEach(c=>{ const code=c.agentCode; if(code) countMap[code]=(countMap[code]||0)+1; });
  const visible=getLegendAgents();
  const allOn=visible.length>0&&visible.every(a=>st.activeAgents.has(a.agentCode));
  const allChip=`<span class="agent-chip${allOn?' on':''}" style="background:#455A64;margin-left:4px" onclick="selectAllAgents()">✓ כולם</span>`;
  el.innerHTML=allChip+visible.map(a=>`
    <span class="agent-chip${st.activeAgents.has(a.agentCode)?' on':''}"
          style="background:${a.color}"
          onclick="toggleAgent('${esc(a.agentCode)}')">
      <span class="agent-chip-count">${countMap[a.agentCode]||0}</span>${esc(a.agentName)}
    </span>`).join('');
}

function toggleAgent(code){
  if(st.activeAgents.has(code)) st.activeAgents.delete(code); else st.activeAgents.add(code);
  renderAgentLegend(); renderAll();
}

function selectAllAgents(){
  const visible=getLegendAgents();
  const allOn=visible.every(a=>st.activeAgents.has(a.agentCode));
  if(allOn){ visible.forEach(a=>st.activeAgents.delete(a.agentCode)); }
  else{ visible.forEach(a=>st.activeAgents.add(a.agentCode)); }
  renderAgentLegend(); renderAll();
}

// ── SADRAN BUTTON ─────────────────────────────────────────────────────────
function renderSadranBtn(){

function toggleSadranFilter(){

}

// ── CARD RENDER ───────────────────────────────────────────────────────────
function renderClientList(){
  const el=document.getElementById('client-list');
  const list=displayClients();
  if(!list.length){
    el.innerHTML='<div class="placeholder"><div class="placeholder-icon">📭</div><div class="placeholder-text">אין לקוחות</div><div class="placeholder-sub">נסה לשנות את הסינון</div></div>';
    return;
  }
  // Re-index from filtered list so numbers start at 1 regardless of active filters
  const visitOrderMap={};
  if(st.sortMode==='visit'&&st.visitOrder.length) list.forEach((c,i)=>visitOrderMap[String(c.custId)]=i+1);
  el.innerHTML=list.map((c,i)=>{
    const color=agentColor(c.agentCode);
    const noGps=!c.lat||!c.lng||c.gpsSource==='no-gps';
    const isSel=st.selectedId===c.custId;
    const dayBadge=c.dayNum?`<span class="day-badge">${DAY_LBL[c.dayNum]||'?'}</span>`:'';
    const isIce=c.iceOnly===true;
    const _s=c.avg6Sales>0?c.avg6Sales:0;
    const salesAmt=_s>0?(_s>=1000?`₪${(_s/1000).toFixed(1)}K`:`₪${Math.round(_s)}`):'';
    const salesBadge=salesAmt?`<span style="background:#E8F5E9;color:#2E7D32;font-size:9px;font-weight:700;padding:2px 6px;border-radius:8px;flex-shrink:0;margin-left:4px;border:1px solid #A5D6A7;white-space:nowrap">FORMULA ${salesAmt}</span>`:'';
    const _ice=c.avg6IceSales>0?c.avg6IceSales:0;
    const iceAmt=_ice>0?(_ice>=1000?`₪${(_ice/1000).toFixed(1)}K`:`₪${Math.round(_ice)}`):'';
    const iceSalesBadge=iceAmt?`<span style="background:#EDE7F6;color:#4527A0;font-size:9px;font-weight:700;padding:2px 6px;border-radius:8px;flex-shrink:0;margin-left:4px;border:1px solid #B39DDB;white-space:nowrap">מש׳ ${iceAmt}</span>`:'';
    const changedMark=c._changed?`<span class="changed-badge">✏️</span>`:'';
    const newBadge=c._isNew?`<span style="background:#FF8F00;color:#fff;font-size:9px;font-weight:900;padding:2px 7px;border-radius:10px;flex-shrink:0;margin-left:4px">🆕 חדש</span>`:'';
    const iceBadge=isIce?`<span style="background:#0288D1;color:#fff;font-size:9px;font-weight:900;padding:2px 7px;border-radius:10px;flex-shrink:0;margin-left:4px;white-space:nowrap">❄️ ICE</span>`:'';
    const secondVisitBadge=c._isSecondVisit?`<span style="background:#7B1FA2;color:#fff;font-size:9px;font-weight:900;padding:2px 7px;border-radius:10px;flex-shrink:0;margin-left:4px">🔁 ביקור שני</span>`:'';
    const ov2=st.overrides[String(c.custId)]||{};
    const hasSecondDay=ov2.secondDay!==undefined;
    const addDayBtn=!c._isSecondVisit&&!hasSecondDay
      ?`<span class="act-btn" onclick="openAddDayPicker(event,'${c.custId}')" title="להוסיף יום">➕</span>`:'';
    const removeSecondBtn=!c._isSecondVisit&&hasSecondDay
      ?`<span class="act-btn" style="color:#C62828" onclick="removeSecondDay('${c.custId}')" title="הסר ביקור שני">🔁✕</span>`:'';
    const removeSecondVisitBtn=c._isSecondVisit
      ?`<span class="act-btn" style="color:#C62828" onclick="removeSecondDay('${c.custId}')" title="הסר ביקור שני">✕</span>`:'';
    const addrText=esc(c.address||'');
    const vNum=visitOrderMap[String(c.custId)];
    return `<div class="client-card${noGps?' no-gps':''}${isSel?' selected':''}${c._isNew?' new-client':''}${isIce?' ice-client':''}"
          style="border-right-color:${color}${c._isNew?';border:1.5px solid #FFD600;border-right:4px solid #FF8F00':''}${isIce?';border:1.5px solid #81D4FA;border-right:4px solid #0288D1':''}"
          data-id="${c.custId}" onclick="selectClient('${c.custId}')">
      <div class="c-drag" style="display:flex;align-items:center;justify-content:center;width:28px;flex-shrink:0;align-self:stretch;cursor:grab;touch-action:none;user-select:none">
        ${vNum===1&&st.startCustId===String(c.custId)
          ?`<span class="visit-num" style="background:#E53935" title="נקודת התחלה">▶</span>`
          :vNum
            ?`<span class="visit-num">${vNum}</span>`
            :`<span style="font-size:14px;color:#bbb;line-height:1">⠿</span>`}
      </div>
      <div class="c-body">
        <div class="c-name">${changedMark}${esc(c.custName||'')}${newBadge}${secondVisitBadge}</div>
        <div class="c-sub">
          <span class="agent-badge" style="background:${color};cursor:pointer" onclick="openAgentPopup(event,'${c.custId}')">${esc(c.agentName||c.agentCode||'')}</span>
          ${iceBadge}${dayBadge}${salesBadge}${iceSalesBadge}
          ${addrText?`<span style="color:var(--mid);margin-right:4px;font-size:9px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${addrText}</span>`:''}
        </div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0">
        ${c.custId?`<span class="c-id">${c.custId}</span>`:''}
        <div class="c-actions">
          ${!c._isSecondVisit?`<span class="act-btn" onclick="openDayPopup(event,'${c.custId}',${c.dayNum||'null'})" title="שנה יום">📅</span>`:''}
          ${addDayBtn}${removeSecondBtn}${removeSecondVisitBtn}
          ${!c._isSecondVisit?(noGps
            ?`<span class="no-gps-badge" onclick="openGpsFix(event,'${c.custId}','${esc(c.custName||'')}','${esc(c.city||'')}','${esc(c.address||'')}')">📍 GPS</span>`
            :`<span class="act-btn" onclick="openAddrModal(event,'${c.custId}','${esc(c.custName||'')}','${esc(c.city||'')}','${esc(c.address||'')}')" title="תיקון מיקום">📍</span>`)
          :''}
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── SELECT CLIENT ─────────────────────────────────────────────────────────
function selectClient(id){
  const wasSelected=st.selectedId===id;
  st.selectedId=wasSelected?null:id;
  renderClientList();
  if(st.tab==='map'||window.innerWidth>=700){
    if(!wasSelected){
      const c=displayClients().find(x=>x.custId===id);
      if(c&&c.lat&&c.lng&&map) setTimeout(()=>map.flyTo([c.lat,c.lng],17,{duration:1}),50);
    }
    renderMap();
  }
}

function setTab(t){
  st.tab=t;
  document.getElementById('tab-list').classList.toggle('active',t==='list');
  document.getElementById('tab-map').classList.toggle('active',t==='map');
  if(window.innerWidth<700){
    document.getElementById('list-pane').style.display=t==='list'?'block':'none';
    document.getElementById('map-pane').classList.toggle('active',t==='map');
  }
  if(t==='map'||window.innerWidth>=700) renderMap();
}

// ── AGENT POPUP ───────────────────────────────────────────────────────────
let _agentPopCustId=null;
function openAgentPopup(event, custId){
  event.stopPropagation();
  _agentPopCustId=custId;

// ── MAP ────────────────────────────────────────────────────────────────────
let map=null,mapMarkers=[],mapPolylines=[],markerCluster=null,sortable=null;
let baseTileLayer=null,currentTileKey='osm';
const TILE_DEFS={
  osm:      {icon:'🏠',label:'בתים',    url:'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',         opts:{attribution:'© OSM',subdomains:'abc',maxZoom:19}},
  light:    {icon:'☁', label:'בהיר',    url:'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png', opts:{attribution:'© CartoDB',subdomains:'abcd',maxZoom:19}},
  satellite:{icon:'🛰',label:'לוויין',  url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',opts:{attribution:'© Esri',maxZoom:19}},
};
const TILE_ORDER=['osm','light','satellite'];
function setTile(key){
  if(!map) return;
  if(baseTileLayer) map.removeLayer(baseTileLayer);
  const d=TILE_DEFS[key]; baseTileLayer=L.tileLayer(d.url,d.opts).addTo(map); currentTileKey=key;
  const btn=document.getElementById('tile-btn'); if(btn) btn.innerHTML=d.icon+' '+d.label;
}
function cycleTile(){ setTile(TILE_ORDER[(TILE_ORDER.indexOf(currentTileKey)+1)%TILE_ORDER.length]); }

function renderMap(){
  if(!map){
    map=L.map('map',{zoomControl:false}).setView([32.0,34.9],10);
    L.control.zoom({position:'bottomright'}).addTo(map);
    setTile('osm');
    initLasso();
    map.on('click', async(e)=>{
      if(!gpsCorrectMode||!gpsCorrectId) return;
      map.getContainer().style.cursor='';
      const {lat,lng}=e.latlng;
      const IL={minLat:29.3,maxLat:33.5,minLng:34.2,maxLng:35.9};
      if(lat<IL.minLat||lat>IL.maxLat||lng<IL.minLng||lng>IL.maxLng){
        showToast('❌ מחוץ לגבולות ישראל'); gpsCorrectMode=false; gpsCorrectId=null; renderMap(); return;
      }
      const la=+lat.toFixed(6), lo=+lng.toFixed(6);
      const id=String(gpsCorrectId);
      gpsCorrections[id]={lat:la,lng:lo};
      try{const loc=JSON.parse(localStorage.getItem('fr_gps_local')||'{}');loc[id]={lat:la,lng:lo};localStorage.setItem('fr_gps_local',JSON.stringify(loc));}catch(_){}
      st.allClients=st.allClients.map(c=>String(c.custId)===id?{...c,lat:la,lng:lo,gpsSource:'correction'}:c);
      gpsCorrectMode=false; gpsCorrectId=null;
      renderAll();
      showToast('✅ מיקום נשמר');
      apiFetch(API+'/save-gps',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({custId:id,lat:la,lng:lo})}).catch(_=>{});
    });
  }
  mapMarkers.forEach(m=>m.remove()); mapMarkers=[];
  mapPolylines.forEach(p=>p.remove()); mapPolylines=[];
  if(markerCluster){markerCluster.clearLayers();map.removeLayer(markerCluster);}
  markerCluster=L.markerClusterGroup({
    maxClusterRadius:40,disableClusteringAtZoom:14,
    iconCreateFunction(cluster){
      const marks=cluster.getAllChildMarkers();
      const colorMap={};
      marks.forEach(m=>{const c=m._agColor||'#999';colorMap[c]=(colorMap[c]||0)+1;});
      const colors=Object.keys(colorMap);
      const sz=38;
      const gradStop=colors.length===1?colors[0]:`conic-gradient(${colors.map((c,i)=>`${c} ${i/colors.length*360}deg ${(i+1)/colors.length*360}deg`).join(',')})`;
      const orders=marks.map(m=>m._visitNum||0).filter(n=>n>0);
      const label=orders.length>1?`${Math.min(...orders)}-${Math.max(...orders)}`:orders.length===1?String(orders[0]):String(marks.length);
      const fsize=label.length>4?9:label.length>2?11:13;
      return L.divIcon({className:'',html:`<div style="background:${gradStop};color:#fff;width:${sz}px;height:${sz}px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2.5px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.35);font-size:${fsize}px;font-weight:900">${label}</div>`,iconSize:[sz,sz],iconAnchor:[sz/2,sz/2]});
    }
  });

  const list=displayClients().filter(c=>c.lat&&c.lng&&c.gpsSource!=='no-gps');
  // Re-index from filtered map list so visit numbers start at 1 for visible clients
  const mapVisitOrderMap={};
  if(st.sortMode==='visit'&&st.visitOrder.length) list.forEach((c,i)=>mapVisitOrderMap[String(c.custId)]=i+1);

  // Jitter: spread markers that share exact GPS (2+ agents at same address)
  const _cc={},_ci={};
  list.forEach(c=>{const k=`${c.lat},${c.lng}`;_cc[k]=(_cc[k]||0)+1;});
  const jList=list.map(c=>{
    const k=`${c.lat},${c.lng}`;
    if(_cc[k]>1){
      const idx=_ci[k]=(_ci[k]||0)+1;
      const angle=(idx/_cc[k])*2*Math.PI;
      const r=0.00012; // ~13m radius
      return{...c,lat:c.lat+r*Math.sin(angle),lng:c.lng+r*Math.cos(angle)};
    }
    return c;
  });

  const bounds=[];

  jList.forEach(c=>{
    const color=agentColor(c.agentCode);
    const isSel=st.selectedId===c.custId;
    const sz=c._isNew?30:24;
    const vNum=mapVisitOrderMap[String(c.custId)];
    const markerLabel=vNum?String(vNum):(DAY_LBL[c.dayNum]||'?');
    const markerInner=c._isNew
      ?`<div style="background:#FF8F00;color:#fff;width:${sz}px;height:${sz}px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;border:3px solid #FFD600;box-shadow:0 2px 10px rgba(255,143,0,.6)">🆕</div>`
      :c.iceOnly===true
      ?`<div style="background:#0288D1;color:#fff;width:${sz}px;height:${sz}px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;border:3px solid #81D4FA;box-shadow:0 2px 10px rgba(2,136,209,.6);flex-direction:column;gap:0;line-height:1.1"><span style="font-size:${vNum?12:14}px;line-height:1">❄️</span>${vNum?`<span style="font-size:9px;font-weight:900;margin-top:-1px">${vNum}</span>`:''}</div>`
      :(()=>{const hasSadran=!!c.sadran;const badge=hasSadran?`<div style="position:absolute;top:-6px;right:-6px;font-size:13px;line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))">💪</div>`:'';return`<div style="position:relative;width:${sz}px;height:${sz}px"><div style="background:${color};color:#fff;width:${sz}px;height:${sz}px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4)">${markerLabel}</div>${badge}</div>`;})();
    const icon=L.divIcon({className:'',html:markerInner,iconSize:[sz,sz],iconAnchor:[sz/2,sz/2]});
    const m=L.marker([c.lat,c.lng],{icon,zIndexOffset:0});
    m._agColor=color; m._custId=String(c.custId); m._visitNum=vNum||0;
    const safeName=esc(c.custName||'');
    m.bindTooltip(`${esc(c.custName||'')} · ${esc(c.agentName||'')}`,{permanent:false,direction:'right',opacity:1,className:'fr-tip'});
    const curDay=st.overrides[String(c.custId)]?.dayNum??c.dayNum;
    const dayBtnsHtml=[1,2,3,4,5].map(d=>{
      const on=d===curDay;
      return `<button type="button" onclick="setClientDayFromMap('${c.custId}',${d})" style="width:28px;height:26px;border-radius:6px;background:${on?'#1565C0':'#E3F2FD'};color:${on?'#fff':'#1565C0'};border:1.5px solid #1565C0;font-size:12px;font-weight:900;cursor:pointer">${DAY_LBL[d]}</button>`;
    }).join('');
    const gpsBtnHtml=`<button type="button" onclick="openGpsFixFromMap('${c.custId}','${safeName}')" style="margin-top:6px;width:100%;background:#1565C0;color:#fff;border:none;border-radius:8px;padding:5px;font-size:11px;font-weight:700;cursor:pointer">📍 תיקון מיקום</button>`;
    m.bindPopup(`<div style="min-width:160px;direction:rtl"><b>${safeName}</b><br><span style="color:${color};font-weight:700">${esc(c.agentName||c.agentCode||'')}</span>${c.address?'<br><span style="font-size:11px;color:#666">'+esc(c.address)+'</span>':''}${c.city?'<br><span style="font-size:11px;color:#1565C0;font-weight:600">'+esc(c.city)+'</span>':''}<br><div style="display:flex;gap:3px;margin-top:5px">${dayBtnsHtml}</div>${gpsBtnHtml}</div>`);
    markerCluster.addLayer(m);
    mapMarkers.push(m);
    bounds.push([c.lat,c.lng]);
  });

  map.addLayer(markerCluster);
  renderRoutePolyline();
  if(bounds.length) map.fitBounds(bounds,{padding:[10,10]});
  setTimeout(()=>map.invalidateSize(),100);
}

function renderRoutePolyline(){
  mapPolylines.forEach(p=>p.remove()); mapPolylines=[];
  if(!map) return;
  if(st.sortMode!=='visit'||!st.visitOrder.length) return;
  if(st.activeDays.size!==1) return; // only for single-day view
  const list=displayClients().filter(c=>c.lat&&c.lng&&c.gpsSource!=='no-gps');
  if(list.length<2) return;
  // Only draw when exactly one agent is visible — multiple agents = messy
  const agentSet=new Set(list.map(c=>c.agentCode));
  if(agentSet.size!==1) return;
  const color=st.visitSource==='version'?'#7B1FA2':'#1565C0';
  for(let i=1;i<list.length;i++){
    const prev=list[i-1],curr=list[i];
    if(!prev.lat||!prev.lng||!curr.lat||!curr.lng) continue;
    const p=L.polyline([[prev.lat,prev.lng],[curr.lat,curr.lng]],{
      color,weight:2.5,opacity:.75,dashArray:'6,7'
    }).addTo(map);
    mapPolylines.push(p);
  }
}

// ── LASSO ─────────────────────────────────────────────────────────────────
let lassoControl=null, _lassoActive=false;

function initLasso(){
  if(!map||lassoControl) return;
  lassoControl=L.control.lasso({intersect:true}).addTo(map);
  map.on('lasso.finished', e=>{
    _lassoActive=false;
    updateLassoBtn(false);
    if(!e.layers||!e.layers.length){ clearLasso(); return; }
    const ids=new Set();
    e.layers.forEach(layer=>{
      if(layer._custId) ids.add(layer._custId);
    });
    st.lassoIds=ids;
    document.getElementById('lasso-clear').classList.add('visible');
    document.getElementById('lasso-btn').classList.remove('active');
    document.getElementById('lasso-btn').classList.add('has-selection');
    renderAll();
    // scroll list to top
    const lp=document.getElementById('list-pane'); if(lp) lp.scrollTop=0;
  });
  map.on('lasso.enabled', ()=>{ _lassoActive=true; updateLassoBtn(true); });
  map.on('lasso.disabled', ()=>{ _lassoActive=false; if(!st.lassoIds) updateLassoBtn(false); });
}

function toggleLasso(){
  if(!map) return;
  if(!lassoControl) initLasso();
  if(_lassoActive){ lassoControl.disable(); }
  else{ if(st.lassoIds){ clearLasso(); }else{ lassoControl.enable(); } }
}

function clearLasso(){
  st.lassoIds=null;
  _lassoActive=false;
  if(lassoControl) lassoControl.disable();
  updateLassoBtn(false);
  document.getElementById('lasso-btn').classList.remove('active','has-selection');
  document.getElementById('lasso-clear').classList.remove('visible');
  renderAll();
}

function updateLassoBtn(active){
  const btn=document.getElementById('lasso-btn');
  if(!btn) return;
  btn.classList.toggle('active',active);
}

async function exportXLSX(){
  const list=displayClients();
  if(!list.length) return;
  const btn=document.querySelector('.export-btn');
  const orig=btn.innerHTML; btn.innerHTML='⏳...'; btn.disabled=true;
  try{
    const rows=buildExportRows(list);
    const dayLblStr=[...st.activeDays].map(d=>DAY_LBL[d]||'').filter(Boolean).join('+');
    const r=await apiFetch(`${API}/api/export-route-xlsx`,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({rows, agentName:[...selectedCities].join(', ')||'', dayLabel:dayLblStr||'כל הימים'}),
    });
    if(!r.ok) throw new Error(r.status);
    const blob=await r.blob();
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url;
    const cityStr=[...selectedCities].slice(0,2).join('_')||'territory';
    a.download=`territory_${cityStr}_${new Date().toISOString().slice(0,10)}.xlsx`;
    a.click(); setTimeout(()=>URL.revokeObjectURL(url),5000);
  }catch(e){ alert('שגיאה: '+e.message); }
  finally{ btn.innerHTML=orig; btn.disabled=false; }
}

// ── SORTABLE DRAG REORDER ────────────────────────────────────────────────
function setupSortable(){
  if(sortable){sortable.destroy();sortable=null;}
  const el=document.getElementById('client-list');
  if(!el||typeof Sortable==='undefined') return;
  sortable=Sortable.create(el,{
    handle:'.c-drag', animation:150,
    onEnd(e){
      if(e.oldIndex===e.newIndex) return;
      const displayed=displayClients();
      const moved=displayed.splice(e.oldIndex,1)[0];
      displayed.splice(e.newIndex,0,moved);
      const dispIds=new Set(displayed.map(c=>c.custId));
      st.allClients=[...displayed,...st.allClients.filter(c=>!dispIds.has(c.custId))];
      if(st.sortMode==='visit'){
        if(e.newIndex===0&&moved.lat&&moved.lng){
          // Client pinned to #1 → becomes start point, re-compute rest from there
          computeVisitOrder(String(moved.custId));
          showToast('📍 סדר ביקור חושב מחדש — ' + (moved.name||moved.custId));
        } else {
          st.visitOrder=displayed.map(c=>String(c.custId));
        }
      }
      renderClientList();
      if(st.tab==='map'||window.innerWidth>=700) renderMap();
    }
  });
}

async function submitGpsAddress(){

      st.allClients=st.allClients.map(c=>String(c.custId)===id?{...c,lat:d.lat,lng:d.lng,address:addr}:c);
      apiFetch(API+'/save-gps',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({custId:id,lat:d.lat,lng:d.lng,address:addr})}).catch(_=>{});
      status.textContent=`✅ ${d.lat.toFixed(5)}, ${d.lng.toFixed(5)}`;
      setTimeout(()=>{ closeGpsModal(); renderAll(); },800);
    } else {
      status.textContent='❌ לא נמצא — נסה כתובת אחרת';
    }
  }catch(e){ status.textContent='❌ שגיאה: '+e.message; }
}

// ── TOAST ─────────────────────────────────────────────────────────────────
function showToast(msg,ms=2500){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';t.style='position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#1565C0;color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;font-weight:700;z-index:9999;pointer-events:none;transition:opacity .3s';document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity='1';clearTimeout(t._to);t._to=setTimeout(()=>t.style.opacity='0',ms);
}

// ── SAVE VERSION ─────────────────────────────────────────────────────────
function openSaveVersionModal(){
  const d=new Date();
  const pad=n=>String(n).padStart(2,'0');
  const def=`${pad(d.getDate())}.${pad(d.getMonth()+1)} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  document.getElementById('sv-name-input').value=def;
  document.getElementById('sv-status').textContent='';
  document.getElementById('save-version-modal').style.display='flex';
  setTimeout(()=>document.getElementById('sv-name-input').select(),80);
}

async function doSaveVersion(){
  const name=document.getElementById('sv-name-input').value.trim();
  if(!name) return;
  const btn=document.getElementById('sv-save-btn');
  const status=document.getElementById('sv-status');
  btn.disabled=true; status.textContent='⏳ שומר...';
  try{
    const r=await apiFetch(`${API}/api/gps/save-version`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name, visitOrder: st.visitOrder.length?st.visitOrder:displayClients().map(c=>String(c.custId))})
    });
    if(!r.ok) throw new Error(r.status);
    const j=await r.json();
    status.textContent=`✅ נשמר — ${j.gpsCount||0} GPS · ${j.overridesCount||0} שינויים`;
    setTimeout(()=>document.getElementById('save-version-modal').style.display='none',1400);
  }catch(e){ status.textContent='❌ שגיאה: '+e.message; }
  finally{ btn.disabled=false; }
}

function previewVersionOrder(orderJson, versionName){
  try{
    const order=JSON.parse(orderJson);
    if(!order||!order.length){ showToast('הגרסה לא מכילה סדר ביקור'); return; }
    st.loadedVersionOrder=order.map(String);
    st.visitOrder=[...st.loadedVersionOrder];
    st.sortMode='visit'; st.visitSource='version'; st.startCustId=null;
    _updateVisitBtns();
    renderClientList();
    if(st.tab==='map'||window.innerWidth>=700) renderMap();
    document.getElementById('version-history-modal').style.display='none';
    showToast('📋 מציג סדר ביקור: '+versionName);
  }catch(e){ showToast('שגיאה בטעינת הסדר'); }
}

async function openVersionHistory(){
  document.getElementById('version-history-modal').style.display='flex';
  const el=document.getElementById('version-list');
  el.innerHTML='<div style="text-align:center;padding:20px;color:#90A4AE;">⏳ טוען...</div>';
  try{
    const r=await apiFetch(`${API}/api/gps/versions`);
    if(!r.ok) throw new Error(r.status);
    const list=await r.json();
    if(!list.length){
      el.innerHTML='<div style="text-align:center;padding:24px;color:#90A4AE;font-size:13px;">אין גרסאות שמורות</div>';
      return;
    }
    const pad=n=>String(n).padStart(2,'0');
    el.innerHTML=list.map(v=>{
      const dt=new Date(v.createdAt);
      const dtStr=`${pad(dt.getDate())}.${pad(dt.getMonth()+1)} ${pad(dt.getHours())}:${pad(dt.getMinutes())}`;
      const hasOrder=v.visitOrder&&v.visitOrder.length>0;
      const orderJson=hasOrder?encodeURIComponent(JSON.stringify(v.visitOrder)):'';
      return `<div class="vh-item">
        <div class="vh-item-info">
          <div class="vh-item-name">${esc(v.name)}</div>
          <div class="vh-item-meta">${dtStr} · GPS: ${v.gpsCount||0} · שינויים: ${v.overridesCount||0}${hasOrder?' · 📍 '+v.visitOrder.length+' ביקורים':''}</div>
        </div>
        <div style="display:flex;gap:6px;flex-shrink:0">
          ${hasOrder?`<button type="button" class="vh-item-restore" style="background:#37474F" onclick="previewVersionOrder(decodeURIComponent('${orderJson}'), '${esc(v.name)}')">👁 סדר ביקור לפי גרסה</button>`:''}
          <button type="button" class="vh-item-restore" onclick="restoreVersion('${esc(v.id)}')">שחזר</button>
        </div>
      </div>`;
    }).join('');
  }catch(e){
    el.innerHTML=`<div style="text-align:center;padding:20px;color:#C62828;">❌ ${esc(String(e))}</div>`;
  }
}

async function restoreVersion(id){
  if(!confirm('לשחזר גרסה זו? השינויים הנוכחיים ידרסו.')) return;
  try{
    const r=await apiFetch(`${API}/api/gps/restore-version`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id})
    });
    if(!r.ok) throw new Error(r.status);
    const j=await r.json();
    try{localStorage.setItem('ter_pending_visit_order',JSON.stringify(j.visitOrder||[]));}catch{}
    document.getElementById('version-history-modal').style.display='none';
    showToast('✅ גרסה שוחזרה — מרענן...',2000);
    setTimeout(()=>location.reload(),1800);
  }catch(e){ showToast('❌ שגיאה: '+e.message); }
}

// ── EXPORT ALL DAYS ───────────────────────────────────────────────────────
async function exportAllDaysXLSX(){
  // All clients regardless of active day filter
  const activeDaysBak=new Set(st.activeDays);
  st.activeDays=new Set([0,1,2,3,4,5,6]);
  const list=displayClients();
  st.activeDays=activeDaysBak;
  if(!list.length) return;
  const btn=Array.from(document.querySelectorAll('.export-btn')).find(b=>b.textContent.includes('כל'));
  if(btn){const orig=btn.innerHTML;btn.innerHTML='⏳...';btn.disabled=true;setTimeout(()=>{btn.innerHTML=orig;btn.disabled=false;},8000);}
  try{
    const rows=buildExportRows(list);
    const r=await apiFetch(`${API}/api/export-route-xlsx`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({rows, agentName:[...selectedCities].slice(0,2).join('_')||'territory', dayLabel:'כל הימים'}),
    });
    if(!r.ok) throw new Error(r.status);
    const blob=await r.blob();
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url;
    const cityStr=[...selectedCities].slice(0,2).join('_')||'territory';
    a.download=`territory_${cityStr}_כל-הימים_${new Date().toISOString().slice(0,10)}.xlsx`;
    a.click(); setTimeout(()=>URL.revokeObjectURL(url),5000);
  }catch(e){ alert('שגיאה: '+e.message); }
}

function buildExportRows(list){
  return list.map((c,i)=>{
    const ov=st.overrides[String(c.custId)]||{};
    const orig=st.allClients.find(x=>x.custId===c.custId)||c;
    return {
      currentPos:i+1, custId:c.custId||'', custName:c.custName||'',
      hevra:c.hevra||'FORMULA', iceOnly:c.hevra==='ICE',
      city:c.city||'', address:c.address||'',
      agentCode:c.agentCode||'', agentName:c.agentName||'',
      dayLabel:DAY_LBL[c.dayNum]||'', lat:c.lat||null, lng:c.lng||null,
      gpsSource:c.gpsSource||null,
      corrected:c.gpsSource==='correction',
      noOrder:!c.dayNum,
      dayChanged:ov.dayNum!==undefined, agentChanged:!!ov.agentCode,
      originalDayLabel: ov.dayNum!==undefined ? (DAY_LBL[orig.dayNum]||'') : '',
      originalAgentName: ov.agentCode ? (orig.agentName||'') : '',
    };
  });
}

// ── INIT ──────────────────────────────────────────────────────────────────
async function init(){
  loadOverrides();
  try{const r=await fetch(API+'/auth/pbi',{credentials:'include'});if(r.ok){const j=await r.json();if(j.ok&&j.token)localStorage.setItem(TOKEN_KEY,j.token);}}catch(_){}
  if(!getToken()){location.href=(location.hostname.includes('sverdlik-apps')?'/formula-road':('formula-road.html'))+'?next=territory.html';return;}
  await Promise.all([loadCities(), loadDropAgents(), loadManagers(), loadCorrections(), loadAiGps(), loadTabletGps()]);
  // Default: AI Google GPS (tablet GPS off)
  if(!selectedCities.size && allCities.length){
    allCities.forEach(c=>selectedCities.add(c));
    renderCityItems(allCities); updateCityBtn(); onCitiesChanged();
  }
}
init();
</script>
