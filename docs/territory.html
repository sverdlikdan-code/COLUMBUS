<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ניתוח שטחים — FORMULA ROAD</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0D1B2E;color:#E8F0FC;height:100dvh;display:flex;flex-direction:column;overflow:hidden;}

/* ── TOP BAR ── */
.topbar{background:linear-gradient(90deg,#0D1B2E 0%,#1A3F7C 100%);border-bottom:1.5px solid #2A5AAA;padding:0 16px;height:54px;display:flex;align-items:center;gap:12px;flex-shrink:0;z-index:1000;}
.topbar-back{background:#1A3F7C;border:1.5px solid #2A5AAA;color:#C9D6F0;font-size:13px;font-weight:800;cursor:pointer;padding:6px 14px;border-radius:20px;white-space:nowrap;}
.topbar-back:hover{background:#2E6FAD;color:#fff;}
.topbar-title{font-size:15px;font-weight:900;color:#fff;letter-spacing:.3px;white-space:nowrap;}
.topbar-sub{font-size:10.5px;font-weight:700;color:#7098CC;letter-spacing:.8px;text-transform:uppercase;}
.topbar-spacer{flex:1;}
/* ── SEARCHABLE CITY PICKER ── */
.city-picker{position:relative;min-width:220px;}
.city-input-wrap{display:flex;align-items:center;background:#1A3F7C;border:1.5px solid #2A5AAA;border-radius:10px;overflow:hidden;cursor:text;}
.city-input-wrap:focus-within{border-color:#C9A84C;}
.city-inp{background:transparent;border:none;outline:none;color:#E8F0FC;font-size:13px;font-weight:700;padding:7px 10px;width:100%;direction:rtl;font-family:inherit;}
.city-inp::placeholder{color:#7098CC;}
.city-arrow-btn{background:transparent;border:none;color:#7098CC;padding:0 10px;cursor:pointer;font-size:12px;flex-shrink:0;}
.city-drop{position:absolute;top:calc(100% + 4px);right:0;left:0;background:#0A1628;border:1.5px solid #2A5AAA;border-radius:10px;overflow:hidden;z-index:3000;box-shadow:0 8px 32px rgba(0,0,0,.6);display:none;max-height:320px;flex-direction:column;}
.city-drop.open{display:flex;}
.city-search-wrap{padding:8px 10px;border-bottom:1px solid #1A3F7C;flex-shrink:0;}
.city-search-inp{width:100%;background:#0D1B2E;border:1.5px solid #1A3F7C;border-radius:7px;color:#E8F0FC;font-size:12px;padding:6px 10px;outline:none;direction:rtl;font-family:inherit;}
.city-search-inp:focus{border-color:#C9A84C;}
.city-drop-list{overflow-y:auto;flex:1;}
.city-drop-item{padding:7px 14px;cursor:pointer;display:flex;align-items:center;gap:8px;border-bottom:1px solid #0D1B2E22;direction:rtl;}
.city-drop-item:hover{background:#1A3F7C44;}
.city-drop-item input[type=checkbox]{accent-color:#C9A84C;width:14px;height:14px;flex-shrink:0;cursor:pointer;}
.city-drop-item-name{font-size:13px;font-weight:700;color:#E8F0FC;flex:1;}
.city-drop-item-meta{font-size:10px;color:#7098CC;white-space:nowrap;}
.city-drop-empty{padding:16px;text-align:center;color:#7098CC;font-size:12px;}
.city-drop-apply{padding:9px 14px;border-top:1px solid #1A3F7C;flex-shrink:0;display:none;gap:8px;align-items:center;}
.city-apply-btn{flex:1;background:linear-gradient(135deg,#1A3F7C,#2E6FAD);border:none;color:#fff;font-size:12px;font-weight:800;padding:7px;border-radius:8px;cursor:pointer;}
.city-apply-btn:disabled{opacity:.4;cursor:default;}
.city-clear-btn{background:transparent;border:1px solid #2A5AAA;color:#7098CC;font-size:11px;padding:6px 10px;border-radius:8px;cursor:pointer;}
.city-loading{padding:16px;text-align:center;color:#7098CC;font-size:12px;display:flex;align-items:center;justify-content:center;gap:8px;}
.city-spin{width:16px;height:16px;border:2px solid #1A3F7C;border-top-color:#C9A84C;border-radius:50%;animation:spin .7s linear infinite;}
.reset-btn{background:transparent;border:1.5px solid #C9A84C;color:#C9A84C;font-size:12px;font-weight:800;padding:6px 12px;border-radius:20px;cursor:pointer;white-space:nowrap;}
.reset-btn:hover{background:#C9A84C22;}
.export-btn{background:linear-gradient(135deg,#1A6E3C,#22A05A);border:none;color:#fff;font-size:12px;font-weight:800;padding:6px 14px;border-radius:20px;cursor:pointer;white-space:nowrap;}

/* ── LAYOUT ── */
.main{display:flex;flex:1;overflow:hidden;}
#map{flex:1;min-width:0;}

/* ── SIDE PANEL ── */
.side{width:300px;flex-shrink:0;background:#0A1628;border-right:1.5px solid #1A3F7C;display:flex;flex-direction:column;overflow:hidden;}
.side-stats{padding:10px 14px;border-bottom:1px solid #1A3F7C;display:flex;gap:12px;flex-shrink:0;}
.stat-box{flex:1;background:#0D1B2E;border-radius:8px;padding:7px 10px;text-align:center;}
.stat-n{font-size:20px;font-weight:900;color:#C9A84C;}
.stat-l{font-size:10px;color:#7098CC;font-weight:700;text-transform:uppercase;}

/* agent filter pills */
.agent-pills{padding:8px 12px;border-bottom:1px solid #1A3F7C;display:flex;gap:6px;flex-wrap:wrap;flex-shrink:0;}
.agent-pill{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:800;cursor:pointer;border:2px solid transparent;transition:all .12s;color:#fff;-webkit-user-select:none;user-select:none;}
.agent-pill.off{opacity:.35;filter:grayscale(.7);}
.agent-pill .pill-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

/* client list */
.side-list{flex:1;overflow-y:auto;}
.agent-group{border-bottom:1px solid #0D1B2E;}
.agent-group-hdr{display:flex;align-items:center;gap:8px;padding:8px 14px 6px;position:sticky;top:0;z-index:10;}
.agent-group-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.agent-group-name{font-size:12px;font-weight:900;color:#E8F0FC;flex:1;}
.agent-group-cnt{font-size:11px;font-weight:700;color:#7098CC;}
.client-row{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 24px;cursor:pointer;border-bottom:1px solid #0D1B2E11;transition:background .1s;}
.client-row:hover{background:#1A3F7C22;}
.client-row.moved{background:#1A6E3C18;}
.client-row.moved .cr-name::after{content:' →';color:#22A05A;font-weight:900;}
.client-rn{width:20px;font-size:10px;font-weight:700;color:#7098CC;text-align:center;flex-shrink:0;}
.cr-body{flex:1;min-width:0;}
.cr-name{font-size:12px;font-weight:700;color:#E8F0FC;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cr-sub{font-size:10px;color:#7098CC;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cr-arrow{font-size:14px;color:#2A5AAA;flex-shrink:0;}

/* ── MOVE PANEL (bottom sheet) ── */
.move-panel{position:fixed;bottom:0;left:0;right:0;background:#0D1B2E;border-top:2px solid #1A3F7C;padding:16px 20px 24px;z-index:2000;transform:translateY(100%);transition:transform .22s ease;box-shadow:0 -8px 32px rgba(0,0,0,.5);}
.move-panel.open{transform:translateY(0);}
.mp-title{font-size:13px;font-weight:900;color:#fff;margin-bottom:4px;}
.mp-sub{font-size:11px;color:#7098CC;margin-bottom:14px;}
.mp-agents{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.mp-agent-btn{padding:8px 16px;border-radius:20px;border:2px solid transparent;font-size:12px;font-weight:800;cursor:pointer;color:#fff;transition:transform .1s,box-shadow .1s;}
.mp-agent-btn:hover{transform:scale(1.05);box-shadow:0 3px 12px rgba(0,0,0,.4);}
.mp-agent-btn.current{opacity:.4;cursor:default;pointer-events:none;}
.mp-cancel{background:transparent;border:1.5px solid #2A5AAA;color:#7098CC;font-size:12px;font-weight:800;padding:8px 20px;border-radius:20px;cursor:pointer;}
.mp-cancel:hover{border-color:#7098CC;color:#fff;}

/* ── SAVE / VARIANTS BUTTONS ── */
.save-btn{background:linear-gradient(135deg,#8B6914,#C9A84C);border:none;color:#fff;font-size:12px;font-weight:800;padding:6px 13px;border-radius:20px;cursor:pointer;white-space:nowrap;display:none;}
.save-btn:hover{filter:brightness(1.1);}
.variants-btn{background:#1A3F7C;border:1.5px solid #2A5AAA;color:#C9D6F0;font-size:12px;font-weight:800;padding:6px 13px;border-radius:20px;cursor:pointer;white-space:nowrap;}
.variants-btn:hover{background:#2E6FAD;color:#fff;}

/* ── VARIANTS DRAWER ── */
.drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:3500;display:none;opacity:0;transition:opacity .2s;}
.drawer-backdrop.open{display:block;opacity:1;}
.drawer{position:fixed;top:0;right:0;bottom:0;width:320px;max-width:95vw;background:#0A1628;border-left:2px solid #1A3F7C;z-index:4000;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s ease;box-shadow:-8px 0 32px rgba(0,0,0,.5);}
.drawer.open{transform:translateX(0);}
.drawer-hdr{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1.5px solid #1A3F7C;flex-shrink:0;}
.drawer-title{font-size:14px;font-weight:900;color:#fff;flex:1;}
.drawer-close{background:transparent;border:none;color:#7098CC;font-size:18px;cursor:pointer;padding:4px 8px;border-radius:6px;}
.drawer-close:hover{color:#fff;background:#1A3F7C;}
.drawer-list{flex:1;overflow-y:auto;padding:8px 0;}
.variant-item{padding:12px 16px;border-bottom:1px solid #0D1B2E;cursor:default;}
.variant-item:hover{background:#1A3F7C18;}
.variant-name{font-size:13px;font-weight:800;color:#E8F0FC;margin-bottom:3px;}
.variant-meta{font-size:10.5px;color:#7098CC;margin-bottom:8px;}
.variant-actions{display:flex;gap:8px;}
.variant-load{background:#1A3F7C;border:1.5px solid #2A5AAA;color:#C9D6F0;font-size:11px;font-weight:800;padding:5px 12px;border-radius:14px;cursor:pointer;}
.variant-load:hover{background:#2E6FAD;color:#fff;}
.variant-del{background:transparent;border:1.5px solid #5A1A1A;color:#F07070;font-size:11px;font-weight:800;padding:5px 10px;border-radius:14px;cursor:pointer;}
.variant-del:hover{background:#5A1A1A;}
.drawer-empty{padding:32px 16px;text-align:center;color:#7098CC;font-size:13px;}

/* ── DAY / SADRAN FILTER BAR ── */
.filter-bar{padding:6px 12px;border-bottom:1px solid #1A3F7C;display:flex;gap:5px;align-items:center;flex-wrap:wrap;flex-shrink:0;}
.day-btn{padding:3px 9px;border-radius:14px;font-size:11px;font-weight:800;cursor:pointer;border:1.5px solid #2A5AAA;color:#7098CC;background:transparent;transition:all .12s;}
.day-btn.on{background:#1A3F7C;color:#E8F0FC;border-color:#4A7ACC;}
.day-btn.all-btn{border-color:#C9A84C;color:#C9A84C;}
.day-btn.all-btn.on{background:#C9A84C22;color:#C9D6F0;}
.sadran-btn{padding:3px 10px;border-radius:14px;font-size:11px;font-weight:800;cursor:pointer;border:1.5px solid #00838F;color:#00838F;background:transparent;transition:all .12s;margin-right:6px;}
.sadran-btn.on{background:#00838F;color:#fff;}

/* ── CLIENT ROW METRICS ── */
.cr-metrics{display:flex;gap:8px;margin-top:2px;}
.cr-metric{font-size:9.5px;font-weight:700;color:#7098CC;white-space:nowrap;}
.cr-metric span{color:#C9A84C;}

/* ── AGENT STAT SALES ── */
.stat-sales{font-size:9px;color:#7098CC;font-weight:700;margin-top:2px;}

/* ── FOCUS / LASSO ── */
.client-row.focus-row{background:#C9A84C18;border-right:3px solid #C9A84C;}
.client-row.lasso-sel{background:#00838F18;border-right:3px solid #00838F;}
.lasso-btn{background:#1A3F7C;border:1.5px solid #2A5AAA;color:#C9D6F0;font-size:12px;font-weight:800;padding:6px 12px;border-radius:20px;cursor:pointer;white-space:nowrap;}
.lasso-btn:hover{background:#2E6FAD;color:#fff;}
.lasso-btn.on{background:#C9A84C;border-color:#C9A84C;color:#0D1B2E;}
.lasso-bulk{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#0A1628;border:2px solid #C9A84C;border-radius:14px;padding:10px 18px;z-index:3000;display:flex;align-items:center;gap:10px;box-shadow:0 4px 20px rgba(0,0,0,.6);font-size:12px;font-weight:800;color:#C9A84C;}
.lasso-bulk-agents{display:flex;gap:6px;}
.lasso-bulk-btn{padding:5px 12px;border-radius:14px;border:none;font-size:11px;font-weight:800;cursor:pointer;color:#fff;}
.lasso-bulk-cancel{background:transparent;border:1px solid #2A5AAA;color:#7098CC;font-size:11px;font-weight:800;padding:5px 10px;border-radius:14px;cursor:pointer;}

/* ── LOADING / EMPTY ── */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:12px;color:#7098CC;}
.spin{width:36px;height:36px;border:3px solid #1A3F7C;border-top-color:#C9A84C;border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:8px;color:#7098CC;font-size:14px;}

/* scrollbar */
.side-list::-webkit-scrollbar{width:4px;}
.side-list::-webkit-scrollbar-track{background:#0A1628;}
.side-list::-webkit-scrollbar-thumb{background:#1A3F7C;border-radius:2px;}

@media(max-width:700px){
  .side{width:100%;position:absolute;bottom:0;left:0;right:0;height:45vh;border-right:none;border-top:2px solid #1A3F7C;z-index:500;}
  .main{flex-direction:column;}
  #map{height:55vh;flex:none;}
}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <button type="button" class="topbar-back" onclick="location.href='formula-road.html'">← חזור</button>
  <div>
    <div class="topbar-title">🗺 ניתוח שטחים</div>
    <div class="topbar-sub">TERRITORY ANALYSIS</div>
  </div>
  <div class="topbar-spacer"></div>
  <div class="city-picker" id="city-picker">
    <div class="city-input-wrap" onclick="showCityDrop()">
      <input class="city-inp" id="city-inp" placeholder="בחר עיר..." readonly autocomplete="off">
      <button type="button" class="city-arrow-btn" tabindex="-1">▾</button>
    </div>
    <div class="city-drop" id="city-drop">
      <div class="city-search-wrap">
        <input class="city-search-inp" id="city-search" placeholder="חיפוש עיר..." oninput="filterCities(this.value)" autocomplete="off">
      </div>
      <div class="city-drop-list" id="city-drop-list"></div>
      <div class="city-drop-apply" id="city-drop-apply">
        <button type="button" class="city-clear-btn" onclick="clearCitySelection()">נקה</button>
        <button type="button" class="city-apply-btn" id="city-apply-btn" onclick="applySelectedCities()" disabled>טען (<span id="city-sel-count">0</span>)</button>
      </div>
    </div>
  </div>
  <button type="button" class="lasso-btn" id="lasso-btn" onclick="toggleLasso()">⬡ לאסו</button>
  <button type="button" class="save-btn" id="save-btn" onclick="saveVariant()">💾 שמור</button>
  <button type="button" class="variants-btn" onclick="openDrawer()">📂 וריאנטים</button>
  <button type="button" class="reset-btn" onclick="resetMoves()" id="reset-btn" style="display:none">↩ איפוס</button>
  <button type="button" class="export-btn" onclick="exportXlsx()" id="export-btn" style="display:none">📥 Excel</button>
</div>

<!-- MAIN -->
<div class="main">
  <div id="map"></div>
  <div class="side" id="side">
    <div class="loading" id="side-loading" style="display:none"><div class="spin"></div><span>טוען...</span></div>
    <div class="empty" id="side-empty">
      <div style="font-size:40px">🏙</div>
      <div>בחר עיר כדי להתחיל</div>
    </div>
    <div id="side-stats" class="side-stats" style="display:none"></div>
    <div id="agent-pills" class="agent-pills" style="display:none"></div>
    <div id="filter-bar" class="filter-bar" style="display:none"></div>
    <div class="side-list" id="side-list"></div>
  </div>
</div>

<!-- VARIANTS DRAWER -->
<div class="drawer-backdrop" id="drawer-backdrop" onclick="closeDrawer()"></div>
<div class="drawer" id="variants-drawer">
  <div class="drawer-hdr">
    <span class="drawer-title">📂 וריאנטים שמורים</span>
    <button type="button" class="drawer-close" onclick="closeDrawer()">✕</button>
  </div>
  <div class="drawer-list" id="drawer-list">
    <div class="drawer-empty">טוען...</div>
  </div>
</div>

<!-- LASSO BULK MOVE -->
<div class="lasso-bulk" id="lasso-bulk" style="display:none">
  <span id="lasso-count">0 לקוחות</span>
  <div class="lasso-bulk-agents" id="lasso-bulk-agents"></div>
  <button type="button" class="lasso-bulk-cancel" onclick="clearLasso()">✕</button>
</div>

<!-- MOVE PANEL -->
<div class="move-panel" id="move-panel">
  <div class="mp-title" id="mp-title"></div>
  <div class="mp-sub">העבר ל:</div>
  <div class="mp-agents" id="mp-agents"></div>
  <button type="button" class="mp-cancel" onclick="closeMove()">ביטול</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-FhPn/2P/fJGhQLeNWDn9B/2Gml2bPOrKJwFqJXgR3xOPYxWg5mYQ5XZdhUSugZT0" crossorigin="anonymous"></script>
<script>
const API = 'https://api.sverdlik-apps.site';
const TOKEN_KEY = 'frToken';
const AGENT_COLORS = ['#1565C0','#E53935','#2E7D32','#F57C00','#6A1B9A','#00838F','#AD1457','#0277BD','#558B2F','#6D4C41','#37474F','#7B1FA2'];

// ── Auth ──
function getToken(){ return localStorage.getItem(TOKEN_KEY)||''; }
async function apiFetch(url, opts={}){
  const r = await fetch(url,{...opts,headers:{...opts.headers,'x-session':getToken(),'Content-Type':'application/json'}});
  if(r.status===401){
    // Try silent PBI re-auth via cookie
    try{
      const pbi = await fetch(API+'/auth/pbi',{credentials:'include'});
      if(pbi.ok){ const j=await pbi.json(); if(j.ok&&j.token){ localStorage.setItem('frToken',j.token); const retry=await fetch(url,{...opts,headers:{...opts.headers,'x-session':j.token,'Content-Type':'application/json'}}); if(retry.status!==401) return retry; } }
    }catch(_){}
    alert('נדרשת התחברות מחדש'); location.href='formula-road.html'; throw new Error('401');
  }
  return r;
}

// ── State ──
let cityData = null;
let colorMap = {};
let visibleAgents = new Set();
let moves = {};
let map = null, markers = [];
let selectedCustId = null;   // highlighted on map
let focusCustId = null;      // click-on-map → scroll list
let activeDays = new Set();  // empty = ALL days
let sadranMode = false;
let lassoActive = false;
let lassoPoints = [];
let lassoPolyline = null;
let lassoPolygon = null;
let lassoSelectedIds = new Set();
let lassoDrawing = false;

// ── Map init ──
function initMap(){
  if(map) return;
  map = L.map('map',{zoomControl:false}).setView([31.8,34.9],9);
  L.control.zoom({position:'bottomleft'}).addTo(map);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19}).addTo(map);
}

// ── City picker ──
let allCities = [];
let selectedCities = new Set();

async function loadCities(retries=4){
  const el = document.getElementById('city-drop-list');
  el.innerHTML = '<div class="city-loading"><div class="city-spin"></div>טוען ערים...</div>';
  for(let i=0; i<retries; i++){
    try{
      const r = await apiFetch(`${API}/api/territory/cities`);
      if(r.status===503){ el.innerHTML=`<div class="city-drop-empty">⏳ שרת טוען נתונים... (${i+1}/${retries})</div>`; await new Promise(res=>setTimeout(res,3000)); continue; }
      if(!r.ok){ el.innerHTML=`<div class="city-drop-empty">שגיאה ${r.status} — רענן</div>`; return; }
      const data = await r.json();
      if(!Array.isArray(data)){ el.innerHTML=`<div class="city-drop-empty">תשובה לא צפויה — רענן</div>`; return; }
      allCities = data;
      renderCityList(allCities);
      return;
    }catch(e){
      if(i<retries-1){ el.innerHTML=`<div class="city-drop-empty">⏳ מנסה שוב... (${i+2}/${retries})</div>`; await new Promise(res=>setTimeout(res,3000)); }
    }
  }
  el.innerHTML='<div class="city-drop-empty">שגיאה בטעינה — רענן</div>';
}

function renderCityList(list){
  const el = document.getElementById('city-drop-list');
  if(!list.length){ el.innerHTML=`<div class="city-drop-empty">לא נמצאו ערים</div>`; return; }
  el.innerHTML=list.map(c=>{
    const checked = selectedCities.has(c.city) ? 'checked' : '';
    return `<div class="city-drop-item" onclick="toggleCityCheck('${c.city.replace(/'/g,"\\'")}')">
      <input type="checkbox" ${checked} onclick="event.stopPropagation();toggleCityCheck('${c.city.replace(/'/g,"\\'")}')">

function toggleCityCheck(city){
  if(selectedCities.has(city)) selectedCities.delete(city);
  else selectedCities.add(city);
  updateCityApplyBtn();
  renderCityList(document.getElementById('city-search').value.trim()
    ? allCities.filter(c=>c.city.includes(document.getElementById('city-search').value.trim()))
    : allCities);
}

function updateCityApplyBtn(){
  const n = selectedCities.size;
  const applyEl = document.getElementById('city-drop-apply');
  const btn = document.getElementById('city-apply-btn');
  const cnt = document.getElementById('city-sel-count');
  applyEl.style.display = 'flex';
  btn.disabled = n === 0;
  cnt.textContent = n;
  document.getElementById('city-inp').value = n===0 ? '' : n===1 ? [...selectedCities][0] : `${n} ערים`;
}

function clearCitySelection(){
  selectedCities.clear();
  updateCityApplyBtn();
  renderCityList(allCities);
}

async function applySelectedCities(){
  if(!selectedCities.size) return;
  hideCityDrop();
  if(selectedCities.size===1){
    loadCity([...selectedCities][0]);
  } else {
    loadMultiCities([...selectedCities]);
  }
}

function filterCities(q){
  renderCityList(q.trim() ? allCities.filter(c=>c.city.includes(q.trim())) : allCities);
}
function showCityDrop(){
  document.getElementById('city-drop').classList.add('open');
  setTimeout(()=>document.getElementById('city-search').focus(),50);
  document.addEventListener('click', hideCityDropOutside, {once:true});
}
function hideCityDropOutside(e){
  if(!document.getElementById('city-picker').contains(e.target)) hideCityDrop();
  else document.addEventListener('click', hideCityDropOutside, {once:true});
}
function hideCityDrop(){
  document.getElementById('city-drop').classList.remove('open');
  document.getElementById('city-search').value='';
  renderCityList(allCities);
}

async function loadMultiCities(cities){
  moves={}; activeDays=new Set(); sadranMode=false; focusCustId=null;
  ['side-empty','side-stats','agent-pills','filter-bar'].forEach(id=>document.getElementById(id).style.display='none');
  document.getElementById('side-list').innerHTML='';
  document.getElementById('side-loading').style.display='flex';
  ['reset-btn','export-btn','save-btn'].forEach(id=>document.getElementById(id).style.display='none');
  try{
    const results = await Promise.all(cities.map(city=>
      apiFetch(`${API}/api/territory/city?city=${encodeURIComponent(city)}`).then(r=>r.json())
    ));
    // merge: combine agents across cities
    const agentMap = new Map();
    for(const data of results){
      for(const a of data.agents){
        if(!agentMap.has(a.agentCode)){
          agentMap.set(a.agentCode,{...a,clients:[]});
        }
        agentMap.get(a.agentCode).clients.push(...a.clients.map(c=>({...c,_city:data.city})));
      }
    }
    cityData = { city: cities.join(', '), agents: [...agentMap.values()] };
    colorMap={};
    cityData.agents.forEach((a,i)=>{ colorMap[a.agentCode]=AGENT_COLORS[i%AGENT_COLORS.length]; });
    visibleAgents=new Set(cityData.agents.map(a=>a.agentCode));
    document.getElementById('side-loading').style.display='none';
    document.getElementById('export-btn').style.display='';
    render();
  }catch(e){
    document.getElementById('side-loading').style.display='none';
    document.getElementById('side-empty').style.display='flex';
    document.getElementById('side-empty').innerHTML='<div style="font-size:32px">⚠️</div><div>שגיאה בטעינה</div>';
  }
}

// ── Load city ──
async function loadCity(city){
  if(!city) return;
  moves = {}; activeDays = new Set(); sadranMode = false; focusCustId = null;
  selectedCities = new Set([city]);
  document.getElementById('city-inp').value = city;
  ['side-empty','side-stats','agent-pills','filter-bar'].forEach(id=>document.getElementById(id).style.display='none');
  document.getElementById('side-list').innerHTML='';
  document.getElementById('side-loading').style.display='flex';
  ['reset-btn','export-btn','save-btn'].forEach(id=>document.getElementById(id).style.display='none');
  try{
    const r = await apiFetch(`${API}/api/territory/city?city=${encodeURIComponent(city)}`);
    cityData = await r.json();
    colorMap = {};
    cityData.agents.forEach((a,i)=>{ colorMap[a.agentCode]=AGENT_COLORS[i%AGENT_COLORS.length]; });
    visibleAgents = new Set(cityData.agents.map(a=>a.agentCode));
    document.getElementById('side-loading').style.display='none';
    document.getElementById('export-btn').style.display='';
    render();
  }catch(e){
    document.getElementById('side-loading').style.display='none';
    document.getElementById('side-empty').style.display='flex';
    document.getElementById('side-empty').innerHTML='<div style="font-size:32px">⚠️</div><div>שגיאה בטעינה</div>';
  }
}

// ── Helpers ──
function effectiveAgent(custId, origCode){ return moves[String(custId)] || origCode; }
function shortName(name){ return (name||'').split(' ')[0] || name; }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function trimName(n){ return n ? n.replace(/\s+[א-ת]["\-][א-ת]$/,'').trim().replace(/\s{2,}/g,' ') : ''; }
function fmtK(n){ return n>=1000000?(n/1000000).toFixed(1)+'M':n>=1000?(n/1000).toFixed(0)+'K':Math.round(n).toLocaleString(); }

// ── Render all ──
function render(){
  if(!cityData) return;
  const hasMoves = Object.keys(moves).length > 0;
  document.getElementById('reset-btn').style.display = hasMoves ? '' : 'none';
  document.getElementById('save-btn').style.display  = hasMoves ? '' : 'none';
  renderStats(); renderPills(); renderFilterBar(); renderList(); renderMap();
}

// ── Stats panel ──
function renderStats(){
  const el = document.getElementById('side-stats');
  el.style.display='flex';
  const sums = {};
  for(const a of cityData.agents) sums[a.agentCode]={cnt:0,sales6:0};
  for(const a of cityData.agents){
    for(const c of a.clients){
      const eff = effectiveAgent(c.custId, a.agentCode);
      if(!sums[eff]) sums[eff]={cnt:0,sales6:0};
      sums[eff].cnt++;
      sums[eff].sales6 += (c.avg6Sales||0)*6;
    }
  }
  el.innerHTML = cityData.agents.map(a=>{
    const s = sums[a.agentCode]||{cnt:0,sales6:0};
    return `<div class="stat-box">
      <div class="stat-n" style="color:${colorMap[a.agentCode]}">${s.cnt}</div>
      <div class="stat-sales">₪${fmtK(s.sales6)}</div>
      <div class="stat-l">${shortName(a.agentName)}</div>
    </div>`;
  }).join('');
}

// ── Agent pills ──
function renderPills(){
  const el = document.getElementById('agent-pills');
  el.style.display='flex';
  el.innerHTML = cityData.agents.map(a=>`
    <div class="agent-pill${visibleAgents.has(a.agentCode)?'':' off'}"
         style="background:${colorMap[a.agentCode]}22;border-color:${colorMap[a.agentCode]};">
      <span class="pill-dot" style="background:${colorMap[a.agentCode]}"></span>
      <span onclick="toggleAgent('${a.agentCode}')">${shortName(a.agentName)}</span>
      <span style="font-size:9px;opacity:.55;cursor:pointer;padding:0 1px;" title="הצג רק" onclick="soloAgent('${a.agentCode}')">◉</span>
    </div>`).join('')
  + `<div class="agent-pill" style="background:#1A3F7C22;border-color:#2A5AAA;font-size:10px;cursor:pointer;" onclick="showAllAgents()">כולם</div>`;
}
function toggleAgent(code){
  if(visibleAgents.has(code)) visibleAgents.delete(code); else visibleAgents.add(code);
  renderPills(); renderList(); renderMap();
}
function soloAgent(code){
  visibleAgents = new Set([code]);
  renderPills(); renderList(); renderMap();
}
function showAllAgents(){
  visibleAgents = new Set(cityData.agents.map(a=>a.agentCode));
  renderPills(); renderList(); renderMap();
}

// ── Filter bar: days + sadran ──
function renderFilterBar(){
  const el = document.getElementById('filter-bar');
  const dayNums = new Set(); const dayLabels = {};
  let hasSadran = false;
  for(const a of cityData.agents) for(const c of a.clients){
    if(c.dayNum){ dayNums.add(c.dayNum); }
    if(c.sadran) hasSadran = true;
  }
  const days = [...dayNums].sort((a,b)=>a-b);
  if(!days.length && !hasSadran){ el.style.display='none'; return; }
  el.style.display='flex';
  const DN = {1:'א',2:'ב',3:'ג',4:'ד',5:'ה'};
  let h = `<button type="button" class="day-btn all-btn${activeDays.size===0?' on':''}" onclick="toggleDayAll()">כל</button>`;
  for(const d of days)
    h += `<button type="button" class="day-btn${activeDays.has(d)?' on':''}" onclick="toggleDay(${d})">${DN[d]||d}</button>`;
  if(hasSadran)
    h += `<button type="button" class="sadran-btn${sadranMode?' on':''}" onclick="toggleSadran()">סדרן</button>`;
  el.innerHTML = h;
}
function toggleDay(d){
  if(activeDays.has(d)) activeDays.delete(d); else activeDays.add(d);
  renderFilterBar(); renderList(); renderMap(); renderStats();
}
function toggleDayAll(){ activeDays=new Set(); renderFilterBar(); renderList(); renderMap(); renderStats(); }
function toggleSadran(){ sadranMode=!sadranMode; renderFilterBar(); renderList(); renderMap(); renderStats(); }

// ── Client list ──
function buildGroups(){
  const groups = {};
  for(const a of cityData.agents){
    if(!groups[a.agentCode]) groups[a.agentCode]={agentName:a.agentName,clients:[]};
    for(const c of a.clients){
      const eff = effectiveAgent(c.custId, a.agentCode);
      if(!groups[eff]) groups[eff]={agentName:a.agentName,clients:[]};
      groups[eff].clients.push({...c, _origAgent:a.agentCode});
    }
  }
  return groups;
}
function clientPassesFilter(c){
  if(sadranMode && (c.iceOnly || !c.sadran)) return false;
  if(activeDays.size>0 && !activeDays.has(c.dayNum)) return false;
  return true;
}
function renderList(){
  const el = document.getElementById('side-list');
  const groups = buildGroups();
  let html = '';
  for(const a of cityData.agents){
    if(!visibleAgents.has(a.agentCode)) continue;
    const g = groups[a.agentCode]||{clients:[]};
    const visible = g.clients.filter(clientPassesFilter);
    if(!visible.length) continue;
    html += `<div class="agent-group">
      <div class="agent-group-hdr" style="background:#0A1628ee;">
        <span class="agent-group-dot" style="background:${colorMap[a.agentCode]}"></span>
        <span class="agent-group-name">${esc(a.agentName)}</span>
        <span class="agent-group-cnt">${visible.length}</span>
      </div>
      ${visible.map((c,i)=>{
        const moved = moves[String(c.custId)] !== undefined;
        const eff = effectiveAgent(c.custId, c._origAgent);
        const salesK = fmtK(c.avg6Sales||0);
        const ordM = (c.avg6Orders||0).toFixed(1);
        const sadranBadge = c.sadran ? `<span style="color:#00838F;font-weight:900">${esc(c.sadran)}</span> · ` : '';
        const isFocus = String(c.custId)===String(focusCustId);
        const isLasso = lassoSelectedIds.has(String(c.custId));
        return `<div class="client-row${moved?' moved':''}${isFocus?' focus-row':''}${isLasso?' lasso-sel':''}" id="cr-${c.custId}" onclick="openMove(${JSON.stringify(c.custId)})">
          <div class="client-rn">${i+1}</div>
          <div class="cr-body">
            <div class="cr-name">${esc(trimName(c.custName))}</div>
            <div class="cr-sub">${sadranBadge}${esc(c.address||'')}${moved?' → '+shortName(cityData.agents.find(x=>x.agentCode===eff)?.agentName||eff):''}</div>
            <div class="cr-metrics">
              <span class="cr-metric">מכירות: <span>₪${salesK}/m</span></span>
              <span class="cr-metric">הזמנות: <span>${ordM}/m</span></span>
            </div>
          </div>
          <div class="cr-arrow">›</div>
        </div>`;
      }).join('')}
    </div>`;
  }
  el.innerHTML = html || '<div style="padding:20px;text-align:center;color:#7098CC;font-size:13px">אין לקוחות מוצגים</div>';
  // scroll to focused client
  if(focusCustId){
    const row = document.getElementById(`cr-${focusCustId}`);
    if(row) row.scrollIntoView({behavior:'smooth',block:'center'});
  }
}

// ── Map ──
function renderMap(){
  if(!map) initMap();
  markers.forEach(m=>m.remove()); markers=[];
  const bounds=[];
  for(const a of cityData.agents){
    for(const c of a.clients){
      if(!c.lat||!c.lng) continue;
      if(!clientPassesFilter(c)) continue;
      const eff = effectiveAgent(c.custId, a.agentCode);
      if(!visibleAgents.has(eff)) continue;
      const col = colorMap[eff]||'#888';
      const isSel = String(c.custId)===String(selectedCustId);
      const isFoc = String(c.custId)===String(focusCustId);
      const isLasso = lassoSelectedIds.has(String(c.custId));
      const sz = isSel ? 36 : 26;
      const ring = isFoc ? `box-shadow:0 0 0 4px #C9A84C88,0 2px 8px rgba(0,0,0,.5);`
                 : isLasso ? `box-shadow:0 0 0 3px #00838F88,0 2px 8px rgba(0,0,0,.5);`
                 : 'box-shadow:0 2px 8px rgba(0,0,0,.5);';
      const icon = L.divIcon({className:'',
        html:`<div style="width:${sz}px;height:${sz}px;border-radius:50%;background:${col};border:${isSel?3:2}px solid #fff;${ring}"></div>`,
        iconSize:[sz,sz],iconAnchor:[sz/2,sz/2]});
      const m = L.marker([c.lat,c.lng],{icon,zIndexOffset:isSel||isFoc?1000:0});
      m.on('click',()=>{ focusClient(c.custId); });
      m.bindTooltip(`<b>${esc(trimName(c.custName))}</b><br>${esc(a.agentName)}`,{direction:'right',opacity:1});
      m.addTo(map); markers.push(m);
      bounds.push([c.lat,c.lng]);
    }
  }
  if(bounds.length) map.fitBounds(bounds,{padding:[30,30],maxZoom:14});
}

// ── Focus client (click on map → scroll list) ──
function focusClient(custId){
  focusCustId = String(custId);
  renderList(); // scrolls to the row
  renderMap();  // highlights ring
}

// ── Move dialog ──
function openMove(custId){
  if(!cityData) return;
  selectedCustId = custId;
  let clientName='', origAgent='';
  for(const a of cityData.agents){
    const c = a.clients.find(x=>String(x.custId)===String(custId));
    if(c){ clientName=c.custName; origAgent=a.agentCode; break; }
  }
  const eff = effectiveAgent(custId, origAgent);
  document.getElementById('mp-title').textContent=trimName(clientName)||String(custId);
  document.getElementById('mp-agents').innerHTML = cityData.agents.map(a=>`
    <button type="button" class="mp-agent-btn${eff===a.agentCode?' current':''}"
            style="background:${colorMap[a.agentCode]};"
            onclick="applyMove(${JSON.stringify(String(custId))},'${a.agentCode}','${origAgent}')">
      ${shortName(a.agentName)}
    </button>`).join('');
  document.getElementById('move-panel').classList.add('open');
  renderMap();
}
function applyMove(custId, toAgent, origAgent){
  if(toAgent===origAgent) delete moves[String(custId)];
  else moves[String(custId)]=toAgent;
  closeMove(); render();
}
function closeMove(){
  selectedCustId=null;
  document.getElementById('move-panel').classList.remove('open');
  renderMap();
}
function resetMoves(){ moves={}; render(); }

// ── Lasso ──
function toggleLasso(){
  if(lassoActive) exitLasso();
  else enterLasso();
}
function enterLasso(){
  lassoActive = true;
  lassoPoints = []; lassoSelectedIds = new Set(); lassoDrawing = false;
  map.dragging.disable();
  map.scrollWheelZoom.disable();
  map.getContainer().style.cursor = 'crosshair';
  document.getElementById('lasso-btn').classList.add('on');
}
function exitLasso(){
  lassoActive = false; lassoDrawing = false;
  map.dragging.enable();
  map.scrollWheelZoom.enable();
  map.getContainer().style.cursor = '';
  document.getElementById('lasso-btn').classList.remove('on');
  if(lassoPolyline){ map.removeLayer(lassoPolyline); lassoPolyline=null; }
  if(lassoPolygon){ map.removeLayer(lassoPolygon); lassoPolygon=null; }
  lassoPoints = [];
}
function clearLasso(){
  lassoSelectedIds = new Set();
  focusCustId = null;
  document.getElementById('lasso-bulk').style.display='none';
  exitLasso();
  renderList(); renderMap();
}
function pointInPolygon(lat, lng, poly){
  let inside = false;
  for(let i=0, j=poly.length-1; i<poly.length; j=i++){
    const xi=poly[i].lat, yi=poly[i].lng, xj=poly[j].lat, yj=poly[j].lng;
    if(((yi>lng)!==(yj>lng)) && (lat<(xj-xi)*(lng-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}
function selectClientsInPolygon(){
  if(!cityData) return;
  lassoSelectedIds = new Set();
  for(const a of cityData.agents){
    for(const c of a.clients){
      if(!c.lat||!c.lng) continue;
      if(pointInPolygon(c.lat, c.lng, lassoPoints)) lassoSelectedIds.add(String(c.custId));
    }
  }
  if(lassoSelectedIds.size > 0){
    focusCustId = [...lassoSelectedIds][0];
    // show bulk panel
    const bulk = document.getElementById('lasso-bulk');
    document.getElementById('lasso-count').textContent = `${lassoSelectedIds.size} לקוחות`;
    document.getElementById('lasso-bulk-agents').innerHTML = cityData.agents.map(a=>
      `<button type="button" class="lasso-bulk-btn" style="background:${colorMap[a.agentCode]}"
        onclick="bulkMove('${a.agentCode}')">${shortName(a.agentName)}</button>`
    ).join('');
    bulk.style.display='flex';
    renderList(); renderMap();
  }
}
function bulkMove(toAgent){
  for(const custId of lassoSelectedIds){
    let origAgent = '';
    for(const a of cityData.agents){
      if(a.clients.some(c=>String(c.custId)===custId)){ origAgent=a.agentCode; break; }
    }
    if(origAgent && toAgent !== origAgent) moves[custId] = toAgent;
    else if(toAgent === origAgent) delete moves[custId];
  }
  clearLasso();
  render();
}
function initLassoEvents(){
  const container = map.getContainer();
  container.addEventListener('mousedown', e=>{
    if(!lassoActive) return;
    e.preventDefault(); e.stopPropagation();
    lassoDrawing = true;
    lassoPoints = [];
    const ll = map.containerPointToLatLng([e.offsetX, e.offsetY]);
    lassoPoints.push(ll);
    if(lassoPolyline){ map.removeLayer(lassoPolyline); }
    lassoPolyline = L.polyline([ll],{color:'#C9A84C',weight:2.5,opacity:.9,dashArray:'5,3'}).addTo(map);
  });
  container.addEventListener('mousemove', e=>{
    if(!lassoActive||!lassoDrawing) return;
    const ll = map.containerPointToLatLng([e.offsetX, e.offsetY]);
    lassoPoints.push(ll);
    if(lassoPolyline) lassoPolyline.setLatLngs(lassoPoints);
  });
  container.addEventListener('mouseup', e=>{
    if(!lassoActive||!lassoDrawing) return;
    lassoDrawing = false;
    if(lassoPolyline){ map.removeLayer(lassoPolyline); lassoPolyline=null; }
    if(lassoPoints.length < 3){ exitLasso(); return; }
    lassoPolygon = L.polygon(lassoPoints,{color:'#C9A84C',fillColor:'#C9A84C66',weight:2,fillOpacity:.15}).addTo(map);
    selectClientsInPolygon();
    setTimeout(()=>{ if(lassoPolygon){ map.removeLayer(lassoPolygon); lassoPolygon=null; } exitLasso(); }, 2000);
  });
}

// ── Init ──
(async()=>{
  if(!getToken()){
    try{
      const pbi=await fetch(API+'/auth/pbi',{credentials:'include'});
      if(pbi.ok){ const j=await pbi.json(); if(j.ok&&j.token) localStorage.setItem('frToken',j.token); }
    }catch(_){}
    if(!getToken()){ location.href='formula-road.html'; return; }
  }
  initMap();
  initLassoEvents();
  await loadCities();
})();
</script>
