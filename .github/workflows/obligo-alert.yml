name: Obligo Alert

# Еженедельный (по четвергам) алярм топ-менеджменту о сетях/клиентах, приближающихся
# к лимиту облиго (>= 85% ניצול OBLIGO). Источник — HOVOT ALL в датасете FORMULA DASHBORD.
# Отдельный GitHub Actions job, не PM2-крон на VPS — рестарты/деплои VPS уже дважды
# сажали PBI-квоту в 429 (см. VAULT project_pbi_429_incident), этот job живой сервер
# не трогает вообще. Клиент/сеть репортится в каждом еженедельном отчёте, пока остаётся
# выше порога (не только при первом переходе) — состояние между запусками не хранится.
# Расписания здесь нет с 2026-09-29: GitHub cron в этом репо пропускает запуски. Четверг 09:00 Israel —
# cron на VPS: /root/run-alert.sh obligo-alert (отдельный клон /root/alerts-run, живой сервер и его
# рестарты не трогает; один DAX-запрос в неделю). Здесь — только ручной/тестовый запуск.
on:
  workflow_dispatch:

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install server dependencies
        run: npm install
        working-directory: server

      - name: Run obligo-alert
        run: node obligo-alert.js
        working-directory: server
        env:
          AZURE_TENANT_ID: ${{ secrets.PBI_TENANT }}
          AZURE_CLIENT_ID: ${{ secrets.PBI_CLIENT }}
          AZURE_CLIENT_SECRET: ${{ secrets.PBI_SECRET }}
          POWERBI_DATASET_ID: ${{ secrets.PBI_DATASET }}
          POWERBI_WORKSPACE_ID: ${{ secrets.PBI_WORKSPACE }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OBLIGO_ALERT_RECIPIENTS: ${{ secrets.OBLIGO_ALERT_RECIPIENTS }}
