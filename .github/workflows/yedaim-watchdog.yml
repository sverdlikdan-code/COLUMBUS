name: Yedaim watchdog

# Straxovka na sluchay esli scheduled yedaim-build.yml (04:00 UTC) ne
# otrabotal — GitHub inogda propuskaet/otkladyvaet cron-zapuski pri
# nagruzke na infrastrukturu, eto ne pod nashim kontrolem. Etot job
# proveryaet svezhest snapshotov na VPS v 08:00 UTC (4ch zapasa posle
# osnovnogo zapuska) i, esli oni stare 20 chasov, peresobiraet i
# zalivaet ikh sam + shlyot alert chto srabotala straxovka.
on:
  schedule:
    # Off :00 since 2026-08-31 — see yedaim-build.yml comment: top-of-hour is
    # GitHub's documented peak load window for scheduled events.
    - cron: '27 8 * * *'
  workflow_dispatch: {}

jobs:
  check-and-rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check freshness on VPS
        id: freshness
        run: |
          echo "${{ secrets.VPS_SSH_KEY }}" > /tmp/vps_key
          chmod 600 /tmp/vps_key
          AGE=$(ssh -o StrictHostKeyChecking=no -i /tmp/vps_key root@31.154.67.58 \
            "echo \$(( \$(date +%s) - \$(stat -c %Y /root/COLUMBUS/server/data/yedaim-alexey.png) ))")
          echo "age_seconds=$AGE" >> "$GITHUB_OUTPUT"
          if [ "$AGE" -gt 72000 ]; then
            echo "stale=1" >> "$GITHUB_OUTPUT"
          else
            echo "stale=0" >> "$GITHUB_OUTPUT"
          fi
          rm /tmp/vps_key

      - name: Checkout
        if: steps.freshness.outputs.stale == '1'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.freshness.outputs.stale == '1'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install server dependencies
        if: steps.freshness.outputs.stale == '1'
        run: npm install
        working-directory: server

      - name: Create .env
        if: steps.freshness.outputs.stale == '1'
        run: |
          echo "AZURE_TENANT_ID=${{ secrets.PBI_TENANT }}"  >> .env
          echo "AZURE_CLIENT_ID=${{ secrets.PBI_CLIENT }}"  >> .env
          echo "AZURE_CLIENT_SECRET=${{ secrets.PBI_SECRET }}" >> .env
          echo "POWERBI_WORKSPACE_ID=${{ secrets.PBI_WORKSPACE }}" >> .env

      - name: Build yedaim snapshots (fallback run)
        if: steps.freshness.outputs.stale == '1'
        run: node build-yedaim.js
        working-directory: server

      - name: Upload snapshots to VPS
        if: steps.freshness.outputs.stale == '1'
        run: |
          echo "${{ secrets.VPS_SSH_KEY }}" > /tmp/vps_key
          chmod 600 /tmp/vps_key
          scp -o StrictHostKeyChecking=no -i /tmp/vps_key \
            server/data/yedaim-*.png \
            root@31.154.67.58:/root/COLUMBUS/server/data/
          rm /tmp/vps_key

      - name: Alert — fallback rebuild fired
        if: steps.freshness.outputs.stale == '1'
        env:
          AGE: ${{ steps.freshness.outputs.age_seconds }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          NOW=$(date -u '+%Y-%m-%d %H:%M UTC')
          HTML="<p>Yedaim-снапшоты на VPS были старше 20 часов (${AGE}s) в ${NOW} — плановый yedaim-build.yml (04:00 UTC) похоже не сработал.</p><p>Watchdog пересобрал и залил свежие снапшоты сам.</p>"
          PAYLOAD=$(jq -n --arg to "$NOTIFY_EMAIL" --arg html "$HTML" \
            '{from:"alerts@sverdlik-apps.site", to:[$to], subject:"ALERT: Yedaim — сработала страховка (fallback rebuild)", html:$html}')
          curl -s -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer ${RESEND_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

      - name: Alert — fallback rebuild failed
        if: failure()
        env:
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          NOW=$(date -u '+%Y-%m-%d %H:%M UTC')
          HTML="<p>Yedaim watchdog обнаружил устаревшие снапшоты и попытался пересобрать их сам в ${NOW}, но пересборка провалилась.</p><p>Нужна ручная проверка — см. workflow run в Actions.</p>"
          PAYLOAD=$(jq -n --arg to "$NOTIFY_EMAIL" --arg html "$HTML" \
            '{from:"alerts@sverdlik-apps.site", to:[$to], subject:"ALERT: Yedaim watchdog — пересборка провалилась", html:$html}')
          curl -s -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer ${RESEND_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
