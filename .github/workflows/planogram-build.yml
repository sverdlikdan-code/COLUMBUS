name: MAHSAN Planogram Build

on:
  push:
    branches: [master]
    paths:
      - 'planogram/**'
      - '.github/workflows/planogram-build.yml'
  schedule:
    # Минуты сдвинуты с :00 2026-08-31 — см. yedaim-build.yml: top-of-hour
    # был причиной перегрузки GitHub Actions scheduler для всего репо.
    # ~06:21 Israel (UTC+3) = 03:21 UTC
    - cron: '21 3 * * *'
    # Дневные запуски каждые 2ч: ~08:21/10:21/12:21/14:21 Israel = 05:21/07:21/09:21/11:21 UTC
    # 11:21 UTC ~= 14:21 Israel — ловит PBI refresh 13:46
    - cron: '21 5,7,9,11 * * *'
    # 16:21–23:21 Israel = 13:21–20:21 UTC — каждый час вечером
    - cron: '21 13,14,15,16,17,18,19,20 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: planogram

      - name: Create .env
        run: |
          echo "PBI_TENANT=${{ secrets.PBI_TENANT }}"       >> .env
          echo "PBI_CLIENT=${{ secrets.PBI_CLIENT }}"       >> .env
          echo "PBI_SECRET=${{ secrets.PBI_SECRET }}"       >> .env
          echo "PBI_DATASET=${{ secrets.PBI_DATASET }}"     >> .env
          echo "PBI_WORKSPACE=${{ secrets.PBI_WORKSPACE }}" >> .env
          echo "TOKEN=${{ secrets.WORKFLOW_TRIGGER_TOKEN }}" >> .env
          echo "AZURE_TENANT_ID=${{ secrets.PBI_TENANT }}"  >> .env
          echo "AZURE_CLIENT_ID=${{ secrets.PBI_CLIENT }}"  >> .env
          echo "AZURE_CLIENT_SECRET=${{ secrets.PBI_SECRET }}" >> .env
          echo "POWERBI_DATASET_ID=${{ secrets.PBI_DATASET }}" >> .env
          echo "POWERBI_WORKSPACE_ID=${{ secrets.PBI_WORKSPACE }}" >> .env

      - name: Convert בררת מחדל xlsx to CSV
        run: node planogram/convert-breira.js
        continue-on-error: true

      - name: Run build-planogram (stock/sales refresh first)
        run: SKIP_PBI_REFRESH=1 node planogram/build-planogram.js
        continue-on-error: true

      - name: Run build-kapua-new
        run: node planogram/build-kapua-new.js
        continue-on-error: true

      - name: Run build-halavi-new
        run: node planogram/build-halavi-new.js
        continue-on-error: true

      - name: Run build-dagim-fab
        run: node planogram/build-dagim-fab.js
        continue-on-error: true

      - name: Run build-dagim-yavesh-new
        run: node planogram/build-dagim-yavesh-new.js
        continue-on-error: true

      - name: Run build-planogram (final XLSX with updated sections)
        run: SKIP_PBI_REFRESH=1 SKIP_YAVESH_FETCH=1 node planogram/build-planogram.js
        continue-on-error: true

      - name: Run workflow-doctor
        run: node planogram/workflow-doctor.js
        continue-on-error: true

      - name: Commit and push
        run: |
          git config user.email "columbus-bot@diler.co.il"
          git config user.name "COLUMBUS Bot"
          for f in docs/kapua-base.json docs/halavi-base.json docs/dagim-base.json \
                   docs/dagim-yavesh-base.json docs/product-data.json docs/refresh-info.json \
                   docs/product-photos.json docs/health-report.json; do
            [ -f "$f" ] && git add "$f" || true
          done
          git diff --cached --quiet && echo "No changes." || \
            git commit -m "chore: mahsan planogram build $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin master || \
            (git pull --no-rebase -X ours origin master && git push origin master)
