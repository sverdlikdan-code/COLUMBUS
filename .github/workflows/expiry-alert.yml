name: Expiry Alert

# Ежедневный алярм "דוח תוקף" (סכנה + STOP SALE) из редактора махсана — карточки снимаются
# Puppeteer'ом с docs/planogram-editor.html (см. server/expiry-alert.js). Письмо уходит только
# если есть хотя бы одна карточка. Отдельный job, как obligo-alert — живой сервер/PBI не трогает.
# Расписания здесь нет: 2026-09-29 GitHub молча не запустил cron '0 6' (0 прогонов, health monitor
# */15 тоже пропускал). Ежедневный запуск Вс–Чт 09:00 Israel — cron на VPS: /root/run-alert.sh expiry-alert
# (отдельный клон /root/alerts-run, живой сервер не трогает). Здесь — только ручной/тестовый запуск.
on:
  workflow_dispatch:
    inputs:
      to:
        description: 'Тест: слать только на этот адрес (пусто = всем из секрета)'
        required: false
      note:
        description: 'Разовая приписка в начало письма (иврит), напр. при внеплановой рассылке'
        required: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Hebrew + emoji fonts for Chrome
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-core fonts-noto-color-emoji

      - name: Install server dependencies
        run: npm install
        working-directory: server

      - name: Run expiry-alert
        run: node expiry-alert.js
        working-directory: server
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EXPIRY_ALERT_RECIPIENTS: ${{ inputs.to || secrets.EXPIRY_ALERT_RECIPIENTS }}
          EXPIRY_ALERT_NOTE: ${{ inputs.note }}
