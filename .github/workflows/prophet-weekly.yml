name: Prophet Weekly Forecast

on:
  schedule:
    # Thursday 06:00 IST (UTC+3) = Thursday 03:00 UTC
    - cron: '0 3 * * 4'
  workflow_dispatch:

jobs:
  prophet:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip + CmdStan
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cmdstan
          key: prophet-${{ runner.os }}-${{ hashFiles('prophet/requirements.txt') }}
          restore-keys: prophet-${{ runner.os }}-

      - name: Install Python dependencies
        run: pip install -r prophet/requirements.txt

      - name: Install server dependencies
        run: npm install
        working-directory: server

      - name: Fetch Prophet history from PBI
        env:
          AZURE_TENANT_ID: ${{ secrets.PBI_TENANT }}
          AZURE_CLIENT_ID: ${{ secrets.PBI_CLIENT }}
          AZURE_CLIENT_SECRET: ${{ secrets.PBI_SECRET }}
          POWERBI_WORKSPACE_ID: ${{ secrets.PBI_WORKSPACE }}
          POWERBI_MMD_DATASET_ID: ${{ secrets.PBI_MMD_DATASET }}
        run: node server/fetch-prophet-history.js

      - name: Run Prophet forecast
        run: python prophet/run_prophet.py

      - name: Commit and push
        run: |
          git config user.email "columbus-bot@diler.co.il"
          git config user.name "COLUMBUS Bot"
          git add docs/prophet.json prophet/weekly_sales.csv
          git diff --cached --quiet && echo "No changes." || \
            git commit -m "data: prophet weekly forecast $(date -u +'%Y-%m-%d')"
          git push origin master || \
            (git pull --no-rebase -X ours origin master && git push origin master)
