name: Server Deploy

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'server/index.js'
      - 'server/priority-db.js'
      - 'server/powerbi.js'
      - 'docs/formula-road.html'
      - 'docs/manifest.json'
      - 'docs/sw.js'
      - 'docs/zikuy-order.html'
      - 'docs/mekarer-order.html'
      - 'docs/day-closing.html'
      - 'MMD ORDERS/tukuf.html'
      - 'MMD ORDERS/index.html'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS (git pull — single source of truth)
        run: |
          echo "${{ secrets.VPS_SSH_KEY }}" > /tmp/vps_key
          chmod 600 /tmp/vps_key
          ssh -o StrictHostKeyChecking=no -i /tmp/vps_key root@31.154.67.58 '
            set -e
            flock /root/COLUMBUS/.deploy.lock -c "
              cd /root/COLUMBUS &&
              git fetch origin master &&
              git reset --hard origin/master &&
              pm2 restart columbus-api
            "
          '
          rm /tmp/vps_key
