name: Formula Road Build

on:
  schedule:
    # 06:30 Israel (UTC+3) = 03:30 UTC — после mahsan билда
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install server dependencies
        run: npm install
        working-directory: server

      - name: Create .env
        run: |
          echo "PBI_TENANT=${{ secrets.PBI_TENANT }}"       >> .env
          echo "PBI_CLIENT=${{ secrets.PBI_CLIENT }}"       >> .env
          echo "PBI_SECRET=${{ secrets.PBI_SECRET }}"       >> .env
          echo "PBI_DATASET=${{ secrets.PBI_DATASET }}"     >> .env
          echo "PBI_WORKSPACE=${{ secrets.PBI_WORKSPACE }}" >> .env
          echo "AZURE_TENANT_ID=${{ secrets.PBI_TENANT }}"  >> .env
          echo "AZURE_CLIENT_ID=${{ secrets.PBI_CLIENT }}"  >> .env
          echo "AZURE_CLIENT_SECRET=${{ secrets.PBI_SECRET }}" >> .env
          echo "POWERBI_DATASET_ID=${{ secrets.PBI_DATASET }}" >> .env
          echo "POWERBI_WORKSPACE_ID=${{ secrets.PBI_WORKSPACE }}" >> .env

      - name: Install planogram dependencies
        run: npm install
        working-directory: planogram

      - name: Build formula-road-data.json
        run: node planogram/build-formula-road.js

      - name: Commit and push
        run: |
          git config user.email "columbus-bot@diler.co.il"
          git config user.name "COLUMBUS Bot"
          for f in docs/formula-road-data.json docs/refresh-info.json; do
            [ -f "$f" ] && git add "$f" || true
          done
          git diff --cached --quiet && echo "No changes." || \
            git commit -m "chore: formula-road build $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin master || \
            (git pull --no-rebase -X ours origin master && git push origin master)
