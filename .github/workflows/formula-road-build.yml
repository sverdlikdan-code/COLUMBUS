name: Formula Road Build

on:
  schedule:
    # 07:30 Israel (UTC+3) = 04:30 UTC
    - cron: '30 4 * * *'
    # ~21:42 Israel (UTC+3) = 18:42 UTC — off :00, see 2026-08-31 scheduler note
    - cron: '42 18 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install server dependencies
        run: npm install
        working-directory: server

      - name: Create .env
        run: |
          echo "PBI_TENANT=${{ secrets.PBI_TENANT }}"       >> .env
          echo "PBI_CLIENT=${{ secrets.PBI_CLIENT }}"       >> .env
          echo "PBI_SECRET=${{ secrets.PBI_SECRET }}"       >> .env
          echo "PBI_DATASET=${{ secrets.PBI_DATASET }}"     >> .env
          echo "PBI_WORKSPACE=${{ secrets.PBI_WORKSPACE }}" >> .env
          echo "AZURE_TENANT_ID=${{ secrets.PBI_TENANT }}"  >> .env
          echo "AZURE_CLIENT_ID=${{ secrets.PBI_CLIENT }}"  >> .env
          echo "AZURE_CLIENT_SECRET=${{ secrets.PBI_SECRET }}" >> .env
          echo "POWERBI_DATASET_ID=${{ secrets.PBI_DATASET }}" >> .env
          echo "POWERBI_WORKSPACE_ID=${{ secrets.PBI_WORKSPACE }}" >> .env
          echo "AZURE_MAPS_KEY=${{ secrets.AZURE_MAPS_KEY }}"       >> .env
          echo "GOOGLE_MAPS_KEY=${{ secrets.GOOGLE_MAPS_KEY }}"   >> .env

      - name: Install planogram dependencies
        run: npm install
        working-directory: planogram

      - name: Download GPS corrections from VPS (highest priority — applied in build)
        run: |
          echo "${{ secrets.VPS_SSH_KEY }}" > /tmp/vps_key
          chmod 600 /tmp/vps_key
          scp -o StrictHostKeyChecking=no -i /tmp/vps_key \
            root@31.154.67.58:/root/COLUMBUS/docs/gps-corrections.json \
            docs/gps-corrections.json 2>/dev/null || echo "No corrections file on VPS — continuing without"
          rm /tmp/vps_key

      - name: Build formula-road-data.json
        run: node planogram/build-formula-road.js

      - name: Commit and push
        run: |
          git config user.email "columbus-bot@diler.co.il"
          git config user.name "COLUMBUS Bot"
          for f in docs/formula-road-data.json docs/refresh-info.json docs/gps-corrections-export.csv docs/azure-geocode-cache.json docs/city-bbox-cache.json; do
            [ -f "$f" ] && git add "$f" || true
          done
          git diff --cached --quiet && echo "No changes." || \
            git commit -m "chore: formula-road build $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin master || \
            (git pull --no-rebase -X ours origin master && git push origin master)

      - name: Deploy to VPS (git pull — single source of truth)
        run: |
          echo "${{ secrets.VPS_SSH_KEY }}" > /tmp/vps_key
          chmod 600 /tmp/vps_key
          ssh -o StrictHostKeyChecking=no -i /tmp/vps_key root@31.154.67.58 '
            set -e
            flock /root/COLUMBUS/.deploy.lock -c "
              cd /root/COLUMBUS &&
              git fetch origin master &&
              git reset --hard origin/master &&
              pm2 restart columbus-api
            "
          '
          rm /tmp/vps_key
