name: Yedaim Build

on:
  schedule:
    # ~07:07 Israel (UTC+3 summer) = 04:07 UTC. Was 04:00 UTC exactly — moved
    # off the top of the hour 2026-08-31 after bug-agent traced 3 nights of
    # "cron didn't fire" (27/28/31.08) to repo-wide GitHub Actions scheduler
    # overload, confirmed by planogram-build.yml (13 non-:00 slots/day) and
    # health-monitor.yml (*/5min) collapsing on the exact same dates — not a
    # collision with mmd-orders-build.yml's own 0 4 slot as first suspected.
    # GitHub docs: top-of-hour is documented peak load for scheduled events.
    - cron: '7 4 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install server dependencies
        run: npm install
        working-directory: server

      - name: Create .env
        run: |
          echo "AZURE_TENANT_ID=${{ secrets.PBI_TENANT }}"  >> .env
          echo "AZURE_CLIENT_ID=${{ secrets.PBI_CLIENT }}"  >> .env
          echo "AZURE_CLIENT_SECRET=${{ secrets.PBI_SECRET }}" >> .env
          echo "POWERBI_WORKSPACE_ID=${{ secrets.PBI_WORKSPACE }}" >> .env

      - name: Build yedaim snapshots
        run: node build-yedaim.js
        working-directory: server

      - name: Upload snapshots to VPS
        run: |
          echo "${{ secrets.VPS_SSH_KEY }}" > /tmp/vps_key
          chmod 600 /tmp/vps_key
          scp -o StrictHostKeyChecking=no -i /tmp/vps_key \
            server/data/yedaim-*.png \
            root@31.154.67.58:/root/COLUMBUS/server/data/
          rm /tmp/vps_key
