name: Yedaim Build

on:
  schedule:
    # 07:00 Israel (UTC+3 summer) = 04:00 UTC. Was 05:30 Israel — moved later
    # 2026-08-25 after confirming live that the FORMULA DASHBORD PBI dataset's
    # own scheduled refresh didn't finish until 06:17 Israel that day, so the
    # 05:30 run was screenshotting yesterday's numbers. This leaves ~40min
    # margin after a typical refresh completion, not just the observed one.
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install server dependencies
        run: npm install
        working-directory: server

      - name: Create .env
        run: |
          echo "AZURE_TENANT_ID=${{ secrets.PBI_TENANT }}"  >> .env
          echo "AZURE_CLIENT_ID=${{ secrets.PBI_CLIENT }}"  >> .env
          echo "AZURE_CLIENT_SECRET=${{ secrets.PBI_SECRET }}" >> .env
          echo "POWERBI_WORKSPACE_ID=${{ secrets.PBI_WORKSPACE }}" >> .env

      - name: Build yedaim snapshots
        run: node build-yedaim.js
        working-directory: server

      - name: Upload snapshots to VPS
        run: |
          echo "${{ secrets.VPS_SSH_KEY }}" > /tmp/vps_key
          chmod 600 /tmp/vps_key
          scp -o StrictHostKeyChecking=no -i /tmp/vps_key \
            server/data/yedaim-*.png \
            root@31.154.67.58:/root/COLUMBUS/server/data/
          rm /tmp/vps_key
