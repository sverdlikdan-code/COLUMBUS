name: CI failure alerts

# Odna tochka alertinga na VSE workflow-y v repo — kogda lyuboy job
# padaet (yedaim-build, deploy, i t.d.), prikhodit email. Ne dublirovat
# alert-step v kazhdom otdelnom workflow — dobavlyaesh novyy workflow,
# on avtomaticheski pod pokrytiem, nichego ne trogaesh zdes'.
on:
  workflow_run:
    types: [completed]

jobs:
  notify-on-failure:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.name != 'CI failure alerts'
    runs-on: ubuntu-latest
    steps:
      - name: Alert by email
        env:
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          NOW=$(date -u '+%Y-%m-%d %H:%M UTC')
          HTML="<p>Workflow <b>${WORKFLOW_NAME}</b> завершился с ошибкой в ${NOW}.</p><p><a href=\"${RUN_URL}\">Открыть run в GitHub Actions</a></p>"
          PAYLOAD=$(jq -n --arg to "$NOTIFY_EMAIL" --arg html "$HTML" --arg name "$WORKFLOW_NAME" \
            '{from:"alerts@sverdlik-apps.site", to:[$to], subject:("ALERT: CI failed — " + $name), html:$html}')
          curl -s -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer ${RESEND_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
