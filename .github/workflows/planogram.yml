name: Planogram Builder

on:
  schedule:
    - cron: '0 5-17 * * 0-4'  # 08:00–20:00 Israel time (UTC+3 summer) Sun–Thu, every hour
  workflow_dispatch:          # manual trigger — the "Refresh" button

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install
        working-directory: planogram

      - name: Build kapua-base (products from Fabric)
        run: node build-kapua-new.js
        working-directory: planogram
        env:
          PBI_TENANT:    ${{ secrets.PBI_TENANT }}
          PBI_CLIENT:    ${{ secrets.PBI_CLIENT }}
          PBI_SECRET:    ${{ secrets.PBI_SECRET }}
          PBI_DATASET:   ${{ secrets.PBI_DATASET }}
          PBI_WORKSPACE: ${{ secrets.PBI_WORKSPACE }}

      - name: Build planogram
        run: node build-planogram.js
        working-directory: planogram
        env:
          PBI_TENANT:    ${{ secrets.PBI_TENANT }}
          PBI_CLIENT:    ${{ secrets.PBI_CLIENT }}
          PBI_SECRET:    ${{ secrets.PBI_SECRET }}
          PBI_DATASET:   ${{ secrets.PBI_DATASET }}
          PBI_WORKSPACE: ${{ secrets.PBI_WORKSPACE }}

      - name: Commit and push
        run: |
          git config user.name  "Planogram Bot"
          git config user.email "planogram@formula.co.il"
          git add docs/product-data.json docs/kapua-base.json docs/refresh-info.json
          git diff --cached --quiet && echo "No changes" || git commit -m "Planogram update $(TZ='Asia/Jerusalem' date '+%Y-%m-%d %H:%M')"
          git push
