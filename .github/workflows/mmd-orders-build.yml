name: MMD Orders Build

on:
  schedule:
    # 07:00 Israel (UTC+3) = 04:00 UTC
    - cron: '0 4 * * *'
    # 13:00 Israel (UTC+3) = 10:00 UTC
    - cron: '0 10 * * *'
    # 14:10 Israel (UTC+3) = 11:10 UTC
    - cron: '10 11 * * *'
    # 15:00 Israel (UTC+3) = 12:00 UTC
    - cron: '0 12 * * *'
    # 16:00 Israel (UTC+3) = 13:00 UTC
    - cron: '0 13 * * *'
    # 18:00 Israel (UTC+3) = 15:00 UTC
    - cron: '0 15 * * *'
    # 19:00 Israel (UTC+3) = 16:00 UTC
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip + CmdStan
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cmdstan
          key: prophet-${{ runner.os }}-${{ hashFiles('prophet/requirements.txt') }}
          restore-keys: prophet-${{ runner.os }}-

      - name: Install Python dependencies
        run: pip install -r prophet/requirements.txt

      - name: Install server dependencies
        run: npm install
        working-directory: server

      - name: Build mmd-orders.json
        env:
          AZURE_TENANT_ID: ${{ secrets.PBI_TENANT }}
          AZURE_CLIENT_ID: ${{ secrets.PBI_CLIENT }}
          AZURE_CLIENT_SECRET: ${{ secrets.PBI_SECRET }}
          POWERBI_WORKSPACE_ID: ${{ secrets.PBI_WORKSPACE }}
          POWERBI_MMD_DATASET_ID: ${{ secrets.PBI_MMD_DATASET }}
        run: node server/build-mmd-orders.js

      - name: Fetch Prophet history from PBI
        continue-on-error: true
        env:
          AZURE_TENANT_ID: ${{ secrets.PBI_TENANT }}
          AZURE_CLIENT_ID: ${{ secrets.PBI_CLIENT }}
          AZURE_CLIENT_SECRET: ${{ secrets.PBI_SECRET }}
          POWERBI_WORKSPACE_ID: ${{ secrets.PBI_WORKSPACE }}
          POWERBI_MMD_DATASET_ID: ${{ secrets.PBI_MMD_DATASET }}
        run: node server/fetch-prophet-history.js

      - name: Run Prophet forecast
        continue-on-error: true
        run: python prophet/run_prophet.py

      - name: Commit and push
        run: |
          git config user.email "columbus-bot@diler.co.il"
          git config user.name "COLUMBUS Bot"
          git add docs/mmd-orders.json docs/prophet.json
          git diff --cached --quiet && echo "No changes." || \
            git commit -m "chore: mmd-orders + prophet build $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin master || \
            (git pull --no-rebase -X ours origin master && git push origin master)
