name: MMD Orders Build

on:
  schedule:
    # Минуты сдвинуты с :00 2026-08-31 — см. yedaim-build.yml: top-of-hour
    # был причиной перегрузки GitHub Actions scheduler для всего репо.
    # ~07:12 Israel (UTC+3) = 04:12 UTC
    - cron: '12 4 * * *'
    # ~13:22 Israel (UTC+3) = 10:22 UTC
    - cron: '22 10 * * *'
    # 14:10 Israel (UTC+3) = 11:10 UTC
    - cron: '10 11 * * *'
    # ~15:32 Israel (UTC+3) = 12:32 UTC
    - cron: '32 12 * * *'
    # ~16:42 Israel (UTC+3) = 13:42 UTC
    - cron: '42 13 * * *'
    # ~18:52 Israel (UTC+3) = 15:52 UTC
    - cron: '52 15 * * *'
    # ~19:17 Israel (UTC+3) = 16:17 UTC
    - cron: '17 16 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install server dependencies
        run: npm install
        working-directory: server

      - name: Build mmd-orders.json
        env:
          AZURE_TENANT_ID: ${{ secrets.PBI_TENANT }}
          AZURE_CLIENT_ID: ${{ secrets.PBI_CLIENT }}
          AZURE_CLIENT_SECRET: ${{ secrets.PBI_SECRET }}
          POWERBI_WORKSPACE_ID: ${{ secrets.PBI_WORKSPACE }}
          POWERBI_MMD_DATASET_ID: ${{ secrets.PBI_MMD_DATASET }}
        run: node server/build-mmd-orders.js

      - name: Deploy JSON to VPS (live path, outside git tree)
        run: |
          echo "${{ secrets.VPS_SSH_KEY }}" > /tmp/vps_key
          chmod 600 /tmp/vps_key
          ssh -o StrictHostKeyChecking=no -i /tmp/vps_key root@31.154.67.58 "mkdir -p /root/COLUMBUS/server/data"
          scp -o StrictHostKeyChecking=no -i /tmp/vps_key \
            docs/mmd-orders.json \
            root@31.154.67.58:/root/COLUMBUS/server/data/mmd-orders-live.json
          rm /tmp/vps_key

      - name: Commit and push
        run: |
          git config user.email "columbus-bot@diler.co.il"
          git config user.name "COLUMBUS Bot"
          git add docs/mmd-orders.json
          git diff --cached --quiet && echo "No changes." || \
            git commit -m "data: mmd-orders build $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin master || \
            (git pull --no-rebase -X ours origin master && git push origin master)
