name: MMD Orders Build

on:
  schedule:
    # 07:00 Israel (UTC+3) = 04:00 UTC
    - cron: '0 4 * * *'
    # 13:00 Israel (UTC+3) = 10:00 UTC
    - cron: '0 10 * * *'
    # 14:10 Israel (UTC+3) = 11:10 UTC
    - cron: '10 11 * * *'
    # 15:00 Israel (UTC+3) = 12:00 UTC
    - cron: '0 12 * * *'
    # 16:00 Israel (UTC+3) = 13:00 UTC
    - cron: '0 13 * * *'
    # 18:00 Israel (UTC+3) = 15:00 UTC
    - cron: '0 15 * * *'
    # 19:00 Israel (UTC+3) = 16:00 UTC
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install server dependencies
        run: npm install
        working-directory: server

      - name: Create .env
        run: |
          echo "AZURE_TENANT_ID=${{ secrets.PBI_TENANT }}"              >> .env
          echo "AZURE_CLIENT_ID=${{ secrets.PBI_CLIENT }}"              >> .env
          echo "AZURE_CLIENT_SECRET=${{ secrets.PBI_SECRET }}"          >> .env
          echo "POWERBI_WORKSPACE_ID=${{ secrets.PBI_WORKSPACE }}"      >> .env
          echo "POWERBI_MMD_DATASET_ID=${{ secrets.PBI_MMD_DATASET }}"  >> .env

      - name: Build mmd-orders.json
        run: node server/build-mmd-orders.js

      - name: Commit and push
        run: |
          git config user.email "columbus-bot@diler.co.il"
          git config user.name "COLUMBUS Bot"
          git add docs/mmd-orders.json
          git diff --cached --quiet && echo "No changes." || \
            git commit -m "chore: mmd-orders build $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin master || \
            (git pull --no-rebase -X ours origin master && git push origin master)
